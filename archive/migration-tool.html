<head>
<meta charset="utf-8">
<title>DPS Vault — Migration Tool</title>
<style>
  body { font-family: 'Courier New', monospace; background: #111318; color: #e8ebf4; padding: 32px; max-width: 640px; margin: 0 auto; }
  h2 { color: #14b8a6; margin-bottom: 4px; }
  p { color: #8b90a8; font-size: 13px; margin-top: 4px; }
  label { display: block; margin-top: 20px; font-size: 12px; color: #8b90a8; text-transform: uppercase; letter-spacing: 1px; }
  input { width: 100%; box-sizing: border-box; background: #1c1f2b; border: 1px solid #252836; color: #e8ebf4; padding: 10px 12px; margin-top: 6px; font-family: inherit; font-size: 14px; border-radius: 4px; }
  button { margin-top: 24px; background: #14b8a6; color: #111318; border: none; padding: 12px 28px; font-family: inherit; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
  button:hover { background: #0d9488; }
  #log { margin-top: 24px; background: #1c1f2b; border: 1px solid #252836; padding: 16px; border-radius: 4px; font-size: 13px; min-height: 80px; white-space: pre-wrap; line-height: 1.6; }
  .ok  { color: #22c55e; }
  .err { color: #ef4444; }
  .inf { color: #8b90a8; }
</style>
</head>
<body>

<h2>DPS Vault — Migration Tool</h2>
<p>Run this once to upload your agent roster to the Cloudflare Worker. Does not touch localStorage.</p>

<label>Worker URL</label>
<input id="url" type="text" placeholder="https://dps-vault.YOUR_SUBDOMAIN.workers.dev" />

<label>Your Jesse PIN</label>
<input id="pin" type="password" placeholder="Your trainer PIN" />

<button onclick="runMigration()">Upload Roster to Vault</button>

<div id="log"><span class="inf">Ready. Fill in Worker URL and PIN, then click Upload.</span></div>

<script>
var AGENTS_JSON = null; // will be set below

function log(msg, cls) {
  var el = document.getElementById('log');
  el.innerHTML += '\n<span class="' + (cls||'inf') + '">' + msg + '</span>';
  el.scrollTop = el.scrollHeight;
}

function runMigration() {
  var url = document.getElementById('url').value.trim().replace(/\/$/, '');
  var pin = document.getElementById('pin').value.trim();
  document.getElementById('log').innerHTML = '';

  if (!url || !pin) {
    log('Worker URL and PIN are required.', 'err');
    return;
  }

  log('Step 1/3 — Validating PIN...');

  fetch(url + '/auth', {
    method: 'POST',
    headers: { 'X-DPS-Pin': pin }
  })
  .then(function(r) { return r.json(); })
  .then(function(auth) {
    if (!auth.ok) {
      log('PIN rejected: ' + (auth.error || 'unknown error'), 'err');
      return;
    }
    log('PIN valid. Role: ' + auth.role + ', Identity: ' + auth.identity, 'ok');
    log('Step 2/3 — Uploading agent roster (' + AGENTS_JSON.agents.length + ' agents)...');

    return fetch(url + '/pii', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-DPS-Pin': pin
      },
      body: JSON.stringify({ data: AGENTS_JSON })
    });
  })
  .then(function(r) {
    if (!r) return;
    return r.json();
  })
  .then(function(result) {
    if (!result) return;
    if (result.ok) {
      log('Step 3/3 — Verifying upload...', 'inf');
      return fetch(url + '/pii', {
        method: 'GET',
        headers: { 'X-DPS-Pin': pin }
      });
    } else {
      log('Upload failed: ' + (result.error || 'unknown'), 'err');
    }
  })
  .then(function(r) {
    if (!r) return;
    return r.json();
  })
  .then(function(verify) {
    if (!verify) return;
    if (verify.exists && verify.data && verify.data.agents) {
      log('Verified: ' + verify.data.agents.length + ' agents stored in Vault.', 'ok');
      log('');
      log('Migration complete. You can now deploy the updated index.html.', 'ok');
    } else {
      log('Verification failed — data may not have saved correctly.', 'err');
    }
  })
  .catch(function(err) {
    log('Network error: ' + err.message, 'err');
    log('Check that your Worker URL is correct and the Worker is deployed.', 'inf');
  });
}
