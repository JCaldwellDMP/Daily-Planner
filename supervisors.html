// ── Countdown Timer ────────────────────────────────────────────────────────

function CountdownTimer(props) {
  var label = props.label;
  var color = props.color;
  var storageKey = 'sup-timer-' + label.replace(/\s+/g,'-').toLowerCase();

  var initTarget = null;
  try {
    var stored = localStorage.getItem(storageKey);
    if (stored) { initTarget = parseInt(stored); }
  } catch(e){}

  var targetState = React.useState(initTarget);
  var targetMin = targetState[0];
  var setTargetMin = targetState[1];

  var showState = React.useState(false);
  var showPicker = showState[0];
  var setShowPicker = showState[1];

  var draftState = React.useState('');
  var draft = draftState[0];
  var setDraft = draftState[1];

  var displayState = React.useState('--:--');
  var display = displayState[0];
  var setDisplay = displayState[1];

  var urgentState = React.useState(false);
  var urgent = urgentState[0];
  var setUrgent = urgentState[1];

  function calcDisplay(tgt) {
    if (tgt === null) { return '--:--'; }
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var diff = tgt - nowMin;
    if (diff < 0) { diff = 0; }
    var h = Math.floor(diff / 60);
    var m = diff % 60;
    if (h > 0) { return h + ':' + String(m).padStart(2,'0'); }
    return String(m).padStart(2,'0') + ':00';
  }

  React.useEffect(function() {
    if (targetMin !== null) { setDisplay(calcDisplay(targetMin)); setUrgent(targetMin - (new Date().getHours()*60+new Date().getMinutes()) <= 10); }
    var iv = setInterval(function() {
      if (targetMin !== null) {
        setDisplay(calcDisplay(targetMin));
        var now2 = new Date();
        var diff2 = targetMin - (now2.getHours()*60+now2.getMinutes());
        setUrgent(diff2 <= 10 && diff2 >= 0);
      }
    }, 30000);
    return function(){ clearInterval(iv); };
  }, [targetMin]);

  function setTime() {
    if (!draft) { return; }
    var parts = draft.split(':');
    var h = parseInt(parts[0]);
    var m = parseInt(parts[1] || '0');
    var tgt = h * 60 + m;
    setTargetMin(tgt);
    setDisplay(calcDisplay(tgt));
    try { localStorage.setItem(storageKey, String(tgt)); } catch(e){}
    setShowPicker(false);
    setDraft('');
  }

  function clearTimer() {
    setTargetMin(null);
    setDisplay('--:--');
    setUrgent(false);
    try { localStorage.removeItem(storageKey); } catch(e){}
    setShowPicker(false);
  }

  var displayColor = urgent ? C.rd : targetMin !== null ? color : C.mu;

  return (
    React.createElement('div', {style:{position:'relative'}},
      React.createElement('div', {
        style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,minWidth:80,cursor:'pointer'}
      },
        React.createElement('div', {
          style:{fontSize:11,color:C.mu,letterSpacing:'0.08em',textTransform:'uppercase'}
        }, label),
        React.createElement('div', {
          onClick:function(){ setShowPicker(function(p){ return !p; }); },
          style:{
            fontSize:14,fontWeight:700,color:displayColor,
            background:C.ca,borderRadius:6,padding:'3px 10px',
            border:'1px solid '+(urgent ? C.rd : C.bo),
            letterSpacing:'0.05em',userSelect:'none'
          }
        }, display)
      ),
      showPicker
        ? React.createElement('div', {
            style:{
              position:'absolute',top:'100%',right:0,zIndex:300,
              background:C.su,border:'1px solid '+C.bo,borderRadius:8,
              padding:'12px',marginTop:4,minWidth:160,boxShadow:'0 4px 16px rgba(0,0,0,0.4)'
            }
          },
            React.createElement('div', {style:{fontSize:11,color:C.mu,marginBottom:8}}, 'Set target time'),
            React.createElement('input', {
              type:'time',value:draft,
              onChange:function(e){ setDraft(e.target.value); },
              onKeyDown:function(e){ if(e.key==='Enter'){setTime();} },
              style:{width:'100%',marginBottom:8}
            }),
            React.createElement('div', {style:{display:'flex',gap:6}},
              React.createElement('button', {
                onClick:setTime,
                style:{flex:1,background:color,border:'none',borderRadius:5,color:'#fff',fontFamily:MO,fontSize:11,padding:'5px 0',fontWeight:700}
              }, 'Set'),
              React.createElement('button', {
                onClick:clearTimer,
                style:{background:C.ca,border:'1px solid '+C.bo,borderRadius:5,color:C.mu,fontFamily:MO,fontSize:11,padding:'5px 8px'}
              }, 'Clear')
            )
          )
        : null
    )
  );
}

// ── Tasks Tab ──────────────────────────────────────────────────────────────

function todayKey() {
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return 'sup-tasks-' + d.getFullYear() + '-' + mm + '-' + dd;
}

function dateKeyOffset(offset) {
  var d = new Date();
  d.setDate(d.getDate() + offset);
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return 'sup-tasks-' + d.getFullYear() + '-' + mm + '-' + dd;
}

function loadTasks(key) {
  try {
    var raw = localStorage.getItem(key);
    if (raw) { return JSON.parse(raw); }
  } catch(e){}
  return [];
}

function saveTasks(key, tasks) {
  try { localStorage.setItem(key, JSON.stringify(tasks)); } catch(e){}
}

function carryForward(todayTasks) {
  var existingTexts = {};
  for (var i = 0; i < todayTasks.length; i++) {
    existingTexts[todayTasks[i].text.toLowerCase().trim()] = true;
  }
  var carried = [];
  for (var offset = -1; offset >= -7; offset--) {
    var key = dateKeyOffset(offset);
    var past = loadTasks(key);
    for (var j = 0; j < past.length; j++) {
      var t = past[j];
      if (!t.done) {
        var norm = t.text.toLowerCase().trim();
        if (!existingTexts[norm]) {
          existingTexts[norm] = true;
          carried.push({ id: String(Date.now()) + String(Math.random()), text:t.text, done:false, carried:true });
        }
      }
    }
  }
  return carried;
}

      }

        onClick:onToggle,
        style:{
          width:20,height:20,borderRadius:4,flexShrink:0,
          border:'2px solid ' + (task.done ? C.gr : C.mu),
          background: task.done ? C.gr : 'transparent',

          color:'#fff',fontSize:12,padding:0
        }
      }, task.done ? '\u2713' : ''),

          flex:1,fontSize:13,color: task.done ? C.mu : C.tx,
          textDecoration: task.done ? 'line-through' : 'none',
          wordBreak:'break-word'
        }
      }, task.text),
      task.carried && !task.done
        ? React.createElement('span', {
            style:{
              fontSize:10,color:C.yl,background:C.bo,borderRadius:4,
              padding:'2px 6px',letterSpacing:'0.05em',flexShrink:0
            }
          }, 'CARRIED')
        : null,
      React.createElement('button', {
        onClick:onDelete,
        style:{
          background:'none',border:'none',color:C.mu,fontSize:14,
          padding:'0 4px',flexShrink:0,lineHeight:1
        }
      }, '\u00d7')
    )
  );
}

function TasksTab() {
  var key = todayKey();

  var initTasks = React.useMemo(function() {
    var saved = loadTasks(key);
    var carried = carryForward(saved);
    var merged = saved.concat(carried);
    if (carried.length > 0) { saveTasks(key, merged); }
    return merged;
  }, []);

  var tasksState = React.useState(initTasks);
  var tasks = tasksState[0];
  var setTasks = tasksState[1];

  var inputState = React.useState('');
  var input = inputState[0];
  var setInput = inputState[1];

  function persist(next) {
    setTasks(next);
    saveTasks(key, next);
  }

  function addTask() {
    var text = input.trim();
    if (!text) { return; }
    var next = tasks.concat([{id:String(Date.now()),text:text,done:false,carried:false}]);
    persist(next);
    setInput('');
  }

  function toggleTask(id) {
    var next = tasks.map(function(t) {
      return String(t.id) === String(id) ? {id:t.id,text:t.text,done:!t.done,carried:t.carried} : t;
    });
    persist(next);
  }

  function deleteTask(id) {
    var next = tasks.filter(function(t) { return String(t.id) !== String(id); });
    persist(next);
  }

  function handleKey(e) {
    if (e.key === 'Enter') { addTask(); }
  }

  var incomplete = tasks.filter(function(t){ return !t.done; });
  var done = tasks.filter(function(t){ return t.done; });
  var carriedCount = incomplete.filter(function(t){ return t.carried; }).length;

  return (
    React.createElement('div', {style:{padding:20,maxWidth:640}},
      // Header row
      React.createElement('div', {

];

function schedColor(label) {
  var low = label.toLowerCase();
  for (var i = 0; i < SCHED_KEYWORDS.length; i++) {
    var kw = SCHED_KEYWORDS[i];
    for (var j = 0; j < kw.words.length; j++) {
      if (low.indexOf(kw.words[j]) !== -1) { return kw.color; }
    }
  }
  return C.bl;
}

function schedKeyLabel(label) {
  var low = label.toLowerCase();
  for (var i = 0; i < SCHED_KEYWORDS.length; i++) {
    var kw = SCHED_KEYWORDS[i];
    for (var j = 0; j < kw.words.length; j++) {
      if (low.indexOf(kw.words[j]) !== -1) { return kw.label; }
    }
  }
  return 'Block';
}

function todaySchedKey() {
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return 'sup-schedule-' + d.getFullYear() + '-' + mm + '-' + dd;
}

function loadSched(key) {
  try { var r = localStorage.getItem(key); if (r) { return JSON.parse(r); } } catch(e){}
  return [];
}

function saveSched(key, blocks) {
  try { localStorage.setItem(key, JSON.stringify(blocks)); } catch(e){}
}

function parseTimeToMin(t) {
  if (!t) { return 0; }
  var m12 = t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (m12) {
    var h = parseInt(m12[1]), mn = parseInt(m12[2]);
    var ap = m12[3].toUpperCase();
    if (ap === 'PM' && h !== 12) { h += 12; }
    if (ap === 'AM' && h === 12) { h = 0; }
    return h * 60 + mn;
  }
  var m24 = t.match(/^(\d{1,2}):(\d{2})$/);
  if (m24) { return parseInt(m24[1]) * 60 + parseInt(m24[2]); }
  return 0;
}

function to12h(val) {
  if (!val) { return ''; }
  var parts = val.split(':');
  if (parts.length < 2) { return val; }
  var h = parseInt(parts[0]);
  var m = parts[1];
  var ampm = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12;
  if (h12 === 0) { h12 = 12; }
  return h12 + ':' + m + ' ' + ampm;
}

function ScheduleTab() {
  var key = todaySchedKey();
  var initBlocks = React.useMemo(function() { return loadSched(key); }, []);

  var blocksState = React.useState(initBlocks);
  var blocks = blocksState[0];
  var setBlocks = blocksState[1];

  var startState = React.useState('');
  var startVal = startState[0];
  var setStart = startState[1];

  var endState = React.useState('');
  var endVal = endState[0];
  var setEnd = endState[1];

  var labelState = React.useState('');
  var labelVal = labelState[0];
  var setLabel = labelState[1];

  var errState = React.useState('');
  var err = errState[0];
  var setErr = errState[1];

  function persist(next) {
    var sorted = next.slice().sort(function(a, b) {
      return parseTimeToMin(a.start) - parseTimeToMin(b.start);
    });
    setBlocks(sorted);
    saveSched(key, sorted);
  }

  function addBlock() {
    if (!startVal) { setErr('Start time required.'); return; }
    if (!labelVal.trim()) { setErr('Label required.'); return; }
    setErr('');
    var block = {
      id: String(Date.now()),
      start: to12h(startVal),
      end: endVal ? to12h(endVal) : '',
      label: labelVal.trim()
    };
    persist(blocks.concat([block]));
    setStart(''); setEnd(''); setLabel('');
  }

  var nowMin = (new Date()).getHours() * 60 + (new Date()).getMinutes();

  function isActive(block) {
    var s = parseTimeToMin(block.start);
    var e = block.end ? parseTimeToMin(block.end) : s + 60;
    return nowMin >= s && nowMin < e;
  }

  function deleteBlock(id) {
    persist(blocks.filter(function(b) { return String(b.id) !== String(id); }));
  }

  return (
    React.createElement('div', {style:{padding:20,maxWidth:640}},
      React.createElement('div', {
        style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}
      },
        React.createElement('span', {style:{fontSize:16,fontWeight:700,color:C.or}}, 'Schedule'),
        React.createElement('span', {style:{fontSize:12,color:C.mu}},
          blocks.length + ' block' + (blocks.length !== 1 ? 's' : ''))
      ),
      React.createElement('div', {
        style:{background:C.su,border:'1px solid '+C.bo,borderRadius:9,padding:'14px',marginBottom:20}
      },
        React.createElement('div', {
          style:{fontSize:11,color:C.mu,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:10}
        }, 'Add Block'),
        React.createElement('div', {style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}},
          React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:4}},
            React.createElement('label', {style:{fontSize:11,color:C.mu}}, 'Start'),
            React.createElement('input', {type:'time',value:startVal,
              onChange:function(e){ setStart(e.target.value); },style:{width:120}})
          ),
          React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:4}},
            React.createElement('label', {style:{fontSize:11,color:C.mu}}, 'End (optional)'),
            React.createElement('input', {type:'time',value:endVal,
              onChange:function(e){ setEnd(e.target.value); },style:{width:120}})
          ),
          React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:4,flex:1,minWidth:160}},
            React.createElement('label', {style:{fontSize:11,color:C.mu}}, 'Label'),
            React.createElement('input', {type:'text',value:labelVal,placeholder:'e.g. Team Meeting',
              onChange:function(e){ setLabel(e.target.value); },
              onKeyDown:function(e){ if(e.key==='Enter'){addBlock();} },
              style:{width:'100%'}})
          )
        ),
        err ? React.createElement('div', {style:{color:C.rd,fontSize:12,marginBottom:8}}, err) : null,
        React.createElement('button', {
          onClick:addBlock,
          style:{background:C.or,border:'none',borderRadius:6,color:'#fff',fontFamily:MO,fontWeight:700,fontSize:13,padding:'7px 18px'}
        }, 'Add Block')
      ),
      React.createElement('div', {style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}},
        SCHED_KEYWORDS.map(function(kw) {
          return React.createElement('span', {key:kw.label,
            style:{fontSize:10,color:kw.color,background:C.ca,borderRadius:4,padding:'2px 8px',border:'1px solid '+kw.color+'44',letterSpacing:'0.05em'}
          }, kw.label);
        }),
        React.createElement('span', {
          style:{fontSize:10,color:C.bl,background:C.ca,borderRadius:4,padding:'2px 8px',border:'1px solid '+C.bl+'44',letterSpacing:'0.05em'}
        }, 'Block')
      ),
      blocks.length === 0
        ? React.createElement('div', {style:{color:C.mu,fontSize:12,fontStyle:'italic',textAlign:'center',padding:'24px 0'}},
            'No blocks yet - add one above.')
        : React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:6}},
            blocks.map(function(b) {
              var col = schedColor(b.label);
              var active = isActive(b);
              var timeLabel = b.start + (b.end ? ' - ' + b.end : '');
              return React.createElement('div', {
                key:b.id,
                style:{
                  display:'flex',alignItems:'center',gap:10,
                  background:active ? col+'18' : C.ca,
                  border:'1px solid '+(active ? col : C.bo),
                  borderLeft:'3px solid '+col,
                  borderRadius:7,padding:'10px 12px'
                }
              },
                React.createElement('div', {style:{minWidth:120}},
                  React.createElement('span', {style:{fontSize:13,fontWeight:700,color:col}}, timeLabel)
                ),
                React.createElement('span', {style:{flex:1,fontSize:13,color:C.tx}}, b.label),
                React.createElement('span', {
                  style:{fontSize:10,color:col,background:C.bo,borderRadius:4,padding:'2px 7px',flexShrink:0,letterSpacing:'0.05em'}

var WRAPUP_DEFAULT = [
  'Walk floor — check in with team',
  'Review queue coverage for end of shift',
  'Check absence log is up to date',
  'Complete any training notes',
  'Send shift handoff to next supervisor',
];

function todayWrapKey() {
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return 'sup-wrapup-' + d.getFullYear() + '-' + mm + '-' + dd;
}

function loadWrapUp(key) {
  try {
    var r = localStorage.getItem(key);
    if (r) { return JSON.parse(r); }
  } catch(e){}
  return WRAPUP_DEFAULT.map(function(text, i) {
    return {id:'default-'+i, text:text, done:false, isDefault:true};
  });
}

function saveWrapUp(key, items) {
  try { localStorage.setItem(key, JSON.stringify(items)); } catch(e){}
}

function WrapUpTab() {
  var key = todayWrapKey();
  var initItems = React.useMemo(function(){ return loadWrapUp(key); }, []);

  var itemsState = React.useState(initItems);
  var items = itemsState[0];
  var setItems = itemsState[1];

  var inputState = React.useState('');
  var input = inputState[0];
  var setInput = inputState[1];

  function persist(next) { setItems(next); saveWrapUp(key, next); }

  function toggle(id) {
    persist(items.map(function(it) {
      return String(it.id) === String(id) ? {id:it.id,text:it.text,done:!it.done,isDefault:it.isDefault} : it;
    }));
  }

  function addItem() {
    var text = input.trim();
    if (!text) { return; }
    persist(items.concat([{id:String(Date.now()),text:text,done:false,isDefault:false}]));
    setInput('');
  }

  function deleteItem(id) {
    persist(items.filter(function(it){ return String(it.id) !== String(id); }));
  }

  var done = items.filter(function(it){ return it.done; }).length;
  var pct = items.length > 0 ? Math.round((done/items.length)*100) : 0;
  var allDone = done === items.length && items.length > 0;

  return (
    React.createElement('div', {style:{padding:20,maxWidth:600}},
      React.createElement('div', {
        style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}
      },
        React.createElement('span', {style:{fontSize:16,fontWeight:700,color:C.mu}}, 'Wrap Up'),
        React.createElement('span', {style:{fontSize:13,fontWeight:700,color:allDone?C.gr:C.mu}},
          done+'/'+items.length + (allDone ? ' \u2705' : ''))
      ),
      React.createElement('div', {style:{height:6,background:C.bo,borderRadius:3,marginBottom:20}},
        React.createElement('div', {style:{
          height:'100%',width:pct+'%',
          background:allDone?C.gr:pct>50?C.te:C.or,
          borderRadius:3,transition:'width 0.3s'
        }})
      ),
      allDone
        ? React.createElement('div', {
            style:{background:C.gr+'18',border:'1px solid '+C.gr+'44',borderRadius:8,
              padding:'12px 16px',marginBottom:16,fontSize:13,color:C.gr,fontWeight:700,textAlign:'center'}
          }, '\u2705 Shift wrap up complete!')
        : null,
      React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:6,marginBottom:20}},
        items.map(function(it) {
          return React.createElement('div', {
            key:it.id,
            style:{
              display:'flex',alignItems:'center',gap:10,padding:'10px 12px',
              background:it.done?'transparent':C.ca,
              border:'1px solid '+(it.done?'transparent':C.bo),borderRadius:7
            }
          },
            React.createElement('button', {
              onClick:function(){ toggle(it.id); },
              style:{
                width:20,height:20,borderRadius:4,flexShrink:0,
                border:'2px solid '+(it.done?C.gr:C.mu),
                background:it.done?C.gr:'transparent',
                display:'flex',alignItems:'center',justifyContent:'center',
                color:'#fff',fontSize:12,padding:0
              }
            }, it.done ? '\u2713' : ''),
            React.createElement('span', {
              style:{flex:1,fontSize:13,color:it.done?C.mu:C.tx,
                textDecoration:it.done?'line-through':'none'}
            }, it.text),
            it.isDefault
              ? null
              : React.createElement('button', {
                  onClick:function(){ deleteItem(it.id); },
                  style:{background:'none',border:'none',color:C.mu,fontSize:14,padding:'0 4px',flexShrink:0}
                }, '\u00d7')
          );
        })
      ),
      React.createElement('div', {style:{display:'flex',gap:8}},
        React.createElement('input', {
          value:input,placeholder:'Add custom item...',
          onChange:function(e){ setInput(e.target.value); },
          onKeyDown:function(e){ if(e.key==='Enter'){addItem();} },
          style:{flex:1,fontSize:13,padding:'8px 12px'}
        }),
        React.createElement('button', {
          onClick:addItem,
          style:{background:C.mu,border:'none',borderRadius:6,color:'#fff',
            fontFamily:MO,fontWeight:700,fontSize:13,padding:'8px 14px'}
        }, 'Add')
      )
    )
  );
}

const fmtShortDate = ds => { const d=new Date(ds+'T12:00:00'); return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'}); };
const fmtTime = t => { if(!t) return null; const [h,m]=t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; };
const fmtShift = (s,e) => { const a=fmtTime(s),b=fmtTime(e); return (a&&b)?`${a} – ${b}`:a||b||null; };

const evalAllRatedGlobal = hire => {
  const ev = hire.trainingEval;
  return ev && hire.mockCallsComplete && hire.buddyCallsComplete && [...Object.values(ev.dmpValues||{}), ...Object.values(ev.tswp||{})].every(c=>c.rating!=null);
};

const phaseLabel = hire => {
  const comp = Object.values(hire.days).filter(d=>d.completed).length;
  if (hire.trainingEval?.signedOff) return 'Training Complete ✓';
  if (comp >= 15) {
    const ev = hire.trainingEval;
    const allRated = evalAllRatedGlobal(hire);
    if (allRated) return 'Ready for Sign-Off';
    const bLen=(hire.buddyCalls||[]).length, bGoal=hire.buddyCallsGoal||25;
    const mGoal=hire.mockCallsGoal||15;
    if (bLen>0 || hire.mockCalls.length>=mGoal) return `Buddy Calls (${bLen}/${bGoal})`;
    return `Mock Calls (${hire.mockCalls.length}/${mGoal})`;
  }
  return `Training Day ${comp+1} of 15`;
};


// ── Parse helpers ───────────────────────────────────────────────────────────
function parseMockCallEmail(txt) {
  const out = {date:'',time:'',trainerName:'',agentName:'',agentEmail:'',supervisorEmail:'',
    askedCompanyName:'',askedMyName:'',askedPanelType:'',callDropped:'',triedCallBack:'',
    onHoldCount:'',askedBeforeHold:'',thankedForHolding:'',pulledPanelProgramming:'',
    whatWentWell:'',whatToImprove:'',loggedWintouch:'',wintouchCaseNum:'',
    wintouchQuality:'good',wintouchNotesFeedback:'',totalCallTime:'',
    resolved:true,overallPerformance:'good',feedbackFromCall:'',details:'',duration:'15-20'};
  const lines = txt.split('\n');
  let i=0, lastAnchor='';
  const ratingMap=r=>r.toLowerCase().includes('great')?'great':r.toLowerCase().includes('needs')?'needs-work':'good';
  const boolStr=v=>v.trim().toLowerCase()==='yes';
  const parseD=s=>{try{const d=new Date(s);return isNaN(d)?'':d.toISOString().split('T')[0];}catch(e){return '';}};
  const parseT=s=>{try{const d=new Date('2000-01-01 '+s);return isNaN(d)?s:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}catch(e){return s;}};
  const parseDur=s=>s.replace(/ min.*/i,'').trim();
  const tabMap={
    'Date':v=>{out.date=parseD(v);},'Time':v=>{out.time=parseT(v);},
    'Mock Call Trainer Name':v=>{out.trainerName=v;},'Agent Name':v=>{out.agentName=v;},
    'Agent Email':v=>{out.agentEmail=v;},'Supervisor Email':v=>{out.supervisorEmail=v;},
    'Did the Agent ask for my company name?':v=>{out.askedCompanyName=v;},
    'Did the Agent ask for my name?':v=>{out.askedMyName=v;},
    'Did the Agent ask what panel I was using?':v=>{out.askedPanelType=v;},
    'Did the call Drop?':v=>{out.callDropped=v;},
    'Did the Agent try and call them back?':v=>{out.triedCallBack=v;},
    'How many times did they place me on hold?':v=>{out.onHoldCount=v;},
    'On Hold: Did they ask to place me on hold?':v=>{out.askedBeforeHold=v;},
    'On Hold: Did they thank me for holding?':v=>{out.thankedForHolding=v;},
    'Did the Agent try to pull the panel programming in Remote Link or Dealer Admin?':v=>{out.pulledPanelProgramming=v;},
    'Did they log a Wintouch Ticket?':v=>{out.loggedWintouch=v;lastAnchor='wt';},
    'Wintouch Case#':v=>{out.wintouchCaseNum=v;lastAnchor='wtcase';},
    'How long was the call?':v=>{out.duration=parseDur(v);},
    'Total Call Time':v=>{out.totalCallTime=v;},
    'Did they resolve the call?':v=>{out.resolved=boolStr(v);lastAnchor='resolved';},
  };
  const secMap={'What went well on the call?':'whatWentWell','What can they improve?':'whatToImprove',
    'Wintouch Case Notes Feedback':'wintouchNotesFeedback','Feedback from the call':'feedbackFromCall'};
  const allHdrs=[...Object.keys(tabMap),...Object.keys(secMap),'Mock Call Details','On Hold','Review of the Call','On Hold Time'];
  // Collect Mock Call Details block
  const di=lines.findIndex(l=>l.trim()==='Mock Call Details');
  if(di>=0){const dl=[];for(let j=di+1;j<lines.length;j++){if(lines[j].includes('\t')||lines[j].trim()==='Date')break;dl.push(lines[j].trim());}out.details=dl.filter(Boolean).join('\n').trim();}
  while(i<lines.length){
    const raw=lines[i],tr=raw.trim();
    if(raw.includes('\t')){
      const ti=raw.indexOf('\t'),label=raw.slice(0,ti).trim(),value=raw.slice(ti+1).trim();
      if(label&&tabMap[label])tabMap[label](value);
      else if(!label&&value.startsWith('-')){
        if(lastAnchor==='wtcase')out.wintouchQuality=ratingMap(value);
        else if(lastAnchor==='resolved')out.overallPerformance=ratingMap(value);
      }
      i++;continue;
    }
    if(secMap[tr]){
      const key=secMap[tr];i++;const bl=[];
      while(i<lines.length){const nx=lines[i].trim();if(lines[i].includes('\t')||allHdrs.includes(nx))break;bl.push(nx);i++;}
      out[key]=bl.filter(Boolean).join('\n').trim();continue;
    }
    if(tr.startsWith('-')&&(lastAnchor==='wtcase'||lastAnchor==='resolved')){
      if(lastAnchor==='wtcase')out.wintouchQuality=ratingMap(tr);
      else if(lastAnchor==='resolved')out.overallPerformance=ratingMap(tr);
      lastAnchor='';
    }
    i++;
  }
  return out;
}

function parseBuddyCallEmail(txt) {
  const out = {
    date:'', observerName:'', agentNotes:'', traineeNotes:'',
    independence:null, confidence:null, wintouchCaseNum:'',
    checklist:{ greetedCorrectly:false, identifiedIssue:false, pulledProgramming:false, loggedWintouch:false, askedForHelpApprop:false }
  };
  const lines = txt.split('\n');
  let i=0;
  const boolStr = v => v.trim().toLowerCase()==='yes';
  const parseD = s => { try{const d=new Date(s);return isNaN(d)?'':d.toISOString().split('T')[0];}catch(e){return '';} };
  const indepMap = v => {
    const lv=v.toLowerCase();
    if(lv.includes('guid')) return 'guidance';
    if(lv.includes('exceed')) return 'exceeding';
    if(lv.includes('independ')) return 'independent';
    return null;
  };
  const confMap = v => {
    const lv=v.toLowerCase();
    if(lv.includes('low')) return 'low';
    if(lv.includes('develop')) return 'developing';
    if(lv.includes('confid')) return 'confident';
    return null;
  };
  const tabMap = {
    'Date':                          v=>{out.date=parseD(v);},
    'Observer Name':                 v=>{out.observerName=v;},
    'Greeted caller correctly':      v=>{out.checklist.greetedCorrectly=boolStr(v);},
    'Identified the issue':          v=>{out.checklist.identifiedIssue=boolStr(v);},
    'Pulled panel programming':      v=>{out.checklist.pulledProgramming=boolStr(v);},
    'Logged Wintouch ticket':        v=>{out.checklist.loggedWintouch=boolStr(v);},
    'Wintouch Case#':                v=>{out.wintouchCaseNum=v;},
    'Asked for help appropriately':  v=>{out.checklist.askedForHelpApprop=boolStr(v);},
    'Independence':                  v=>{out.independence=indepMap(v);},
    'Confidence':                    v=>{out.confidence=confMap(v);},
  };
  const secMap = {
    'Observer Notes':'agentNotes',
    'Agent Notes':'agentNotes',
    'Trainee Notes':'traineeNotes',
    'Self-Reflection':'traineeNotes',
    'Trainee Self-Reflection':'traineeNotes',
  };
  const allHdrs=[...Object.keys(tabMap),...Object.keys(secMap)];
  while(i<lines.length){
    const raw=lines[i],tr=raw.trim();
    if(raw.includes('\t')){
      const ti=raw.indexOf('\t'),label=raw.slice(0,ti).trim(),value=raw.slice(ti+1).trim();
      if(label&&tabMap[label]) tabMap[label](value);
      i++;continue;
    }
    if(secMap[tr]){
      const key=secMap[tr];i++;const bl=[];
      while(i<lines.length){const nx=lines[i].trim();if(lines[i].includes('\t')||allHdrs.includes(nx))break;bl.push(nx);i++;}
      out[key]=bl.filter(Boolean).join('\n').trim();continue;
    }
    i++;
  }
  return out;
}

  const TODAY_T = new Date().toISOString().split('T')[0];
  const nowTime = () => { const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); };
  const inpS = {fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',color:C.tx,outline:'none',boxSizing:'border-box'};
  const QUAL = [['needs-work','⚠️ Needs Work',C.rd],['good','👍 Good Work',C.gr],['great','⭐ Great Work',C.yl]];
  const qualLabel = v => ({good:'👍 Good Work',great:'⭐ Great Work','needs-work':'⚠️ Needs Work'}[v]||'');
  const qualColor = v => ({'good':C.gr,'great':C.yl,'needs-work':C.rd}[v]||C.mu);

  const daysComp  = Object.values(hire.days).filter(d=>d.completed).length;

  const mockGoal  = hire.mockCallsGoal||15;
  const mockPct   = Math.min(100,Math.round((hire.mockCalls.length/mockGoal)*100));
  const buddyCalls = hire.buddyCalls||[];
  const buddyGoal = hire.buddyCallsGoal||25;

  const dayQuizPct = d => { const c=parseFloat(d?.quizCorrect), t=parseFloat(d?.quizTotal); return (!c&&c!==0)||!t||t===0?null:Math.round((c/t)*100); };
  const avgDayQuizPct = n => { const scores=peerHires.map(h=>dayQuizPct((h.days||{})[n])).filter(s=>s!=null); return scores.length===0?null:Math.round(scores.reduce((a,b)=>a+b,0)/scores.length); };
  const quizBadge = (pct,n) => { const avg=avgDayQuizPct(n); if(avg==null||pct==null)return null; const diff=pct-avg; if(diff>3)return {label:'▲ Above Avg',color:C.gr}; if(diff<-3)return {label:'▼ Below Avg',color:C.rd}; return {label:'= Avg',color:C.yl}; };

  const finalQuizPct  = hire.finalQuizCorrect!=null&&hire.finalQuizTotal!=null ? Math.round((hire.finalQuizCorrect/hire.finalQuizTotal)*100) : null;

            </div>}
            {hire.status==='active'&&<div style={{borderTop:'1px solid '+C.bo,paddingTop:10,marginBottom:8}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.bl,letterSpacing:2,marginBottom:8}}>🏢 DEPARTMENT</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>

                <div style={{flex:'1 1 140px'}}>
                  <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:3}}>SHIFT END</div>
                  <input type="time" value={shiftEndDraft||''} onChange={e=>setShiftEndDraft(e.target.value)} style={{...inpS,width:'100%',fontSize:11,colorScheme:'dark'}}/>
                </div>
              </div>
              {!isSpecialized&&<div style={{marginBottom:8}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:5}}>QUEUES</div>
                <div style={{display:'flex',flexDirection:'column',gap:5}}>
                  {QUEUES.map(q=>{
                    const active=queuesDraft?.[q.id]?.active??false;
                    const qdate=queuesDraft?.[q.id]?.date||'';
                    return (
                      <div key={q.id} style={{display:'flex',alignItems:'center',gap:8}}>
                        <button onClick={()=>setQueuesDraft(p=>({...p,[q.id]:{active:!active,date:!active?new Date().toISOString().split('T')[0]:p?.[q.id]?.date||null}}))} style={{fontFamily:MO,fontSize:10,padding:'3px 10px',borderRadius:4,cursor:'pointer',border:`1px solid ${active?C.bl:C.bo}`,background:active?C.bl+'22':C.ca,color:active?C.bl:C.mu,minWidth:130,textAlign:'left'}}>{active?'✓':' '} {q.label}</button>
                        {active&&<input type="date" value={qdate} onChange={e=>setQueuesDraft(p=>({...p,[q.id]:{...p[q.id],date:e.target.value}}))} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 6px',color:C.tx,outline:'none',colorScheme:'dark'}}/>}
                        {active&&qdate&&<span style={{fontFamily:MO,fontSize:9,color:C.mu}}>since {new Date(qdate+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'})}</span>}
                      </div>
                    );
                  })}
                  <div style={{display:'flex',gap:8,marginTop:4}}>
                    <button onClick={()=>setTrainingDraft(p=>!p)} style={{fontFamily:MO,fontSize:9,padding:'3px 7px',borderRadius:4,cursor:'pointer',border:`1px solid ${trainingDraft?C.pu:C.bo}`,background:trainingDraft?C.pu+'22':C.ca,color:trainingDraft?C.pu:C.mu}}>🎓 Training</button>
                    <button onClick={()=>setInactiveDraft(p=>!p)} style={{fontFamily:MO,fontSize:9,padding:'3px 7px',borderRadius:4,cursor:'pointer',border:`1px solid ${inactiveDraft?C.rd:C.bo}`,background:inactiveDraft?C.rd+'22':C.ca,color:inactiveDraft?C.rd:C.mu}}>💤 Inactive</button>
                  </div>
                </div>
              </div>}
              <div style={{marginBottom:8}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:5}}>ADDITIONAL ROLES</div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                  {ADDITIONAL_ROLES.map(r=>{

              </div>
              {!isSpecialized&&<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>

                <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>📚 TRAINING NEEDS</div><textarea value={trainingNeedsDraft} onChange={e=>setTrainingNeedsDraft(e.target.value)} placeholder="Skills to develop…" rows={2} style={{...inpS,width:'100%',resize:'vertical',fontSize:11,lineHeight:1.5}}/></div>
              </div>}
            </div>}
            <div style={{display:'flex',gap:8}}><OBtn onClick={commitProfile} style={{fontSize:11,padding:'5px 14px'}}>Save</OBtn><Btn onClick={()=>setEditProfile(false)} style={{fontSize:11}}>Cancel</Btn></div>
          </div>
        ) : (
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
            <div>
              <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:3}}>
                <div style={{fontFamily:MO,fontSize:15,fontWeight:'bold',color:C.tx}}>{hire.name}</div>
                {hire.discProfile&&<span style={{fontFamily:MO,fontSize:10,padding:'1px 7px',borderRadius:3,border:'1px solid '+C.pu+'55',color:C.pu,background:C.pu+'11'}}>DISC: {hire.discProfile}</span>}
                <span style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,border:`1px solid ${hire.status==='active'?C.gr:hire.status==='trainee'?C.yl:C.mu}44`,color:hire.status==='active'?C.gr:hire.status==='trainee'?C.yl:C.mu}}>{hire.status}</span>
              </div>
              <div style={{fontFamily:MO,fontSize:10,color:C.mu}}>Started {fmtShortDate(hire.startDate)}{hire.supervisor?' · Supervisor: '+hire.supervisor:''}{isTrainee?' · '+phaseLabel(hire):''}</div>
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <Btn onClick={()=>setEditProfile(true)} style={{fontSize:11,padding:'5px 10px'}}>✎ Profile</Btn>
              <button onClick={e=>{flash(e);copyReport();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copied?C.gr+'22':C.ca,border:`1px solid ${copied?C.gr:C.bo}`,borderRadius:6,color:copied?C.gr:C.tx,cursor:'pointer',transition:'all .3s'}}>{copied?'✓ COPIED':'📤 Copy Report'}</button>
            </div>
          </div>
        )}
      </div>

      {/* PROGRESS SNAPSHOT — hidden for non-trainees and in history view */}
      {(isTrainee&&!showTraining)&&<div style={{background:C.su,borderBottom:'1px solid '+C.bo,padding:'12px 16px'}}>
        <div style={{fontFamily:MO,fontSize:9,color:C.or,letterSpacing:2,marginBottom:10}}>📊 PROGRESS SNAPSHOT</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
          {[
            [`📋 Days`,`${daysComp}/15`,daysPct>=100?C.gr:C.or,`${daysPct}%`],
            [`📞 Calls`,`${hire.mockCalls.length}/${mockGoal}`,mockPct>=100?C.gr:C.or,`${mockPct}%`],
            [`🤝 Buddy`,`${buddyCalls.length}/${buddyGoal}`,buddyPct>=100?C.gr:C.bl,`${buddyPct}%`],
            [`📌 Notes`,`${hire.notes.length}`,'',''],
          ].map(([label,val,col,pct])=>(
            <div key={label} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',minWidth:80,flex:'1 1 80px'}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>{label}</div>
              <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:col||C.tx}}>{val}{pct&&<span style={{fontSize:10,color:col,marginLeft:4}}>{pct}</span>}</div>
            </div>
          ))}
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',minWidth:80,flex:'1 1 80px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>📝 Homework</div>
            <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:hwDoneCount===hwEnabledDays.length&&hwEnabledDays.length>0?C.gr:C.tx}}>{hwDoneCount}/{hwEnabledDays.length}</div>
          </div>
        </div>
        {(quizAvg!=null||finalQuizPct!=null)&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:(hire.doingWell||hire.areasOfImprovement)?10:0}}>
          {quizAvg!=null&&[['Avg Quiz',quizAvg],[' High',quizHigh],['Low',quizLow]].map(([label,val])=>(
            <div key={label} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',flex:'1 1 60px',minWidth:60}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>{label}</div>
              <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:val>=90?C.gr:val>=70?C.yl:C.rd}}>{val}%</div>
            </div>
          ))}
          {finalQuizPct!=null&&<div style={{background:C.ca,border:'1px solid '+C.or+'44',borderRadius:6,padding:'6px 10px',flex:'1 1 80px',minWidth:80}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.or,marginBottom:2}}>🏁 Final Quiz</div>
            <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:finalQuizPct>=90?C.gr:finalQuizPct>=75?C.yl:C.rd}}>{finalQuizPct}% <span style={{fontSize:10,color:C.mu}}>({hire.finalQuizCorrect}/{hire.finalQuizTotal})</span></div>
          </div>}
        </div>}
        {(hire.doingWell||hire.areasOfImprovement)&&<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {hire.doingWell&&<div style={{flex:'1 1 200px',background:C.gr+'0d',border:'1px solid '+C.gr+'33',borderRadius:6,padding:'8px 10px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:4}}>✅ DOING WELL</div>
            <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{hire.doingWell}</div>
          </div>}
          {hire.areasOfImprovement&&<div style={{flex:'1 1 200px',background:C.yl+'0d',border:'1px solid '+C.yl+'33',borderRadius:6,padding:'8px 10px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>⚠️ AREAS TO DEVELOP</div>
            <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{hire.areasOfImprovement}</div>
          </div>}
        </div>}
      </div>}

      {/* DEPARTMENT FIELDS — visible when status === 'active', 'trainee', or 'inactive' */}
      {(hire.status==='active'||hire.status==='trainee'||hire.status==='inactive')&&(()=>{
        const teamColor = TEAM_COLORS[hire.team||'none']||C.mu;
        const activeQueues = QUEUES.filter(q=>hire.queues?.[q.id]?.active);
        const activeRoles  = ADDITIONAL_ROLES.filter(r=>hire.additionalRoles?.[r.id]);
        const shiftInfo    = null; // shift is free-text, displayed directly as hire.shift
        return (
          <div style={{background:C.su,borderBottom:'1px solid '+C.bo,padding:'12px 16px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.bl,letterSpacing:2,marginBottom:10}}>🏢 DEPARTMENT INFO</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',flex:'1 1 100px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>SUPERVISOR</div>
                <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:teamColor}}>{hire.supervisor||'Unassigned'}</div>
              </div>
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',flex:'1 1 100px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>SHIFT</div>
                <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:(hire.shiftStart||hire.shiftEnd)?C.tx:C.mu}}>{fmtShift(hire.shiftStart,hire.shiftEnd)||'Not set'}</div>
              </div>
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',flex:'1 1 100px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>SEAT</div>
                <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:hire.seatId?C.tx:C.mu}}>{hire.seatId||'Unassigned'}</div>
              </div>
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'8px 12px',flex:'2 1 200px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:6}}>QUEUES ({activeQueues.length})</div>
                {activeQueues.length===0
                  ? <span style={{fontFamily:MO,fontSize:10,color:C.mu,display:'block',marginBottom:6}}>None active</span>
                  : <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:8}}>
                      {activeQueues.map(q=>{
                        const qdate=hire.queues?.[q.id]?.date;
                        return (
                          <div key={q.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <span style={{fontFamily:MO,fontSize:10,color:C.bl}}>✓ {q.label}</span>
                            {qdate&&<span style={{fontFamily:MO,fontSize:9,color:C.mu}}>since {new Date(qdate+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'})}</span>}
                          </div>
                        );
                      })}
                    </div>
                }
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  <button onClick={()=>onUpdate({...hire,status:hire.status==='trainee'?'active':'trainee'})} style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,cursor:'pointer',border:`1px solid ${hire.status==='trainee'?C.pu:C.bo}`,background:hire.status==='trainee'?C.pu+'22':C.ca,color:hire.status==='trainee'?C.pu:C.mu,transition:'all .15s'}}>🎓 Training</button>
                  <button onClick={()=>onUpdate({...hire,status:hire.status==='inactive'?'active':'inactive'})} style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,cursor:'pointer',border:`1px solid ${hire.status==='inactive'?C.rd:C.bo}`,background:hire.status==='inactive'?C.rd+'22':C.ca,color:hire.status==='inactive'?C.rd:C.mu,transition:'all .15s'}}>💤 Inactive</button>
                </div>
              </div>
            </div>
            {activeRoles.length>0&&<div style={{marginBottom:(hire.currentIssues||hire.trainingNeeds)?10:0}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:4}}>ADDITIONAL ROLES</div>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {activeRoles.map(r=>(
                  <span key={r.id} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,background:C.pu+'22',border:'1px solid '+C.pu+'44',color:C.pu}}>{r.label}</span>
                ))}
              </div>
            </div>}
            {(hire.currentIssues||hire.trainingNeeds)&&<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {hire.currentIssues&&<div style={{flex:'1 1 200px',background:C.rd+'0d',border:'1px solid '+C.rd+'33',borderRadius:6,padding:'8px 10px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.rd,letterSpacing:1,marginBottom:4}}>⚠️ CURRENT ISSUES</div>
                <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{hire.currentIssues}</div>
              </div>}
              {hire.trainingNeeds&&<div style={{flex:'1 1 200px',background:C.yl+'0d',border:'1px solid '+C.yl+'33',borderRadius:6,padding:'8px 10px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>📚 TRAINING NEEDS</div>
                <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{hire.trainingNeeds}</div>
              </div>}
            </div>}
          </div>
        );
      })()}

      {/* DISC INTERACTION GUIDE */}
      {(()=>{
        const disc = (hire.discProfile||'').trim().toUpperCase();
        const mode = disc[0];
        if(!disc || !['D','I','S','C'].includes(mode)) return null;
        const modeLabel = {D:'D',I:'I',S:'S',C:'C'}[mode];
        const modeColor = {D:C.rd,I:C.or,S:C.gr,C:C.bl}[mode];
        const guides = {
          D:{
            strengths:'You both are outgoing and activity-driven. Both of you like to win. You may admire the strengths and achievements of this person.',
            struggles:'You may find the other person to be too controlling, while you are too permissive. You are more social, while the other person is more task-driven.',
            strategies:"Understand that a D-type person is direct and results-oriented. Be more direct, and get to the point with them. Do not be afraid of confrontation. Expect it, and do not take it personally. Work first, and THEN have fun.",
          },
          I:{
            strengths:'Both of you live enthusiastically and enjoy being with people. You both like to have fun and tend to forgive easily.',
            struggles:'Both of you tend to live emotionally and may compete for attention. Both of you are impulsive, and that can lead to challenges with following through with responsibilities and staying organized.',
            strategies:"Remember to listen to the other person, because he or she likes to talk as much as you do. When working on important tasks, keep each other accountable, and be clear about who is responsible for what. Give sincere recognition of this person's abilities, ideas and contributions.",
          },
          S:{
            strengths:'Both of you are people-oriented. You like to talk and the other person likes to listen. You tend to get along very well.',
            struggles:'Most struggles are related to pace. You like things fast-paced, exciting, spontaneous and with high energy. The other person likes things to be more calm, quiet and predictable.',
            strategies:'Slow down your approach. Tone down your enthusiasm. Be sincere with praise and appreciation. Do not embarrass this person in public. Allow this person time to warm up and open up to you.',
          },
          C:{
            strengths:'Your opposite strengths provide a good balance to each other\'s weaknesses. You can learn from the other person\'s analytical nature, and this person can learn not to take things so seriously and to have more fun.',
            struggles:'Your differences can lead to misunderstandings. You love to talk and be on the go, but the other person likes time alone. You are much more verbal, and it is easy for you to miss the other person\'s more indirect way of sharing concerns.',
            strategies:"Tone down your emotional reactions. Be more factual and objective, especially in the face of conflict. Do not rush or push this person. Be specific in your communication, and expect this person to speak literally and to take things literally.",
          },
        };
        const g = guides[mode];
        return (
          <div style={{borderBottom:'1px solid '+C.bo}}>
            <button onClick={()=>setShowDiscGuide(p=>!p)} style={{width:'100%',display:'flex',alignItems:'center',gap:8,padding:'8px 16px',background:'transparent',border:'none',cursor:'pointer',textAlign:'left'}}>
              <span style={{fontFamily:MO,fontSize:10,color:C.pu,letterSpacing:2}}>🧠 DISC INTERACTION GUIDE</span>
              <span style={{fontFamily:MO,fontSize:10,padding:'1px 7px',borderRadius:3,border:'1px solid '+modeColor+'55',color:modeColor,background:modeColor+'11'}}>Jesse I ↔ {hire.name.split(' ')[0]} {modeLabel}</span>
              <span style={{fontFamily:MO,fontSize:10,color:C.mu,marginLeft:'auto'}}>{showDiscGuide?'▲ hide':'▼ show'}</span>
            </button>
            {showDiscGuide&&<div style={{display:'flex',gap:0,padding:'0 12px 14px'}}>
              {[['💪 Strengths',g.strengths,C.gr],['⚡ Struggles',g.struggles,C.yl],['🎯 Strategies',g.strategies,C.or]].map(([label,text,col])=>(
                <div key={label} style={{flex:1,background:C.bg,border:'1px solid '+col+'33',borderRadius:7,padding:'10px 12px',margin:'0 4px'}}>
                  <div style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:col,letterSpacing:1,marginBottom:6}}>{label}</div>
                  <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.6}}>{text}</div>
                </div>
              ))}
            </div>}
          </div>
        );
      })()}

      {/* SECTION TABS */}
      <div style={{display:'flex',gap:0,borderBottom:'1px solid '+C.bo,overflowX:'auto',alignItems:'center'}}>
        {(showTabs?[
          ['days',  `📋 Days ${daysComp}/15 · ${daysPct}%`],
          ['mocks', `📞 Calls ${hire.mockCalls.length}/${mockGoal} · ${mockPct}%`],
          ['buddy', `🤝 Buddy ${buddyCalls.length}/${buddyGoal} · ${buddyPct}%`],
          ['eval',  '📊 Eval'],
          ['notes', '📌 Notes'],
        ]:[
          ['notes', '📌 Notes'],
        ]).map(([k,l])=>(
          <button key={k} onClick={()=>setSection(k)} style={{fontFamily:MO,fontSize:11,padding:'9px 16px',cursor:'pointer',border:'none',borderBottom:`2px solid ${section===k?C.or:'transparent'}`,background:'transparent',color:section===k?C.or:C.mu,transition:'all .15s',flex:1,whiteSpace:'nowrap'}}>{l}</button>
        ))}
        {!isTrainee&&<button onClick={()=>{setShowTraining(p=>!p);setSection(showTraining?'notes':'days');}} style={{fontFamily:MO,fontSize:10,padding:'6px 12px',marginLeft:'auto',marginRight:8,cursor:'pointer',border:`1px solid ${showTraining?C.pu:C.bo}`,borderRadius:5,background:showTraining?C.pu+'22':'transparent',color:showTraining?C.pu:C.mu,whiteSpace:'nowrap',flexShrink:0}}>{showTraining?'🎓 Hide Training':'🎓 Training History'}</button>}
      </div>

      <div style={{padding:16}}>

        {/* ── TRAINING DAYS ── */}
        {section==='days'&&<div>
          {(()=>{
            const missingGate=[];
            if(daysComp<15) missingGate.push('All 15 days must be checked complete');
            outlineDays.forEach(td=>{
              const d=hire.days[td.day]||{};
              if(d.showQuizToggle!==false&&d.hasQuiz!==false&&(d.quizCorrect==null||d.quizTotal==null)) missingGate.push('Day '+td.day+' quiz score missing');
            });
            if(hire.finalQuizCorrect==null||hire.finalQuizTotal==null) missingGate.push('Final quiz score missing');
            const gateOk=missingGate.length===0;
            return (
              <div style={{marginBottom:10}}>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <button onClick={gateOk?()=>onUpdate({...hire,trainingDaysComplete:!hire.trainingDaysComplete,trainingDaysCompleteDate:hire.trainingDaysComplete?null:new Date().toISOString().slice(0,10)}):null} style={{flexShrink:0,width:16,height:16,borderRadius:3,border:`2px solid ${hire.trainingDaysComplete?C.gr:gateOk?C.bo:C.mu+'44'}`,background:hire.trainingDaysComplete?C.gr+'22':'transparent',cursor:gateOk?'pointer':'not-allowed',display:'flex',alignItems:'center',justifyContent:'center',opacity:gateOk?1:0.5}}>
                    {hire.trainingDaysComplete&&<span style={{fontSize:9,color:C.gr,lineHeight:1}}>✓</span>}
                  </button>
                  <span style={{fontFamily:MO,fontSize:11,color:hire.trainingDaysComplete?C.gr:gateOk?C.mu:C.mu+'88'}}>Mark this step complete</span>
                  {hire.trainingDaysComplete&&<span style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:C.gr,background:C.gr+'11',border:'1px solid '+C.gr+'44',borderRadius:4,padding:'1px 8px'}}>✓ Complete{hire.trainingDaysCompleteDate?' '+fmtShortDate(hire.trainingDaysCompleteDate):''}</span>}
                </div>
                {!gateOk&&!hire.trainingDaysComplete&&<div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:4,paddingLeft:24,lineHeight:1.7}}>{missingGate.map((m,i)=><div key={i} style={{color:C.rd+'cc'}}>• {m}</div>)}</div>}
              </div>
            );
          })()}
          <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:hire.trainingDaysComplete?8:14}}>
            <span style={{fontFamily:MO,fontSize:11,color:C.tx,flexShrink:0}}>{daysComp}/15 days complete</span>
            <div style={{flex:1,height:5,background:C.bo,borderRadius:3}}><div style={{height:'100%',width:`${daysPct}%`,background:daysPct>=100?C.gr:C.or,borderRadius:3,transition:'width .4s'}}/></div>
            <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:daysPct>=100?C.gr:C.or,flexShrink:0}}>{daysPct}%</span>
          </div>
          {hire.trainingDaysComplete&&<div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
            <button onClick={e=>{flash(e);copySupEmail();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copiedSupEmail?C.gr+'22':C.ca,border:`1px solid ${copiedSupEmail?C.gr:C.bl}`,borderRadius:6,color:copiedSupEmail?C.gr:C.bl,cursor:'pointer',transition:'all .3s',flexShrink:0}}>{copiedSupEmail?'✓ COPIED':'📧 Final Email — Supervisor'}</button>
            <button onClick={e=>{flash(e);copyAgentEmail();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copiedAgentEmail?C.gr+'22':C.ca,border:`1px solid ${copiedAgentEmail?C.gr:C.te}`,borderRadius:6,color:copiedAgentEmail?C.gr:C.te,cursor:'pointer',transition:'all .3s',flexShrink:0}}>{copiedAgentEmail?'✓ COPIED':'📧 Final Email — Agent'}</button>
          </div>}

          {outlineDays.map(td=>{
            const d=hire.days[td.day]||{}, isRev=td.review, qpct=dayQuizPct(d);
            const hasHw=d.hasHw!==false, hasQuiz=d.hasQuiz!==false;
            const showHwBtn=td.showHwToggle!==false||hasHw; const showQuizBtn=td.showQuizToggle!==false||hasQuiz;
            return (
              <div key={td.day} style={{background:isRev?'#1a1500':C.ca,border:`1px solid ${isRev?C.yl+'44':C.bo}`,borderRadius:7,padding:'10px 12px',marginBottom:6}}>
                {/* Day title row */}
                <div style={{display:'flex',gap:8,alignItems:'flex-start',flexWrap:'wrap'}}>
                  <button onClick={()=>toggleDay(td.day)} style={{flexShrink:0,width:18,height:18,borderRadius:3,border:`2px solid ${d.completed?C.gr:C.bo}`,background:d.completed?C.gr+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',marginTop:2}}>
                    {d.completed&&<span style={{fontSize:10,color:C.gr,lineHeight:1}}>✓</span>}
                  </button>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                      <span style={{fontFamily:MO,fontSize:11,fontWeight:'bold',color:isRev?C.yl:C.tx}}>Day {td.day}</span>
                      {isRev&&<span style={{fontFamily:MO,fontSize:8,color:C.yl,border:'1px solid '+C.yl+'44',padding:'1px 5px',borderRadius:3}}>REVIEW ★</span>}
                    </div>
                    <div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:3,lineHeight:1.4}}>{td.topics}</div>
                  </div>
                  <div style={{display:'flex',gap:4,flexShrink:0,alignItems:'center'}}>
                    {(!isRev&&showHwBtn)&&<button onClick={()=>toggleDayHasHw(td.day)} title={hasHw?'Disable homework for this day':'Enable homework for this day'} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,cursor:'pointer',border:`1px solid ${hasHw?C.gr+'66':C.bo}`,background:hasHw?C.gr+'11':C.ca,color:hasHw?C.gr:C.mu+'88',transition:'all .15s'}}>HW</button>}
                    {showQuizBtn&&<button onClick={()=>toggleDayHasQuiz(td.day)} title={hasQuiz?'Disable quiz for this day':'Enable quiz for this day'} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,cursor:'pointer',border:`1px solid ${hasQuiz?C.bl+'66':C.bo}`,background:hasQuiz?C.bl+'11':C.ca,color:hasQuiz?C.bl:C.mu+'88',transition:'all .15s'}}>QZ</button>}
                    {d.completed&&<input type="date" value={d.completedDate||''} onChange={e=>setDayDate(td.day,e.target.value)} title="Completion date" style={{...inpS,fontSize:11,padding:'2px 6px',width:118,colorScheme:'dark'}}/>}
                  </div>
                </div>

                {(hasHw||hasQuiz||td.hasReviewQuiz||(d.customSteps||[]).length>0)&&<div style={{marginTop:8,paddingTop:8,borderTop:'1px solid '+C.bo+'55',display:'flex',flexDirection:'column',gap:7}}>
                  {(function(){
                    var slotOrder = d.stepOrder || td.stepOrder || (['hw','quizSent','quiz','reviewQuiz']).concat((d.customSteps||[]).map(function(s){return s.id;}));
                    return slotOrder.map(function(slotId){
                      if(slotId==='hw'){
                        if(!hasHw||isRev) return null;
                        if(hwPrompt===td.day) return (
                          <div key="hw" style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <span style={{fontFamily:MO,fontSize:10,color:C.gr,flexShrink:0}}>📎 HW Date:</span>
                            <input autoFocus type="date" value={hwDateDraft} onChange={e=>setHwDateDraft(e.target.value)} style={{...inpS,padding:'3px 6px',fontSize:11,width:120,colorScheme:'dark',flexShrink:0}}/>
                            <OBtn onClick={commitHw} style={{fontSize:10,padding:'3px 10px',flexShrink:0}}>✓ Mark Done</OBtn>
                            <Btn onClick={()=>setHwPrompt(null)} style={{fontSize:10,padding:'3px 8px',flexShrink:0}}>✕</Btn>
                          </div>
                        );
                        return (
                          <div key="hw" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <button onClick={()=>toggleHw(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(d.hwComplete?C.gr:C.bo),background:d.hwComplete?C.gr+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {d.hwComplete&&<span style={{fontSize:8,color:C.gr,lineHeight:1}}>✓</span>}
                            </button>
                            {d.hwComplete
                              ? <><span style={{fontFamily:MO,fontSize:10,color:C.gr,flex:1}}>📎 Day {td.day} HW — done</span><input type="date" value={d.hwDate||''} onChange={e=>setHwDate(td.day,e.target.value)} title="HW completed date" style={{...inpS,padding:'2px 6px',fontSize:10,width:112,colorScheme:'dark',flexShrink:0}}/></>
                              : <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Day {td.day} Homework</span>
                            }
                          </div>
                        );
                      }
                      if(slotId==='quizSent'){
                        if(!hasQuiz) return null;
                        return (
                          <div key="quizSent" style={{display:'flex',gap:8,alignItems:'center',paddingLeft:4}}>
                            <button onClick={()=>toggleQuizSent(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(d.quizSent?C.yl:C.bo),background:d.quizSent?C.yl+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {d.quizSent&&<span style={{fontSize:8,color:C.yl,lineHeight:1}}>✓</span>}
                            </button>
                            <span style={{fontFamily:MO,fontSize:10,color:d.quizSent?C.yl:C.mu}}>Day {td.day} Quiz Sent</span>
                          </div>
                        );
                      }
                      if(slotId==='quiz'){
                        if(!hasQuiz) return null;
                        if(td.finalQuiz) return (
                          <div key="quiz" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4,paddingTop:4,borderTop:'1px solid '+C.bo}}>
                            <span style={{fontFamily:MO,fontSize:10,color:C.or,flexShrink:0}}>🏁 Final Quiz:</span>
                            <input type="number" min={0} step={0.5} value={fqCorrect} onChange={e=>setFqCorrect(e.target.value)} placeholder="?" title="Correct" style={{...inpS,width:52,padding:'3px 8px',fontSize:11}}/>
                            <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>/</span>
                            <input type="number" min={1} step={0.5} value={fqTotal} onChange={e=>setFqTotal(e.target.value)} placeholder="?" title="Total" style={{...inpS,width:52,padding:'3px 8px',fontSize:11}}/>
                            <OBtn onClick={saveFinalQuiz} style={{fontSize:10,padding:'3px 10px'}}>Save</OBtn>
                            {hire.finalQuizCorrect!=null&&hire.finalQuizTotal!=null&&(()=>{const fp=Math.round((hire.finalQuizCorrect/hire.finalQuizTotal)*100);const b=quizBadge(fp,15);return(<><span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:fp>=90?C.gr:fp>=75?C.yl:C.rd}}>{fp}% ({hire.finalQuizCorrect}/{hire.finalQuizTotal})</span>{b&&<span style={{fontFamily:MO,fontSize:9,fontWeight:'bold',color:b.color,background:b.color+'22',border:'1px solid '+b.color+'55',borderRadius:4,padding:'1px 5px',flexShrink:0}}>{b.label}</span>}</>);})()}
                          </div>
                        );
                        return (
                          <div key="quiz" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <button onClick={()=>toggleDayQuiz(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(d.quizComplete?C.bl:C.bo),background:d.quizComplete?C.bl+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {d.quizComplete&&<span style={{fontSize:8,color:C.bl,lineHeight:1}}>✓</span>}
                            </button>
                            <span style={{fontFamily:MO,fontSize:10,color:d.quizComplete?C.bl:C.mu,flexShrink:0}}>Day {td.day} Quiz</span>
                            <input type="number" min={0} step={0.5} value={d.quizCorrect!=null?String(d.quizCorrect):''} onChange={e=>setQuizField(td.day,'quizCorrect',e.target.value)} placeholder="?" title="Correct" style={{...inpS,width:52,padding:'2px 6px',fontSize:11,flexShrink:0}}/>
                            <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>/</span>
                            <input type="number" min={1} step={0.5} value={d.quizTotal!=null?String(d.quizTotal):''} onChange={e=>setQuizField(td.day,'quizTotal',e.target.value)} placeholder="?" title="Total" style={{...inpS,width:52,padding:'2px 6px',fontSize:11,flexShrink:0}}/>
                            {qpct!=null&&<span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:qpct>=90?C.gr:qpct>=70?C.yl:C.rd,flexShrink:0}}>= {qpct}%</span>}
                            {qpct!=null&&(()=>{const b=quizBadge(qpct,td.day);return b?<span style={{fontFamily:MO,fontSize:9,fontWeight:'bold',color:b.color,background:b.color+'22',border:'1px solid '+b.color+'55',borderRadius:4,padding:'1px 5px',flexShrink:0}}>{b.label}</span>:null;})()}
                          </div>
                        );
                      }
                      if(slotId==='reviewQuiz'){
                        if(!td.hasReviewQuiz||(!hire.days[td.day-1]||hire.days[td.day-1].hasQuiz===false)) return null;
                        if(rqPrompt===td.day) return (
                          <div key="reviewQuiz" style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <span style={{fontFamily:MO,fontSize:10,color:C.pu,flexShrink:0}}>📝 RQ Date:</span>
                            <input autoFocus type="date" value={rqDateDraft} onChange={e=>setRqDateDraft(e.target.value)} style={{...inpS,padding:'3px 6px',fontSize:11,width:120,colorScheme:'dark',flexShrink:0}}/>
                            <OBtn onClick={commitRq} style={{fontSize:10,padding:'3px 10px',flexShrink:0}}>✓ Mark Done</OBtn>
                            <Btn onClick={()=>setRqPrompt(null)} style={{fontSize:10,padding:'3px 8px',flexShrink:0}}>✕</Btn>
                          </div>
                        );
                        return (
                          <div key="reviewQuiz" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <button onClick={()=>toggleReviewQuiz(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(d.reviewQuizComplete?C.pu:C.bo),background:d.reviewQuizComplete?C.pu+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {d.reviewQuizComplete&&<span style={{fontSize:8,color:C.pu,lineHeight:1}}>✓</span>}
                            </button>
                            {d.reviewQuizComplete
                              ? <><span style={{fontFamily:MO,fontSize:10,color:C.pu,flex:1}}>📝 Review Day {td.day-1} Quiz - In Class — done</span><input type="date" value={d.reviewQuizDate||''} onChange={e=>onUpdate({...hire,days:{...hire.days,[td.day]:{...d,reviewQuizDate:e.target.value}}})} title="Review quiz date" style={{...inpS,padding:'2px 6px',fontSize:10,width:112,colorScheme:'dark',flexShrink:0}}/></>
                              : <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Review Day {td.day-1} Quiz - In Class</span>
                            }
                          </div>
                        );
                      }
                      var cs=(d.customSteps||[]).find(function(s){return s.id===slotId;});
                      if(!cs) return null;
                      var csi=(d.customSteps||[]).indexOf(cs);
                      var cqPct=(cs.isQuiz&&cs.quizCorrect!=null&&cs.quizTotal!=null&&parseFloat(cs.quizTotal)>0)?Math.round(parseFloat(cs.quizCorrect)/parseFloat(cs.quizTotal)*100):null;
                      var cqBadge=cqPct!=null?customStepQuizBadge(cs.id,cqPct,td.day):null;
                      return (
                        <div key={cs.id} style={{paddingLeft:4,marginBottom:cs.isQuiz?5:0}}>
                          <div style={{display:'flex',gap:8,alignItems:'center'}}>
                            <button onClick={()=>{var steps=[...(d.customSteps||[])];steps[csi]={...cs,complete:!cs.complete,completeDate:cs.complete?null:new Date().toISOString().slice(0,10)};onUpdate({...hire,days:{...hire.days,[td.day]:{...d,customSteps:steps}}});}} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(cs.complete?C.gr:C.bo),background:cs.complete?C.gr+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {cs.complete&&<span style={{fontSize:8,color:C.gr,lineHeight:1}}>✓</span>}
                            </button>
                            <span style={{fontFamily:MO,fontSize:10,color:cs.complete?C.gr:C.mu,textDecoration:cs.complete?'line-through':'none',flex:1}}>{cs.label}</span>
                            {(cs.plannedDate!==null&&cs.plannedDate!==undefined)&&<input type="date" value={cs.completeDate||''} onChange={e=>{var steps=[...(d.customSteps||[])];steps[csi]={...cs,completeDate:e.target.value||null};onUpdate({...hire,days:{...hire.days,[td.day]:{...d,customSteps:steps}}});}} title="Date completed" style={{...inpS,padding:'2px 6px',fontSize:10,width:112,colorScheme:'dark',flexShrink:0}}/>}
                          </div>
                          {cs.isQuiz&&<div style={{display:'flex',gap:6,alignItems:'center',marginTop:3,paddingLeft:22}}>
                            <input type="number" min="0" placeholder="?" value={cs.quizCorrect!=null?String(cs.quizCorrect):''} onChange={e=>{var steps=[...(d.customSteps||[])];steps[csi]={...cs,quizCorrect:e.target.value===''?null:parseFloat(e.target.value)||null};onUpdate({...hire,days:{...hire.days,[td.day]:{...d,customSteps:steps}}});}} style={{...inpS,width:44,padding:'2px 5px',fontSize:10,textAlign:'center'}}/>
                            <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>/</span>
                            <input type="number" min="1" placeholder="#" value={cs.quizTotal!=null?String(cs.quizTotal):''} onChange={e=>{var steps=[...(d.customSteps||[])];steps[csi]={...cs,quizTotal:e.target.value===''?null:parseFloat(e.target.value)||null};onUpdate({...hire,days:{...hire.days,[td.day]:{...d,customSteps:steps}}});}} style={{...inpS,width:44,padding:'2px 5px',fontSize:10,textAlign:'center'}}/>
                            {cqPct!=null&&<span style={{fontFamily:MO,fontSize:10,color:cqPct>=90?C.gr:cqPct>=75?C.yl:C.rd,fontWeight:'bold'}}>{cqPct}%</span>}
                            {cqBadge&&<span style={{fontFamily:MO,fontSize:9,color:cqBadge.color,border:'1px solid '+cqBadge.color+'44',borderRadius:3,padding:'1px 5px'}}>{cqBadge.label}</span>}
                          </div>}
                        </div>
                      );
                    });
                  })()}
                </div>}
              </div>
            );
          })}
        </div>}

        {/* ── MOCK CALLS ── */}
        {section==='mocks'&&<div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
            <button onClick={hire.mockCalls.length>=1?()=>onUpdate({...hire,mockCallsComplete:!hire.mockCallsComplete,mockCallsCompleteDate:hire.mockCallsComplete?null:new Date().toISOString().slice(0,10)}):null} style={{flexShrink:0,width:16,height:16,borderRadius:3,border:`2px solid ${hire.mockCallsComplete?C.gr:hire.mockCalls.length>=1?C.bo:C.mu+'44'}`,background:hire.mockCallsComplete?C.gr+'22':'transparent',cursor:hire.mockCalls.length>=1?'pointer':'not-allowed',display:'flex',alignItems:'center',justifyContent:'center',opacity:hire.mockCalls.length>=1?1:0.5}}>
              {hire.mockCallsComplete&&<span style={{fontSize:9,color:C.gr,lineHeight:1}}>✓</span>}
            </button>
            <span style={{fontFamily:MO,fontSize:11,color:hire.mockCallsComplete?C.gr:hire.mockCalls.length>=1?C.mu:C.mu+'88'}}>Mark this step complete</span>
            {hire.mockCallsComplete&&<span style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:C.gr,background:C.gr+'11',border:'1px solid '+C.gr+'44',borderRadius:4,padding:'1px 8px'}}>✓ Complete{hire.mockCallsCompleteDate?' '+fmtShortDate(hire.mockCallsCompleteDate):''}</span>}
            {hire.mockCalls.length===0&&!hire.mockCallsComplete&&<span style={{fontFamily:MO,fontSize:10,color:C.rd+'cc',marginLeft:4}}>• Log at least 1 call first</span>}
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10,flexWrap:'wrap'}}>
            <span style={{fontFamily:MO,fontSize:11,color:C.mu,flexShrink:0}}>Mock Calls Start Date:</span>
            <input type="date" value={hire.mockCallStartDate||''} onChange={e=>onUpdate({...hire,mockCallStartDate:e.target.value||null})} style={{...inpS,fontSize:11,padding:'3px 8px',width:140,colorScheme:'dark',flexShrink:0}}/>
            {hire.mockCallStartDate&&<span style={{fontFamily:MO,fontSize:11,color:C.or}}>{(()=>{const d=new Date(hire.mockCallStartDate+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric',year:'2-digit'});})()}</span>}
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
            <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:4}}>✅ MOCK CALLS — DOING WELL</div><textarea value={hire.mockDoingWell||''} onChange={e=>onUpdate({...hire,mockDoingWell:e.target.value})} placeholder="What are they doing well in mock calls…" rows={3} style={{...inpS,width:'100%',resize:'vertical',fontSize:11,lineHeight:1.5,boxSizing:'border-box'}}/></div>
            <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>⚠️ MOCK CALLS — AREAS TO DEVELOP</div><textarea value={hire.mockAreasOfImprovement||''} onChange={e=>onUpdate({...hire,mockAreasOfImprovement:e.target.value})} placeholder="Areas to develop through mock calls…" rows={3} style={{...inpS,width:'100%',resize:'vertical',fontSize:11,lineHeight:1.5,boxSizing:'border-box'}}/></div>
          </div>
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
              <span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:C.tx}}>Mock Calls</span>
