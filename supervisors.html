          </div>
          {showBuddyImport&&(
            <div style={{background:C.ca,border:'1px solid '+C.pu,borderRadius:8,padding:14,marginBottom:14}}>
              <div style={{fontFamily:MO,fontSize:10,color:C.pu,letterSpacing:2,marginBottom:8}}>IMPORT BUDDY CALL</div>
              <div style={{fontFamily:MO,fontSize:11,color:C.mu,marginBottom:8}}>Paste the full buddy call form email submission below. All available fields will be auto-filled.</div>
              <textarea value={buddyImportText} onChange={e=>{setBuddyImportText(e.target.value);setBuddyImportError('');}} rows={8} placeholder="Paste email text here…" style={{fontFamily:MO,fontSize:11,color:C.tx,background:C.su,border:`1px solid ${buddyImportError?C.rd:C.bo}`,borderRadius:6,padding:'8px 10px',width:'100%',resize:'vertical',outline:'none',boxSizing:'border-box',lineHeight:1.5,marginBottom:6}}/>
              {buddyImportError&&<div style={{fontFamily:MO,fontSize:11,color:C.rd,marginBottom:6}}>{buddyImportError}</div>}
              <div style={{display:'flex',gap:8}}>
                <OBtn onClick={importBuddyCall} style={{background:C.pu}}>📥 Parse & Import</OBtn>
                <Btn onClick={()=>{setShowBuddyImport(false);setBuddyImportText('');setBuddyImportError('');}}>Cancel</Btn>
              </div>
            </div>
          )}
          {newBuddyOpen&&<div style={{background:C.ca,border:'1px solid '+C.bl,borderRadius:8,padding:14,marginBottom:14}}>
            <div style={{fontFamily:MO,fontSize:10,color:C.bl,letterSpacing:2,marginBottom:10}}>LOG BUDDY CALL</div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
              <div style={{flex:1,minWidth:140}}><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:3}}>DATE</div><input type="date" value={buddyDraft.date||''} onChange={e=>setBuddyDraft(p=>({...p,date:e.target.value}))} style={{...inpS,colorScheme:'dark',width:'100%'}}/></div>
              <div style={{flex:2,minWidth:180}}><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:3}}>OBSERVER NAME</div><input value={buddyDraft.observerName||''} onChange={e=>setBuddyDraft(p=>({...p,observerName:e.target.value}))} placeholder="Seasoned agent name…" style={{...inpS,width:'100%'}}/></div>
            </div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
              <div style={{flex:1,minWidth:180}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:4}}>INDEPENDENCE</div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                  {[['guidance','Needed Guidance',C.rd],['independent','Handled Independently',C.yl],['exceeding','Exceeded Expectations',C.gr]].map(([val,lbl,col])=>(
                    <button key={val} onClick={()=>setBuddyDraft(p=>({...p,independence:p.independence===val?null:val}))} style={{fontFamily:MO,fontSize:10,padding:'3px 8px',borderRadius:4,cursor:'pointer',border:`1px solid ${buddyDraft.independence===val?col+'99':C.bo}`,background:buddyDraft.independence===val?col+'22':C.ca,color:buddyDraft.independence===val?col:C.mu}}>{lbl}</button>
                  ))}
                </div>
              </div>
              <div style={{flex:1,minWidth:160}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:4}}>CONFIDENCE</div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                  {[['low','Low',C.rd],['developing','Developing',C.yl],['confident','Confident',C.gr]].map(([val,lbl,col])=>(
                    <button key={val} onClick={()=>setBuddyDraft(p=>({...p,confidence:p.confidence===val?null:val}))} style={{fontFamily:MO,fontSize:10,padding:'3px 8px',borderRadius:4,cursor:'pointer',border:`1px solid ${buddyDraft.confidence===val?col+'99':C.bo}`,background:buddyDraft.confidence===val?col+'22':C.ca,color:buddyDraft.confidence===val?col:C.mu}}>{lbl}</button>
                  ))}
                </div>
              </div>
            </div>
            <div style={{background:C.su,border:'1px solid '+C.bo,borderRadius:6,padding:'8px 10px',marginBottom:8}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:6}}>CHECKLIST</div>
              {[['greetedCorrectly','Greeted caller correctly'],['identifiedIssue','Identified the issue'],['pulledProgramming','Pulled panel programming'],['loggedWintouch','Logged Wintouch ticket'],['askedForHelpApprop','Asked for help appropriately']].map(([key,lbl])=>(
                <div key={key} style={{marginBottom:4}}>
                  <div onClick={()=>setBuddyDraft(p=>({...p,checklist:{...p.checklist,[key]:!p.checklist?.[key]}}))} style={{display:'flex',gap:8,alignItems:'center',cursor:'pointer'}}>
                    <div style={{width:14,height:14,borderRadius:3,border:`2px solid ${buddyDraft.checklist?.[key]?C.gr:C.bo}`,background:buddyDraft.checklist?.[key]?C.gr+'22':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      {buddyDraft.checklist?.[key]&&<span style={{fontSize:9,color:C.gr,lineHeight:1}}>✓</span>}
                    </div>
                    <span style={{fontFamily:MO,fontSize:11,color:buddyDraft.checklist?.[key]?C.tx:C.mu}}>{lbl}</span>
                  </div>
                  {key==='loggedWintouch'&&buddyDraft.checklist?.loggedWintouch&&(
                    <div style={{display:'flex',alignItems:'center',gap:6,marginTop:3,marginLeft:22}}>
                      <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>CASE#</span>
                      <input value={buddyDraft.wintouchCaseNum||''} onChange={e=>setBuddyDraft(p=>({...p,wintouchCaseNum:e.target.value}))} placeholder="0000000" maxLength={7} style={{...inpS,width:80,fontSize:11,padding:'2px 6px'}}/>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div style={{marginBottom:8}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:3}}>AGENT NOTES (your observations)</div><textarea value={buddyDraft.agentNotes||''} onChange={e=>setBuddyDraft(p=>({...p,agentNotes:e.target.value}))} rows={3} placeholder="Your notes from sitting with them…" style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5}}/></div>
            <div style={{marginBottom:12}}><div style={{fontFamily:MO,fontSize:9,color:C.pu,letterSpacing:1,marginBottom:3}}>TRAINEE NOTES (their self-reflection)</div><textarea value={buddyDraft.traineeNotes||''} onChange={e=>setBuddyDraft(p=>({...p,traineeNotes:e.target.value}))} rows={3} placeholder="Trainee's own notes or reflections…" style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5}}/></div>
            <div style={{display:'flex',gap:8}}><OBtn onClick={saveBuddy} style={{flex:1}}>💾 Save</OBtn><Btn onClick={()=>setNewBuddyOpen(false)}>Cancel</Btn></div>
          </div>}
          {buddyCalls.length===0&&!newBuddyOpen&&<div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:8,padding:'20px 16px',textAlign:'center',fontFamily:MO,fontSize:12,color:C.mu,marginBottom:14}}>No buddy calls logged yet.</div>}
          {buddyCalls.map((call,i)=>{
            const isExp=expandedBuddy===call.id;
            return (
              <div key={call.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:7,marginBottom:6,overflow:'hidden'}}>
                <div onClick={()=>setExpandedBuddy(isExp?null:call.id)} style={{display:'flex',gap:8,alignItems:'center',padding:'8px 12px',cursor:'pointer',flexWrap:'wrap'}}>
                  <span style={{fontFamily:MO,fontSize:11,fontWeight:'bold',color:C.bl,flexShrink:0}}>#{i+1}</span>
                  <span style={{fontFamily:MO,fontSize:10,color:C.mu,flex:1}}>{fmtShortDate(call.date)}</span>
                  {call.observerName&&<span style={{fontFamily:MO,fontSize:9,color:C.mu,flexShrink:0}}>{call.observerName}</span>}
                  {call.independence&&<span style={{fontFamily:MO,fontSize:9,color:call.independence==='exceeding'?C.gr:call.independence==='independent'?C.yl:C.rd,border:`1px solid ${call.independence==='exceeding'?C.gr:call.independence==='independent'?C.yl:C.rd}44`,padding:'1px 5px',borderRadius:3,flexShrink:0}}>{call.independence==='exceeding'?'Exceeded':call.independence==='independent'?'Independent':'Guided'}</span>}
                  {call.confidence&&<span style={{fontFamily:MO,fontSize:9,color:call.confidence==='confident'?C.gr:call.confidence==='developing'?C.yl:C.rd,border:`1px solid ${call.confidence==='confident'?C.gr:call.confidence==='developing'?C.yl:C.rd}44`,padding:'1px 5px',borderRadius:3,flexShrink:0}}>{call.confidence==='confident'?'Confident':call.confidence==='developing'?'Developing':'Low'}</span>}
                  <button onClick={e=>{e.stopPropagation();deleteBuddy(call.id);}} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11,flexShrink:0}}>✕</button>
                </div>
                {isExp&&<div style={{padding:'10px 12px 12px',borderTop:'1px solid '+C.bo}}>
                  {(call.independence||call.confidence)&&<div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
                    {call.independence&&<span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Independence: <span style={{color:call.independence==='exceeding'?C.gr:call.independence==='independent'?C.yl:C.rd,fontWeight:'bold'}}>{call.independence==='exceeding'?'Exceeded Expectations':call.independence==='independent'?'Handled Independently':'Needed Guidance'}</span></span>}
                    {call.confidence&&<span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Confidence: <span style={{color:call.confidence==='confident'?C.gr:call.confidence==='developing'?C.yl:C.rd,fontWeight:'bold'}}>{call.confidence==='confident'?'Confident':call.confidence==='developing'?'Developing':'Low'}</span></span>}
                  </div>}
                  {call.checklist&&Object.values(call.checklist).some(Boolean)&&<div style={{background:C.su,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',marginBottom:10}}>
                    <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:4}}>CHECKLIST</div>
                    {[['greetedCorrectly','Greeted caller correctly'],['identifiedIssue','Identified the issue'],['pulledProgramming','Pulled panel programming'],['loggedWintouch','Logged Wintouch ticket'],['askedForHelpApprop','Asked for help appropriately']].map(([key,lbl])=>(
                      call.checklist[key]&&<div key={key} style={{fontFamily:MO,fontSize:10,color:C.gr,marginBottom:2}}>✓ {lbl}{key==='loggedWintouch'&&call.wintouchCaseNum?<span style={{color:C.mu}}> · Case# {call.wintouchCaseNum}</span>:null}</div>
                    ))}
                    {[['greetedCorrectly','Greeted caller correctly'],['identifiedIssue','Identified the issue'],['pulledProgramming','Pulled panel programming'],['loggedWintouch','Logged Wintouch ticket'],['askedForHelpApprop','Asked for help appropriately']].map(([key,lbl])=>(
                      !call.checklist[key]&&<div key={key+'x'} style={{fontFamily:MO,fontSize:10,color:C.rd,marginBottom:2}}>✕ {lbl}</div>
                    ))}
                  </div>}
                  {call.agentNotes&&<div style={{marginBottom:call.traineeNotes?10:0}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:4}}>AGENT NOTES</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.agentNotes}</div></div>}
                  {call.traineeNotes&&<div><div style={{fontFamily:MO,fontSize:9,color:C.pu,letterSpacing:1,marginBottom:4}}>TRAINEE NOTES</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.traineeNotes}</div></div>}
                  {!call.agentNotes&&!call.traineeNotes&&!call.independence&&!call.confidence&&<div style={{fontFamily:MO,fontSize:11,color:C.mu}}>No notes recorded.</div>}
                </div>}
              </div>
            );
          })}
        </div>}

        {/* ── EVAL ── */}
        {section==='eval'&&(()=>{
          const ev = hire.trainingEval;
          const allRated = evalAllRated();
          const ratingBg = r => r==='needs-work'?C.rd+'22':r==='good'?C.yl+'22':r==='great'?C.gr+'22':'transparent';
          const ratingBdr = r => r==='needs-work'?C.rd+'66':r==='good'?C.yl+'66':r==='great'?C.gr+'66':C.bo;
          const sectionStatus = group => {
            const cats = Object.values(ev[group]||{});
            const rated = cats.filter(c=>c.rating!=null).length;
            if (rated===0) return null;
            const needs = cats.filter(c=>c.rating==='needs-work').length;
            if (needs===0) return {label:'On Track',color:C.gr};
            if (needs<=2) return {label:'Needs Attention',color:C.yl};
            return {label:'At Risk',color:C.rd};
          };
          const dmpStatus  = sectionStatus('dmpValues');
          const tswpStatus = sectionStatus('tswp');
          const RatingBtn = ({val, cur, onClick, color, label}) => (
            <button onClick={onClick} style={{fontFamily:MO,fontSize:10,padding:'3px 10px',borderRadius:4,cursor:'pointer',border:`1px solid ${cur===val?color+'99':C.bo}`,background:cur===val?color+'22':C.ca,color:cur===val?color:C.mu,transition:'all .15s',flexShrink:0}}>{label}</button>
          );
          const CategoryRow = ({group, catKey, label}) => {
            const cat = ev[group][catKey];
            return (
              <div style={{background:ratingBg(cat.rating),border:`1px solid ${ratingBdr(cat.rating)}`,borderRadius:7,padding:'10px 12px',marginBottom:6}}>
                <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',marginBottom:cat.rating?6:0}}>
                  <span style={{fontFamily:MO,fontSize:11,color:C.tx,flex:1,minWidth:120}}>{label}</span>
                  <RatingBtn val="needs-work" cur={cat.rating} onClick={()=>setEvalRating(group,catKey,'needs-work')} color={C.rd} label="⚠️ Needs Work"/>
                  <RatingBtn val="good"  cur={cat.rating} onClick={()=>setEvalRating(group,catKey,'good')}  color={C.yl} label="👍 Good Work"/>
                  <RatingBtn val="great" cur={cat.rating} onClick={()=>setEvalRating(group,catKey,'great')} color={C.gr} label="⭐ Great Work"/>
                </div>
                {cat.rating&&<input value={cat.notes} onChange={e=>setEvalNotes(group,catKey,e.target.value)} placeholder="Notes (optional)…" style={{...inpS,width:'100%',fontSize:11,padding:'4px 8px',boxSizing:'border-box'}}/>}
              </div>
            );
          };
          return (
            <div>
              {/* Sign-off */}
              {ev.signedOff
                ? <div style={{fontFamily:MO,fontSize:13,color:C.gr,background:C.gr+'11',border:'1px solid '+C.gr+'44',borderRadius:8,padding:'14px 16px',textAlign:'center',marginBottom:14}}>✅ TRAINING COMPLETE — Signed off {fmtShortDate(ev.signedOffDate)}</div>
                : <button onClick={signOff} disabled={!allRated} style={{width:'100%',fontFamily:MO,fontSize:13,fontWeight:'bold',padding:'12px',marginBottom:14,border:'none',borderRadius:8,cursor:allRated?'pointer':'default',background:allRated?C.gr:C.bo,color:allRated?'#fff':C.mu,opacity:allRated?1:0.5,transition:'all .3s'}}>✅ CLEAR FOR SOLO — Sign Off{!allRated?(!hire.mockCallsComplete?' (complete mock calls first)':!hire.buddyCallsComplete?' (complete buddy calls first)':' (rate all categories first)'):''}</button>
              }
              <div style={{display:'flex',justifyContent:'flex-end',marginBottom:10}}>
                <button onClick={e=>{flash(e);copyEvalReport();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copiedEval?C.gr+'22':C.ca,border:`1px solid ${copiedEval?C.gr:C.bo}`,borderRadius:6,color:copiedEval?C.gr:C.tx,cursor:'pointer',transition:'all .3s'}}>{copiedEval?'✓ COPIED':'📤 Copy Full Report'}</button>
              </div>
              {/* Header strip */}
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:'10px 14px',marginBottom:12,display:'flex',gap:16,flexWrap:'wrap',alignItems:'center'}}>
                {quizAvg!=null&&<span style={{fontFamily:MO,fontSize:11,color:C.mu}}>Avg Quiz: <span style={{color:quizAvg>=90?C.gr:quizAvg>=70?C.yl:C.rd,fontWeight:'bold'}}>{quizAvg}%</span></span>}
                {finalQuizPct!=null&&<span style={{fontFamily:MO,fontSize:11,color:C.mu}}>Final Quiz: <span style={{color:finalQuizPct>=90?C.gr:finalQuizPct>=75?C.yl:C.rd,fontWeight:'bold'}}>{finalQuizPct}%</span></span>}
                {dmpStatus&&<span style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:dmpStatus.color,background:dmpStatus.color+'22',border:'1px solid '+dmpStatus.color+'55',borderRadius:4,padding:'2px 8px'}}>DMP: {dmpStatus.label}</span>}
                {tswpStatus&&<span style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:tswpStatus.color,background:tswpStatus.color+'22',border:'1px solid '+tswpStatus.color+'55',borderRadius:4,padding:'2px 8px'}}>TSWP: {tswpStatus.label}</span>}
                {hire.doingWell&&<span style={{fontFamily:MO,fontSize:11,color:C.gr,flex:1,minWidth:120}}>👍 <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>DAYS: </span>{hire.doingWell}</span>}
                {hire.areasOfImprovement&&<span style={{fontFamily:MO,fontSize:11,color:C.yl,flex:1,minWidth:120}}>⚠️ <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>DAYS: </span>{hire.areasOfImprovement}</span>}
                {hire.mockCallsComplete&&hire.mockDoingWell&&<span style={{fontFamily:MO,fontSize:11,color:C.gr,flex:1,minWidth:120}}>👍 <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>MOCK: </span>{hire.mockDoingWell}</span>}
                {hire.mockCallsComplete&&hire.mockAreasOfImprovement&&<span style={{fontFamily:MO,fontSize:11,color:C.yl,flex:1,minWidth:120}}>⚠️ <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>MOCK: </span>{hire.mockAreasOfImprovement}</span>}
                {hire.buddyCallsComplete&&hire.buddyDoingWell&&<span style={{fontFamily:MO,fontSize:11,color:C.gr,flex:1,minWidth:120}}>👍 <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>BUDDY: </span>{hire.buddyDoingWell}</span>}
                {hire.buddyCallsComplete&&hire.buddyAreasOfImprovement&&<span style={{fontFamily:MO,fontSize:11,color:C.yl,flex:1,minWidth:120}}>⚠️ <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>BUDDY: </span>{hire.buddyAreasOfImprovement}</span>}
              </div>
              {/* Sub-tabs */}
              <div style={{display:'flex',gap:0,borderBottom:'1px solid '+C.bo,marginBottom:12}}>
                {[['dmp','DMP Values',dmpStatus],['tswp','Tech Support Word Pictures',tswpStatus]].map(([k,l,st])=>(
                  <button key={k} onClick={()=>setEvalSubTab(k)} style={{fontFamily:MO,fontSize:11,padding:'8px 16px',cursor:'pointer',border:'none',borderBottom:`2px solid ${evalSubTab===k?C.or:'transparent'}`,background:'transparent',color:evalSubTab===k?C.or:C.mu,transition:'all .15s',display:'flex',gap:6,alignItems:'center'}}>
                    {l}{st&&<span style={{fontFamily:MO,fontSize:9,fontWeight:'bold',color:st.color,background:st.color+'22',border:'1px solid '+st.color+'44',borderRadius:3,padding:'1px 5px'}}>{st.label}</span>}
                  </button>
                ))}
              </div>
              {/* DMP Values */}
              {evalSubTab==='dmp'&&<div>
                <CategoryRow group="dmpValues" catKey="honestyIntegrity"     label="Honesty and integrity"/>
                <CategoryRow group="dmpValues" catKey="innovationInitiative" label="Innovation and initiative"/>
                <CategoryRow group="dmpValues" catKey="responsiveness"       label="Responsiveness"/>
                <CategoryRow group="dmpValues" catKey="kindness"             label="Kindness"/>
                <CategoryRow group="dmpValues" catKey="fun"                  label="Fun!"/>
                <CategoryRow group="dmpValues" catKey="profit"               label="Profit"/>
                <CategoryRow group="dmpValues" catKey="teamworkDmp"          label="Teamwork"/>
                <CategoryRow group="dmpValues" catKey="generosity"           label="Generosity"/>
                <CategoryRow group="dmpValues" catKey="appearance"           label="Appearance"/>
              </div>}
              {/* TSWP */}
              {evalSubTab==='tswp'&&<div>
                <CategoryRow group="tswp" catKey="resolutionMindset"  label="Resolution mindset"/>
                <CategoryRow group="tswp" catKey="phoneEtiquette"     label="Phone etiquette"/>
                <CategoryRow group="tswp" catKey="attitude"           label="Attitude"/>
                <CategoryRow group="tswp" catKey="initiative"         label="Initiative"/>
                <CategoryRow group="tswp" catKey="documentingCalls"   label="Documenting calls"/>
                <CategoryRow group="tswp" catKey="responseToCoaching" label="Response to coaching"/>
                <CategoryRow group="tswp" catKey="attendance"         label="Attendance"/>
                <CategoryRow group="tswp" catKey="teamworkTswp"       label="Teamwork"/>
              </div>}
            </div>
          );
        })()}

        {/* ── NOTES ── */}
        {section==='notes'&&<div>
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:8}}>ADD SUPERVISOR NOTE</div>
            <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap'}}>
              {[['positive','👍 Positive',C.gr],['improvement','⚠️ Improvement',C.yl],['milestone','📌 Milestone',C.bl]].map(([k,l,col])=>(
                <button key={k} onClick={()=>setNoteTag(k)} style={{fontFamily:MO,fontSize:11,padding:'4px 10px',borderRadius:4,cursor:'pointer',border:`1px solid ${noteTag===k?col:C.bo}`,background:noteTag===k?col+'22':C.ca,color:noteTag===k?col:C.mu}}>{l}</button>
              ))}
            </div>
            <textarea value={noteBody} onChange={e=>setNoteBody(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))addNote();}} placeholder="Add a note… Ctrl+Enter to save" rows={3} style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5,marginBottom:8}}/>
            <div style={{display:'flex',justifyContent:'flex-end'}}><OBtn onClick={addNote} disabled={!noteBody.trim()}>+ Add Note</OBtn></div>
          </div>
          {hire.notes.length===0&&<div style={{fontFamily:MO,fontSize:12,color:C.mu,textAlign:'center',padding:'20px 0'}}>No notes yet.</div>}
          {[...hire.notes].sort((a,b)=>a.date.localeCompare(b.date)).map(n=>(
            <div key={n.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:7,padding:12,marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,gap:8}}>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,border:'1px solid '+tagCol(n.tag)+'55',color:tagCol(n.tag),background:tagCol(n.tag)+'11'}}>{tagIcon(n.tag)} {n.tag}</span>
                  <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>{fmtShortDate(n.date)}</span>
                </div>
                <button onClick={()=>onUpdate({...hire,notes:hire.notes.filter(x=>x.id!==n.id)})} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11}}>✕</button>
              </div>
              <div style={{fontFamily:MO,fontSize:12,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{n.body}</div>
            </div>
          ))}
        </div>}

      </div>
    </div>
  );
}

const AddForm = ({isAlumni, onSave, onCancel, name, setName, start, setStart, sup, setSup, disc, setDisc}) => {
  const inpS = {fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',color:C.tx,outline:'none'};
  return (
    <div style={{background:C.su,border:'1px solid '+(isAlumni?C.bl:C.pu),borderRadius:8,padding:14,marginBottom:16}}>
      <div style={{fontFamily:MO,fontSize:10,color:isAlumni?C.bl:C.pu,letterSpacing:2,marginBottom:10}}>{isAlumni?'ADD PAST TRAINEE':'ADD CURRENT TRAINEE'}</div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
        <input autoFocus value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&onSave()} placeholder="Full name…" style={{...inpS,flex:'2 1 140px'}}/>
        <input type="date" value={start} onChange={e=>setStart(e.target.value)} style={{...inpS,flex:'1 1 120px',colorScheme:'dark'}}/>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
        <input value={sup} onChange={e=>setSup(e.target.value)} placeholder="Supervisor name…" style={{...inpS,flex:'2 1 140px'}}/>
        <input value={disc} onChange={e=>setDisc(e.target.value)} placeholder="DISC profile…" style={{...inpS,flex:'1 1 80px'}}/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <OBtn onClick={onSave} disabled={!name.trim()} style={{background:isAlumni?C.bl:undefined}}>{isAlumni?'Add to Alumni':'Add Trainee'}</OBtn>
        <Btn onClick={onCancel}>Cancel</Btn>
      </div>
    </div>
  );
};

// ── DeptTrainingTab ───────────────────────────────────────────────────────────

// ── SeatingChart ──────────────────────────────────────────────────────────────
function SeatingChart({ agents, onUpdateAgent }) {
  const [dragId,setDragId]         = useState(null);
  const [dragSource,setDragSource] = useState(null);
  const [dropHover,setDropHover]   = useState(null);
  const [editSeat,setEditSeat]     = useState(null);
  const [editName,setEditName]     = useState('');

  // ── Calibration mode state ─────────────────────────────────────────────────
  const [calibMode,setCalibMode]   = useState(false);
  const [selCalib,setSelCalib]     = useState(null);   // selected seatId in calib panel
  const [calibDrag,setCalibDrag]   = useState(null);   // {seatId, offX, offY}
  const [copied,setCopied]         = useState(false);
  const [deletedSeats,setDeletedSeats] = useState(()=>{ try{return new Set(JSON.parse(localStorage.getItem('dps-deleted-seats')||'[]'));}catch(e){return new Set();} });
  const [addedSeats,setAddedSeats]     = useState(()=>{ try{return JSON.parse(localStorage.getItem('dps-added-seats')||'[]');}catch(e){return [];} });
  const [newSeatId,setNewSeatId]       = useState('');
  const floorRef = useRef(null);

  const [seatRoles, setSeatRoles] = useState(() => {
    try { const s = localStorage.getItem('dps-seat-roles'); if(s) return JSON.parse(s); } catch(e) {}
    return JSON.parse(JSON.stringify(SEAT_ROLES));
  });
  const updateSeatRole = (id, roleKey) => {
    setSeatRoles(prev => {
      const next = {...prev};
      if(!roleKey) { delete next[id]; }
      else {
        const ROLE_DEFS = {
          'supervisor':  { label: 'Open Supervisor Seat',           color: '#ef4444' },
          'adv-tech':    { label: 'Open Advanced Technician Seat',  color: '#ef4444' },
          'trainer':     { label: 'Open Trainer Seat',              color: '#ef4444' },
        };
        next[id] = ROLE_DEFS[roleKey];
      }
      try { localStorage.setItem('dps-seat-roles', JSON.stringify(next)); } catch(e) {}
      return next;
    });
  };

  // [seatId, tx, ty, fixed?] -- tile top-left in 1120x540 container
  const SEATS_INIT = [
    ['adv-1',  14, 375], ['adv-2',  74, 375],
    ['adv-3',  14, 435], ['adv-4',  74, 435],
    ['net-1', 252, 375], ['net-2', 310, 375], ['net-3', 368, 375], ['net-4', 438, 375],
    ['inv-1', 438, 285],
    ['conf-1', 558, 272], ['conf-2', 616, 272], ['conf-3', 674, 272],
    ['conf-4', 558, 344], ['conf-5', 616, 344], ['conf-6', 674, 344],
    ['conf-7', 736, 344],
    ['quad-1', 964, 330], ['quad-2', 1022, 330],
    ['quad-3', 964, 390], ['quad-4', 1022, 390],
    ['main-01',  16, 470], ['main-02',  75, 470], ['main-03', 134, 470],
    ['main-04', 193, 470], ['main-05', 252, 470], ['main-06', 311, 470],
    ['main-07', 370, 470], ['main-08', 429, 470], ['main-09', 488, 470],
    ['main-10', 547, 470], ['main-11', 606, 470], ['main-12', 665, 470],
    ['main-13', 724, 470], ['main-14', 783, 470], ['main-15', 842, 470],
    ['main-16', 901, 470], ['main-17', 960, 470], ['main-18',1019, 470],
  ];

  const [seatPos, setSeatPos] = useState(() => {
    const m = {};
    SEATS_INIT.forEach(([id,x,y,fx])=>{ m[id]={x,y,fixed:!!fx}; });
    try {
      const saved = JSON.parse(localStorage.getItem('dps-seat-pos')||'{}');
      Object.keys(saved).forEach(id=>{ m[id]={...m[id],...saved[id]}; });
    } catch(e) {}
    return m;
  });

  const saveSeatPos = pos => { try{localStorage.setItem('dps-seat-pos',JSON.stringify(pos));}catch(e){} };

  const SEATS = [...SEATS_INIT.filter(([id])=>!deletedSeats.has(id)), ...addedSeats]
    .map(([id,,,fx])=>[id, seatPos[id]?.x??0, seatPos[id]?.y??0, fx]);

  const updatePos = (id, x, y) => setSeatPos(p=>{
    const n={...p,[id]:{...p[id],x:Math.max(0,Math.round(x)),y:Math.max(0,Math.round(y))}};
    saveSeatPos(n); return n;
  });
  const nudge = (id, dx, dy) => setSeatPos(p=>{
    const n={...p,[id]:{...p[id],x:Math.max(0,(p[id]?.x||0)+dx),y:Math.max(0,(p[id]?.y||0)+dy)}};
    saveSeatPos(n); return n;
  });

  const deleteSeat = id => {
    setDeletedSeats(prev=>{ const n=new Set(prev); n.add(id); try{localStorage.setItem('dps-deleted-seats',JSON.stringify([...n]));}catch(e){} return n; });
    if(selCalib===id) setSelCalib(null);
  };
  const addSeat = () => {
    const sid = newSeatId.trim().replace(/\s+/g,'-').toLowerCase();
    if(!sid || [...SEATS_INIT.map(s=>s[0]),...addedSeats.map(s=>s[0])].includes(sid)) return;
    const entry = [sid, 500, 200];
    const next = [...addedSeats, entry];
    setAddedSeats(next);
    setSeatPos(p=>{ const n={...p,[sid]:{x:500,y:200,fixed:false}}; saveSeatPos(n); return n; });
    try{localStorage.setItem('dps-added-seats',JSON.stringify(next));}catch(e){}
    setNewSeatId('');
    setSelCalib(sid);
  };

  const copyArray = () => {
    const lines = SEATS.map(([id,x,y,fx])=>`  ['${id}', ${x}, ${y}${fx?', true':''}],`).join('\n');
    const out = `const SEATS = [\n${lines}\n];`;
    navigator.clipboard.writeText(out).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});
  };

  // Mouse handlers for calib drag
  const onFloorMouseMove = e => {
    if(!calibDrag) return;
    const rect = floorRef.current.getBoundingClientRect();
    const nx = e.clientX - rect.left - calibDrag.offX;
    const ny = e.clientY - rect.top  - calibDrag.offY;
    updatePos(calibDrag.seatId, nx, ny);
  };
  const onFloorMouseUp = () => setCalibDrag(null);

  const FW=1120, FH=540;

  const activeAgents = agents.filter(a => a.status !== 'inactive');
  const seatMap = {};
  activeAgents.filter(a=>a.seatId).forEach(a=>{ seatMap[a.seatId]=a; });
  const unseated = activeAgents.filter(a=>!a.seatId && !SPECIALTY_GOLD.includes(a.name));

  const agentColor = a => {
    if(!a) return null;
    if(SPECIALTY_GOLD.includes(a.name)) return '#eab308';
    if(a.specializedRole || SPECIALTY_RED.includes(a.name)) return C.rd;
    const tc = supervisorColor(a.supervisor);
    return TEAM_COLORS[tc] || C.mu;
  };

  const assignSeat = (agentId, toSeatId) => {
    const fromAgent = activeAgents.find(a=>a.id===agentId);
    if(!fromAgent) return;
    if(SPECIALTY_GOLD.includes(seatMap[toSeatId]?.name)) return;
    const toAgent = seatMap[toSeatId];
    if(toAgent) onUpdateAgent({...toAgent, seatId: fromAgent.seatId||null});
    onUpdateAgent({...fromAgent, seatId: toSeatId});
  };

  const unassignSeat = agentId => {
    const ag = activeAgents.find(a=>a.id===agentId);
    if(ag && !SPECIALTY_GOLD.includes(ag.name)) onUpdateAgent({...ag, seatId:null});
  };

  const saveEdit = () => {
    if(!editSeat) return;
    const ag = seatMap[editSeat];
    if(ag && editName.trim()) onUpdateAgent({...ag, name:editName.trim()});
    setEditSeat(null);
  };

  const supColors = [
    ['Dolan Parnell', TEAM_COLORS['blue']],
    ['Ryan Kay',      TEAM_COLORS['dark-green']],
    ['Stephen Bowen', TEAM_COLORS['light-green']],
  ];

  // ── Panel tile (unassigned list) ───────────────────────────────────────────
  const PanelTile = ({agent}) => {
    const col = agentColor(agent);
    const parts = agent.name.split(' ');
    const initials = parts.map(w=>w[0]).join('');
    const last = parts.length>1 ? parts[parts.length-1].slice(0,8) : agent.name.slice(0,8);
    return (
      <div draggable onDragStart={()=>{ setDragId(agent.id); setDragSource('panel'); }}
        onDragEnd={()=>{ setDragId(null); setDragSource(null); }} title={agent.name}
        style={{width:52,height:44,borderRadius:4,border:'2px solid '+col,background:col+'2a',
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
          cursor:'grab',fontFamily:MO,textAlign:'center',lineHeight:1.2,userSelect:'none',
          opacity:dragId===agent.id?0.4:1,transition:'opacity .15s',flexShrink:0}}>
        <span style={{fontSize:9,fontWeight:'bold',color:col}}>{initials}</span>
        <span style={{fontSize:7,color:col}}>{last}</span>
      </div>
    );
  };

  // ── Normal floor seat tile ─────────────────────────────────────────────────
  const SeatTile = ({seatId, fixed, x, y}) => {
    const agent   = seatMap[seatId];
    const col     = agentColor(agent) || '#ccc';
    const isFixed = fixed||(agent&&SPECIALTY_GOLD.includes(agent.name));
    const isHover = dropHover===seatId;
    const parts   = agent ? agent.name.split(' ') : [];
    const initials = parts.map(w=>w[0]).join('');
    const last    = parts.length>1 ? parts[parts.length-1].slice(0,8) : (agent?agent.name.slice(0,8):'');
    const role    = !agent ? seatRoles[seatId] : null;
    const emptyBg = isHover ? '#e8ffe8' : '#f5f5f5';
    const emptyBd = isHover ? '#4ade80' : role ? role.color : '#ddd';
    return (
      <div draggable={!isFixed&&!!agent}
        onDragStart={()=>{ if(!isFixed&&agent){ setDragId(agent.id); setDragSource('floor'); } }}
        onDragEnd={()=>{ setDragId(null); setDragSource(null); setDropHover(null); }}
        onDragOver={e=>{ if(!isFixed){ e.preventDefault(); setDropHover(seatId); } }}
        onDragLeave={()=>setDropHover(null)}
        onDrop={e=>{ e.preventDefault(); setDropHover(null); if(dragId&&!isFixed) assignSeat(dragId,seatId); setDragId(null); }}
        onDoubleClick={()=>{ if(agent){ setEditSeat(seatId); setEditName(agent.name); } }}
        title={agent?agent.name:role?role.label:'Open'}
        style={{position:'absolute',left:x,top:y,width:52,height:44,borderRadius:4,
          border:'2px solid '+(agent?col:emptyBd),background:agent?col:emptyBg,
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
          cursor:isFixed?'default':agent?'grab':'default',fontFamily:MO,textAlign:'center',
          lineHeight:1.2,userSelect:'none',transition:'all .12s',
          opacity:dragId===agent?.id?0.35:1,boxSizing:'border-box',zIndex:2}}>
        {agent
          ? <><span style={{fontSize:9,fontWeight:'bold',color:'#fff',textShadow:'0 1px 2px rgba(0,0,0,0.6)'}}>{initials}</span>
               <span style={{fontSize:7,color:'rgba(255,255,255,0.9)',textShadow:'0 1px 2px rgba(0,0,0,0.6)'}}>{last}</span></>
          : <span style={{fontSize:6,color:isHover?'#22c55e':role?role.color:'#bbb',lineHeight:1.3,padding:'0 3px'}}>{role?role.label:'Open'}</span>}
      </div>
    );
  };

  // ── Calibration seat tile ──────────────────────────────────────────────────
  const CalibTile = ({seatId, x, y}) => {
    const agent  = seatMap[seatId];
    const isSel  = selCalib===seatId;
    const isDragging = calibDrag?.seatId===seatId;
    const parts  = agent ? agent.name.split(' ') : [];
    const initials = parts.map(w=>w[0]).join('');
    const last   = parts.length>1 ? parts[parts.length-1].slice(0,6) : (agent?agent.name.slice(0,6):'');
    return (
      <div
        onMouseDown={e=>{ e.stopPropagation(); setSelCalib(seatId);
          const rect=floorRef.current.getBoundingClientRect();
          setCalibDrag({seatId, offX:e.clientX-rect.left-x, offY:e.clientY-rect.top-y});
        }}
        style={{position:'absolute',left:x,top:y,width:52,height:44,borderRadius:4,zIndex:10,
          border:`2px solid ${isSel?C.or:'#f97316aa'}`,
          background:isDragging?C.or+'44':isSel?C.or+'22':'#1c1f2bcc',
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
          cursor:'grab',userSelect:'none',boxSizing:'border-box',
          boxShadow:isSel?`0 0 8px ${C.or}88`:'none'}}>
        <span style={{fontFamily:MO,fontSize:7,fontWeight:'bold',color:C.or,lineHeight:1.1}}>{seatId}</span>
        {agent&&<span style={{fontFamily:MO,fontSize:6,color:'#ccc',lineHeight:1.1}}>{initials} {last}</span>}
        <span style={{fontFamily:MO,fontSize:6,color:C.mu,lineHeight:1}}>{x},{y}</span>
      </div>
    );
  };

  // ── Selected seat calib editor ─────────────────────────────────────────────
  const selPos = selCalib ? seatPos[selCalib] : null;
  const inpNum = {fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,
    padding:'4px 6px',color:C.tx,outline:'none',width:64,textAlign:'center'};
  const nudgeBtn = (label,dx,dy) => (
    <button onMouseDown={e=>{e.preventDefault();nudge(selCalib,dx,dy);}}
      style={{fontFamily:MO,fontSize:10,width:24,height:24,borderRadius:4,border:'1px solid '+C.bo,
        background:C.ca,color:C.tx,cursor:'pointer',display:'flex',alignItems:'center',
        justifyContent:'center',padding:0,flexShrink:0}}>{label}</button>
  );

  return (
    <div style={{padding:'12px',display:'flex',flexDirection:'column',gap:8}}>

      {/* ── Top toolbar ───────────────────────────────────────────────────── */}
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <button onClick={()=>{ setCalibMode(p=>!p); setSelCalib(null); setCalibDrag(null); }}
          style={{fontFamily:MO,fontSize:11,padding:'5px 14px',borderRadius:6,cursor:'pointer',
            border:`1px solid ${calibMode?C.or:C.bo}`,
            background:calibMode?C.or+'22':C.ca,
            color:calibMode?C.or:C.mu,fontWeight:'bold',transition:'all .15s'}}>
          🔧 {calibMode?'Exit Configure':'Configure Seats'}
        </button>
        {calibMode&&(
          <button onClick={copyArray}
            style={{fontFamily:MO,fontSize:11,padding:'5px 14px',borderRadius:6,cursor:'pointer',
              border:`1px solid ${copied?C.gr:C.bo}`,background:copied?C.gr+'22':C.ca,
              color:copied?C.gr:C.tx,transition:'all .15s'}}>
            {copied?'✓ Copied!':'📋 Copy SEATS Array'}
          </button>
        )}
        {calibMode&&<span style={{fontFamily:MO,fontSize:9,color:C.or}}>Drag tiles to position · Select to fine-tune · Copy array when done</span>}
      </div>

      <div style={{display:'flex',gap:10,alignItems:'flex-start',overflowX:'auto'}}>

        {/* ── Left panel: unassigned OR calib editor ─────────────────── */}
        {!calibMode ? (
          <div onDragOver={e=>e.preventDefault()}
            onDrop={e=>{e.preventDefault(); if(dragId&&dragSource==='floor') unassignSeat(dragId); setDragId(null);}}
            style={{flexShrink:0,width:128,minHeight:FH,background:C.su,border:'1px solid '+C.bo,
              borderRadius:6,padding:'8px 6px',display:'flex',flexDirection:'column',gap:6,boxSizing:'border-box'}}>
            <div style={{fontFamily:MO,fontSize:8,color:C.mu,letterSpacing:1,marginBottom:4,textAlign:'center'}}>UNASSIGNED</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4,justifyContent:'center'}}>
              {unseated.length===0
                ? <div style={{fontFamily:MO,fontSize:8,color:C.mu,textAlign:'center',padding:'12px 4px',width:'100%'}}>All agents seated</div>
                : unseated.map(a=><PanelTile key={a.id} agent={a}/>)}
            </div>
            <div style={{marginTop:'auto',paddingTop:8,borderTop:'1px solid '+C.bo}}>
              <div style={{fontFamily:MO,fontSize:7,color:C.mu,marginBottom:4}}>SUPERVISOR KEY</div>
              {supColors.map(([name,col])=>(
                <div key={name} style={{display:'flex',alignItems:'center',gap:4,marginBottom:3}}>
                  <span style={{width:8,height:8,borderRadius:2,background:col,flexShrink:0,display:'inline-block'}}/>
                  <span style={{fontFamily:MO,fontSize:7,color:C.tx,lineHeight:1.2}}>{name.split(' ')[1]}</span>
                </div>
              ))}
              <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3}}>
                <span style={{width:8,height:8,borderRadius:2,background:C.rd,flexShrink:0,display:'inline-block'}}/>
                <span style={{fontFamily:MO,fontSize:7,color:C.tx}}>Supervisor</span>
              </div>
            </div>
            <div style={{fontFamily:MO,fontSize:7,color:C.mu,marginTop:6,lineHeight:1.4,textAlign:'center'}}>
              Drag to seat<br/>Drag back to unassign<br/>Double-click to rename
            </div>
          </div>
        ) : (
          <div style={{flexShrink:0,width:200,minHeight:FH,background:C.su,border:`1px solid ${C.or}44`,
            borderRadius:6,padding:'8px',display:'flex',flexDirection:'column',gap:6,boxSizing:'border-box'}}>
            <div style={{fontFamily:MO,fontSize:8,color:C.or,letterSpacing:1,marginBottom:4}}>🔧 SEAT EDITOR</div>

            {/* Selected seat editor */}
            {selCalib&&selPos ? (
              <div style={{background:C.ca,border:`1px solid ${C.or}66`,borderRadius:6,padding:10,marginBottom:6}}>
                <div style={{fontFamily:MO,fontSize:10,color:C.or,fontWeight:'bold',marginBottom:8}}>{selCalib}</div>
                {/* X coordinate */}
                <div style={{marginBottom:8}}>
                  <div style={{fontFamily:MO,fontSize:8,color:C.mu,marginBottom:4}}>X (left)</div>
                  <div style={{display:'flex',gap:4,alignItems:'center'}}>
                    {nudgeBtn('−−',-10,0)}{nudgeBtn('−',-1,0)}
                    <input type="number" value={selPos.x}
                      onChange={e=>updatePos(selCalib,parseInt(e.target.value)||0,selPos.y)}
                      style={inpNum}/>
                    {nudgeBtn('+',1,0)}{nudgeBtn('++',10,0)}
                  </div>
                </div>
                {/* Y coordinate */}
                <div>
                  <div style={{fontFamily:MO,fontSize:8,color:C.mu,marginBottom:4}}>Y (top)</div>
                  <div style={{display:'flex',gap:4,alignItems:'center'}}>
                    {nudgeBtn('−−',0,-10)}{nudgeBtn('−',0,-1)}
                    <input type="number" value={selPos.y}
                      onChange={e=>updatePos(selCalib,selPos.x,parseInt(e.target.value)||0)}
                      style={inpNum}/>
                    {nudgeBtn('+',0,1)}{nudgeBtn('++',0,10)}
                  </div>
                </div>
                {/* Role assignment */}
                <div style={{marginTop:10}}>
                  <div style={{fontFamily:MO,fontSize:8,color:C.mu,marginBottom:4}}>SEAT ROLE</div>
                  {(()=>{
                    const cur = seatRoles[selCalib];
                    const curKey = !cur ? '' : cur.label.includes('Supervisor') ? 'supervisor' : cur.label.includes('Trainer') ? 'trainer' : cur.label.includes('Advanced') ? 'adv-tech' : '';
                    return (
                      <select value={curKey} onChange={e=>updateSeatRole(selCalib, e.target.value||null)}
                        style={{fontFamily:MO,fontSize:9,background:C.ca,border:'1px solid '+C.bo,
                          borderRadius:4,padding:'4px 6px',color:C.tx,outline:'none',width:'100%',cursor:'pointer'}}>
                        <option value="">Agent (Standard)</option>
                        <option value="supervisor">Supervisor</option>
                        <option value="adv-tech">Advanced Technician</option>
                        <option value="trainer">Trainer</option>
                      </select>
                    );
                  })()}
                  {seatRoles[selCalib]&&(
                    <div style={{marginTop:4,display:'flex',alignItems:'center',gap:4}}>
                      <span style={{width:8,height:8,borderRadius:2,background:'#ef4444',flexShrink:0,display:'inline-block'}}/>
                      <span style={{fontFamily:MO,fontSize:7,color:'#ef4444'}}>{seatRoles[selCalib].label}</span>
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,padding:'8px 4px',textAlign:'center',lineHeight:1.6}}>
                Click a seat tile<br/>on the floor to<br/>select & edit
              </div>
            )}

            {/* Seat list */}
            <div style={{fontFamily:MO,fontSize:8,color:C.mu,letterSpacing:1,marginBottom:2}}>ALL SEATS</div>
            <div style={{overflowY:'auto',flex:1}}>
              {SEATS.map(([id,x,y])=>(
                <div key={id} onClick={()=>setSelCalib(id)}
                  style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                    padding:'3px 6px',borderRadius:4,marginBottom:2,cursor:'pointer',
                    background:selCalib===id?C.or+'22':'transparent',
                    border:`1px solid ${selCalib===id?C.or+'66':'transparent'}`}}>
                  <span style={{fontFamily:MO,fontSize:9,color:selCalib===id?C.or:C.tx,flex:1}}>{id}</span>
                  <span style={{fontFamily:MO,fontSize:8,color:C.mu,marginRight:4}}>{x},{y}</span>
                  <button onClick={e=>{e.stopPropagation();if(window.confirm(`Delete seat "${id}"?`))deleteSeat(id);}}
                    style={{fontFamily:MO,fontSize:9,padding:'1px 5px',borderRadius:3,border:'1px solid '+C.rd+'44',
                      background:'transparent',color:C.rd,cursor:'pointer',lineHeight:1,flexShrink:0}}>✕</button>
                </div>
              ))}
            </div>
            {/* Add seat form */}
            <div style={{borderTop:'1px solid '+C.bo,paddingTop:6,marginTop:4}}>
              <div style={{fontFamily:MO,fontSize:8,color:C.mu,letterSpacing:1,marginBottom:4}}>ADD SEAT</div>
              <div style={{display:'flex',gap:4}}>
                <input value={newSeatId} onChange={e=>setNewSeatId(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&addSeat()}
                  placeholder="seat-id" style={{fontFamily:MO,fontSize:9,background:C.ca,border:'1px solid '+C.bo,
                    borderRadius:4,padding:'3px 6px',color:C.tx,outline:'none',flex:1,minWidth:0}}/>
                <button onClick={addSeat} style={{fontFamily:MO,fontSize:9,padding:'3px 8px',borderRadius:4,
                  border:'1px solid '+C.gr+'66',background:C.gr+'22',color:C.gr,cursor:'pointer',flexShrink:0}}>+ Add</button>
              </div>
              <div style={{fontFamily:MO,fontSize:7,color:C.mu,marginTop:3,lineHeight:1.4}}>New seat placed at center. Drag to position.</div>
            </div>
          </div>
        )}

        {/* ── Floor plan ────────────────────────────────────────────── */}
        <div ref={floorRef}
          onMouseMove={calibMode?onFloorMouseMove:undefined}
          onMouseUp={calibMode?onFloorMouseUp:undefined}
          onMouseLeave={calibMode?onFloorMouseUp:undefined}
          style={{flexShrink:0,position:'relative',width:FW,height:FH,borderRadius:4,
            overflow:'hidden',cursor:calibDrag?'grabbing':'default'}}>

          <img src="./floorplan.png" alt="Floor plan"
            style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',
              objectFit:'fill',pointerEvents:'none',userSelect:'none'}}/>

          {/* Rename modal (normal mode only) */}
          {!calibMode&&editSeat&&(
            <div style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',
              background:'rgba(0,0,0,0.45)',zIndex:20,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div style={{background:C.su,border:'1px solid '+C.bo,borderRadius:8,padding:18,minWidth:230}}>
                <div style={{fontFamily:MO,fontSize:10,color:C.mu,marginBottom:8,letterSpacing:1}}>RENAME — {editSeat}</div>
                <input autoFocus value={editName} onChange={e=>setEditName(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter')saveEdit();if(e.key==='Escape')setEditSeat(null);}}
                  style={{fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,
                    padding:'6px 10px',color:C.tx,outline:'none',width:'100%',boxSizing:'border-box',marginBottom:10}}/>
                <div style={{display:'flex',gap:8}}>
                  <OBtn onClick={saveEdit}>Save</OBtn>
                  <Btn onClick={()=>setEditSeat(null)}>Cancel</Btn>
                </div>
              </div>
            </div>
          )}

          {calibMode
            ? SEATS.map(([sid,sx,sy])=><CalibTile key={sid} seatId={sid} x={sx} y={sy}/>)
            : SEATS.map(([sid,sx,sy,fx])=><SeatTile key={sid} seatId={sid} x={sx} y={sy} fixed={!!fx}/>)
          }

        </div>
      </div>
    </div>
  );
}

// ── CoverageGrid ──────────────────────────────────────────────────────────────

function CoverageGrid({ agents }) {
  const GRID_START = 7 * 60;
  const GRID_END   = 19 * 60;
  const SLOT_MIN   = 30;
  const NUM_SLOTS  = (GRID_END - GRID_START) / SLOT_MIN;
  const TODAY = new Date().toISOString().split('T')[0];

  const [filterTeam,  setFilterTeam]  = React.useState('');
  const [filterQueue, setFilterQueue] = React.useState('');
  const [showQueues,  setShowQueues]  = React.useState(false);
  const [showTeams,   setShowTeams]   = React.useState(false);
  const [showLookahead, setShowLookahead] = React.useState(true);
  const [expandedDay, setExpandedDay] = React.useState(null);
  const [gridDate,    setGridDate]    = React.useState(TODAY);

  const [allAbsences, setAllAbsences] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('dps-absences')||'{}'); } catch(e) { return {}; }
  });
  const [showMins, setShowMins] = React.useState(false);
  const deriveMins = (agentList) => {
    const obj = {};
    QUEUES.forEach(q => {
      const base = agentList.filter(a => a.status==='active' && a.queues?.[q.id]?.active).length;
      obj[q.id] = Math.floor(base * 0.75);
    });
    return obj;
  };
  const [queueMins, setQueueMins] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('dps-queue-minimums')||'null');
      return saved || deriveMins(agents);
    } catch(e) { return deriveMins(agents); }
  });
  const saveMins = (mins) => {
    setQueueMins(mins);
    try { localStorage.setItem('dps-queue-minimums', JSON.stringify(mins)); } catch(e) {}
  };
  const absentIds = new Set(allAbsences[gridDate] || []);

  const toggleAbsent = (id) => {
    setAllAbsences(prev => {
      const cur = prev[gridDate] || [];
      const next = cur.includes(id) ? cur.filter(x=>x!==id) : [...cur, id];
      const updated = {...prev, [gridDate]: next};
      try { localStorage.setItem('dps-absences', JSON.stringify(updated)); } catch(e) {}
      return updated;
    });
  };

  const toggleAbsentForDate = (id, date) => {
    setAllAbsences(prev => {
      const cur = prev[date] || [];
      const next = cur.includes(id) ? cur.filter(x=>x!==id) : [...cur, id];
      const updated = {...prev, [date]: next};
      try { localStorage.setItem('dps-absences', JSON.stringify(updated)); } catch(e) {}
      return updated;
    });
  };

  const toMin = t => { if(!t) return null; const parts=t.split(':').map(Number); return parts[0]*60+(parts[1]||0); };
  const fmtSlot = min => {
    const h=Math.floor(min/60), m=min%60, h12=h>12?h-12:(h===0?12:h);
    return `${h12}${m?':'+String(m).padStart(2,'0'):''}`;
  };
  const fmtTime = t => {
    if(!t) return '—';
    const [hh,mm]=t.split(':').map(Number);
    const ap=hh>=12?'PM':'AM', h12=hh>12?hh-12:(hh===0?12:hh);
    return `${h12}:${String(mm||0).padStart(2,'0')} ${ap}`;
  };
  const getLunch = shiftStart => {
    if(!shiftStart) return null;
    const m=toMin(shiftStart);
    if(m===null) return null;
    const lm=m+240; // lunch always 4hr after start
    const h=Math.floor(lm/60), mn=lm%60;
    return `${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;
  };

  const slots = Array.from({length:NUM_SLOTS},(_,i)=>GRID_START+i*SLOT_MIN);

  const visible = agents.filter(a=>{
    if(filterTeam  && (a.team||'none')!==filterTeam)  return false;
    if(filterQueue && !a.queues?.[filterQueue]?.active) return false;
    return true;
  });

  const sorted = [...visible].sort((a,b)=>{
    const am=toMin(a.shiftStart)||0, bm=toMin(b.shiftStart)||0;
    return am!==bm ? am-bm : a.name.localeCompare(b.name);
  });

  const agentMeta = sorted.map(a=>{
    const s=toMin(a.shiftStart), e=toMin(a.shiftEnd);
    const lunchStr=getLunch(a.shiftStart);
    const lm=lunchStr?toMin(lunchStr):null;
    const teamColor=TEAM_COLORS[a.team||'none']||C.mu;
    const absent=absentIds.has(a.id);
    return {a, s, e, lm, lunchStr, teamColor, absent};
  });

  const inShift = (s,e,slot) => s!==null&&e!==null&&slot>=s&&slot<e;
  const presentMeta = agentMeta.filter(m=>!m.absent);
  const coverage = slots.map(sl=>presentMeta.filter(({s,e})=>inShift(s,e,sl)).length);

  const queueMeta = QUEUES.map(q=>({
    q,
    counts: slots.map(sl=>presentMeta.filter(({a,s,e})=>inShift(s,e,sl)&&a.queues?.[q.id]?.active).length)
  }));

  const teamKeys = [...new Set(agents.map(a=>a.team||'none'))].sort();
  const teamMeta = teamKeys.map(tk=>({
    tk,
    color: TEAM_COLORS[tk]||C.mu,
    label: tk==='none'?'No Team':tk.replace('-',' ').replace(/\b\w/g,c=>c.toUpperCase()),
    counts: slots.map(sl=>presentMeta.filter(({a,s,e})=>(a.team||'none')===tk&&inShift(s,e,sl)).length)
  }));

  const absentAgents = agentMeta.filter(m=>m.absent);
  const covColor=n=>n===0?C.rd:n<=2?C.yl:C.gr;
  const inpS={fontFamily:MO,fontSize:11,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'4px 8px',color:C.tx,outline:'none',colorScheme:'dark'};
  const hdrTxt={fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,textAlign:'center',whiteSpace:'nowrap'};

  // Fixed left cols: Name(150) Schedule(110) Lunch(62) | then slots | Supervisor(110)
  const COL_NAME=190, COL_SCHED=110, COL_LUNCH=62, COL_SLOT=40, COL_SUP=75;
  const leftCols=`${COL_NAME}px ${COL_SCHED}px ${COL_LUNCH}px`;
  const gridCols=`${leftCols} repeat(${NUM_SLOTS},${COL_SLOT}px) ${COL_SUP}px`;

  const cellBorder='1px solid '+C.bo+'55';

  return (
    <div>
      {/* Filter bar */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10,alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:6,background:C.su,border:'1px solid '+C.bo,borderRadius:6,padding:'3px 10px'}}>
          <span style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1}}>DATE</span>
          <input type="date" value={gridDate} onChange={e=>setGridDate(e.target.value)} style={{...inpS,border:'none',background:'transparent',padding:'2px 0'}}/>
          {gridDate!==TODAY&&<button onClick={()=>setGridDate(TODAY)} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:4,border:'1px solid '+C.or,background:C.or+'18',color:C.or,cursor:'pointer'}}>Today</button>}
        </div>
        <select value={filterTeam} onChange={e=>setFilterTeam(e.target.value)} style={inpS}>
          <option value="">All Teams</option>
          {Object.entries(TEAM_COLORS).filter(([k])=>k!=='none').map(([k])=>(
            <option key={k} value={k}>{k.replace('-',' ').replace(/\b\w/g,c=>c.toUpperCase())}</option>
          ))}
        </select>
        <select value={filterQueue} onChange={e=>setFilterQueue(e.target.value)} style={inpS}>
          <option value="">All Queues</option>
          {QUEUES.map(q=><option key={q.id} value={q.id}>{q.label}</option>)}
        </select>
        {(filterTeam||filterQueue)&&<button onClick={()=>{setFilterTeam('');setFilterQueue('');}} style={{fontFamily:MO,fontSize:10,padding:'4px 8px',borderRadius:5,border:'1px solid '+C.bo,background:C.ca,color:C.mu,cursor:'pointer'}}>✕ Clear</button>}
        <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
          {absentAgents.length>0&&<span style={{fontFamily:MO,fontSize:10,color:C.rd,background:C.rd+'18',border:'1px solid '+C.rd+'44',borderRadius:5,padding:'2px 8px'}}>{absentAgents.length} absent</span>}
          <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>{sorted.length} agents</span>
        </div>
      </div>

      {/* Main grid */}
      <div style={{overflowX:'auto',borderRadius:8,border:'1px solid '+C.bo,background:C.su}}>

        {/* Header row */}
        <div style={{display:'grid',gridTemplateColumns:gridCols,background:C.ca,borderBottom:'2px solid '+C.bo,position:'sticky',top:0,zIndex:2}}>
          <div style={{...hdrTxt,textAlign:'left',padding:'7px 10px',fontSize:10,color:C.tx,fontWeight:'bold',borderRight:cellBorder}}>TECHNICIAN</div>
          <div style={{...hdrTxt,padding:'7px 4px',borderRight:cellBorder,fontSize:10,color:C.tx,fontWeight:'bold'}}>SCHEDULE</div>
          <div style={{...hdrTxt,padding:'7px 4px',borderRight:cellBorder,fontSize:10,color:C.tx,fontWeight:'bold'}}>LUNCH</div>
          {slots.map(sl=>{
            const isHour=sl%60===0;
            return <div key={sl} style={{...hdrTxt,padding:'5px 1px',borderRight:cellBorder,fontWeight:isHour?'bold':'normal',color:isHour?C.tx:C.mu,fontSize:isHour?9:7}}>{fmtSlot(sl)}</div>;
          })}
          <div style={{...hdrTxt,padding:'7px 6px',fontSize:10,color:C.tx,fontWeight:'bold',borderLeft:'1px solid '+C.bo}}>SUPERVISOR</div>
        </div>

        {/* Agent rows */}
        {agentMeta.length===0&&<div style={{fontFamily:MO,fontSize:12,color:C.mu,padding:'30px',textAlign:'center'}}>No agents match filters.</div>}
        {agentMeta.map(({a,s,e,lm,lunchStr,teamColor,absent},ri)=>{
          const rowBg=absent?C.rd+'08':ri%2===0?C.su:C.su+'88';
          const barColor=absent?C.mu:teamColor;
          return (
            <div key={a.id} style={{display:'grid',gridTemplateColumns:gridCols,borderBottom:cellBorder,background:rowBg,opacity:absent?0.55:1}}>

              {/* Name + absent toggle */}
              <div style={{padding:'0 6px 0 10px',display:'flex',alignItems:'center',gap:5,overflow:'hidden',borderRight:cellBorder,minHeight:30}}>
                <div style={{width:3,height:16,borderRadius:2,background:absent?C.rd:teamColor,flexShrink:0}}/>
                <span style={{fontFamily:MO,fontSize:11,color:absent?C.rd:C.tx,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textDecoration:absent?'line-through':'none'}}>{a.name}</span>
                {absent&&<span style={{fontFamily:MO,fontSize:7,color:C.rd,background:C.rd+'22',border:'1px solid '+C.rd+'44',borderRadius:3,padding:'1px 3px',flexShrink:0}}>ABS</span>}
                <button onClick={()=>toggleAbsent(a.id)} title={absent?'Mark present':'Mark absent'}
                  style={{fontFamily:MO,fontSize:9,padding:'1px 5px',borderRadius:4,border:'1px solid '+(absent?C.gr+'66':C.rd+'66'),background:absent?C.gr+'18':C.rd+'18',color:absent?C.gr:C.rd,cursor:'pointer',flexShrink:0,lineHeight:1}}>
                  {absent?'✓':'✕'}
                </button>
              </div>

              {/* Schedule */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',borderRight:cellBorder,padding:'0 4px'}}>
                <span style={{fontFamily:MO,fontSize:9,color:C.mu,whiteSpace:'nowrap'}}>{a.shiftStart&&a.shiftEnd?fmtTime(a.shiftStart)+' – '+fmtTime(a.shiftEnd):'—'}</span>
              </div>

              {/* Lunch */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',borderRight:cellBorder,padding:'0 4px'}}>
                <span style={{fontFamily:MO,fontSize:9,color:C.mu,whiteSpace:'nowrap'}}>{lunchStr?fmtTime(lunchStr):'—'}</span>
              </div>

              {/* Shift bar slots */}
              {slots.map((sl,si)=>{
                const ins=inShift(s,e,sl);
                const isLunch=lm!==null&&sl===lm;
                const showBar=ins&&!isLunch;
                const isFirst=showBar&&(si===0||!inShift(s,e,slots[si-1])||lm===slots[si-1]);
                const isLast =showBar&&(si===slots.length-1||!inShift(s,e,slots[si+1])||lm===slots[si+1]);
                return (
                  <div key={sl} style={{height:30,borderRight:cellBorder,position:'relative',overflow:'hidden',
                    background:showBar?barColor+'33':isLunch&&ins?C.bo+'22':'transparent'}}>
                    {showBar&&<div style={{position:'absolute',inset:0,
                      borderTop:isFirst?'2px solid '+barColor:'none',
                      borderBottom:isLast?'2px solid '+barColor:'none',
                      borderLeft:isFirst?'2px solid '+barColor:'none',
                      borderRight:isLast?'2px solid '+barColor:'none',
                      background:barColor+'22'}}/>}
                  </div>
                );
              })}

              {/* Supervisor */}
              <div style={{display:'flex',alignItems:'center',padding:'0 8px',borderLeft:'1px solid '+C.bo,overflow:'hidden'}}>
                <span style={{fontFamily:MO,fontSize:10,color:C.mu,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.supervisor||'—'}</span>
              </div>
            </div>
          );
        })}

        {/* Coverage count row */}
        <div style={{display:'grid',gridTemplateColumns:gridCols,background:C.ca,borderTop:'2px solid '+C.bo}}>
          <div style={{padding:'0 10px',display:'flex',alignItems:'center',borderRight:cellBorder}}>
            <span style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1}}>COVERAGE</span>
          </div>
          <div style={{borderRight:cellBorder}}/>
          <div style={{borderRight:cellBorder}}/>
          {coverage.map((n,i)=>(
            <div key={i} style={{borderRight:cellBorder,display:'flex',alignItems:'center',justifyContent:'center',height:26}}>
              <span style={{fontFamily:MO,fontSize:11,fontWeight:'bold',color:covColor(n)}}>{n||''}</span>
            </div>
          ))}
          <div/>
        </div>
      </div>

      {/* Absent summary strip */}
      {absentAgents.length>0&&(
        <div style={{marginTop:8,background:C.rd+'0d',border:'1px solid '+C.rd+'33',borderRadius:7,padding:'8px 12px',display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontFamily:MO,fontSize:9,color:C.rd,letterSpacing:2,flexShrink:0}}>ABSENT</span>
          {absentAgents.map(({a})=>(
            <span key={a.id} style={{fontFamily:MO,fontSize:10,color:C.rd,background:C.rd+'18',border:'1px solid '+C.rd+'44',borderRadius:4,padding:'2px 7px'}}>{a.name}</span>
          ))}
        </div>
      )}

      {/* Queue Coverage */}
      <div style={{marginTop:12,border:'1px solid '+C.bo,borderRadius:8,overflow:'hidden'}}>
        <div onClick={()=>setShowQueues(v=>!v)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:C.ca,cursor:'pointer',borderBottom:showQueues?'1px solid '+C.bo:'none'}}>
          <span style={{fontFamily:MO,fontSize:10,color:C.bl,letterSpacing:2}}>QUEUE COVERAGE</span>
          <span style={{fontFamily:MO,fontSize:11,color:C.mu}}>{showQueues?'▲':'▼'}</span>
        </div>
        {showQueues&&<div style={{overflowX:'auto'}}>
          <div style={{display:'grid',gridTemplateColumns:`200px repeat(${NUM_SLOTS},${COL_SLOT}px)`,background:C.ca,borderBottom:'1px solid '+C.bo}}>
            <div style={{...hdrTxt,textAlign:'left',padding:'5px 10px',color:C.mu}}>QUEUE</div>
            {slots.map(sl=>{const isHour=sl%60===0;return <div key={sl} style={{...hdrTxt,padding:'4px 1px',borderLeft:cellBorder,fontWeight:isHour?'bold':'normal',color:isHour?C.tx:C.mu,fontSize:isHour?9:7}}>{fmtSlot(sl)}</div>;})}
          </div>
          {queueMeta.map(({q,counts},ri)=>(
            <div key={q.id} style={{display:'grid',gridTemplateColumns:`200px repeat(${NUM_SLOTS},${COL_SLOT}px)`,borderBottom:cellBorder,background:ri%2===0?C.su+'44':'transparent'}}>
              <div style={{padding:'0 10px',display:'flex',alignItems:'center'}}><span style={{fontFamily:MO,fontSize:10,color:C.tx,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{q.label}</span></div>
              {counts.map((n,i)=>(<div key={i} style={{borderLeft:cellBorder,display:'flex',alignItems:'center',justifyContent:'center',height:24}}><span style={{fontFamily:MO,fontSize:10,color:n>0?C.gr:C.bo}}>{n||''}</span></div>))}
            </div>
          ))}
        </div>}
      </div>

      {/* Team Breakdown */}
      <div style={{marginTop:12,border:'1px solid '+C.bo,borderRadius:8,overflow:'hidden'}}>
        <div onClick={()=>setShowTeams(v=>!v)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:C.ca,cursor:'pointer',borderBottom:showTeams?'1px solid '+C.bo:'none'}}>
          <span style={{fontFamily:MO,fontSize:10,color:C.pu,letterSpacing:2}}>TEAM BREAKDOWN</span>
          <span style={{fontFamily:MO,fontSize:11,color:C.mu}}>{showTeams?'▲':'▼'}</span>
        </div>
        {showTeams&&<div style={{overflowX:'auto'}}>
          <div style={{display:'grid',gridTemplateColumns:`200px repeat(${NUM_SLOTS},${COL_SLOT}px)`,background:C.ca,borderBottom:'1px solid '+C.bo}}>
            <div style={{...hdrTxt,textAlign:'left',padding:'5px 10px',color:C.mu}}>TEAM</div>
            {slots.map(sl=>{const isHour=sl%60===0;return <div key={sl} style={{...hdrTxt,padding:'4px 1px',borderLeft:cellBorder,fontWeight:isHour?'bold':'normal',color:isHour?C.tx:C.mu,fontSize:isHour?9:7}}>{fmtSlot(sl)}</div>;})}
          </div>
          {teamMeta.map(({tk,color,label,counts},ri)=>(
            <div key={tk} style={{display:'grid',gridTemplateColumns:`200px repeat(${NUM_SLOTS},${COL_SLOT}px)`,borderBottom:cellBorder,background:ri%2===0?C.su+'44':'transparent'}}>
              <div style={{padding:'0 10px',display:'flex',alignItems:'center',gap:6}}>
                <div style={{width:3,height:14,borderRadius:2,background:color,flexShrink:0}}/>
                <span style={{fontFamily:MO,fontSize:10,color:C.tx}}>{label}</span>
              </div>
              {counts.map((n,i)=>(<div key={i} style={{borderLeft:cellBorder,display:'flex',alignItems:'center',justifyContent:'center',height:24}}><span style={{fontFamily:MO,fontSize:10,color:n>0?color:C.bo}}>{n||''}</span></div>))}
            </div>
          ))}
        </div>}
      </div>
      {/* Queue Minimums Editor */}
      <div style={{marginTop:12,border:'1px solid '+C.bo,borderRadius:8,overflow:'hidden'}}>
        <div onClick={()=>setShowMins(v=>!v)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:C.ca,cursor:'pointer',borderBottom:showMins?'1px solid '+C.bo:'none'}}>
          <span style={{fontFamily:MO,fontSize:10,color:C.gr,letterSpacing:2}}>⚙ QUEUE MINIMUMS</span>
          <span style={{fontFamily:MO,fontSize:11,color:C.mu}}>{showMins?'▲':'▼'}</span>
        </div>
        {showMins&&(
          <div style={{padding:'10px 12px',background:C.su}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:10}}>Set the minimum viable headcount per queue. Below this = 🔴 DANGER regardless of %.</div>
            {QUEUES.map(q => {
              const base = agents.filter(a=>a.status==='active'&&a.queues?.[q.id]?.active).length;
              const cur = queueMins[q.id] ?? 0;
              return (
                <div key={q.id} style={{display:'flex',alignItems:'center',gap:10,marginBottom:7,padding:'6px 10px',background:C.ca,borderRadius:6,border:'1px solid '+C.bo}}>
                  <span style={{fontFamily:MO,fontSize:11,color:C.tx,flex:1}}>{q.label.split('/')[0].trim()}</span>
                  <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>baseline {base}</span>
                  <button onClick={()=>saveMins({...queueMins,[q.id]:Math.max(0,cur-1)})} style={{fontFamily:MO,fontSize:13,width:24,height:24,borderRadius:4,border:'1px solid '+C.bo,background:C.ca,color:C.tx,cursor:'pointer',padding:0}}>−</button>
                  <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:cur>0?C.or:C.mu,width:20,textAlign:'center'}}>{cur}</span>
                  <button onClick={()=>saveMins({...queueMins,[q.id]:Math.min(base,cur+1)})} style={{fontFamily:MO,fontSize:13,width:24,height:24,borderRadius:4,border:'1px solid '+C.bo,background:C.ca,color:C.tx,cursor:'pointer',padding:0}}>+</button>
                </div>
              );
            })}
            <button onClick={()=>saveMins(deriveMins(agents))} style={{fontFamily:MO,fontSize:10,padding:'4px 12px',borderRadius:5,border:'1px solid '+C.bo,background:C.ca,color:C.mu,cursor:'pointer',marginTop:4}}>↺ Reset to Auto (75% floor)</button>
          </div>
        )}
      </div>

      {/* Coverage Lookahead */}
      {(()=>{
        const activeOnly = agents.filter(a => a.status === 'active');
        const weekdays = [];
        const d = new Date(); d.setDate(d.getDate()+1);
        while(weekdays.length < 7) {
          const dow = d.getDay();
          if(dow !== 0 && dow !== 6) {
            weekdays.push(d.toISOString().split('T')[0]);
          }
          d.setDate(d.getDate()+1);
        }
        const fmtDay = iso => { const dt = new Date(iso+'T12:00:00'); return { dow: dt.toLocaleDateString('en-US',{weekday:'short'}), date: dt.toLocaleDateString('en-US',{month:'numeric',day:'numeric'}) }; };
        const worstQueue = (abIds) => {
          let worst = null;
          QUEUES.forEach(q => {
            const base = activeOnly.filter(a => a.queues?.[q.id]?.active);
            if(!base.length) return;
            const present = base.filter(a => !abIds.has(a.id));
            const pct = Math.round(present.length/base.length*100);
            const min = queueMins[q.id] ?? 0;
            const belowMin = present.length < min;
            const score = belowMin ? -1 : pct;
            if(worst===null || score < (worst.belowMin ? -1 : worst.pct)) worst = {pct, present:present.length, min, belowMin, label:q.label.split('/')[0].trim()};
          });
          return worst;
        };
        const badgeFor = (pct, present, min) => {
          if(pct===null) return null;
          if(pct===0)           return {text:'⛔ ZERO',    color:C.rd};
          if(present < min)     return {text:'🔴 DANGER',  color:C.rd};
          if(pct<90)            return {text:'🟡 THIN',    color:C.yl};
          return                       {text:'✓ OK',       color:C.gr};
        };
        return (
          <div style={{marginTop:12,border:'1px solid '+C.bo,borderRadius:8,overflow:'hidden'}}>
            <div onClick={()=>setShowLookahead(v=>!v)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:C.ca,cursor:'pointer',borderBottom:showLookahead?'1px solid '+C.bo:'none'}}>
              <span style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2}}>📅 7-DAY COVERAGE LOOKAHEAD</span>
              <span style={{fontFamily:MO,fontSize:11,color:C.mu}}>{showLookahead?'▲':'▼'}</span>
            </div>
            {showLookahead&&(
              <div style={{padding:'10px 12px'}}>
                {weekdays.map(iso => {
                  const abIds = new Set(allAbsences[iso]||[]);
                  const absentList = activeOnly.filter(a => abIds.has(a.id));
                  const openers = absentList.filter(a => a.shiftStart==='07:00');
                  const closers = absentList.filter(a => a.shiftStart==='10:30');
                  const wq = worstQueue(abIds);
                  const badge = badgeFor(wq?.pct ?? null, wq?.present ?? 0, wq?.min ?? 0);
                  const {dow, date} = fmtDay(iso);
                  const isExp = expandedDay===iso;
                  return (
                    <div key={iso} style={{marginBottom:6,border:'1px solid '+(badge&&badge.color!==C.gr?badge.color+'44':C.bo),borderRadius:7,overflow:'hidden'}}>
                      {/* Summary row */}
                      <div onClick={()=>setExpandedDay(isExp?null:iso)} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 10px',background:C.ca,cursor:'pointer',flexWrap:'wrap'}}>
                        <span style={{fontFamily:MO,fontSize:12,color:C.tx,fontWeight:'bold',minWidth:32}}>{dow}</span>
                        <span style={{fontFamily:MO,fontSize:11,color:C.mu,minWidth:40}}>{date}</span>
                        <span style={{fontFamily:MO,fontSize:10,color:abIds.size>0?C.rd:C.mu,background:abIds.size>0?C.rd+'18':'transparent',border:abIds.size>0?'1px solid '+C.rd+'44':'1px solid transparent',borderRadius:4,padding:'1px 7px'}}>
                          {abIds.size>0?`${abIds.size} absent`:'Full'}
                        </span>
                        {badge&&badge.color!==C.gr&&<span style={{fontFamily:MO,fontSize:9,color:badge.color,border:'1px solid '+badge.color+'55',borderRadius:4,padding:'1px 7px'}}>{badge.text} — {wq.label}</span>}
                        {openers.length>0&&<span style={{fontFamily:MO,fontSize:9,color:C.rd,border:'1px solid '+C.rd+'44',borderRadius:4,padding:'1px 7px'}}>🔴 Opener out</span>}
                        {closers.length>0&&<span style={{fontFamily:MO,fontSize:9,color:C.yl,border:'1px solid '+C.yl+'44',borderRadius:4,padding:'1px 7px'}}>🟡 Closer out</span>}
                        <span style={{fontFamily:MO,fontSize:10,color:C.mu,marginLeft:'auto'}}>{isExp?'▲':'▼'}</span>
                      </div>
                      {/* Expanded detail */}
                      {isExp&&(
                        <div style={{padding:'10px 12px',background:C.su}}>
                          {/* Queue tiles */}
                          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(145px,1fr))',gap:6,marginBottom:10}}>
                            {QUEUES.map(q => {
                              const base = activeOnly.filter(a => a.queues?.[q.id]?.active);
                              if(!base.length) return null;
                              const present = base.filter(a => !abIds.has(a.id));
                              const pct = Math.round(present.length/base.length*100);
                              const min = queueMins[q.id] ?? 0;
                              const col = pct===0?C.rd:present.length<min?C.rd:pct<90?C.yl:C.gr;
                              const flagged = pct<90 || present.length<min;
                              return (
                                <div key={q.id} style={{background:C.ca,border:'1px solid '+(flagged?col+'55':C.bo),borderRadius:6,padding:'7px 9px'}}>
                                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:2}}>
                                    <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>{q.label.split('/')[0].trim().toUpperCase()}</span>
                                    <span style={{fontFamily:MO,fontSize:9,color:col,fontWeight:'bold'}}>{present.length<min?'🔴 DANGER':pct<90?'🟡 THIN':'✓'}</span>
                                  </div>
                                  <div style={{display:'flex',alignItems:'baseline',gap:4}}>
                                    <span style={{fontFamily:MO,fontSize:18,fontWeight:'bold',color:col,lineHeight:1}}>{present.length}</span>
                                    <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>/ {base.length}</span>
                                    {min>0&&<span style={{fontFamily:MO,fontSize:9,color:C.mu,marginLeft:'auto'}}>min {min}</span>}
                                  </div>
                                  <div style={{height:3,background:C.bo,borderRadius:2,marginTop:4}}>
                                    <div style={{height:'100%',width:pct+'%',background:col,borderRadius:2}}/>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                          {/* Agent chips — click to toggle absence */}
                          <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:5}}>CLICK AGENT TO TOGGLE ABSENCE</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                            {activeOnly.sort((a,b)=>a.name.localeCompare(b.name)).map(a => {
                              const absent = abIds.has(a.id);
                              return (
                                <button key={a.id} onClick={()=>toggleAbsentForDate(a.id,iso)} style={{fontFamily:MO,fontSize:10,padding:'3px 9px',borderRadius:4,cursor:'pointer',border:'1px solid '+(absent?C.rd+'66':C.bo),background:absent?C.rd+'22':C.ca,color:absent?C.rd:C.tx,transition:'all .15s',textDecoration:absent?'line-through':'none'}}>
                                  {a.name}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}

function DepartmentMode({ agents, onUpdateAgent, onAddAgent, onDeactivateAgent, onReactivateAgent, onDeleteAgent, onLoadSeed }) {

  const filtered = activeAgents.filter(a=>{
    if(filterSup  && a.supervisor!==filterSup)  return false;

                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
                  <input autoFocus value={newSpecName} onChange={e=>setNewSpecName(e.target.value)}

                  <select value={newSpecRole} onChange={e=>setNewSpecRole(e.target.value)} style={{...inpS,flex:'1 1 160px'}}>
