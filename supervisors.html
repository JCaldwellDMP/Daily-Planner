                    <input type="time" value={newSpecShiftStart} onChange={e=>setNewSpecShiftStart(e.target.value)} style={{...inpS,colorScheme:'dark'}}/>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:3,flex:'1 1 120px'}}>
                    <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>SHIFT END</span>
                    <input type="time" value={newSpecShiftEnd} onChange={e=>setNewSpecShiftEnd(e.target.value)} style={{...inpS,colorScheme:'dark'}}/>
                  </div>
                  <input value={newSpecDisc} onChange={e=>setNewSpecDisc(e.target.value)}
                    placeholder="DISC profile…" style={{...inpS,flex:'1 1 100px'}}/>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <OBtn onClick={saveNewSpec} disabled={!newSpecName.trim()}>+ Add</OBtn>
                  <Btn onClick={()=>{setShowAddSpec(false);setNewSpecName('');setNewSpecRole('supervisor');setNewSpecShiftStart('');setNewSpecShiftEnd('');setNewSpecDisc('');}}>Cancel</Btn>
                </div>
              </div>
            )}

            {/* Add button row */}
            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:10}}>
              <OBtn onClick={()=>{setShowAddSpec(v=>!v);setSelectedId(null);}} style={{fontSize:10,padding:'3px 10px'}}>
                {showAddSpec?'✕ Cancel':'+ Add Role'}
              </OBtn>
            </div>

            <div style={{display:'flex',gap:0,alignItems:'flex-start',minHeight:400}}>
            {/* LEFT LIST */}
            <div style={{width:220,flexShrink:0,background:C.su,border:'1px solid '+C.bo,borderRadius:8,overflowY:'auto',maxHeight:'calc(100vh - 220px)',marginRight:12}}>
              {sorted.length===0
                ? <div style={{fontFamily:MO,fontSize:11,color:C.mu,padding:'20px 12px',textAlign:'center'}}>No specialized agents.</div>
                : sorted.map(a=>{
                    const meta=ROLE_META[a.specializedRole]||{label:a.specializedRole,color:C.mu};
                    const isSel=selectedId===a.id;
                    return (
                      <div key={a.id} onClick={()=>setSelectedId(isSel?null:a.id)}
                        style={{padding:'9px 12px',cursor:'pointer',borderBottom:'1px solid '+C.bo,background:isSel?C.ca:'transparent',borderLeft:`3px solid ${isSel?meta.color:'transparent'}`,transition:'all .1s'}}>
                        <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:isSel?C.tx:C.mu,marginBottom:2}}>{a.name}</div>
                        <span style={{fontFamily:MO,fontSize:9,padding:'1px 5px',borderRadius:3,border:`1px solid ${meta.color}44`,color:meta.color,background:meta.color+'11'}}>{meta.label}</span>
                      </div>
                    );
                  })
              }
            </div>
            {/* RIGHT DETAIL */}
            <div style={{flex:1,minWidth:0}}>
              {!selSpec
                ? <div style={{background:C.su,border:'1px dashed '+C.bo,borderRadius:8,padding:'40px 20px',textAlign:'center',fontFamily:MO,fontSize:12,color:C.mu}}>Select a person to view details.</div>
                : (()=>{
                    const meta=ROLE_META[selSpec.specializedRole]||{label:selSpec.specializedRole,color:C.mu};
                    const shiftInfo=null; // shift is free-text
                    return (
                      <div style={{background:C.su,border:`1px solid ${meta.color}44`,borderRadius:8,padding:16}}>
                        {/* Header */}
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
                          <div>
                            <div style={{fontFamily:MO,fontSize:16,fontWeight:'bold',color:C.tx,marginBottom:4}}>{selSpec.name}</div>
                            <span style={{fontFamily:MO,fontSize:10,padding:'2px 8px',borderRadius:4,border:`1px solid ${meta.color}66`,color:meta.color,background:meta.color+'18'}}>{meta.label}</span>
                          </div>
                          <button onClick={()=>{if(window.confirm(`Move ${selSpec.name} to Inactive?`)){onDeactivateAgent(selSpec.id);setSelectedId(null);}}}
                            style={{fontFamily:MO,fontSize:10,padding:'4px 10px',borderRadius:5,border:'1px solid '+C.rd,background:C.rd+'18',color:C.rd,cursor:'pointer'}}>
                            Set Inactive
                          </button>
                        </div>
                        {/* Edit form */}
                        <AgentDetail key={selSpec.id} hire={selSpec} onUpdate={updated=>onUpdateAgent(sanitizeAgent({...updated,specializedRole:selSpec.specializedRole}))} hideSnapshot={true} isSpecialized={true}/>
                      </div>
                    );
                  })()
              }
            </div>
          </div>
          </div>
        );
      })()}

      {/* SEATING TAB */}
      {deptTab==='seating'&&<SeatingChart agents={agents} onUpdateAgent={onUpdateAgent}/>}

      {/* SCHEDULE TAB */}
      {deptTab==='schedule'&&<CoverageGrid agents={activeAgents}/>}

      {/* INACTIVE TAB */}
      {deptTab==='inactive'&&<div>
        {inactiveAgents.length===0
          ? <div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:10,padding:'40px 20px',textAlign:'center',fontFamily:MO,fontSize:12,color:C.mu}}>No inactive agents.</div>
          : <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>

              {/* Left list — alpha sorted */}
              <div style={{flexShrink:0,width:180,background:C.su,border:'1px solid '+C.bo,borderRadius:8,overflow:'hidden'}}>
                <div style={{fontFamily:MO,fontSize:8,color:C.mu,letterSpacing:2,padding:'8px 12px',borderBottom:'1px solid '+C.bo,background:C.ca}}>
                  INACTIVE · {inactiveAgents.length}
                </div>
                <div style={{display:'flex',flexDirection:'column'}}>
                  {[...inactiveAgents].sort((a,b)=>a.name.localeCompare(b.name)).map(a=>{
                    const isSel=selectedInactive===a.id;
                    return (
                      <div key={a.id} onClick={()=>setSelectedInactive(isSel?null:a.id)}
                        style={{padding:'9px 12px',cursor:'pointer',borderBottom:'1px solid '+C.bo,
                          background:isSel?C.bo:'transparent',
                          borderLeft:`3px solid ${isSel?C.mu:'transparent'}`,
                          transition:'all .15s'}}>
                        <div style={{fontFamily:MO,fontSize:11,fontWeight:'bold',color:isSel?C.tx:C.mu,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{a.name}</div>
                        <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{a.supervisor||'No supervisor'}</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Right detail panel */}
              <div style={{flex:1,minWidth:0}}>
                {!selectedInactive
                  ? <div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:8,padding:'40px 20px',textAlign:'center',fontFamily:MO,fontSize:12,color:C.mu}}>
                      Select an agent from the list to view details.
                    </div>
                  : (()=>{
                      const a=inactiveAgents.find(x=>x.id===selectedInactive);
                      if(!a) return null;
                      return (
                        <div>
                          <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'center'}}>
                            <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.mu,flex:1}}>{a.name}</span>
                            <button onClick={()=>{onReactivateAgent(a.id);setSelectedInactive(null);}}
                              style={{fontFamily:MO,fontSize:11,padding:'6px 14px',borderRadius:6,border:'1px solid '+C.gr,background:C.gr+'22',color:C.gr,cursor:'pointer',fontWeight:'bold'}}>
                              ↺ Reactivate
                            </button>
                            <button onClick={()=>{if(window.confirm('Permanently delete all data for '+a.name+'?')){onDeleteAgent(a.id);setSelectedInactive(null);}}}
                              style={{fontFamily:MO,fontSize:11,padding:'6px 14px',borderRadius:6,border:'1px solid '+C.rd+'66',background:C.rd+'11',color:C.rd,cursor:'pointer'}}>
                              ✕ Delete
                            </button>
                          </div>
                          <AgentDetail hire={a} onUpdate={updated=>onUpdateAgent(updated)} onGraduate={()=>{}} hideSnapshot={true}/>
                        </div>
                      );
                    })()
                }
              </div>

            </div>
        }
      </div>}
    </div>
  );
}

// ── Projects sub-components ───────────────────────────────────────────────────


// ── App ────────────────────────────────────────────────────────────────────

function App() {
  var stored = null;
  try { stored = JSON.parse(localStorage.getItem('sup-identity')); } catch(e){}

  var initIdentity = null;
  if (stored && stored.id) {
    var found = null;
    for (var i = 0; i < SUPERVISORS.length; i++) {
      if (SUPERVISORS[i].id === stored.id) { found = SUPERVISORS[i]; break; }
    }
    initIdentity = found;
  }

  var identityState = React.useState(initIdentity);
  var identity = identityState[0];
  var setIdentityRaw = identityState[1];

  var tabState = React.useState('tasks');
  var activeTab = tabState[0];
  var setTab = tabState[1];

  var agentsAppState = React.useState(function() {
    try {
      var raw = localStorage.getItem('dps-agents');
      if (raw) return JSON.parse(raw).map(sanitizeAgent);
    } catch(e) {}
    return [];
  });
  var agents = agentsAppState[0];
  var setAgents = agentsAppState[1];

  function saveAgents(updated) {
    setAgents(updated);
    try { localStorage.setItem('dps-agents', JSON.stringify(updated)); } catch(e) {}
  }

  function onUpdateAgent(updated) {
    saveAgents(agents.map(function(a) {
      return String(a.id) === String(updated.id) ? updated : a;
    }));
  }

  function onAddAgent(agent) {
    saveAgents(agents.concat([agent]));
  }

  function onDeactivateAgent(id) {
    saveAgents(agents.map(function(a) {
      return String(a.id) === String(id) ? Object.assign({}, a, {status:'inactive'}) : a;
    }));
  }

  function onReactivateAgent(id) {
    saveAgents(agents.map(function(a) {
      return String(a.id) === String(id) ? Object.assign({}, a, {status:'active'}) : a;
    }));
  }

  function onDeleteAgent(id) {
    saveAgents(agents.filter(function(a) {
      return String(a.id) !== String(id);
    }));
  }

  function onLoadSeed(seedAgents) {
    saveAgents(seedAgents);
  }

  function setAgentsFromGist(updated) {
    setAgents(updated);
  }

  function setIdentity(sup) {
    localStorage.setItem('sup-identity', JSON.stringify({id:sup.id}));
    setIdentityRaw(sup);
  }

  function clearIdentity() {
    setIdentityRaw(null);
  }

  if (!identity) {
    return React.createElement(IdentityModal, {onSelect:setIdentity});
  }

  var currentTab = null;
  for (var t = 0; t < TABS.length; t++) {
    if (TABS[t].id === activeTab) { currentTab = TABS[t]; break; }
  }

  return (
    React.createElement('div', {style:{minHeight:'100vh',background:C.bg}},
      React.createElement(Header, {
        identity:identity,
        onChangeIdentity:clearIdentity,
        activeTab:activeTab,
        setTab:setTab
      }),
      React.createElement('div', {style:{padding:'0'}},
        activeTab === 'tasks'
          ? React.createElement(TasksTab, null)
          : activeTab === 'schedule'
            ? React.createElement(ScheduleTab, null)
            : activeTab === 'department'
              ? React.createElement(DepartmentMode, {
                  agents: agents,
                  onUpdateAgent: onUpdateAgent,
                  onAddAgent: onAddAgent,
                  onDeactivateAgent: onDeactivateAgent,
                  onReactivateAgent: onReactivateAgent,
                  onDeleteAgent: onDeleteAgent,
                  onLoadSeed: onLoadSeed
                })
              : activeTab === 'training'
                ? React.createElement(TrainingTab, null)
                : activeTab === 'notes'
                  ? React.createElement(NotesTab, null)
                  : activeTab === 'wrapup'
                    ? React.createElement(WrapUpTab, null)
                    : null
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

</script>
</body>
</html>
