<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DPS Leads — Dept. Projects</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111318; }
    #root { min-height: 100%; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
    select option { background: #1c1f2b; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111318; }
    ::-webkit-scrollbar-thumb { background: #252836; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #f9731644; }
  </style>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById('root').innerHTML =
        '<div style="min-height:100vh;background:#111318;display:flex;align-items:center;justify-content:center;padding:20px">' +
        '<div style="background:#1c1f2b;border:1px solid #ef4444;border-radius:10px;padding:24px;max-width:700px;width:100%;font-family:monospace">' +
        '<div style="color:#ef4444;font-size:13px;margin-bottom:8px;letter-spacing:2px">LOAD ERROR</div>' +
        '<pre style="color:#dde1ee;font-size:11px;white-space:pre-wrap;word-break:break-word">' +
        msg + '\nLine: ' + line + ' Col: ' + col + '\n' + (err ? err.stack : '') +
        '</pre></div></div>';
      return false;
    };
  </script>
</head>
<body>
  <div id="root"></div>

<script type="text/babel" data-presets="react,env">
// ── Globals ───────────────────────────────────────────────────────────────────
const { useState, useEffect, useRef } = React;

// ── localStorage with in-memory fallback ─────────────────────────────────────
const _memStore = {};
const store = (() => {
  try { localStorage.setItem('_dps_test','1'); localStorage.removeItem('_dps_test'); return localStorage; }
  catch(e) { return { getItem: k=>_memStore[k]||null, setItem:(k,v)=>{_memStore[k]=v;}, removeItem:k=>{delete _memStore[k];} }; }
})();

// ── Constants ─────────────────────────────────────────────────────────────────
const C = {
  bg:'#111318', su:'#181b24', ca:'#1c1f2b', bo:'#252836',
  or:'#f97316', gr:'#22c55e', rd:'#ef4444', yl:'#eab308',
  pu:'#a855f7', bl:'#3b82f6', tx:'#e8ebf4', mu:'#8b90a8', te:'#14b8a6',
};
const MO = "'Courier New', Courier, monospace";
const DPS_VERSION = 'v1.0';

// ── DPS Vault ─────────────────────────────────────────────────────────────────
var DPS_VAULT_URL = 'https://dps-vault.jessecaldwell07.workers.dev';
function vaultGet(vStore, pin) {
  return fetch(DPS_VAULT_URL + '/' + vStore, {
    method: 'GET', headers: { 'X-DPS-Pin': pin }
  }).then(function(r) { return r.json(); });
}
function vaultPost(vStore, pin, data) {
  return fetch(DPS_VAULT_URL + '/' + vStore, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-DPS-Pin': pin },
    body: JSON.stringify({ data: data })
  }).then(function(r) { return r.json(); });
}
function vaultAuth(pin) {
  return fetch(DPS_VAULT_URL + '/auth', {
    method: 'POST', headers: { 'X-DPS-Pin': pin }
  }).then(function(r) { return r.json(); });
}

// ── Role / Agent constants ────────────────────────────────────────────────────
const ADDITIONAL_ROLES = [
  { id:'emailManagement', label:'Email Management Team' },
  { id:'publicBoards',    label:'Managing Public Boards' },
  { id:'videoBoard',      label:'Managing Video Board' },
  { id:'repairScrap',     label:'Managing Repair & Scrap' },
  { id:'inventory',       label:'Managing Inventory' },
  { id:'wikiEditor',      label:'Wiki Editor' },
];

// ── Storage keys ──────────────────────────────────────────────────────────────
var SK_PROJECTS = 'dps-dept-projects'; // shared with index.html (same origin)
var SK_NOTES    = 'dps-dept-notes';
var SK_LOG      = 'dps-dept-log';

// ── Flash animation ───────────────────────────────────────────────────────────
if (!document.getElementById('dps-flash-style')) {
  var _fs = document.createElement('style');
  _fs.id = 'dps-flash-style';
  _fs.textContent = '@keyframes dps-flash{0%{box-shadow:0 0 0px 0px rgba(249,115,22,.2);filter:brightness(1)}35%{box-shadow:0 0 14px 5px rgba(249,115,22,.7);filter:brightness(1.35)}100%{box-shadow:0 0 0px 0px rgba(249,115,22,0);filter:brightness(1)}}.dps-flash{animation:dps-flash .4s ease-out}';
  document.head.appendChild(_fs);
}

// ── Utilities ─────────────────────────────────────────────────────────────────
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const fmtDateTime = iso => {
  var d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' ' +
         d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
};

const inputFmt = str => { var p=str.split('-'); return p[1]+'/'+p[2]+'/'+p[0]; };

const flash = e => {
  var el = e.currentTarget;
  el.classList.remove('dps-flash');
  void el.offsetWidth;
  el.classList.add('dps-flash');
};

function useWindowWidth() {
  var _s = useState(window.innerWidth);
  var w = _s[0]; var setW = _s[1];
  useEffect(function() {
    var h = function(){ setW(window.innerWidth); };
    window.addEventListener('resize', h);
    return function(){ window.removeEventListener('resize', h); };
  }, []);
  return w;
}

// ── Shared small components ───────────────────────────────────────────────────
function Modal({ children, onClose, width }) {
  var w = width || 600;
  return (
    <div onClick={onClose||undefined} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999,padding:'20px',boxSizing:'border-box'}}>
      <div onClick={function(e){e.stopPropagation();}} style={{background:C.su,border:'1px solid '+C.bo,borderRadius:10,width:w,maxWidth:'100%',maxHeight:'90vh',overflow:'auto',fontFamily:MO}}>
        {children}
      </div>
    </div>
  );
}

const Btn = function({ children, onClick, style, disabled }) {
  var s = style || {};
  var d = disabled || false;
  return (
    <button onClick={function(e){flash(e);if(!d&&onClick)onClick(e);}} disabled={d} style={Object.assign({fontFamily:MO,fontSize:12,cursor:d?'not-allowed':'pointer',border:'1px solid '+C.bo,borderRadius:6,padding:'6px 14px',background:C.ca,color:d?C.mu:C.tx,opacity:d?0.5:1,transition:'all .15s'},s)}>{children}</button>
  );
};

const OBtn = function({ children, onClick, style, disabled }) {
  var s = style || {};
  var d = disabled || false;
  return (
    <button onClick={function(e){flash(e);if(!d&&onClick)onClick(e);}} disabled={d} style={Object.assign({fontFamily:MO,fontSize:12,fontWeight:'bold',cursor:d?'not-allowed':'pointer',border:'none',borderRadius:6,padding:'7px 16px',background:d?C.mu:C.or,color:'#fff',opacity:d?0.5:1,transition:'all .15s'},s)}>{children}</button>
  );
};

// ── Projects: status constants ────────────────────────────────────────────────
const STATUS_OPTS  = ['active','on-hold','complete'];
const STATUS_LABEL = {active:'Active','on-hold':'On Hold',complete:'Complete'};
const STATUS_COLOR = {active:C.gr,'on-hold':C.yl,complete:C.mu};

const MS_STATUS_OPTS  = ['not-started','in-progress','done'];
const MS_STATUS_LABEL = {'not-started':'Not Started','in-progress':'In Progress',done:'Done'};
const MS_STATUS_COLOR = {'not-started':C.mu,'in-progress':C.yl,done:C.gr};

// ── Projects sub-components (verbatim from index.html) ────────────────────────

function SendToDatePicker({ itemId, label, onSend }) {
  var _o = useState(false); var open = _o[0]; var setOpen = _o[1];
  var _d = useState(''); var date = _d[0]; var setDate = _d[1];
  var _t = useState(false); var toast = _t[0]; var setToast = _t[1];
  var send = function() {
    if (!date) return;
    onSend(date);
    setToast(true); setOpen(false); setDate('');
    setTimeout(function(){ setToast(false); }, 1800);
  };
  if (toast) return <span style={{fontFamily:MO,fontSize:10,color:C.te,flexShrink:0}}>✓ Sent</span>;
  if (!open) return (
    <button onClick={function(){setOpen(true);}} title={'Send "'+label+'" to a date'}
      style={{fontFamily:MO,fontSize:10,padding:'2px 7px',borderRadius:4,cursor:'pointer',border:'1px solid '+C.bo,background:C.ca,color:C.mu,whiteSpace:'nowrap',flexShrink:0}}>
      → Date
    </button>
  );
  return (
    <div style={{display:'flex',gap:4,alignItems:'center',flexShrink:0}}>
      <input type="date" value={date} onChange={function(e){setDate(e.target.value);}} autoFocus
        style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.te,borderRadius:4,padding:'2px 5px',color:C.tx,outline:'none'}}/>
      <button onClick={send} disabled={!date}
        style={{fontFamily:MO,fontSize:10,padding:'2px 7px',background:date?C.te+'33':C.ca,border:'1px solid '+(date?C.te:C.bo),borderRadius:4,color:date?C.te:C.mu,cursor:date?'pointer':'default',whiteSpace:'nowrap'}}>✓ Send</button>
      <button onClick={function(){setOpen(false);setDate('');}}
        style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11,padding:'0 2px'}}>✕</button>
    </div>
  );
}

function StepRow({ step, milestoneTitle, projectTitle, onToggle, onEditText, onSend, onDelete, onMoveUp, onMoveDown, isFirst, isLast, onMove, otherMilestones, onEditNotes, readOnly }) {
  var _e = useState(false); var editing = _e[0]; var setEditing = _e[1];
  var _v = useState(step.text); var val = _v[0]; var setVal = _v[1];
  var _sn = useState(false); var showNotes = _sn[0]; var setShowNotes = _sn[1];
  var _nv = useState(step.notes || ''); var notesVal = _nv[0]; var setNotesVal = _nv[1];
  var _ms = useState(false); var showMoveSelect = _ms[0]; var setShowMoveSelect = _ms[1];

  var commit      = function(){ if(val.trim()) onEditText(val.trim()); setEditing(false); };
  var commitNotes = function(){ if(onEditNotes) onEditNotes(notesVal); };
  var hasNotes    = !!(step.notes && step.notes.trim());
  var arrowBtn    = function(dis){ return {background:'transparent',border:'none',cursor:dis?'default':'pointer',fontSize:11,padding:'0 2px',lineHeight:1,color:dis?C.bo:C.mu,flexShrink:0}; };

  return (
    <div style={{marginBottom:3}}>
      <div style={{display:'flex',gap:4,alignItems:'center',padding:'5px 8px',borderRadius:showNotes?'5px 5px 0 0':5,background:C.su}}>
        <input type="checkbox" checked={!!step.done} onChange={onToggle} disabled={!!readOnly} style={{accentColor:C.te,flexShrink:0,cursor:readOnly?'not-allowed':'pointer'}}/>
        {(!readOnly && editing)
          ? <input autoFocus value={val} onChange={function(e){setVal(e.target.value);}}
              onBlur={commit} onKeyDown={function(e){if(e.key==='Enter')commit();if(e.key==='Escape'){setEditing(false);setVal(step.text);}}}
              style={{fontFamily:MO,fontSize:11,color:C.tx,background:'transparent',border:'none',borderBottom:'1px solid '+C.bo,outline:'none',flex:1,padding:'2px 0'}}/>
          : <span onClick={function(){if(!readOnly)setEditing(true);}} title={readOnly?'':'Click to edit'}
              style={{fontFamily:MO,fontSize:11,color:step.done?C.mu:C.tx,flex:1,cursor:readOnly?'default':'text',textDecoration:step.done?'line-through':'none',padding:'2px 0',borderBottom:'1px dashed '+(readOnly?'transparent':C.bo)}}>{step.text}</span>
        }
        <button onClick={function(e){e.stopPropagation();setShowNotes(function(p){return !p;});}} title={showNotes?'Hide notes':'Notes'}
          style={{background:'none',border:'none',cursor:'pointer',fontSize:11,padding:'0 2px',flexShrink:0,opacity:hasNotes?1:0.4,color:hasNotes?C.yl:C.mu}}>📝</button>
        {!readOnly && otherMilestones && otherMilestones.length > 0 && (
          showMoveSelect
            ? <select autoFocus defaultValue="" onChange={function(e){if(e.target.value&&onMove){onMove(e.target.value);setShowMoveSelect(false);}}} onBlur={function(){setShowMoveSelect(false);}}
                style={{fontFamily:MO,fontSize:10,background:C.ca,color:C.tx,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 4px',maxWidth:110}}>
                <option value="">Move to...</option>
                {otherMilestones.map(function(m){ return <option key={m.id} value={m.id}>{m.title}</option>; })}
              </select>
            : <button onClick={function(e){e.stopPropagation();setShowMoveSelect(true);}} title="Move to another milestone"
                style={{background:'transparent',border:'none',color:C.pu,cursor:'pointer',fontSize:10,padding:'0 2px',flexShrink:0}}>⇄</button>
        )}
        {!readOnly && <button onClick={function(e){e.stopPropagation();if(!isFirst&&onMoveUp)onMoveUp();}} disabled={!!isFirst} style={arrowBtn(!!isFirst)} title="Move up">▲</button>}
        {!readOnly && <button onClick={function(e){e.stopPropagation();if(!isLast&&onMoveDown)onMoveDown();}} disabled={!!isLast} style={arrowBtn(!!isLast)} title="Move down">▼</button>}
        {!readOnly && <button onClick={onDelete} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:12,padding:'0 2px',flexShrink:0,opacity:0.6}} title="Delete step">×</button>}
      </div>
      {showNotes && (
        <div style={{background:C.su,borderRadius:'0 0 5px 5px',padding:'4px 8px 6px 28px',borderTop:'1px solid '+C.bo}}>
          <textarea value={notesVal} onChange={function(e){setNotesVal(e.target.value);}} onBlur={commitNotes}
            readOnly={!!readOnly} placeholder="Step notes..." rows={3}
            style={{fontFamily:MO,fontSize:11,color:C.tx,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'5px 7px',outline:'none',width:'100%',resize:'vertical',boxSizing:'border-box',lineHeight:1.5}}/>
        </div>
      )}
    </div>
  );
}

function TaskRow({ task, projectTitle, onToggle, onEditText, onDelete, onMoveUp, onMoveDown, isFirst, isLast, onEditNotes, readOnly }) {
  var _e = useState(false); var editing = _e[0]; var setEditing = _e[1];
  var _v = useState(task.text); var val = _v[0]; var setVal = _v[1];
  var _sn = useState(false); var showNotes = _sn[0]; var setShowNotes = _sn[1];
  var _nv = useState(task.notes || ''); var notesVal = _nv[0]; var setNotesVal = _nv[1];

  var commit      = function(){ if(val.trim()) onEditText(val.trim()); setEditing(false); };
  var commitNotes = function(){ if(onEditNotes) onEditNotes(notesVal); };
  var hasNotes    = !!(task.notes && task.notes.trim());
  var arrowBtn    = function(dis){ return {background:'transparent',border:'none',cursor:dis?'default':'pointer',fontSize:11,padding:'0 2px',lineHeight:1,color:dis?C.bo:C.mu,flexShrink:0}; };

  return (
    <div style={{marginBottom:4}}>
      <div style={{display:'flex',gap:4,alignItems:'center',padding:'6px 10px',borderRadius:showNotes?'5px 5px 0 0':5,background:C.su,border:'1px solid '+C.bo}}>
        <input type="checkbox" checked={!!task.done} onChange={onToggle} disabled={!!readOnly} style={{accentColor:C.te,flexShrink:0,cursor:readOnly?'not-allowed':'pointer'}}/>
        {(!readOnly && editing)
          ? <input autoFocus value={val} onChange={function(e){setVal(e.target.value);}}
              onBlur={commit} onKeyDown={function(e){if(e.key==='Enter')commit();if(e.key==='Escape'){setEditing(false);setVal(task.text);}}}
              style={{fontFamily:MO,fontSize:12,color:C.tx,background:'transparent',border:'none',borderBottom:'1px solid '+C.bo,outline:'none',flex:1,padding:'2px 0'}}/>
          : <span onClick={function(){if(!readOnly)setEditing(true);}} title={readOnly?'':'Click to edit'}
              style={{fontFamily:MO,fontSize:12,color:task.done?C.mu:C.tx,flex:1,cursor:readOnly?'default':'text',textDecoration:task.done?'line-through':'none',padding:'2px 0',borderBottom:'1px dashed '+(readOnly?'transparent':C.bo)}}>{task.text}</span>
        }
        <button onClick={function(e){e.stopPropagation();setShowNotes(function(p){return !p;});}} title={showNotes?'Hide notes':'Notes'}
          style={{background:'none',border:'none',cursor:'pointer',fontSize:11,padding:'0 2px',flexShrink:0,opacity:hasNotes?1:0.4,color:hasNotes?C.yl:C.mu}}>📝</button>
        {!readOnly && <button onClick={function(e){e.stopPropagation();if(!isFirst&&onMoveUp)onMoveUp();}} disabled={!!isFirst} style={arrowBtn(!!isFirst)} title="Move up">▲</button>}
        {!readOnly && <button onClick={function(e){e.stopPropagation();if(!isLast&&onMoveDown)onMoveDown();}} disabled={!!isLast} style={arrowBtn(!!isLast)} title="Move down">▼</button>}
        {!readOnly && <button onClick={onDelete} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:12,padding:'0 2px',flexShrink:0,opacity:0.6}} title="Delete task">×</button>}

function MilestoneRow({ milestone, projectTitle, onUpdate, onDelete, onMoveUp, onMoveDown, isFirst, isLast, otherMilestones, onMoveStep, readOnly }) {
  var _ex = useState(false); var expanded = _ex[0]; var setExpanded = _ex[1];
  var _em = useState(false); var editMode = _em[0]; var setEditMode = _em[1];
  var _td = useState(milestone.title); var titleDraft = _td[0]; var setTitleDraft = _td[1];
  var _dd = useState(milestone.dueDate || ''); var dueDraft = _dd[0]; var setDueDraft = _dd[1];
  var _as = useState(false); var addingStep = _as[0]; var setAddingStep = _as[1];
  var _si = useState(''); var stepInp = _si[0]; var setStepInp = _si[1];
  var _sn = useState(false); var showNotes = _sn[0]; var setShowNotes = _sn[1];
  var _nv = useState(milestone.notes || ''); var notesVal = _nv[0]; var setNotesVal = _nv[1];

  var commitNotes = function(){ onUpdate({notes: notesVal}); };
  var hasNotes    = !!(milestone.notes && milestone.notes.trim());

  var saveEdit = function() {
    if (titleDraft.trim()) onUpdate({title: titleDraft.trim(), dueDate: dueDraft || null});
    setEditMode(false);
  };
  var cancelEdit = function(){ setTitleDraft(milestone.title); setDueDraft(milestone.dueDate||''); setEditMode(false); };

  var toggleDone = function(e) {
    e.stopPropagation();
    if (readOnly) return;
    onUpdate({ done: !milestone.done, status: !milestone.done ? 'done' : 'in-progress' });
  };

  var steps = milestone.steps || [];
  var deleteStep = function(sid){ onUpdate({ steps: steps.filter(function(s){ return s.id !== sid; }) }); };
  var moveStep = function(sid, dir) {
    var idx = steps.findIndex(function(s){ return s.id === sid; });
    var j = idx + dir;
    if (idx < 0 || j < 0 || j >= steps.length) return;
    var next = steps.slice();
    var tmp = next[idx]; next[idx] = next[j]; next[j] = tmp;
    onUpdate({ steps: next });
  };
  var addStep = function() {
    if (!stepInp.trim()) return;
    onUpdate({ steps: [...steps, { id:nid(), text:stepInp.trim(), done:false, notes:'' }] });
    setStepInp(''); setAddingStep(false);
  };

  var isDone    = !!milestone.done;
  var effStatus = isDone ? 'done' : (milestone.status || 'not-started');
  var col       = MS_STATUS_COLOR[effStatus] || C.mu;
  var stepsDone = steps.filter(function(s){ return s.done; }).length;
  var stepsPct  = steps.length > 0 ? Math.round((stepsDone / steps.length) * 100) : 0;
  var stepsBarCol = stepsPct === 100 ? C.gr : stepsPct >= 50 ? C.te : C.mu;
  var arrowBtn  = function(dis){ return {background:'transparent',border:'none',cursor:dis?'default':'pointer',fontSize:11,padding:'0 2px',lineHeight:1,color:dis?C.bo:C.mu,flexShrink:0}; };

  var updateStep = function(sid, changes) {
    var newSteps = steps.map(function(s){ return s.id===sid ? Object.assign({},s,changes) : s; });
    var allDone = newSteps.length > 0 && newSteps.every(function(s){ return s.done; });
    if (allDone && !isDone) {
      onUpdate({ steps: newSteps, done: true, status: 'done' });
      setExpanded(false);
    } else {
      onUpdate({ steps: newSteps });
    }
  };

  return (
    <div style={{marginBottom:6,border:'1px solid '+C.bo,borderRadius:6,overflow:'hidden'}}>
      <div style={{display:'flex',gap:5,alignItems:'center',padding:'7px 10px',background:C.ca,cursor:'pointer'}} onClick={function(){setExpanded(function(p){return !p;});}}>
        <div onClick={toggleDone} style={{width:16,height:16,borderRadius:4,border:'2px solid '+(isDone?C.gr:C.bo),background:isDone?C.gr:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,cursor:readOnly?'not-allowed':'pointer'}}>
          {isDone && <span style={{color:'#111',fontSize:9,fontWeight:'bold',lineHeight:1}}>✓</span>}
        </div>
        <span style={{fontFamily:MO,fontSize:11,color:C.mu,flexShrink:0,userSelect:'none'}}>{expanded?'▼':'▶'}</span>
        <span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:isDone?C.mu:C.tx,flex:1,textDecoration:isDone?'line-through':'none',padding:'2px 0'}}>{milestone.title}</span>
        {milestone.dueDate && <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>{inputFmt(milestone.dueDate)}</span>}
        <select value={effStatus} onClick={function(e){e.stopPropagation();}} onChange={function(e){e.stopPropagation();if(!readOnly)onUpdate({status:e.target.value,done:e.target.value==='done'});}}
          disabled={!!readOnly}
          style={{fontFamily:MO,fontSize:10,color:col,background:C.ca,border:'1px solid '+col+'44',borderRadius:4,padding:'2px 5px',cursor:readOnly?'not-allowed':'pointer',outline:'none',flexShrink:0}}>
          {MS_STATUS_OPTS.map(function(s){ return <option key={s} value={s}>{MS_STATUS_LABEL[s]}</option>; })}
        </select>

                onSend={function(){}}

                isFirst={si===0}

                otherMilestones={otherMs}

            );
          })}
          {!readOnly && (
            addingStep
              ? <div style={{display:'flex',gap:6,alignItems:'center',marginTop:4}}>

          )}

      )}
    </div>
  );
}

function BucketProjectsTab({ projects, setProjects, readOnly, onAudit, bucketLabel, bucketId, isCompact }) {
  var _f  = useState('active');   var filter     = _f[0];  var setFilter     = _f[1];
  var _si = useState(null);       var selectedId = _si[0]; var setSelectedId = _si[1];
  var _sn = useState(false);      var showNew    = _sn[0]; var setShowNew    = _sn[1];
  var _nt = useState('');         var newTitle   = _nt[0]; var setNewTitle   = _nt[1];
  var _nd = useState('');         var newDesc    = _nd[0]; var setNewDesc    = _nd[1];
  var _ei = useState(null);       var editingId  = _ei[0]; var setEditingId  = _ei[1];
  var _et = useState('');         var editTitle  = _et[0]; var setEditTitle  = _et[1];
  var _ed = useState(false);      var editingDesc = _ed[0]; var setEditingDesc = _ed[1];
  var _edv = useState('');        var editDesc   = _edv[0]; var setEditDesc   = _edv[1];
  var _at = useState(null);       var addingType = _at[0]; var setAddingType = _at[1];
  var _ai = useState('');         var addInp     = _ai[0]; var setAddInp     = _ai[1];
  var _adu = useState('');        var addDue     = _adu[0]; var setAddDue     = _adu[1];
  var _sb = useState('created');  var sortBy     = _sb[0]; var setSortBy     = _sb[1];

  var save = function(next){ setProjects(next); };

  var updateItems = function(pid, newItems) {
    save(projects.map(function(p){ return p.id===pid ? Object.assign({},p,{items:newItems}) : p; }));
  };

  var moveItem = function(pid, idx, dir) {
    save(projects.map(function(p) {
      if (p.id !== pid) return p;
      var items = p.items.slice();
      var j = idx + dir;
      if (j < 0 || j >= items.length) return p;
      var tmp = items[idx]; items[idx] = items[j]; items[j] = tmp;
      return Object.assign({},p,{items:items});
    }));
  };

  var moveStepToMilestone = function(pid, fromMsId, step, toMsId) {
    save(projects.map(function(p) {
      if (p.id !== pid) return p;
      var items = p.items.map(function(i) {
        if (i.id === fromMsId) return Object.assign({},i,{steps:(i.steps||[]).filter(function(s){return s.id!==step.id;})});
        if (i.id === toMsId)   return Object.assign({},i,{steps:[...(i.steps||[]),step]});
        return i;
      });
      return Object.assign({},p,{items:items});
    }));
  };

  var addItem = function() {
    if (!addInp.trim() || !selected) return;
    var items = (selected.items || []).slice();
    if (addingType === 'milestone') {
      items.push({ id:nid(), type:'milestone', title:addInp.trim(), dueDate:addDue||null, status:'not-started', steps:[] });
    } else {
      items.push({ id:nid(), type:'task', text:addInp.trim(), done:false });
    }
    updateItems(selected.id, items);
    if (onAudit) onAudit('added ' + addingType, addInp.trim(), bucketId);
    setAddInp(''); setAddDue(''); setAddingType(null);
  };

  var selected = null;
  for (var _pi=0; _pi<projects.length; _pi++) {
    if (projects[_pi].id === selectedId) { selected = projects[_pi]; break; }
  }

  useEffect(function() {
    setEditingDesc(false); setEditDesc('');
    setAddingType(null); setAddInp(''); setAddDue('');
    setEditingId(null); setEditTitle('');
  }, [selectedId]);

  var createProject = function() {
    if (!newTitle.trim()) return;
    var p = { id:nid(), title:newTitle.trim(), description:newDesc.trim(), status:'active', created:new Date().toISOString(), items:[] };
    save([...projects, p]);
    setSelectedId(p.id); setShowNew(false); setNewTitle(''); setNewDesc('');
    if (onAudit) onAudit('created project', p.title, bucketId);

  var deleteProject = function(id) {
    var proj = projects.find(function(p){return p.id===id;});
    if (!window.confirm('Delete this project and all its content?')) return;
    save(projects.filter(function(p){return p.id!==id;}));
    if (selectedId===id) setSelectedId(null);
    if (onAudit && proj) onAudit('deleted project', proj.title, bucketId);
  };

  var updateProject = function(id, changes) {
    save(projects.map(function(p){return p.id===id?Object.assign({},p,changes):p;}));
  };

  var itemCount = function(p) {
    var ms = p.items.filter(function(i){return i.type==='milestone';}).length;
    var ts = p.items.filter(function(i){return i.type==='task';}).length;
    var parts = [];
    if(ms) parts.push(ms + ' milestone' + (ms!==1?'s':''));
    if(ts) parts.push(ts + ' task' + (ts!==1?'s':''));
    return parts.length ? parts.join(' · ') : 'No items yet';
  };

  var earliestDue = function(p) {

                      style={{fontFamily:MO,fontSize:11,padding:'4px 10px',background:addInp.trim()?C.bl+'22':C.ca,border:'1px solid '+(addInp.trim()?C.bl:C.bo),borderRadius:4,color:addInp.trim()?C.bl:C.mu,cursor:addInp.trim()?'pointer':'default'}}>✓ Add</button>
                    <button onClick={function(){setAddingType(null);setAddInp('');setAddDue('');}}
                      style={{fontFamily:MO,fontSize:11,padding:'4px 8px',background:'transparent',border:'1px solid '+C.bo,borderRadius:4,color:C.mu,cursor:'pointer'}}>✕ Cancel</button>
                  </div>
                : <div style={{display:'flex',gap:6,marginBottom:12}}>

                      style={{fontFamily:MO,fontSize:11,padding:'4px 12px',borderRadius:4,cursor:'pointer',border:'1px solid '+C.bl+'66',background:C.ca,color:C.bl}}>+ Milestone</button>
                    <button onClick={function(){setAddingType('task');}}
                      style={{fontFamily:MO,fontSize:11,padding:'4px 12px',borderRadius:4,cursor:'pointer',border:'1px solid '+C.bo,background:C.ca,color:C.mu}}>+ Task</button>
                  </div>
            )}
            <div>
              {(selected.items||[]).length===0 && <div style={{fontFamily:MO,fontSize:11,color:C.mu,textAlign:'center',padding:'24px 0'}}>{readOnly ? 'No items in this project.' : 'No milestones or tasks yet.'}</div>}
              {(selected.items||[]).map(function(item, itemIdx) {
                var totalItems = (selected.items||[]).length;
                if (item.type==='milestone') {
                  var otherMs = (selected.items||[]).filter(function(i){return i.type==='milestone'&&i.id!==item.id;});
                  return (
                    <MilestoneRow key={item.id} milestone={item} projectTitle={selected.title}
                      readOnly={readOnly}
                      onMoveUp={function(){moveItem(selected.id, itemIdx, -1);}}
                      onMoveDown={function(){moveItem(selected.id, itemIdx, 1);}}
                      isFirst={itemIdx===0}
                      isLast={itemIdx===totalItems-1}
                      otherMilestones={otherMs}
                      onMoveStep={function(step, toMsId){moveStepToMilestone(selected.id, item.id, step, toMsId);}}
                      onUpdate={function(changes){
                        updateItems(selected.id,(selected.items||[]).map(function(i){return i.id===item.id?Object.assign({},i,changes):i;}));
                      }}
                      onDelete={function(){if(window.confirm('Delete this milestone and all its steps?'))updateItems(selected.id,(selected.items||[]).filter(function(i){return i.id!==item.id;}));if(onAudit)onAudit('deleted milestone',item.title,bucketId);}}
                      onSend={function(){}}
                    />
                  );
                }
                if (item.type==='task') {
                  return (
                    <TaskRow key={item.id} task={item} projectTitle={selected.title}
                      readOnly={readOnly}
                      onMoveUp={function(){moveItem(selected.id, itemIdx, -1);}}
                      onMoveDown={function(){moveItem(selected.id, itemIdx, 1);}}
                      isFirst={itemIdx===0}
                      isLast={itemIdx===totalItems-1}
                      onToggle={function(){updateItems(selected.id,(selected.items||[]).map(function(i){return i.id===item.id?Object.assign({},i,{done:!i.done}):i;}));}}
                      onEditText={function(text){updateItems(selected.id,(selected.items||[]).map(function(i){return i.id===item.id?Object.assign({},i,{text:text}):i;}));}}
                      onEditNotes={function(notes){updateItems(selected.id,(selected.items||[]).map(function(i){return i.id===item.id?Object.assign({},i,{notes:notes}):i;}));}}
                      onDelete={function(){updateItems(selected.id,(selected.items||[]).filter(function(i){return i.id!==item.id;}));if(onAudit)onAudit('deleted task',item.text,bucketId);}}
                    />
                  );
                }
                return null;
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── LeadsApp ──────────────────────────────────────────────────────────────────
function LeadsApp() {
  var w = useWindowWidth();
  var isCompact = w < 900;

  // Session identity (persisted in sessionStorage for tab lifetime)
  var _su = useState(function(){
    try { var s = sessionStorage.getItem('leads-session-user'); if(s) return JSON.parse(s); } catch(e) {}
    return null;
  });
  var sessionUser = _su[0]; var setSessionUser = _su[1];

  // Agents — loaded after PIN auth
  var _agents = useState([]); var agents = _agents[0]; var setAgents = _agents[1];

  // PIN state
  var _vp  = useState(function(){ try{ return sessionStorage.getItem('leads-vault-pin')||''; }catch(e){return '';} });
  var vaultPin = _vp[0]; var setVaultPin = _vp[1];
  var _vpi = useState(''); var vaultPinInput = _vpi[0]; var setVaultPinInput = _vpi[1];
  var _vpe = useState(''); var vaultPinError = _vpe[0]; var setVaultPinError = _vpe[1];
  var _vf  = useState(false); var vaultFetching = _vf[0]; var setVaultFetching = _vf[1];
  var _vr  = useState(false); var vaultReady = _vr[0]; var setVaultReady = _vr[1];

  var fetchRosterWithPin = function(pin) {
    setVaultFetching(true);
    setVaultPinError('');
    vaultAuth(pin).then(function(auth) {
      if (!auth.ok) {
        setVaultPinError('Invalid PIN. Try again.');
        setVaultFetching(false);
        return;
      }
      return vaultGet('leads-roster', pin).then(function(result) {
        setVaultFetching(false);
        if (result && result.leads && result.leads.length > 0) {
          setAgents(result.leads);
          try { sessionStorage.setItem('leads-vault-pin', pin); } catch(e) {}
          setVaultPin(pin);
          setVaultReady(true);
        } else if (result && result.data && result.data.leads) {
          // handleStore wraps in { data: ... }
          setAgents(result.data.leads);
          try { sessionStorage.setItem('leads-vault-pin', pin); } catch(e) {}
          setVaultPin(pin);
          setVaultReady(true);
        } else {
          setVaultPinError('No roster found. Ask Jesse to push the Leads Roster from index.html first.');
        }
      });
    }).catch(function() {
      setVaultFetching(false);
      setVaultPinError('Connection failed. Check network and try again.');
    });
  };

  // Auto-auth on load if PIN already in session
  useEffect(function() {
    var saved = '';
    try { saved = sessionStorage.getItem('leads-vault-pin') || ''; } catch(e) {}
    if (saved) {
      fetchRosterWithPin(saved);
    }
  }, []);

  // Active tab
  var _at = useState('projects'); var activeTab = _at[0]; var setActiveTab = _at[1];

  // Dept projects — six buckets
  var _dp = useState(function(){
    try {
      var s = store.getItem(SK_PROJECTS);
      if(s) return JSON.parse(s);
    } catch(e) {}
    return { emailManagement:[], publicBoards:[], videoBoard:[], repairScrap:[], inventory:[], wikiEditor:[] };
  });
  var allBuckets = _dp[0]; var setAllBuckets = _dp[1];

  // Notes
  var _notes = useState(function(){
    try { var s = store.getItem(SK_NOTES); if(s) return JSON.parse(s); } catch(e) {}
    return [];
  });
  var notes = _notes[0]; var setNotes = _notes[1];

  // Audit log
  var _log = useState(function(){
    try { var s = store.getItem(SK_LOG); if(s) return JSON.parse(s); } catch(e) {}
    return [];
  });
  var deptLog = _log[0]; var setDeptLog = _log[1];

  // Persist buckets to localStorage whenever they change
  useEffect(function(){
    try { store.setItem(SK_PROJECTS, JSON.stringify(allBuckets)); } catch(e) {}
  }, [allBuckets]);

  // Persist notes
  useEffect(function(){
    try { store.setItem(SK_NOTES, JSON.stringify(notes)); } catch(e) {}
  }, [notes]);

  // Persist session identity
  useEffect(function(){
    try { if(sessionUser) sessionStorage.setItem('leads-session-user', JSON.stringify(sessionUser)); else sessionStorage.removeItem('leads-session-user'); } catch(e) {}
  }, [sessionUser]);

  var addAudit = function(action, what, bucketId) {
    var bucketLabel = '';
    for (var i=0; i<ADDITIONAL_ROLES.length; i++) {
      if (ADDITIONAL_ROLES[i].id === bucketId) { bucketLabel = ADDITIONAL_ROLES[i].label; break; }
    }
    var entry = {
      id: nid(),
      who: sessionUser ? sessionUser.name : 'Unknown',
      action: action,
      what: what,
      bucket: bucketLabel || bucketId || '',
      ts: new Date().toISOString(),
    };
    var next = [entry, ...deptLog].slice(0, 500);
    setDeptLog(next);
    try { store.setItem(SK_LOG, JSON.stringify(next)); } catch(e) {}
  };

  var handleSelectUser = function(user) {
    setSessionUser(user);
  };

  var handleSwitchUser = function() {
    setSessionUser(null);
    try { sessionStorage.removeItem('leads-session-user'); } catch(e) {}
  };

  // Step 1 — PIN gate
  if (!vaultReady) {
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.9)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999,padding:20}}>
        <div style={{background:C.su,border:'1px solid '+C.bo,borderRadius:12,padding:32,maxWidth:400,width:'100%',fontFamily:MO}}>
          <div style={{fontSize:11,color:C.bl,letterSpacing:3,marginBottom:6}}>DPS LEADS</div>
          <div style={{fontSize:20,fontWeight:'bold',color:C.tx,marginBottom:4}}>Dept. Projects</div>
          <div style={{fontSize:11,color:C.mu,marginBottom:24}}>{DPS_VERSION} — enter department PIN to continue</div>
          <input
            type="password"
            placeholder="Department PIN"
            value={vaultPinInput}
            onChange={function(e){ setVaultPinInput(e.target.value); setVaultPinError(''); }}
            onKeyDown={function(e){ if(e.key==='Enter'&&vaultPinInput.trim()) fetchRosterWithPin(vaultPinInput.trim()); }}
            autoFocus
            style={{width:'100%',boxSizing:'border-box',fontFamily:MO,fontSize:14,color:C.tx,background:C.ca,border:'1px solid '+(vaultPinError?C.rd:C.bo),borderRadius:6,padding:'10px 12px',outline:'none',marginBottom:8,letterSpacing:4}}
          />
          {vaultPinError && <div style={{fontFamily:MO,fontSize:11,color:C.rd,marginBottom:10}}>{vaultPinError}</div>}
          <button
            onClick={function(){ if(vaultPinInput.trim()) fetchRosterWithPin(vaultPinInput.trim()); }}
            disabled={!vaultPinInput.trim()||vaultFetching}
            style={{width:'100%',fontFamily:MO,fontSize:13,fontWeight:'bold',padding:'10px 0',borderRadius:6,border:'none',background:(vaultPinInput.trim()&&!vaultFetching)?C.bl:C.bo,color:(vaultPinInput.trim()&&!vaultFetching)?'#fff':C.mu,cursor:(vaultPinInput.trim()&&!vaultFetching)?'pointer':'not-allowed',transition:'all .15s'}}>
            {vaultFetching ? 'Connecting...' : 'Continue'}
          </button>
        </div>
      </div>
    );
  }

  // Step 2 — Name picker if no session user
  if (!sessionUser) {
    return <NamePickerModal agents={agents} onSelect={handleSelectUser}/>;
  }

  // Build tab list
  var tabs = [
    { id:'projects', label:'Dept. Projects' },
    { id:'notes',    label:'Notes' },
  ];

  return (
    <div style={{minHeight:'100vh',background:C.bg,color:C.tx}}>
      {/* Header */}
      <div style={{background:C.su,borderBottom:'1px solid '+C.bo,padding:'10px 20px',display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
        <div style={{display:'flex',flexDirection:'column',gap:1}}>
          <span style={{fontFamily:MO,fontSize:9,color:C.bl,letterSpacing:3}}>DPS LEADS</span>
          <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>{DPS_VERSION}</span>
        </div>
        {/* Tab strip */}
        <div style={{display:'flex',gap:0,borderRight:'1px solid '+C.bo,paddingRight:16,marginRight:0}}>
          {tabs.map(function(t){
            var isActive = activeTab===t.id;
            return (
              <button key={t.id} onClick={function(){setActiveTab(t.id);}}
                style={{fontFamily:MO,fontSize:12,fontWeight:'bold',padding:'6px 16px',border:'none',borderBottom:'2px solid '+(isActive?C.bl:'transparent'),background:'transparent',color:isActive?C.bl:C.mu,cursor:'pointer',transition:'all .15s'}}>
                {t.label}
              </button>
            );
          })}
        </div>
        {/* Session identity */}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10}}>
          <div style={{display:'flex',flexDirection:'column',gap:2,alignItems:'flex-end'}}>
            <span style={{fontFamily:MO,fontSize:12,color:C.tx}}>{sessionUser.name}</span>
            <div style={{display:'flex',gap:4,flexWrap:'wrap',justifyContent:'flex-end'}}>
              {ADDITIONAL_ROLES.filter(function(r){return sessionUser.additionalRoles&&sessionUser.additionalRoles[r.id];}).map(function(r){
                return <span key={r.id} style={{fontFamily:MO,fontSize:8,color:C.bl,border:'1px solid '+C.bl+'44',padding:'1px 4px',borderRadius:3}}>{r.label}</span>;
              })}
            </div>
          </div>
          <button onClick={handleSwitchUser}
            style={{fontFamily:MO,fontSize:10,padding:'4px 10px',borderRadius:4,border:'1px solid '+C.bo,background:C.ca,color:C.mu,cursor:'pointer'}}>
            Switch
          </button>
          <button onClick={function(){ handleSwitchUser(); setVaultReady(false); setVaultPin(''); setVaultPinInput(''); try{sessionStorage.removeItem('leads-vault-pin');}catch(e){} }}
            style={{fontFamily:MO,fontSize:10,padding:'4px 10px',borderRadius:4,border:'1px solid '+C.rd+'44',background:'transparent',color:C.rd,cursor:'pointer'}}>
            Sign Out
          </button>
        </div>
      </div>

      {/* Content */}
      <div style={{padding:activeTab==='projects'?'12px 20px 0':'0'}}>
        {activeTab==='projects' && (
          <DeptProjectsTab
            allBuckets={allBuckets}
            setAllBuckets={setAllBuckets}
            sessionRoles={sessionUser.additionalRoles || {}}
            onAudit={addAudit}
            isCompact={isCompact}
          />
        )}
        {activeTab==='notes' && (
          <SharedNotesTab
            notes={notes}
            onUpdateNotes={setNotes}
            sessionName={sessionUser.name}
          />
        )}
      </div>
    </div>
  );
}

// ── Error Boundary ────────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{minHeight:'100vh',background:'#111318',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
        <div style={{background:'#1c1f2b',border:'1px solid #ef4444',borderRadius:10,padding:24,maxWidth:700,width:'100%'}}>
          <div style={{fontFamily:"'Courier New',monospace",fontSize:13,color:'#ef4444',marginBottom:8,letterSpacing:2}}>RENDER ERROR</div>
          <pre style={{fontFamily:"'Courier New',monospace",fontSize:11,color:'#dde1ee',whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{this.state.error.toString()}{'\n\n'}{this.state.error.stack}</pre>
        </div>
      </div>
    );
    return this.props.children;
  }
}

// ── Mount ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><LeadsApp /></ErrorBoundary>);
</script>
</body>
</html>
