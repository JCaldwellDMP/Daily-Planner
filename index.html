function TrainingMode({ trainees, agents, onUpdateAgent, onAddAgent, onGraduateAgent, onDeleteAgent }) {
  const [selectedId,setSelectedId]         = useState(null);
  const [selectedShowTraining,setSelectedShowTraining] = useState(false);
  const [showAdd,setShowAdd]         = useState(false);
  const [newName,setNewName]         = useState('');
  const [newStart,setNewStart]       = useState(new Date().toISOString().split('T')[0]);
  const [newSup,setNewSup]           = useState('');
  const [newDisc,setNewDisc]         = useState('');

  const selectedHire = trainees.find(h=>h.id===selectedId);
  const inpS = {fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',color:C.tx,outline:'none'};

  const addHire = () => {
    if(!newName.trim()) return;
    if(trainees.length>=3){ alert('Maximum 3 active trainees supported.'); return; }
    const h={...initAgent(newName.trim(),newStart),supervisor:newSup.trim(),discProfile:newDisc.trim()};
    onAddAgent(h);
    setSelectedId(h.id); setShowAdd(false); setNewName(''); setNewSup(''); setNewDisc('');
  };

  const updateHire = hire => onUpdateAgent(sanitizeAgent(hire));

  const deleteHire = id => {
    if(!window.confirm('Delete this record and all data?')) return;
    onDeleteAgent(id);
    if(selectedId===id) setSelectedId(null);
  };

  return (
    <div style={{padding:'24px 20px'}}>
      <div style={{fontFamily:MO,fontSize:11,color:C.pu,letterSpacing:2,marginBottom:4}}>NEW HIRE TRAINING TRACKER</div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,flexWrap:'wrap',gap:8}}>
        <div style={{fontFamily:MO,fontSize:12,color:C.mu}}>Active Trainees: <span style={{color:C.pu,fontWeight:'bold'}}>{trainees.length}</span> / 3</div>
        <div style={{display:'flex',gap:6}}>
          {trainees.length<3&&!showAdd&&<OBtn onClick={()=>setShowAdd(true)}>+ Add Trainee</OBtn>}
        </div>
      </div>

      {showAdd&&<AddForm isAlumni={false} onSave={addHire} onCancel={()=>{setShowAdd(false);setNewName('');setNewSup('');setNewDisc('');}} name={newName} setName={setNewName} start={newStart} setStart={setNewStart} sup={newSup} setSup={setNewSup} disc={newDisc} setDisc={setNewDisc}/>}

      {trainees.length===0&&!showAdd&&(
        <div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:10,padding:'50px 20px',textAlign:'center'}}>
          <div style={{fontSize:36,marginBottom:12}}>👥</div>
          <div style={{fontFamily:MO,fontSize:13,color:C.mu}}>No active trainees. Click + Add Trainee to begin tracking.</div>
        </div>
      )}

      {trainees.length>0&&(
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          {trainees.map(h=>(
            <div key={h.id} style={{position:'relative',flex:'1 1 190px',maxWidth:280}}>
              <HireCard hire={h} selected={selectedId===h.id} onSelect={id=>{setSelectedId(selectedId===id?null:id);setSelectedShowTraining(false);}} onSelectTraining={id=>{setSelectedId(id);setSelectedShowTraining(true);}}/>
              <button onClick={()=>deleteHire(h.id)} title="Delete record" style={{position:'absolute',top:6,right:6,background:C.ca,border:'1px solid '+C.bo,borderRadius:3,color:C.mu,cursor:'pointer',fontSize:10,padding:'1px 5px',lineHeight:1}}>✕</button>
            </div>
          ))}
        </div>
      )}

      {selectedHire&&<AgentDetail
        key={selectedHire.id}
        hire={selectedHire}
        onUpdate={updateHire}
        onGraduate={onGraduateAgent}
        peerHires={agents.filter(h=>h.id!==selectedHire.id)}
        forceTraining={selectedShowTraining}
      />}
    </div>
  );
}

// ── SeatingChart ──────────────────────────────────────────────────────────────
const supervisorColor = sup => {
  if(sup==='Dolan Parnell')  return 'blue';
  if(sup==='Ryan Kay')       return 'dark-green';
  if(sup==='Stephen Bowen')  return 'light-green';
  return 'none';
};

function SeatingChart({ agents, onUpdateAgent }) {
  const [dragId,setDragId]         = useState(null);
  const [dragSource,setDragSource] = useState(null); // 'panel' | 'floor'
  const [dropHover,setDropHover]   = useState(null);
  const [editSeat,setEditSeat]     = useState(null);
  const [editName,setEditName]     = useState('');

  const activeAgents = agents.filter(a => a.status !== 'inactive');

  const seatMap = {};
  activeAgents.filter(a=>a.seatId).forEach(a=>{ seatMap[a.seatId]=a; });

  const unseated = activeAgents.filter(a=>!a.seatId && !SPECIALTY_GOLD.includes(a.name));

  const agentColor = a => {
    if(!a) return null;
    if(SPECIALTY_GOLD.includes(a.name)) return '#eab308';
    if(SPECIALTY_RED.includes(a.name))  return C.rd;
    const tc = supervisorColor(a.supervisor);
    return TEAM_COLORS[tc] || C.mu;
  };

  const assignSeat = (agentId, toSeatId) => {
    const fromAgent = activeAgents.find(a=>a.id===agentId);
    if(!fromAgent) return;
    if(SPECIALTY_GOLD.includes(seatMap[toSeatId]?.name)) return;
    const toAgent = seatMap[toSeatId];
    if(toAgent) onUpdateAgent({...toAgent, seatId: fromAgent.seatId||null});
    onUpdateAgent({...fromAgent, seatId: toSeatId});
  };

  const unassignSeat = agentId => {
    const ag = activeAgents.find(a=>a.id===agentId);
    if(ag && !SPECIALTY_GOLD.includes(ag.name)) onUpdateAgent({...ag, seatId:null});
  };

  const saveEdit = () => {
    if(!editSeat) return;
    const ag = seatMap[editSeat];
    if(ag && editName.trim()) onUpdateAgent({...ag, name:editName.trim()});
    setEditSeat(null);
  };

  // ── Panel tile (unassigned list) ───────────────────────────────────────────
  const PanelTile = ({agent}) => {
    const col = agentColor(agent);
    const parts = agent.name.split(' ');
    const initials = parts.map(w=>w[0]).join('');
    const last = parts.length>1 ? parts[parts.length-1].slice(0,8) : agent.name.slice(0,8);
    return (
      <div
        draggable
        onDragStart={()=>{ setDragId(agent.id); setDragSource('panel'); }}
        onDragEnd={()=>{ setDragId(null); setDragSource(null); }}
        title={agent.name}
        style={{
          width:52,height:44,borderRadius:4,border:'2px solid '+col,
          background:col+'2a',display:'flex',flexDirection:'column',
          alignItems:'center',justifyContent:'center',cursor:'grab',
          fontFamily:MO,textAlign:'center',lineHeight:1.2,userSelect:'none',
          opacity:dragId===agent.id?0.4:1,transition:'opacity .15s',flexShrink:0,
        }}>
        <span style={{fontSize:9,fontWeight:'bold',color:col}}>{initials}</span>
        <span style={{fontSize:7,color:col}}>{last}</span>
      </div>
    );
  };

  // ── Floor seat tile ────────────────────────────────────────────────────────
  const SeatTile = ({seatId, fixed, x, y}) => {
    const agent  = seatMap[seatId];
    const col    = agentColor(agent) || '#ccc';
    const isFixed = fixed||(agent&&SPECIALTY_GOLD.includes(agent.name));
    const isHover = dropHover===seatId;
    const parts   = agent ? agent.name.split(' ') : [];
    const initials = parts.map(w=>w[0]).join('');
    const last    = parts.length>1 ? parts[parts.length-1].slice(0,8) : (agent?agent.name.slice(0,8):'');
    const tileTitle = agent ? agent.name : seatId;
    const emptyBg = isHover ? '#e8ffe8' : '#f5f5f5';
    const emptyBd = isHover ? '#4ade80' : '#ddd';
    return (
      <div
        draggable={!isFixed&&!!agent}
        onDragStart={()=>{ if(!isFixed&&agent){ setDragId(agent.id); setDragSource('floor'); } }}
        onDragEnd={()=>{ setDragId(null); setDragSource(null); setDropHover(null); }}
        onDragOver={e=>{ if(!isFixed){ e.preventDefault(); setDropHover(seatId); } }}
        onDragLeave={()=>setDropHover(null)}
        onDrop={e=>{ e.preventDefault(); setDropHover(null); if(dragId&&!isFixed) assignSeat(dragId,seatId); setDragId(null); }}
        onDoubleClick={()=>{ if(agent){ setEditSeat(seatId); setEditName(agent.name); } }}
        title={tileTitle}
        style={{
          position:'absolute',left:x,top:y,width:52,height:44,
          borderRadius:4,
          border:'2px solid '+(agent ? col : emptyBd),
          background:agent ? col+'2a' : emptyBg,
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
          cursor:isFixed?'default':agent?'grab':'default',
          fontFamily:MO,textAlign:'center',lineHeight:1.2,
          userSelect:'none',transition:'all .12s',
          opacity:dragId===agent?.id?0.35:1,
          boxSizing:'border-box',zIndex:2,
        }}>
        {agent
          ? <><span style={{fontSize:9,fontWeight:'bold',color:col}}>{initials}</span>
               <span style={{fontSize:7,color:col}}>{last}</span></>
          : <span style={{fontSize:7,color:isHover?'#22c55e':'#bbb'}}>+</span>}
      </div>
    );
  };

  // [seatId, tx, ty, fixed?] -- tile top-left in 1120x540 container
  const SEATS = [
    // ADV zone -- 2x2, lower-left below restroom block
    ['adv-1',  14, 375], ['adv-2',  74, 375],
    ['adv-3',  14, 435], ['adv-4',  74, 435],
    // NET zone -- 4 desks south of IT Networking Room
    ['net-1', 252, 375], ['net-2', 310, 375], ['net-3', 368, 375], ['net-4', 438, 375],
    // INV zone -- single desk near TS Inventory
    ['inv-1', 438, 285],
    // CONF zone -- row1: 3 desks, row2: 4 desks, south of Conference Room
    ['conf-1', 558, 272], ['conf-2', 616, 272], ['conf-3', 674, 272],
    ['conf-4', 558, 344], ['conf-5', 616, 344], ['conf-6', 674, 344],
    ['conf-7', 736, 344],
    // GOLD fixed seats -- enclosed offices
    ['gold-brad', 768, 224, true], ['gold-brent', 1042, 40, true],
    // QUAD zone -- 2x2 cluster, far right
    ['quad-1', 964, 330], ['quad-2', 1022, 330],
    ['quad-3', 964, 390], ['quad-4', 1022, 390],
    // MAIN row -- 19 seats, 59px spacing
    ['main-01',  16, 470], ['main-02',  75, 470], ['main-03', 134, 470],
    ['main-04', 193, 470], ['main-05', 252, 470], ['main-06', 311, 470],
    ['main-07', 370, 470], ['main-08', 429, 470], ['main-09', 488, 470],
    ['main-10', 547, 470], ['main-11', 606, 470], ['main-12', 665, 470],
    ['main-13', 724, 470], ['main-14', 783, 470], ['main-15', 842, 470],
    ['main-16', 901, 470], ['main-17', 960, 470], ['main-18',1019, 470],
    ['main-19',1062, 470],
  ];

  const FW=1120, FH=540;

  const supColors = [
    ['Dolan Parnell', TEAM_COLORS['blue']],
    ['Ryan Kay',      TEAM_COLORS['dark-green']],
    ['Stephen Bowen', TEAM_COLORS['light-green']],
  ];

  return (
    <div style={{padding:'12px',display:'flex',gap:10,alignItems:'flex-start',overflowX:'auto'}}>

      {/* ── Unassigned agents panel ────────────────────────── */}
      <div
        onDragOver={e=>e.preventDefault()}
        onDrop={e=>{e.preventDefault(); if(dragId&&dragSource==='floor') unassignSeat(dragId); setDragId(null);}}
        style={{
          flexShrink:0,width:128,minHeight:FH,background:C.su,
          border:'1px solid '+C.bo,borderRadius:6,padding:'8px 6px',
          display:'flex',flexDirection:'column',gap:6,boxSizing:'border-box',
        }}>
        <div style={{fontFamily:MO,fontSize:8,color:C.mu,letterSpacing:1,marginBottom:4,textAlign:'center'}}>UNASSIGNED</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:4,justifyContent:'center'}}>
          {unseated.length===0
            ? <div style={{fontFamily:MO,fontSize:8,color:C.mu,textAlign:'center',padding:'12px 4px',width:'100%'}}>All agents seated</div>
            : unseated.map(a=><PanelTile key={a.id} agent={a}/>)
          }
        </div>
        <div style={{marginTop:'auto',paddingTop:8,borderTop:'1px solid '+C.bo}}>
          <div style={{fontFamily:MO,fontSize:7,color:C.mu,marginBottom:4}}>SUPERVISOR KEY</div>
          {supColors.map(([name,col])=>(
            <div key={name} style={{display:'flex',alignItems:'center',gap:4,marginBottom:3}}>
              <span style={{width:8,height:8,borderRadius:2,background:col,flexShrink:0,display:'inline-block'}}/>
              <span style={{fontFamily:MO,fontSize:7,color:C.tx,lineHeight:1.2}}>{name.split(' ')[1]}</span>
            </div>
          ))}
          <div style={{display:'flex',alignItems:'center',gap:4,marginBottom:3}}>
            <span style={{width:8,height:8,borderRadius:2,background:C.rd,flexShrink:0,display:'inline-block'}}/>
            <span style={{fontFamily:MO,fontSize:7,color:C.tx}}>Supervisor</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:4}}>
            <span style={{width:8,height:8,borderRadius:2,background:'#eab308',flexShrink:0,display:'inline-block'}}/>
            <span style={{fontFamily:MO,fontSize:7,color:C.tx}}>Fixed</span>
          </div>
        </div>
        <div style={{fontFamily:MO,fontSize:7,color:C.mu,marginTop:6,lineHeight:1.4,textAlign:'center'}}>
          Drag to seat<br/>Drag back to unassign<br/>Double-click to rename
        </div>
      </div>

      {/* ── Floor plan ────────────────────────────────────── */}
      <div style={{flexShrink:0,position:'relative',width:FW,height:FH,borderRadius:4,overflow:'hidden'}}>

        <img src="./floorplan.png" alt="Floor plan"
          style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',objectFit:'fill',pointerEvents:'none',userSelect:'none'}}
        />


        {/* Rename modal */}
        {editSeat&&(
          <div style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',background:'rgba(0,0,0,0.45)',zIndex:20,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{background:C.su,border:'1px solid '+C.bo,borderRadius:8,padding:18,minWidth:230}}>
              <div style={{fontFamily:MO,fontSize:10,color:C.mu,marginBottom:8,letterSpacing:1}}>RENAME — {editSeat}</div>
              <input autoFocus value={editName} onChange={e=>setEditName(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter')saveEdit();if(e.key==='Escape')setEditSeat(null);}}
                style={{fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'6px 10px',color:C.tx,outline:'none',width:'100%',boxSizing:'border-box',marginBottom:10}}/>
              <div style={{display:'flex',gap:8}}>
                <OBtn onClick={saveEdit}>Save</OBtn>
                <Btn onClick={()=>setEditSeat(null)}>Cancel</Btn>
              </div>
            </div>
          </div>
        )}

        {SEATS.map(([sid,sx,sy,fx])=>(
          <SeatTile key={sid} seatId={sid} x={sx} y={sy} fixed={!!fx}/>
        ))}

      </div>
    </div>
  );
}

  const [newDisc,setNewDisc]   = useState('');

  const [newSpecShift,setNewSpecShift] = useState('');
  const [newSpecDisc,setNewSpecDisc]   = useState('');

  const activeAgents   = agents.filter(a=>(a.status==='active'||a.status==='trainee')&&!a.specializedRole);
  const inactiveAgents = agents.filter(a=>a.status==='inactive');
  const specializedAgents = agents.filter(a=>!!a.specializedRole && a.status!=='inactive');
  const supervisors    = [...new Set(agents.filter(a=>!a.specializedRole).map(a=>a.supervisor).filter(Boolean))].sort();

  const filtered = activeAgents.filter(a=>{
    if(filterSup  && a.supervisor!==filterSup)  return false;
    if(filterTeam && (a.team||'none')!==filterTeam) return false;
    if(filterQueue && !a.queues?.[filterQueue]?.active) return false;
    return true;
  });

      ...initAgent(newName.trim(), new Date().toISOString().split('T')[0]),
      status:'active',
      supervisor: newSup.trim(),
      shift: newShift||null,
      discProfile: newDisc.trim(),

    onAddAgent(a);
    setShowAddAgent(false);
    setNewName(''); setNewSup(''); setNewShift(''); setNewDisc('');
    setSelectedId(a.id);

  const saveNewSpec = () => {
    if(!newSpecName.trim()) return;

      ...initAgent(newSpecName.trim(), new Date().toISOString().split('T')[0]),
      status:'active',
      specializedRole: newSpecRole,
      shift: newSpecShift||null,
      discProfile: newSpecDisc.trim(),

    setShowAddSpec(false);
    setNewSpecName(''); setNewSpecRole('supervisor'); setNewSpecShift(''); setNewSpecDisc('');
    setSelectedId(a.id);
  };

  const AgentRosterCard = ({agent}) => {
    const teamColor = TEAM_COLORS[agent.team||'none']||C.mu;
    const activeQ   = QUEUES.filter(q=>agent.queues?.[q.id]?.active).length;
    const shiftInfo = SHIFTS.find(s=>s.id===agent.shift);
    return (
      <div onClick={()=>setSelectedId(selectedId===agent.id?null:agent.id)}
        style={{background:selectedId===agent.id?C.ca:C.su,border:`2px solid ${selectedId===agent.id?C.bl:C.bo}`,borderRadius:10,padding:12,cursor:'pointer',transition:'all .15s',flex:'1 1 200px',maxWidth:300,position:'relative'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:5,gap:6}}>
          <div>
            <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.tx,marginBottom:1}}>{agent.name}</div>
            <div style={{fontFamily:MO,fontSize:9,color:C.mu}}>{agent.supervisor||'No supervisor'}</div>
          </div>
          <span style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,border:`1px solid ${teamColor}44`,color:teamColor,flexShrink:0,background:teamColor+'11'}}>{agent.supervisor?(agent.supervisor.split(' ').slice(-1)[0]):'Unassigned'}</span>
          {agent.status==='trainee'&&<span style={{fontFamily:MO,fontSize:8,padding:'2px 6px',borderRadius:3,border:`1px solid ${C.pu}55`,color:C.pu,background:C.pu+'11',flexShrink:0}}>🎓 training</span>}
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {agent.discProfile&&<span style={{fontFamily:MO,fontSize:9,color:C.pu}}>DISC: {agent.discProfile}</span>}
          {shiftInfo&&<span style={{fontFamily:MO,fontSize:9,color:C.mu}}>{shiftInfo.label}</span>}
          {activeQ>0&&<span style={{fontFamily:MO,fontSize:9,color:C.bl}}>{activeQ} queue{activeQ!==1?'s':''}</span>}
          {agent.seatId&&<span style={{fontFamily:MO,fontSize:9,color:C.mu}}>Seat: {agent.seatId}</span>}
        </div>
        <button onClick={e=>{e.stopPropagation();if(window.confirm(`Deactivate ${agent.name}?`))onDeactivateAgent(agent.id);}} title="Deactivate" style={{position:'absolute',top:6,right:6,background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:10,padding:'2px 4px'}}>✕</button>
      </div>
    );

  return (
    <div style={{padding:'24px 20px'}}>
      <div style={{fontFamily:MO,fontSize:11,color:C.bl,letterSpacing:2,marginBottom:12}}>DEPARTMENT MODE</div>

      {/* ROSTER TAB */}
      {deptTab==='roster'&&<div>

              <select value={newShift} onChange={e=>setNewShift(e.target.value)} style={{...inpS,flex:'2 1 160px'}}>

          <select value={filterQueue} onChange={e=>setFilterQueue(e.target.value)} style={{...inpS}}>

          {(filterSup||filterQueue)&&<button onClick={()=>{setFilterSup('');setFilterQueue('');}} style={{fontFamily:MO,fontSize:10,padding:'4px 8px',borderRadius:5,border:'1px solid '+C.bo,background:C.ca,color:C.mu,cursor:'pointer'}}>✕ Clear</button>}
          <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>{filtered.length} of {activeAgents.length}</span>
          <OBtn onClick={()=>{setShowAddAgent(v=>!v);setSelectedId(null);}} style={{marginLeft:'auto',fontSize:10,padding:'3px 10px'}}>

        const sorted = [...specializedAgents].sort((a,b)=>{
          const ri = r => roleOrder.indexOf(r.specializedRole);
          if(ri(a)!==ri(b)) return ri(a)-ri(b);
          return a.name.localeCompare(b.name);

                    <option value="advTech">Advanced Technician</option>
                    <option value="trainer">Tech Support Trainer</option>

                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>

            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:10}}>

              {sorted.length===0
                ? <div style={{fontFamily:MO,fontSize:11,color:C.mu,padding:'20px 12px',textAlign:'center'}}>No specialized agents.</div>
                : sorted.map(a=>{
                    const meta=ROLE_META[a.specializedRole]||{label:a.specializedRole,color:C.mu};

                      <div style={{background:C.su,border:`1px solid ${meta.color}44`,borderRadius:8,padding:16}}>

                        <AgentDetail key={selSpec.id} hire={selSpec} onUpdate={updated=>onUpdateAgent(sanitizeAgent({...updated,specializedRole:selSpec.specializedRole}))} hideSnapshot={true} isSpecialized={true}/>
                      </div>
                    );
                  })()
              }
            </div>
          </div>
          </div>
        );
      })()}

      {/* SEATING TAB */}
      {deptTab==='seating'&&<SeatingChart agents={agents} onUpdateAgent={onUpdateAgent}/>}

      {/* INACTIVE TAB */}
      {deptTab==='inactive'&&<div>
        {inactiveAgents.length===0&&<div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:10,padding:'40px 20px',textAlign:'center',fontFamily:MO,fontSize:12,color:C.mu}}>No inactive agents.</div>}
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {inactiveAgents.map(a=>{
            const teamColor=TEAM_COLORS[a.team||'none']||C.mu;
            return (
              <div key={a.id} style={{background:C.su,border:'1px solid '+C.bo,borderRadius:10,padding:12,flex:'1 1 200px',maxWidth:300}}>
                <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.mu,marginBottom:3}}>{a.name}</div>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:8}}>{a.supervisor||'No supervisor'}</div>
                <div style={{display:'flex',gap:6}}>
                  <button onClick={()=>onReactivateAgent(a.id)} style={{fontFamily:MO,fontSize:10,padding:'4px 10px',borderRadius:5,border:'1px solid '+C.gr,background:C.gr+'22',color:C.gr,cursor:'pointer'}}>↺ Reactivate</button>
                  <button onClick={()=>{if(window.confirm('Delete all data?'))onDeleteAgent(a.id);}} style={{fontFamily:MO,fontSize:10,padding:'4px 10px',borderRadius:5,border:'1px solid '+C.bo,background:C.ca,color:C.mu,cursor:'pointer'}}>✕ Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>}
    </div>
  );
}

  },[ds,tasks,done,timerLogs,awayMs,trainMs,watchMs,timeBlocks,deferred]);

  const loadHistory=summary=>{
    if(summary.snapshot){const snap=summary.snapshot;setSd(p=>({...p,[`tasks-${ds}`]:snap.tasks||[],...( snap.done?{[`done-${ds}`]:snap.done}:{}),...(snap.timeBlocks?{[`time-${ds}`]:snap.timeBlocks}:{}),[`dismissed-${ds}`]:[]}));}
    else{const newItems=(summary.undone||[]).map(i=>({id:nid(),text:i.text,priority:i.priority,carried:true,srcId:i.id}));setSd(p=>({...p,[`tasks-${ds}`]:[...(p[`tasks-${ds}`]||[]),...newItems],[`dismissed-${ds}`]:[]}));}
  };
  const deleteHistory=keys=>{ setSums(p=>{const n={...p};keys.forEach(k=>delete n[k]);return n;}); setIdx(p=>p.filter(d=>!keys.includes(d))); };
  const importHistory=data=>{ if(data.summaries)setSums(p=>({...p,...data.summaries})); if(data.idx)setIdx(p=>{const n=[...p];data.idx.forEach(d=>{if(!n.includes(d))n.push(d);});return n;}); };
  const restoreSession=data=>{
    if(data.sd)setSd(()=>({...initDay(TODAY),...data.sd}));
    if(data.sums)setSums(()=>({...data.sums}));
    if(data.summaryIndex)setIdx(data.summaryIndex);
    if(data.sd){
      const dates=Object.keys(data.sd).filter(k=>k.startsWith('tasks-')&&Array.isArray(data.sd[k])&&data.sd[k].length>0).map(k=>k.replace('tasks-','')).sort().reverse();
      if(dates[0]){setDs(dates[0]);setDateInp(inputFmt(dates[0]));}
    }
  };

  const TABS=['collect','schedule','progress','wrapup'];
  const ALL_TABS=[...TABS,'stats','notes'];
  const goNext=()=>{ const i=TABS.indexOf(tab); if(i<TABS.length-1)setTab(TABS[i+1]); };
  const goBack=()=>{ const i=TABS.indexOf(tab); if(i>0)setTab(TABS[i-1]); };

  useEffect(()=>{
    const handler=e=>{
      const tag=(e.target?.tagName||'').toUpperCase();
      const isEditable=e.target?.isContentEditable;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||isEditable)return;
      if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();goNext();}
      if(e.key==='ArrowLeft' ||e.key==='ArrowUp')  {e.preventDefault();goBack();}
      if(e.key==='Escape'){setShowHist(false);setShowTL(false);setShowRest(false);}
      const n=parseInt(e.key);
      if(n>=1&&n<=TABS.length)setTab(TABS[n-1]);
      if(n===5)setTab('stats');
      if(n===6)setTab('notes');
    };
    window.addEventListener('keydown',handler);
    return ()=>window.removeEventListener('keydown',handler);
  },[tab]);

  const tabInfo={
    collect: {label:'Collect',  icon:'📥', step:1},
    schedule:{label:'Schedule',icon:'📅', step:2},
    progress:{label:'Progress',icon:'☑',  step:3},
    wrapup:  {label:'Wrap Up', icon:'🎁', step:4},
    stats:   {label:'Stats',   icon:'📊', step:null},
    notes:   {label:'Notes',   icon:'📝', step:null},
  };

  const logAwayMs  =timerLogs.filter(r=>r.type==='Away')    .reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
  const logTrainMs =timerLogs.filter(r=>r.type==='Training').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
  const logWatchMs =timerLogs.filter(r=>r.type==='Watching').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;

  const TimerCtrl=({type,ms,running,color})=>(
    <div style={{display:'flex',alignItems:'center'}}>
      <button onClick={e=>{flash(e);timerAdj(type,-1);}} style={{width:20,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:'4px 0 0 4px',color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:13,padding:0}}>−</button>
      <button onClick={e=>{flash(e);timerToggle(type);}} style={{height:26,padding:'0 8px',background:running?`${color}22`:C.ca,border:`1px solid ${running?color:C.bo}`,borderLeft:'none',borderRight:'none',color:running?color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:isCompact?10:11,minWidth:isCompact?90:110,transition:'all .2s',whiteSpace:'nowrap'}}>
        {isCompact?type.slice(0,3).toUpperCase():type.charAt(0).toUpperCase()+type.slice(1)}: {fmtMs(ms)}
      </button>
      <button onClick={e=>{flash(e);timerAdj(type,1);}} style={{width:20,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:'0 4px 4px 0',borderLeft:'none',color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:13,padding:0}}>+</button>
    </div>
  );

  if (!storageReady) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
      <div style={{fontFamily:MO,fontSize:13,color:C.or,letterSpacing:2}}>DAILY PLANNING SYSTEM</div>
      <div style={{fontFamily:MO,fontSize:11,color:C.mu}}>Loading your data…</div>
    </div>
  );

  const cdBoxStyle = {flex:'1 1 130px', background:C.ca, border:'1px solid '+C.bo, borderRadius:8, padding:'8px 12px', boxSizing:'border-box', minWidth:isMobile?0:130};
  const cdValSize = isMobile ? 18 : 22;

  return (
    <div style={{minHeight:'100vh',background:C.bg,fontFamily:MO,color:C.tx,zoom:fontScale}}>
      <div style={{background:C.su,borderBottom:`1px solid ${C.bo}`,padding:'10px 14px'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:6,flexWrap:'wrap'}}>
          <div style={{flex:'1 1 180px',minWidth:0}}>
            <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.or,letterSpacing:2,marginBottom:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>DMP TECHNICAL SUPPORT — JESSE CALDWELL</div>
            <div style={{fontFamily:MO,fontSize:isCompact?14:16,fontWeight:'bold',color:C.tx,marginBottom:6}}>Daily Planning System</div>
            <div style={{display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
              <button onClick={()=>shiftDate(-1)} style={{width:26,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:12,flexShrink:0}}>‹</button>
              <input value={dateInp} onChange={e=>handleDateInput(e.target.value)} style={{fontFamily:MO,fontSize:12,color:C.tx,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,padding:'3px 8px',width:86,textAlign:'center',outline:'none'}}/>
              <button onClick={()=>shiftDate(1)} style={{width:26,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:12,flexShrink:0}}>›</button>
              {ds!==TODAY&&<button onClick={()=>{setDs(TODAY);setDateInp(inputFmt(TODAY));setSd(p=>p[`tasks-${TODAY}`]!==undefined?p:{...p,...initDay(TODAY)});}} style={{fontFamily:MO,fontSize:11,padding:'3px 10px',background:C.or+'22',border:`1px solid ${C.or}`,borderRadius:4,color:C.or,cursor:'pointer'}}>Today</button>}
              {!isMobile&&<span style={{fontFamily:MO,fontSize:11,color:C.mu,marginLeft:2}}>{fmtDate(ds)}</span>}
            </div>
            {isMobile&&<div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:4}}>{fmtDate(ds)}</div>}
          </div>
          <div style={{display:'flex',gap:6,flex:'1 1 300px',flexWrap:'wrap'}}>
            <div style={cdBoxStyle}>
              <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.tx,letterSpacing:1,marginBottom:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{apptBoxTitle}</div>
              <div style={{fontFamily:MO,fontSize:apptCd===null?14:cdValSize,fontWeight:'bold',lineHeight:1.1,color:apptCd===null?C.mu:C.or,whiteSpace:'nowrap'}}>{apptCd!==null?apptCd:'—'}</div>
              {nextEvent&&<div style={{fontFamily:MO,fontSize:9,color:C.tx,marginTop:2,lineHeight:1.3,wordBreak:'break-word'}}>{nextEvent.displayName}</div>}
            </div>
            <div style={cdBoxStyle}>
              <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.tx,letterSpacing:1,marginBottom:2}}>🥗 LUNCH IN</div>
              <div style={{fontFamily:MO,fontSize:lunchCd===null||lunchDiff===0?14:cdValSize,fontWeight:'bold',lineHeight:1.1,color:lunchCd===null||lunchDiff===0?C.mu:C.gr,whiteSpace:'nowrap'}}>{lunchCd!==null?lunchCd:'—'}</div>
            </div>
            <div style={cdBoxStyle}>
              <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.tx,letterSpacing:1,marginBottom:2}}>🏁 SHIFT ENDS IN</div>
              <div style={{fontFamily:MO,fontSize:endDiff===0?14:cdValSize,fontWeight:'bold',lineHeight:1.1,color:endDiff===0?C.mu:C.bl,whiteSpace:'nowrap'}}>{endCd}</div>
              <div style={{display:'flex',gap:4,alignItems:'center',marginTop:4,flexWrap:'wrap'}}>
                <button onClick={()=>setEndTime('16:00')} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:4,cursor:'pointer',border:'1px solid '+(endTime==='16:00'?C.bl:C.bo),background:endTime==='16:00'?C.bl+'22':C.ca,color:endTime==='16:00'?C.bl:C.mu,whiteSpace:'nowrap'}}>4 PM</button>
                <button onClick={()=>setEndTime('17:00')} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:4,cursor:'pointer',border:'1px solid '+(endTime==='17:00'?C.bl:C.bo),background:endTime==='17:00'?C.bl+'22':C.ca,color:endTime==='17:00'?C.bl:C.mu,whiteSpace:'nowrap'}}>5 PM</button>
                <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 4px',color:C.tx,outline:'none',width:75,colorScheme:'dark'}}/>
              </div>
            </div>
          </div>
        </div>
        {!isMobile&&<div style={{fontFamily:MO,fontSize:9,color:C.mu+'88',marginBottom:5,letterSpacing:1}}>← → navigate steps &nbsp;·&nbsp; 1–4 jump to step &nbsp;·&nbsp; 5 = stats &nbsp;·&nbsp; 6 = notes &nbsp;·&nbsp; Esc close modals</div>}
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <TimerCtrl type="away"     ms={awayMs+logAwayMs}   running={awayRun}  color={C.rd}/>
          <TimerCtrl type="training" ms={trainMs+logTrainMs} running={trainRun} color={C.pu}/>
          <TimerCtrl type="watching" ms={watchMs+logWatchMs} running={watchRun} color={C.bl}/>
          <div style={{display:'flex',gap:0,borderRadius:8,overflow:'hidden',border:`2px solid ${appMode==='training'?C.pu:appMode==='department'?C.bl:C.or}`,flexShrink:0,boxShadow:appMode==='training'?`0 0 10px ${C.pu}44`:appMode==='department'?`0 0 10px ${C.bl}44`:`0 0 10px ${C.or}44`,transition:'border-color .2s, box-shadow .2s'}}>
            <button onClick={()=>setAppMode('schedule')} style={{fontFamily:MO,fontSize:isCompact?10:12,fontWeight:'bold',padding:isCompact?'5px 10px':'6px 18px',background:appMode==='schedule'?C.or:C.ca,border:'none',borderRight:'1px solid '+C.bo,color:appMode==='schedule'?'#fff':C.mu,cursor:'pointer',letterSpacing:1,transition:'all .15s',whiteSpace:'nowrap'}}>📅 {isCompact?'SCH':'SCHEDULE'}</button>
            <button onClick={()=>setAppMode('training')} style={{fontFamily:MO,fontSize:isCompact?10:12,fontWeight:'bold',padding:isCompact?'5px 10px':'6px 18px',background:appMode==='training'?C.pu:C.ca,border:'none',borderRight:'1px solid '+C.bo,color:appMode==='training'?'#fff':C.mu,cursor:'pointer',letterSpacing:1,transition:'all .15s',whiteSpace:'nowrap'}}>👥 {isCompact?'TRN':'TRAINING'}</button>
            <button onClick={()=>setAppMode('department')} style={{fontFamily:MO,fontSize:isCompact?10:12,fontWeight:'bold',padding:isCompact?'5px 10px':'6px 18px',background:appMode==='department'?C.bl:C.ca,border:'none',color:appMode==='department'?'#fff':C.mu,cursor:'pointer',letterSpacing:1,transition:'all .15s',whiteSpace:'nowrap'}}>🏢 {isCompact?'DEPT':'DEPARTMENT'}</button>
          </div>
          <div style={{display:'flex',gap:4,marginLeft:'auto',flexWrap:'wrap'}}>
            <div style={{display:'flex',gap:0,alignItems:'center'}}>
              <button onClick={()=>adjFont(-0.1)} title="Smaller text" style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 7px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:'6px 0 0 6px',color:C.mu,cursor:'pointer',whiteSpace:'nowrap'}}>A−</button>
              <button onClick={()=>adjFont(0.1)}  title="Larger text"  style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 7px',background:C.ca,border:`1px solid ${C.bo}`,borderLeft:'none',borderRadius:'0 6px 6px 0',color:C.tx,cursor:'pointer',whiteSpace:'nowrap',fontWeight:'bold'}}>A+</button>
            </div>
            <button onClick={()=>setShowRest(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:'#1a1000',border:`1px solid ${C.or}`,borderRadius:6,color:C.or,cursor:'pointer',whiteSpace:'nowrap'}}>↑ {isCompact?'':' '}RESTORE</button>
            <button onClick={e=>{flash(e);saveSession();}} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:savedFlash?'#0d2010':C.ca,border:`1px solid ${savedFlash?C.gr:C.bo}`,borderRadius:6,color:savedFlash?C.gr:C.tx,cursor:'pointer',whiteSpace:'nowrap',transition:'all .3s'}}>{savedFlash?'✓ SAVED':'💾 SAVE'}</button>
            <button onClick={()=>setShowTL(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>⏱ {isCompact?'':'TIMER LOG'}</button>
            <button onClick={()=>setShowHist(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>■ {isCompact?'HIST':'HISTORY'}</button>
            <button onClick={()=>setShowSync(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:'#001a1a',border:`1px solid ${gistSyncer.gistStatus==='ok'?C.gr:C.gr}`,borderRadius:6,color:C.gr,cursor:'pointer',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:5}}>
              {gistSyncer.gistToken&&<span style={{width:7,height:7,borderRadius:'50%',background:gistSyncer.gistStatus==='ok'?C.gr:gistSyncer.gistStatus==='error'?C.rd:C.mu,flexShrink:0}}/>}
              📱 {isCompact?'':'SYNC'}
            </button>
            <button onClick={()=>{const b=new Blob([exportJson],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`jesse-planner-session-${ds}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);}} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>↑ {isCompact?'EXP':'EXPORT'}</button>
          </div>
        </div>
      </div>

      {appMode==='training'
        ? <TrainingMode trainees={trainees} agents={agents} onUpdateAgent={updateAgent} onAddAgent={addAgent} onGraduateAgent={graduateAgent} onDeleteAgent={deleteAgent}/>
        : appMode==='department'
        ? <DepartmentMode agents={agents} onUpdateAgent={updateAgent} onAddAgent={addAgent} onDeactivateAgent={deactivateAgent} onReactivateAgent={reactivateAgent} onDeleteAgent={deleteAgent} onLoadSeed={loadSeedAgents}/>
        : <>
          <div style={{background:C.su,borderBottom:`1px solid ${C.bo}`,padding:'6px 12px',display:'flex',gap:4,flexWrap:'wrap'}}>
            {ALL_TABS.map(t=>{
              const info=tabInfo[t], active=tab===t;
              const isUtil = t==='notes';
              const isStats = t==='stats';
              return (
                <button key={t} onClick={e=>{flash(e);setTab(t);}} style={{
                  fontFamily:MO, fontSize:isCompact?11:12, padding:isCompact?'4px 8px':'5px 12px', borderRadius:20, cursor:'pointer',
                  border: active ? 'none' : `1px solid ${isUtil?C.bl+'66':isStats?C.pu+'66':C.bo}`,
                  background: active ? (isUtil?C.bl:isStats?C.pu:C.or) : C.ca,
                  color: active ? '#fff' : isUtil ? C.bl : isStats ? C.pu : C.tx,
                  transition:'all .15s', display:'flex', alignItems:'center', gap:4,
                  marginLeft: (!isMobile && isUtil) ? 'auto' : 0,
                  whiteSpace:'nowrap',
                }}>
                  <span>{info.icon}</span>
                  <span>{isMobile && isUtil ? '⚡' : info.label}</span>
                  {!isMobile&&!isUtil&&!isStats&&info.step&&<span style={{fontFamily:MO,fontSize:9,opacity:0.5}}>{info.step}</span>}
                </button>
              );
            })}
          </div>

          <div style={{padding:isMobile?'16px 12px':'24px 20px'}}>
            {tab==='collect'  && <CollectTab  tasks={tasks} dismissed={dismissed} lastSum={lastSum} deferred={deferred} onUpdateTasks={v=>upd('tasks',v)} onUpdateDismissed={v=>upd('dismissed',v)} onBack={goBack} onNext={goNext} onResetCarry={resetAndRepull}/>}
            {tab==='schedule' && <ScheduleTab timeBlocks={timeBlocks} tasks={tasks} done={done} timerLogs={timerLogs} deferred={deferred} onUpdateTime={v=>upd('time',v)} onBack={goBack} onNext={goNext} isCompact={isCompact}/>}
            {tab==='notes'    && <NotesTab    notes={allNotes} onUpdateNotes={handleUpdateAllNotes}/>}
            {tab==='progress' && <ProgressTab tasks={tasks} done={done} deferred={deferred} timeBlocks={timeBlocks} onUpdateDone={v=>upd('done',v)} onUpdateDeferred={v=>upd('deferred',v)} onBack={goBack} onNext={goNext} isMobile={isMobile}/>}
            {tab==='wrapup'   && <WrapUpTab   tasks={tasks} done={done} timeBlocks={timeBlocks} awayMs={awayMs} trainMs={trainMs} watchMs={watchMs} timerLogs={timerLogs} ds={ds} sums={sums} onSaveSummary={saveSummary} onBack={goBack} isMobile={isMobile} deferred={deferred}/>}
            {tab==='stats'    && <StatsTab    sums={sums} idx={idx} isMobile={isMobile}/>}
          </div>
        </>
      }

      {showHist && <HistoryModal sums={sums} idx={idx} onClose={()=>setShowHist(false)} onLoad={loadHistory} onDelete={deleteHistory} onImport={importHistory}/>}

      {showTL   && <TimerLogModal  logs={timerLogs} awayMs={awayMs} trainMs={trainMs} watchMs={watchMs} onSave={rows=>upd('timerLogs',rows)} onClose={()=>setShowTL(false)} onReset={timerReset}/>}
      {showRest && <RestoreModal   onRestore={restoreSession} onClose={()=>setShowRest(false)}/>}
      {showSync && <SyncModal today={ds} tasks={tasks} done={done} timeBlocks={timeBlocks} deferred={deferred} timerLogs={timerLogs} awayMs={awayMs+logAwayMs} trainMs={trainMs+logTrainMs} watchMs={watchMs+logWatchMs} notes={gd('notes')||[]} onMerge={mergeFromSync} onClose={()=>setShowSync(false)} isSendFirst={true} gistSyncer={gistSyncer}/>}
    </div>
  );
}

// ── Error Boundary ────────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{minHeight:'100vh',background:'#111318',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
        <div style={{background:'#1c1f2b',border:'1px solid #ef4444',borderRadius:10,padding:24,maxWidth:700,width:'100%'}}>
          <div style={{fontFamily:"'Courier New',monospace",fontSize:13,color:'#ef4444',marginBottom:8,letterSpacing:2}}>⚠ RENDER ERROR</div>
          <pre style={{fontFamily:"'Courier New',monospace",fontSize:11,color:'#dde1ee',whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{this.state.error.toString()}{'\n\n'}{this.state.error.stack}</pre>
        </div>
      </div>
    );
    return this.props.children;
  }
}

// ── Mount ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><DailyPlanner /></ErrorBoundary>);
</script>
</body>
</html>
