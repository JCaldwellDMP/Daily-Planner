                        <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:4}}>SUBJECT</div>
                        {editType==='queue'
                          ? <select value={editSubject} onChange={e=>setEditSubject(e.target.value)} style={{fontFamily:MO,fontSize:11,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'5px 7px',color:C.tx,outline:'none',width:'100%',boxSizing:'border-box',marginBottom:8}}>
                              {QUEUES.map(q=><option key={q.id} value={q.id}>{q.label}</option>)}
                            </select>
                          : <input value={editLabel} onChange={e=>setEditLabel(e.target.value)} placeholder="Training name..." style={{fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.pu+'88',borderRadius:5,padding:'6px 8px',color:C.tx,outline:'none',width:'100%',boxSizing:'border-box',marginBottom:8}}/>
                        }
                        {editType==='queue'&&(
                          <div style={{marginBottom:8}}>
                            <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:4}}>DISPLAY NAME</div>
                            <input value={editLabel} onChange={e=>setEditLabel(e.target.value)} placeholder="Training name..." style={{fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.pu+'88',borderRadius:5,padding:'6px 8px',color:C.tx,outline:'none',width:'100%',boxSizing:'border-box'}}/>
                          </div>
                        )}
                        <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:8,flexWrap:'wrap'}}>
                          <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>Planned date:</span>
                          <input
                            type="date"
                            value={editDate}
                            onChange={e=>setEditDate(e.target.value)}
                            style={{fontFamily:MO,fontSize:11,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'4px 6px',color:C.tx,outline:'none',colorScheme:'dark'}}
                          />
                          {editDate&&<button onClick={()=>setEditDate('')} style={{fontFamily:MO,fontSize:10,padding:'3px 7px',borderRadius:4,border:'1px solid '+C.bo,background:C.ca,color:C.mu,cursor:'pointer'}}>x Clear</button>}
                        </div>
                        <div style={{display:'flex',gap:6}}>
                          <OBtn onClick={()=>editTraining(rec)} style={{fontSize:11,padding:'4px 12px'}}>Save</OBtn>
                          <Btn onClick={()=>{setEditingRec(null);setEditLabel('');setEditDate('');setEditType('queue');setEditSubject('');}} style={{fontSize:11,padding:'4px 10px'}}>Cancel</Btn>
                        </div>
                      </div>
                    ) : (
                    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10,gap:8,flexWrap:'wrap'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',flex:1,minWidth:0}}>
                        <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.tx}}>{rec.subjectLabel}</span>
                        {rec.plannedStartDate&&<span style={{fontFamily:MO,fontSize:10,color:C.bl,borderLeft:'1px solid '+C.bo,paddingLeft:8}}>{(()=>{var d=new Date(rec.plannedStartDate+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});})()}</span>}
                        <button onClick={()=>updateRec(rec.id,{timeLogEnabled:!(rec.timeLogEnabled||false)})} style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:4,border:'1px solid '+((rec.timeLogEnabled)?C.te+'66':C.bo),background:(rec.timeLogEnabled)?C.te+'18':C.ca,color:(rec.timeLogEnabled)?C.te:C.mu,cursor:'pointer',flexShrink:0}}>⏱ {(rec.timeLogEnabled)?'Tracking':'Track Time'}</button>
                      </div>
                      <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0}}>
                        <span style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,border:'1px solid '+(rec.type==='queue'?C.bl+'44':C.pu+'44'),color:rec.type==='queue'?C.bl:C.pu,background:rec.type==='queue'?C.bl+'11':C.pu+'11'}}>{rec.type==='queue'?'Queue':'Other'}</span>
                        <button onClick={()=>{setEditingRec(rec.id);setEditLabel(rec.subjectLabel||'');setEditDate(rec.plannedStartDate||'');setEditType(rec.type==='queue'?'queue':'product');setEditSubject(rec.type==='queue'?rec.subject||QUEUES[0].id:rec.subject||'');}} style={{fontFamily:MO,fontSize:10,padding:'2px 6px',borderRadius:4,border:'1px solid '+C.pu+'44',background:C.pu+'11',color:C.pu,cursor:'pointer'}}>✎</button>
                        <button onClick={()=>{ if(window.confirm('Delete "'+rec.subjectLabel+'" training record for '+selectedAgent.name+'? This cannot be undone.')) onUpdateAgent({...selectedAgent,extTraining:(selectedAgent.extTraining||[]).filter(r=>r.id!==rec.id)}); }} style={{fontFamily:MO,fontSize:10,padding:'2px 6px',borderRadius:4,border:'1px solid '+C.rd+'44',background:'#1a0d0d',color:C.rd,cursor:'pointer'}}>🗑</button>
                      </div>
                    </div>
                    )}
                    {/* Steps */}
                    {rec.steps.map((step,si)=>(
                      <div key={step.id} style={{display:'flex',gap:8,alignItems:'flex-start',padding:'7px 0',borderBottom:si<rec.steps.length-1?'1px solid '+C.bo:'none'}}>
                        <input type="checkbox" checked={step.completed}
                          onChange={e=>updateStep(rec.id,step.id,{completed:e.target.checked,completedDate:e.target.checked?TODAY:null})}
                          style={{marginTop:3,flexShrink:0,accentColor:C.pu}}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                            <span style={{fontFamily:MO,fontSize:12,color:step.completed?C.mu:C.tx,textDecoration:step.completed?'line-through':'none'}}>{step.label}</span>
                            <span style={{fontFamily:MO,fontSize:8,padding:'1px 5px',borderRadius:3,color:stepTypeColor(step.type),border:`1px solid ${stepTypeColor(step.type)}44`}}>{step.type}</span>
                            {step.completed&&<input type="date" value={step.completedDate||''} onChange={e=>updateStep(rec.id,step.id,{completedDate:e.target.value})} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'1px 5px',color:C.mu,outline:'none',colorScheme:'dark'}}/>}
                          </div>
                          {step.type==='quiz'&&step.completed&&(
                            <div style={{display:'flex',gap:6,alignItems:'center',marginTop:4}}>
                              <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>Score:</span>
                              <input type="number" min={0} value={step.quizCorrect??''} onChange={e=>updateStep(rec.id,step.id,{quizCorrect:e.target.value===''?null:parseInt(e.target.value)})} placeholder="correct" style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 5px',color:C.tx,outline:'none',width:60}}/>
                              <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>/</span>
                              <input type="number" min={0} value={step.quizTotal??''} onChange={e=>updateStep(rec.id,step.id,{quizTotal:e.target.value===''?null:parseInt(e.target.value)})} placeholder="total" style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 5px',color:C.tx,outline:'none',width:60}}/>
                            </div>
                          )}
                          <textarea value={step.notes} rows={3} onChange={e=>updateStep(rec.id,step.id,{notes:e.target.value})} placeholder="Notes…" style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo+'88',borderRadius:4,color:C.mu,outline:'none',width:'100%',resize:'vertical',marginTop:4,padding:'4px 6px',boxSizing:'border-box'}}/>
                        </div>
                      </div>
                    ))}
                    {/* Time Log */}
                    {(rec.timeLogEnabled)&&(
                      <div style={{marginTop:12,borderTop:'1px solid '+C.bo,paddingTop:10}}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                          <span style={{fontFamily:MO,fontSize:9,color:C.te,letterSpacing:2}}>⏱ TIME LOG</span>
                          <button onClick={()=>{var ns={id:nid(),date:TODAY,start:'',end:''};updateRec(rec.id,{timeSessions:[...(rec.timeSessions||[]),ns]});}} style={{fontFamily:MO,fontSize:10,padding:'2px 8px',borderRadius:4,border:'1px solid '+C.te+'44',background:C.te+'11',color:C.te,cursor:'pointer'}}>+ Add Session</button>
                        </div>
                        {(rec.timeSessions||[]).map(function(sess){
                          var mins=calcSessionMins(sess.start,sess.end);
                          return (
                            <div key={sess.id} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
                              <input type="date" value={sess.date||''} onChange={function(e){var s=(rec.timeSessions||[]).map(function(x){return x.id!==sess.id?x:{...x,date:e.target.value};});updateRec(rec.id,{timeSessions:s});}} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 5px',color:C.tx,outline:'none',colorScheme:'dark',flexShrink:0}}/>
                              <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>Start</span>
                              <input type="time" value={sess.start||''} onChange={function(e){var s=(rec.timeSessions||[]).map(function(x){return x.id!==sess.id?x:{...x,start:e.target.value};});updateRec(rec.id,{timeSessions:s});}} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 5px',color:C.tx,outline:'none',colorScheme:'dark',flexShrink:0,width:90}}/>
                              <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>→</span>
                              <input type="time" value={sess.end||''} onChange={function(e){var s=(rec.timeSessions||[]).map(function(x){return x.id!==sess.id?x:{...x,end:e.target.value};});updateRec(rec.id,{timeSessions:s});}} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 5px',color:C.tx,outline:'none',colorScheme:'dark',flexShrink:0,width:90}}/>
                              {sess.start&&sess.end&&mins>0&&<span style={{fontFamily:MO,fontSize:10,color:C.te,flexShrink:0}}>({mins} min)</span>}
                              <button onClick={function(){var s=(rec.timeSessions||[]).filter(function(x){return x.id!==sess.id;});updateRec(rec.id,{timeSessions:s});}} style={{fontFamily:MO,fontSize:10,padding:'1px 6px',borderRadius:3,border:'1px solid '+C.rd+'44',background:'transparent',color:C.rd,cursor:'pointer',flexShrink:0}}>✕</button>
                            </div>
                          );
                        })}
                        {(()=>{var tot=totalSessionMins(rec.timeSessions||[]);var cnt=(rec.timeSessions||[]).length;return (tot>0)?<div style={{fontFamily:MO,fontSize:10,color:C.te,marginTop:4,paddingTop:5,borderTop:'1px solid '+C.bo+'55'}}>Total: {fmtMinutes(tot)} (across {cnt} session{cnt===1?'':'s'})</div>:null;})()}
                      </div>
                    )}
                    {/* Sign-off */}
                    <div style={{marginTop:10,display:'flex',justifyContent:'flex-end'}}>
                      <OBtn disabled={!allDone} onClick={()=>{setSignOffRec(rec);setSignOffAgent(selectedAgent);setSignOffDate(TODAY);}} style={{fontSize:11,padding:'4px 12px',background:allDone?C.gr:undefined}}>✓ Sign Off</OBtn>
                    </div>
                  </div>
                );
              })}

              {/* Completed section */}
              {completed.length>0&&(
                <div style={{marginTop:16}}>
                  <div onClick={()=>setShowCompletedFor(p=>({...p,[selectedAgent.id]:!p[selectedAgent.id]}))} style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',marginBottom:8,paddingTop:8,borderTop:'1px solid '+C.bo}}>
                    <span style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2}}>COMPLETED TRAINING ({completed.length})</span>
                    <span style={{fontFamily:MO,fontSize:11,color:C.mu}}>{showCompletedFor[selectedAgent.id]?'▲':'▼'}</span>
                  </div>
                  {showCompletedFor[selectedAgent.id]&&completed.map(rec=>{
                    const isEditing = !!editingCompleted[rec.id];
                    return (
                      <div key={rec.id} style={{background:isEditing?C.su:'transparent',border:`1px solid ${isEditing?C.bo:C.bo+'55'}`,borderRadius:8,padding:14,marginBottom:8,opacity:isEditing?1:0.65,transition:'all .2s'}}>
                        {/* Header row */}
                        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',justifyContent:'space-between'}}>
                          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                            <span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:isEditing?C.tx:C.mu}}>{rec.subjectLabel}</span>
                            <span style={{fontFamily:MO,fontSize:9,color:C.gr,border:'1px solid '+C.gr+'44',padding:'1px 6px',borderRadius:3}}>✓ Signed Off {rec.signedOffDate}</span>
                            {rec.queueActiveDate&&<span style={{fontFamily:MO,fontSize:9,color:C.bl}}>Queue active: {rec.queueActiveDate}</span>}
                            {(()=>{var tot=totalSessionMins(rec.timeSessions||[]);return tot>0?<span style={{fontFamily:MO,fontSize:9,color:C.te}}>⏱ {fmtMinutes(tot)}</span>:null;})()}
                          </div>
                          <Btn onClick={()=>setEditingCompleted(p=>({...p,[rec.id]:!p[rec.id]}))} style={{fontSize:10,padding:'2px 8px',flexShrink:0}}>{isEditing?'▲ Collapse':'✎ Edit'}</Btn>
                        </div>
                        {/* Expanded edit view */}
                        {isEditing&&(
                          <div style={{marginTop:12}}>
                            {rec.steps.map((step,si)=>(
                              <div key={step.id} style={{display:'flex',gap:8,alignItems:'flex-start',padding:'7px 0',borderBottom:si<rec.steps.length-1?'1px solid '+C.bo:'none'}}>
                                <input type="checkbox" checked={step.completed}
                                  onChange={e=>updateStep(rec.id,step.id,{completed:e.target.checked,completedDate:e.target.checked?TODAY:null})}
                                  style={{marginTop:3,flexShrink:0,accentColor:C.pu}}/>
                                <div style={{flex:1,minWidth:0}}>
                                  <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                                    <span style={{fontFamily:MO,fontSize:12,color:step.completed?C.mu:C.tx,textDecoration:step.completed?'line-through':'none'}}>{step.label}</span>
                                    <span style={{fontFamily:MO,fontSize:8,padding:'1px 5px',borderRadius:3,color:stepTypeColor(step.type),border:`1px solid ${stepTypeColor(step.type)}44`}}>{step.type}</span>
                                    {step.completed&&<input type="date" value={step.completedDate||''} onChange={e=>updateStep(rec.id,step.id,{completedDate:e.target.value})} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'1px 5px',color:C.mu,outline:'none',colorScheme:'dark'}}/>}
                                  </div>
                                  {step.type==='quiz'&&step.completed&&(
                                    <div style={{display:'flex',gap:6,alignItems:'center',marginTop:4}}>
                                      <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>Score:</span>
                                      <input type="number" min={0} value={step.quizCorrect??''} onChange={e=>updateStep(rec.id,step.id,{quizCorrect:e.target.value===''?null:parseInt(e.target.value)})} placeholder="correct" style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 5px',color:C.tx,outline:'none',width:60}}/>
                                      <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>/</span>
                                      <input type="number" min={0} value={step.quizTotal??''} onChange={e=>updateStep(rec.id,step.id,{quizTotal:e.target.value===''?null:parseInt(e.target.value)})} placeholder="total" style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 5px',color:C.tx,outline:'none',width:60}}/>
                                    </div>
                                  )}
                                  <textarea value={step.notes} rows={3} onChange={e=>updateStep(rec.id,step.id,{notes:e.target.value})} placeholder="Notes…" style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo+'88',borderRadius:4,color:C.mu,outline:'none',width:'100%',resize:'vertical',marginTop:4,padding:'4px 6px',boxSizing:'border-box'}}/>
                                </div>
                              </div>
                            ))}
                            <div style={{marginTop:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                              <div style={{display:'flex',alignItems:'center',gap:8}}>
                                <span style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1}}>SIGN-OFF DATE</span>
                                <input type="date" value={rec.signedOffDate||''} onChange={e=>onUpdateAgent({...selectedAgent,extTraining:(selectedAgent.extTraining||[]).map(r=>r.id!==rec.id?r:{...r,signedOffDate:e.target.value})})} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 6px',color:C.tx,outline:'none',colorScheme:'dark'}}/>
                              </div>
                              <Btn onClick={()=>undoSignOff(rec)} style={{fontSize:10,padding:'3px 10px',color:C.rd}}>↩ Undo Sign-Off</Btn>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })()}
      </div>

      {/* NEW TRAINING MODAL */}
      {showNewModal&&(
        <Modal onClose={()=>setShowNewModal(false)} width={480}>
          <div style={{padding:'16px 20px',borderBottom:'1px solid '+C.bo,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontFamily:MO,fontSize:15,fontWeight:'bold',color:C.tx}}>+ New Training</div>
            <Btn onClick={()=>setShowNewModal(false)} style={{padding:'4px 10px'}}>✕</Btn>
          </div>
          <div style={{padding:20}}>
            <div style={{marginBottom:12}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:5}}>SUBJECT</div>
              <select value={mSubject} onChange={e=>setMSubject(e.target.value)} style={{...inpS,width:'100%'}}>
                {QUEUES.map(q=><option key={q.id} value={q.id}>{q.label}</option>)}
                <option value="other">Other (Product / Topic)</option>
              </select>
            </div>
            {mSubject==='other'&&(
              <div style={{marginBottom:12}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:5}}>TOPIC NAME</div>
                <input value={mOtherText} onChange={e=>setMOtherText(e.target.value)} placeholder="e.g. 860 Module, After-Hours Protocol…" style={{...inpS,width:'100%',boxSizing:'border-box'}}/>
              </div>
            )}
            <div style={{marginBottom:12}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:5}}>TEMPLATE</div>
              <select value={mTemplate} onChange={e=>setMTemplate(e.target.value)} style={{...inpS,width:'100%'}}>
                {templates.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
              <div style={{marginTop:6,display:'flex',gap:4,flexWrap:'wrap'}}>
                {(templates.find(t=>t.id===mTemplate)?.steps||[]).map((s,i)=>(
                  <span key={i} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,color:stepTypeColor(s.type),border:`1px solid ${stepTypeColor(s.type)}44`}}>{s.label}</span>
                ))}
              </div>
            </div>
            <div style={{marginBottom:20}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:5}}>PLANNED START DATE <span style={{color:C.mu+'88'}}>(OPTIONAL)</span></div>
              <input type="date" value={mStartDate} onChange={e=>setMStartDate(e.target.value)} style={{...inpS,colorScheme:'dark'}}/>
              {mStartDate&&<div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:4}}>Creates a task on the Schedule tab for {mStartDate}.</div>}
            </div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <Btn onClick={()=>setShowNewModal(false)}>Cancel</Btn>
              <OBtn onClick={saveNewTraining} disabled={!mSubject||(mSubject==='other'&&!mOtherText.trim())}>Create</OBtn>
            </div>
          </div>
        </Modal>
      )}

      {/* SIGN-OFF MODAL */}
      {signOffRec&&(
        <Modal onClose={()=>{setSignOffRec(null);setSignOffAgent(null);}} width={420}>
          <div style={{padding:'16px 20px',borderBottom:'1px solid '+C.bo,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontFamily:MO,fontSize:15,fontWeight:'bold',color:C.tx}}>✓ Sign Off</div>
            <Btn onClick={()=>{setSignOffRec(null);setSignOffAgent(null);}} style={{padding:'4px 10px'}}>✕</Btn>
          </div>
          <div style={{padding:20}}>
            <div style={{fontFamily:MO,fontSize:13,color:C.tx,marginBottom:16}}>
              Sign off <strong>{signOffAgent?.name}</strong> on <strong>{signOffRec.subjectLabel}</strong>?
            </div>
            {signOffRec.type==='queue'&&(
              <div style={{marginBottom:20}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:5}}>QUEUE ACTIVE DATE</div>
                <input type="date" value={signOffDate} onChange={e=>setSignOffDate(e.target.value)} style={{fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'6px 8px',color:C.tx,outline:'none',colorScheme:'dark'}}/>
                <div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:4}}>The queue will be activated on this date on the agent record.</div>
              </div>
            )}
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <Btn onClick={()=>{setSignOffRec(null);setSignOffAgent(null);}}>Cancel</Btn>
              <OBtn onClick={confirmSignOff} style={{background:C.gr}}>✓ Confirm Sign Off</OBtn>
            </div>
          </div>
        </Modal>
      )}

      {/* TEMPLATE MANAGER MODAL */}
      {showTmplMgr&&(
        <Modal onClose={()=>{setShowTmplMgr(false);setTmplEdit(null);}} width={500}>
          <div style={{padding:'16px 20px',borderBottom:'1px solid '+C.bo,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontFamily:MO,fontSize:15,fontWeight:'bold',color:C.tx}}>⚙ Manage Templates</div>
            <Btn onClick={()=>{setShowTmplMgr(false);setTmplEdit(null);}} style={{padding:'4px 10px'}}>✕</Btn>
          </div>
          <div style={{padding:20,maxHeight:'70vh',overflowY:'auto'}}>
            {!tmplEdit&&(<>
              {templates.map((t,i)=>(
                <div key={t.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'10px 12px',marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:C.tx,marginBottom:4}}>{t.label}</div>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                      {t.steps.map((s,j)=><span key={j} style={{fontFamily:MO,fontSize:9,padding:'1px 5px',borderRadius:3,color:stepTypeColor(s.type),border:`1px solid ${stepTypeColor(s.type)}44`}}>{s.label}</span>)}
                    </div>
                  </div>
                  <div style={{display:'flex',gap:4,flexShrink:0}}>
                    <Btn onClick={()=>{ if(i>0){const a=[...templates];[a[i-1],a[i]]=[a[i],a[i-1]];updateTemplates(a);}}} disabled={i===0} style={{fontSize:10,padding:'2px 7px'}}>▲</Btn>
                    <Btn onClick={()=>{ if(i<templates.length-1){const a=[...templates];[a[i],a[i+1]]=[a[i+1],a[i]];updateTemplates(a);}}} disabled={i===templates.length-1} style={{fontSize:10,padding:'2px 7px'}}>▼</Btn>
                    <Btn onClick={()=>{setTmplEdit(t);setTmplLabelDraft(t.label);setTmplStepDraft(t.steps.map(s=>({...s})));}} style={{fontSize:10,padding:'2px 8px'}}>Edit</Btn>
                    <Btn onClick={()=>{ if(window.confirm(`Delete "${t.label}"?`)) updateTemplates(templates.filter(x=>x.id!==t.id)); }} style={{fontSize:10,padding:'2px 8px',color:C.rd}}>✕</Btn>
                  </div>
                </div>
              ))}
              <OBtn onClick={()=>{setTmplEdit({id:nid(),label:'',steps:[]});setTmplLabelDraft('');setTmplStepDraft([]);}} style={{fontSize:11,marginTop:4}}>+ New Template</OBtn>
            </>)}
            {tmplEdit&&(
              <div>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:5}}>TEMPLATE NAME</div>
                <input value={tmplLabelDraft} onChange={e=>setTmplLabelDraft(e.target.value)} placeholder="e.g. Two-Session Track" style={{fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'6px 8px',color:C.tx,outline:'none',width:'100%',boxSizing:'border-box',marginBottom:14}}/>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:6}}>STEPS</div>
                {tmplStepDraft.map((s,i)=>(
                  <div key={i} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
                    <input value={s.label} onChange={e=>{const a=[...tmplStepDraft];a[i]={...a[i],label:e.target.value};setTmplStepDraft(a);}} placeholder="Step name" style={{fontFamily:MO,fontSize:11,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'4px 6px',color:C.tx,outline:'none',flex:1}}/>
                    <select value={s.type} onChange={e=>{const a=[...tmplStepDraft];a[i]={...a[i],type:e.target.value};setTmplStepDraft(a);}} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'4px 6px',color:C.tx,outline:'none'}}>
                      {STEP_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
                    </select>
                    <Btn onClick={()=>setTmplStepDraft(tmplStepDraft.filter((_,j)=>j!==i))} style={{fontSize:10,padding:'2px 7px',color:C.rd}}>✕</Btn>
                  </div>
                ))}
                <Btn onClick={()=>setTmplStepDraft([...tmplStepDraft,{label:'',type:'session'}])} style={{fontSize:10,marginBottom:16}}>+ Add Step</Btn>
                <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                  <Btn onClick={()=>setTmplEdit(null)}>← Back</Btn>
                  <OBtn disabled={!tmplLabelDraft.trim()||tmplStepDraft.length===0||tmplStepDraft.some(s=>!s.label.trim())} onClick={()=>{
                    const saved={...tmplEdit,label:tmplLabelDraft.trim(),steps:tmplStepDraft};
                    const exists=templates.find(x=>x.id===saved.id);
                    updateTemplates(exists?templates.map(x=>x.id===saved.id?saved:x):[...templates,saved]);
                    setTmplEdit(null);
                  }}>Save Template</OBtn>
                </div>
              </div>
            )}
          </div>
        </Modal>
      )}

    </div>
  );
}

// ── NewHireTraining ───────────────────────────────────────────────────────────
function NewHireTraining({ trainees, agents, onUpdateAgent, onAddAgent, onGraduateAgent, onDeleteAgent }) {
  const [selectedId,setSelectedId]         = useState(null);
  const [selectedShowTraining,setSelectedShowTraining] = useState(false);
  const [showAdd,setShowAdd]         = useState(false);
  const [newName,setNewName]         = useState('');
  const [newStart,setNewStart]       = useState(new Date().toISOString().split('T')[0]);
  const [newSup,setNewSup]           = useState('');
  const [newDisc,setNewDisc]         = useState('');

  const selectedHire = trainees.find(h=>h.id===selectedId);

  const addHire = () => {
    if(!newName.trim()) return;
    if(trainees.length>=3){ alert('Maximum 3 active trainees supported.'); return; }
    const h={...initAgent(newName.trim(),newStart),supervisor:newSup.trim(),discProfile:newDisc.trim()};
    onAddAgent(h);
    setSelectedId(h.id); setShowAdd(false); setNewName(''); setNewSup(''); setNewDisc('');
  };

  const updateHire = hire => onUpdateAgent(sanitizeAgent(hire));

  const deleteHire = id => {
    if(!window.confirm('Delete this record and all data?')) return;
    onDeleteAgent(id);
    if(selectedId===id) setSelectedId(null);
  };

  return (
    <div>
      <div style={{fontFamily:MO,fontSize:11,color:C.pu,letterSpacing:2,marginBottom:4}}>NEW HIRE TRAINING TRACKER</div>

      <div style={{fontFamily:MO,fontSize:12,color:C.mu,marginBottom:16}}>Active Trainees: <span style={{color:C.pu,fontWeight:'bold'}}>{trainees.length}</span> / 3</div>

      {trainees.length===0&&(
        <div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:10,padding:'50px 20px',textAlign:'center'}}>
          <div style={{fontSize:36,marginBottom:12}}>👥</div>
          <div style={{fontFamily:MO,fontSize:13,color:C.mu}}>No active trainees. Add agents via Department Mode → Roster.</div>
        </div>
      )}

      {trainees.length>0&&(
        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
          {trainees.map(h=>(
            <div key={h.id} style={{position:'relative',flex:'1 1 190px',maxWidth:280}}>
              <HireCard hire={h} selected={selectedId===h.id} onSelect={id=>{setSelectedId(selectedId===id?null:id);setSelectedShowTraining(false);}} onSelectTraining={id=>{setSelectedId(id);setSelectedShowTraining(true);}}/>
              <button onClick={()=>deleteHire(h.id)} title="Delete record" style={{position:'absolute',top:6,right:6,background:C.ca,border:'1px solid '+C.bo,borderRadius:3,color:C.mu,cursor:'pointer',fontSize:10,padding:'1px 5px',lineHeight:1}}>✕</button>
            </div>
          ))}
        </div>
      )}

      {selectedHire&&<AgentDetail
        key={selectedHire.id}
        hire={selectedHire}
        onUpdate={updateHire}
        onGraduate={onGraduateAgent}
        peerHires={agents.filter(h=>h.id!==selectedHire.id)}
        forceTraining={true}
      />}
    </div>
  );
}

// ── TrainingOverview ──────────────────────────────────────────────────────────
function TrainingOverview({ trainees, agents, onSwitchTab }) {
  const TODAY = new Date().toISOString().split('T')[0];

  // ── New Hire helpers ───────────────────────────────────────────────────────
  const overallPct = hire => {
    const days  = Math.round((Object.values(hire.days).filter(d=>d.completed).length / 15) * 33.33);
    const mock  = Math.round((Math.min((hire.mockCalls||[]).length, hire.mockCallsGoal||15) / (hire.mockCallsGoal||15)) * 33.33);
    const buddy = Math.round((Math.min((hire.buddyCalls||[]).length, hire.buddyCallsGoal||25) / (hire.buddyCallsGoal||25)) * 33.33);
    return Math.min(100, days + mock + buddy);
  };

  const nextThing = hire => {
    const comp  = Object.values(hire.days).filter(d=>d.completed).length;
    if (comp < 15) {
      const outline = loadOutline();
      const next = outline[comp];
      if (!next) return null;
      return next.isReviewDay ? `Day ${next.day} — Review` : `Day ${next.day}`;
    }
    const mockGoal  = hire.mockCallsGoal||15;
    const buddyGoal = hire.buddyCallsGoal||25;
    if ((hire.mockCalls||[]).length < mockGoal)  return `Mock Calls (${(hire.mockCalls||[]).length}/${mockGoal})`;
    if ((hire.buddyCalls||[]).length < buddyGoal) return `Buddy Calls (${(hire.buddyCalls||[]).length}/${buddyGoal})`;
    if (!hire.trainingEval?.signedOff)            return 'Eval & Sign-Off';
    return null; // complete
  };

  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  const avgQuiz = hire => {
    const pcts = Object.values(hire.days).map(d => {
      const c = parseFloat(d.quizCorrect), t = parseFloat(d.quizTotal);
      return (!c && c !== 0) || !t || t === 0 ? null : Math.round((c/t)*100);
    }).filter(s => s != null);
    return pcts.length > 0 ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : null;
  };

  const activeHires  = trainees.filter(h => h.startDate <= TODAY);
  const futureHires  = trainees.filter(h => h.startDate >  TODAY);

  // ── Dept Training data ─────────────────────────────────────────────────────
  const TODAY_MS = new Date(TODAY).getTime();
  const STALL_DAYS = 7;

  const allActiveRecs = agents
    .filter(a => a.status==='active' && !a.specializedRole)
    .flatMap(a => (a.extTraining||[])
      .filter(r => !r.signedOff)
      .map(r => ({ agent:a, rec:r }))
    );

  const awaitingSignOff = allActiveRecs.filter(({rec}) =>
    rec.steps.length > 0 && rec.steps.every(s => s.completed)
  );

  const needsAttention = allActiveRecs
    .filter(({rec}) => !rec.steps.every(s => s.completed))
    .map(({agent, rec}) => {
      const nextStep = rec.steps.find(s => !s.completed);
      return nextStep && (nextStep.type==='homework' || nextStep.type==='quiz')
        ? { agent, rec, nextStep } : null;
    })
    .filter(Boolean);

  const stalled = allActiveRecs
    .filter(({rec}) => !rec.steps.every(s => s.completed))
    .map(({agent, rec}) => {
      const dates = rec.steps.filter(s=>s.completed&&s.completedDate).map(s=>s.completedDate);
      const lastDate = dates.length > 0 ? dates.sort().slice(-1)[0] : rec.createdDate;
      const daysSince = Math.round((TODAY_MS - new Date(lastDate).getTime()) / 86400000);
      return daysSince >= STALL_DAYS ? { agent, rec, daysSince } : null;
    })
    .filter(Boolean)
    .sort((a,b) => b.daysSince - a.daysSince);

  const upcoming7 = allActiveRecs
    .filter(({rec}) => rec.plannedStartDate)
    .map(({agent, rec}) => {
      const diff = Math.round((new Date(rec.plannedStartDate).getTime() - TODAY_MS) / 86400000);
      return diff >= 0 && diff <= 7 ? { agent, rec, diff } : null;
    })
    .filter(Boolean)
    .sort((a,b) => a.diff - b.diff);

  const recentSignOffs = agents
    .filter(a => a.status==='active' && !a.specializedRole)
    .flatMap(a => (a.extTraining||[])
      .filter(r => r.signedOff && r.signedOffDate)
      .map(r => {
        const diff = Math.round((TODAY_MS - new Date(r.signedOffDate).getTime()) / 86400000);
        return diff <= 7 ? { agent:a, rec:r, diff } : null;
      })
      .filter(Boolean)
    )
    .sort((a,b) => a.diff - b.diff);

  const typeBadge = (type) => (
    <span style={{fontFamily:MO,fontSize:9,padding:'1px 5px',borderRadius:3,
      color:type==='queue'?C.bl:C.pu,
      border:`1px solid ${type==='queue'?C.bl:C.pu}44`}}>
      {type==='queue'?'QUEUE':'PRODUCT'}
    </span>
  );

  const RecRow = ({agent, rec, meta}) => (
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',
      background:C.ca,borderRadius:5,marginBottom:5}}>
      <div style={{width:3,height:24,borderRadius:2,flexShrink:0,
        background:TEAM_COLORS[agent.team||'none']||C.mu}}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontFamily:MO,fontSize:11,color:C.tx,fontWeight:'bold'}}>{agent.name}</div>
        <div style={{fontFamily:MO,fontSize:10,color:C.mu}}>{rec.subjectLabel}</div>
      </div>
      {typeBadge(rec.type)}
      {meta && <div style={{fontFamily:MO,fontSize:10,color:meta.color,flexShrink:0}}>{meta.text}</div>}
    </div>
  );

  const secLabel = {fontFamily:MO,fontSize:9,color:C.pu,letterSpacing:2,marginBottom:10};
  const card     = {background:C.su,border:'1px solid '+C.bo,borderRadius:8,padding:14,marginBottom:10};
  const mu       = {fontFamily:MO,fontSize:10,color:C.mu};

  return (
    <div style={{display:'flex',gap:16,alignItems:'flex-start',flexWrap:'wrap'}}>

      {/* ── LEFT: New Hire Training ───────────────────────────────────────── */}
      <div style={{flex:'2 1 340px',minWidth:0}}>
        <div style={secLabel}>NEW HIRE TRAINING</div>

        {/* Summary chip */}
        <div style={{fontFamily:MO,fontSize:11,color:C.mu,marginBottom:12}}>
          Active trainees: <span style={{color:C.pu,fontWeight:'bold'}}>{activeHires.length}</span>
          <span style={{color:C.bo}}> / 3</span>
        </div>

        {/* Active hire cards */}
        {activeHires.length === 0 && (
          <div style={{...card,textAlign:'center',color:C.mu,fontSize:11,fontFamily:MO,padding:'30px 16px'}}>No active trainees.</div>
        )}
        {activeHires.map(hire => {
          const pct   = overallPct(hire);
          const next  = nextThing(hire);
          const quiz  = avgQuiz(hire);
          const done  = pct >= 100 && !next;
          const pctColor = done ? C.gr : pct >= 66 ? C.bl : pct >= 33 ? C.or : C.yl;
          const fqPct = (hire.finalQuizCorrect!=null&&hire.finalQuizTotal!=null&&hire.finalQuizTotal>0) ? Math.round((hire.finalQuizCorrect/hire.finalQuizTotal)*100) : null;
          const fqPeers = activeHires.filter(h=>h.id!==hire.id&&h.finalQuizCorrect!=null&&h.finalQuizTotal!=null&&h.finalQuizTotal>0).map(h=>Math.round((h.finalQuizCorrect/h.finalQuizTotal)*100));
          const fqAvg = fqPeers.length>0 ? Math.round(fqPeers.reduce((a,b)=>a+b,0)/fqPeers.length) : null;
          const fqBadge = (fqPct!=null&&fqAvg!=null) ? (fqPct-fqAvg>3?{label:'▲ Above Avg',color:C.gr}:fqPct-fqAvg<-3?{label:'▼ Below Avg',color:C.rd}:{label:'= Avg',color:C.yl}) : null;
          return (
            <div key={hire.id} style={card}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,gap:8}}>
                <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.tx}}>{hire.name}</div>
                <div style={{fontFamily:MO,fontSize:16,fontWeight:'bold',color:pctColor}}>{pct}%</div>
              </div>
              {/* Progress bar */}
              <div style={{height:4,background:C.bo,borderRadius:2,marginBottom:8}}>
                <div style={{height:'100%',width:`${pct}%`,background:pctColor,borderRadius:2,transition:'width .4s'}}/>
              </div>
              <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:(next||fqPct!=null)?8:0}}>
                {quiz != null && (
                  <span style={mu}>Avg Quiz <span style={{color:quiz>=90?C.gr:quiz>=75?C.yl:C.rd,fontWeight:'bold'}}>{quiz}%</span></span>
                )}
                {quiz == null && <span style={{...mu,fontStyle:'italic'}}>No quiz scores yet</span>}
                {fqPct!=null&&<span style={mu}>🏁 Final Quiz <span style={{color:fqPct>=90?C.gr:fqPct>=75?C.yl:C.rd,fontWeight:'bold'}}>{fqPct}%</span>{fqBadge&&<span style={{marginLeft:5,fontSize:9,color:fqBadge.color,border:'1px solid '+fqBadge.color+'44',borderRadius:3,padding:'1px 5px'}}>{fqBadge.label}</span>}</span>}
              </div>
              {done && <div style={{fontFamily:MO,fontSize:11,color:C.gr}}>✓ Training Complete</div>}
              {next && (
                <div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:4}}>
                  Next: <span style={{color:C.or,fontWeight:'bold'}}>{next}</span>
                </div>
              )}
            </div>
          );
        })}

        {/* Future hires */}
        {futureHires.length > 0 && (
          <>
            <div style={{...secLabel,marginTop:16,paddingTop:12,borderTop:'1px solid '+C.bo}}>UPCOMING</div>
            {futureHires.map(hire => {
              const diff = daysBetween(TODAY, hire.startDate);
              return (
                <div key={hire.id} style={{...card,borderColor:C.pu+'55',background:C.ca}}>
                  <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:C.tx,marginBottom:4}}>{hire.name}</div>
                  <div style={{fontFamily:MO,fontSize:10,color:C.mu}}>
                    Starts <span style={{color:C.tx}}>{hire.startDate}</span>
                    <span style={{marginLeft:10,color:diff===0?C.gr:C.pu,fontWeight:'bold'}}>
                      {diff === 0 ? '🎉 Starting today!' : `${diff} day${diff===1?'':'s'} away`}
                    </span>
                  </div>
                </div>
              );
            })}
          </>
        )}

        <div style={{marginTop:12}}>
          <button onClick={()=>onSwitchTab('new-hire')} style={{fontFamily:MO,fontSize:10,color:C.mu,background:'none',border:'none',cursor:'pointer',padding:0,textDecoration:'underline'}}>→ Go to New Hire Training</button>
        </div>
      </div>

      {/* ── RIGHT: Dept. Training ─────────────────────────────────────────── */}
      <div style={{flex:'1 1 260px',minWidth:0}}>
        <div style={secLabel}>DEPT. TRAINING</div>

        {/* Section 1 — Awaiting Sign-Off */}
        <div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:2,marginBottom:8}}>✓ AWAITING SIGN-OFF</div>
        {awaitingSignOff.length === 0
          ? <div style={{fontFamily:MO,fontSize:10,color:C.mu,fontStyle:'italic',marginBottom:14}}>No training awaiting sign-off.</div>
          : <div style={{marginBottom:14}}>{awaitingSignOff.map(({agent,rec},i)=><RecRow key={i} agent={agent} rec={rec}/>)}</div>
        }

        {/* Section 2 — Needs Attention */}
        <div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:2,marginBottom:8}}>⚠ NEEDS ATTENTION</div>
        {needsAttention.length === 0
          ? <div style={{fontFamily:MO,fontSize:10,color:C.mu,fontStyle:'italic',marginBottom:14}}>No attention needed.</div>
          : <div style={{marginBottom:14}}>{needsAttention.map(({agent,rec,nextStep},i)=>(
              <RecRow key={i} agent={agent} rec={rec} meta={{color:C.yl,text:nextStep.type==='homework'?'Homework pending':'Quiz pending'}}/>
            ))}</div>
        }

        {/* Section 3 — Stalled */}
        <div style={{fontFamily:MO,fontSize:9,color:C.or,letterSpacing:2,marginBottom:8}}>● STALLED</div>
        {stalled.length === 0
          ? <div style={{fontFamily:MO,fontSize:10,color:C.mu,fontStyle:'italic',marginBottom:14}}>No stalled training.</div>
          : <div style={{marginBottom:14}}>{stalled.map(({agent,rec,daysSince},i)=>(
              <RecRow key={i} agent={agent} rec={rec} meta={{color:C.or,text:`${daysSince} days`}}/>
            ))}</div>
        }

        {/* Section 4 — Upcoming 7 days */}
        <div style={{fontFamily:MO,fontSize:9,color:C.bl,letterSpacing:2,marginBottom:8}}>📅 UPCOMING — NEXT 7 DAYS</div>
        {upcoming7.length === 0
          ? <div style={{fontFamily:MO,fontSize:10,color:C.mu,fontStyle:'italic',marginBottom:14}}>No upcoming training this week.</div>
          : <div style={{marginBottom:14}}>{upcoming7.map(({agent,rec,diff},i)=>(
              <RecRow key={i} agent={agent} rec={rec} meta={{color:C.bl,text:diff===0?'today':`in ${diff} day${diff===1?'':'s'}`}}/>
            ))}</div>
        }

        {/* Section 5 — Signed off last 7 days */}
        <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:8}}>✓ TRAINED — LAST 7 DAYS</div>
        {recentSignOffs.length === 0
          ? <div style={{fontFamily:MO,fontSize:10,color:C.mu,fontStyle:'italic',marginBottom:14}}>No sign-offs in the last 7 days.</div>
          : <div style={{marginBottom:14}}>{recentSignOffs.map(({agent,rec,diff},i)=>(
              <RecRow key={i} agent={agent} rec={rec} meta={{color:C.mu,text:diff===0?'today':`${diff} day${diff===1?'':'s'} ago`}}/>
            ))}</div>
        }

        <div style={{marginTop:4}}>
          <button onClick={()=>onSwitchTab('dept-training')} style={{fontFamily:MO,fontSize:10,color:C.mu,background:'none',border:'none',cursor:'pointer',padding:0,textDecoration:'underline'}}>→ Go to Dept. Training</button>
        </div>
      </div>

    </div>
  );
}

  return (
    <div style={{padding:'24px 20px'}}>
      <div style={{display:'flex',gap:0,borderRadius:8,overflow:'hidden',border:'1px solid '+C.bo,marginBottom:20,width:'fit-content'}}>

          <button key={k} onClick={()=>switchTrainingTab(k)} style={{fontFamily:MO,fontSize:12,fontWeight:'bold',padding:'7px 18px',border:'none',borderLeft:k!=='overview'?'1px solid '+C.bo:'none',background:trainingTab===k?C.pu:C.ca,color:trainingTab===k?'#fff':C.mu,cursor:'pointer',transition:'all .15s'}}>{l}</button>
