  const toggleDayHasQuiz= n => { const c=hire.days[n]; onUpdate({...hire,days:{...hire.days,[n]:{...c,hasQuiz:!c.hasQuiz,quizSent:false,quizComplete:false,quizCorrect:null,quizTotal:null}}}); };
  const toggleQuizSent  = n => { const c=hire.days[n]; onUpdate({...hire,days:{...hire.days,[n]:{...c,quizSent:!c.quizSent}}}); };
  const toggleHw      = n => { const c=hire.days[n]; if(!c.hwComplete){setHwPrompt(n);setHwDateDraft(TODAY_T);}else onUpdate({...hire,days:{...hire.days,[n]:{...c,hwComplete:false,hwDate:null}}}); };
  const commitHw      = () => { const c=hire.days[hwPrompt]; onUpdate({...hire,days:{...hire.days,[hwPrompt]:{...c,hwComplete:true,hwDate:hwDateDraft||TODAY_T}}}); setHwPrompt(null); };
  const setHwDate     = (n,v) => { const c=hire.days[n]; onUpdate({...hire,days:{...hire.days,[n]:{...c,hwDate:v}}}); };
  const toggleDayQuiz = n => { const c=hire.days[n]; onUpdate({...hire,days:{...hire.days,[n]:{...c,quizComplete:!(c.quizComplete||false)}}}); };
  const setQuizField  = (n,f,v) => { const c=hire.days[n]; onUpdate({...hire,days:{...hire.days,[n]:{...c,[f]:v===''?null:parseFloat(v)||null}}}); };

  // Mock calls
  const saveGoal = () => { const n=parseInt(goalDraft); if(!isNaN(n)&&n>0) onUpdate({...hire,mockCallsGoal:n}); setEditGoal(false); };
  const openCall = () => { setCallDraft({date:TODAY_T,time:nowTime(),details:'',duration:'5-10',resolved:true,wintouchQuality:'good',overallPerformance:'good'}); setNewCallOpen(true); };
  const saveCall = () => { onUpdate({...hire,mockCalls:[...hire.mockCalls,{id:nid(),callNum:hire.mockCalls.length+1,...callDraft}]}); setNewCallOpen(false); };
  const importCall = () => {
    if(!importText.trim()){setImportError('Paste the email text first.');return;}
    const p=parseMockCallEmail(importText);
    if(!p.date&&!p.agentName){setImportError('Could not parse — make sure you pasted the full email text.');return;}
    const c={id:nid(),callNum:hire.mockCalls.length+1,date:p.date||new Date().toISOString().split('T')[0],
      time:p.time||'',details:p.details||'',duration:p.duration||'15-20',resolved:p.resolved,
      wintouchQuality:p.wintouchQuality||'good',overallPerformance:p.overallPerformance||'good',
      trainerName:p.trainerName,agentName:p.agentName,agentEmail:p.agentEmail,supervisorEmail:p.supervisorEmail,
      askedCompanyName:p.askedCompanyName,askedMyName:p.askedMyName,askedPanelType:p.askedPanelType,
      callDropped:p.callDropped,triedCallBack:p.triedCallBack,onHoldCount:p.onHoldCount,
      askedBeforeHold:p.askedBeforeHold,thankedForHolding:p.thankedForHolding,
      pulledPanelProgramming:p.pulledPanelProgramming,whatWentWell:p.whatWentWell,
      whatToImprove:p.whatToImprove,loggedWintouch:p.loggedWintouch,wintouchCaseNum:p.wintouchCaseNum,
      wintouchNotesFeedback:p.wintouchNotesFeedback,totalCallTime:p.totalCallTime,feedbackFromCall:p.feedbackFromCall};
    onUpdate({...hire,mockCalls:[...hire.mockCalls,c]});
    setImportText('');setImportError('');setShowImport(false);
  };

  // Buddy calls
  const saveBuddyGoal = () => { const n=parseInt(buddyGoalDraft); if(!isNaN(n)&&n>0) onUpdate({...hire,buddyCallsGoal:n}); setEditBuddyGoal(false); };
  const openBuddy  = () => { setBuddyDraft({date:TODAY_T,agentNotes:'',traineeNotes:''}); setNewBuddyOpen(true); };
  const saveBuddy  = () => { onUpdate({...hire,buddyCalls:[...buddyCalls,{id:nid(),...buddyDraft}]}); setNewBuddyOpen(false); };
  const deleteBuddy = id => onUpdate({...hire,buddyCalls:buddyCalls.filter(c=>c.id!==id)});
  const toggleBuddyCheck = k => onUpdate({...hire,buddyChecks:{...hire.buddyChecks,[k]:!hire.buddyChecks[k]}});
  const signOff = () => {
    if(!['etiquette','patience','troubleshooting','fielding'].every(k=>hire.buddyChecks[k]))return;
    const updated={...hire,buddyChecks:{...hire.buddyChecks,clearedDate:TODAY_T}};
    onUpdate(updated);
    if(onGraduate&&window.confirm('Training complete! Graduate this agent to Active status?')) onGraduate(hire.id);
  };

  // Notes
  const addNote = () => { if(!noteBody.trim())return; onUpdate({...hire,notes:[...hire.notes,{id:nid(),date:TODAY_T,tag:noteTag,body:noteBody.trim()}]}); setNoteBody(''); };
  const [shiftDraft,setShiftDraft]         = useState(hire.shift||'');
  const [teamDraft,setTeamDraft]           = useState(hire.team||'none');
  const [queuesDraft,setQueuesDraft]       = useState(hire.queues||{});
  const [addRolesDraft,setAddRolesDraft]   = useState(hire.additionalRoles||{});
  const [currentIssuesDraft,setCurrentIssuesDraft] = useState(hire.currentIssues||'');
  const [trainingNeedsDraft,setTrainingNeedsDraft] = useState(hire.trainingNeeds||'');
  const [trainingDraft,setTrainingDraft]   = useState(hire.status==='trainee');
  const [inactiveDraft,setInactiveDraft]   = useState(hire.status==='inactive');

  const commitProfile = () => {
    const base = {name:nameDraft.trim()||hire.name,discProfile:discDraft.trim(),supervisor:supDraft.trim(),startDate:startDraft,doingWell:wellDraft.trim(),areasOfImprovement:improveDraft.trim()};
    const newStatus = inactiveDraft ? 'inactive' : trainingDraft ? 'trainee' : 'active';
    const dept = (hire.status==='active'||hire.status==='trainee')?{shift:shiftDraft||null,team:supervisorColor(supDraft.trim()),queues:queuesDraft,additionalRoles:addRolesDraft,currentIssues:currentIssuesDraft.trim(),trainingNeeds:trainingNeedsDraft.trim()}:{};
    onUpdate({...hire,...base,...dept,status:newStatus});
    setEditProfile(false);
  };
  const saveFinalQuiz = () => { const c=parseFloat(fqCorrect),t=parseFloat(fqTotal); if(!isNaN(c)&&!isNaN(t)&&t>0&&c>=0) onUpdate({...hire,finalQuizCorrect:c,finalQuizTotal:t}); };

  const generateReport = () => {
    const L=[];
    const today=new Date().toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});

    // HEADER
    L.push('NEW HIRE PROGRESS REPORT\n========================');
    L.push(`Name: ${hire.name}${hire.supervisor?'\nSupervisor: '+hire.supervisor:''}${hire.discProfile?'\nDISC Profile: '+hire.discProfile:''}\nStart Date: ${fmtShortDate(hire.startDate)}\nCurrent Phase: ${phaseLabel(hire)}\nGenerated: ${today}`);

    // QUIZ PERFORMANCE
    const allPcts=Object.values(hire.days).map(d=>dayQuizPct(d)).filter(s=>s!=null);
    if(allPcts.length>0){
      const avg=Math.round(allPcts.reduce((a,b)=>a+b,0)/allPcts.length);
      const hiPct=Math.max(...allPcts); const loPct=Math.min(...allPcts);
      const hiDay=TRAINING_DAYS.find(td=>dayQuizPct(hire.days[td.day])===hiPct);
      const loDay=TRAINING_DAYS.find(td=>dayQuizPct(hire.days[td.day])===loPct);
      L.push(`\nQUIZ PERFORMANCE (per-day)\nAgent's Average Quiz Score: ${avg}%\nAgent's Highest Quiz Score: ${hiPct}%${hiDay?' (Day '+hiDay.day+' — '+hiDay.topics+')':''}\nAgent's Lowest Quiz Score:  ${loPct}%${loDay?' (Day '+loDay.day+' — '+loDay.topics+')':''}`);
    }

    // DOING WELL / AREAS OF IMPROVEMENT
    if(hire.doingWell)           L.push(`\nWhat the Agent is Doing Well\n${hire.doingWell}`);
    if(hire.areasOfImprovement)  L.push(`\nAreas of Improvement\n${hire.areasOfImprovement}`);

    // TRAINING DAYS COMPLETED (completed only)
    const completedDays=TRAINING_DAYS.filter(td=>hire.days[td.day]?.completed);
    L.push(`\nTraining Days Completed (${daysComp}/15 = ${daysPct}%)`);
    if(completedDays.length===0){ L.push('  No days completed yet.'); }
    else { completedDays.forEach(td=>{
      const d=hire.days[td.day]; const qpct=dayQuizPct(d);
      const badge=quizBadge(qpct,td.day);
      const badgeText=badge?` — ${badge.label.replace('\u25b2 ','').replace('\u25bc ','').replace('= ','')} Score`:'';
      const quizStr=qpct!=null?` | Quiz: ${qpct}% (${d.quizCorrect}/${d.quizTotal})${badgeText}`:'';
      L.push(`Day ${td.day}${quizStr}\n~ ${td.topics}\n`);
    }); }

    // HOMEWORK (completed only)
    const hwEn=TRAINING_DAYS.filter(td=>!td.review&&hire.days[td.day]?.hasHw!==false);
    const hwDone=hwEn.filter(td=>hire.days[td.day]?.hwComplete);
    L.push(`\nHomework (${hwDone.length}/${hwEn.length} Completed)`);
    if(hwDone.length===0){ L.push('  No homework submitted yet.'); }
    else { hwDone.forEach(td=>L.push(`Day ${td.day} Homework - Completed`)); }

    // NEXT TRAINING DAY
    const nextDay=TRAINING_DAYS.find(td=>!hire.days[td.day]?.completed);
    if(nextDay){ L.push(`\nNext Training Day\nDay ${nextDay.day}\n~ ${nextDay.topics}`); }

    return L.join('\n');
  };
  const generateReportHtml = () => {
    const today=new Date().toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});
    const mu='#444';const tx='#111';const gr='#166534';const rd='#991b1b';const yl='#713f12';
    const h=(tag,style,content)=>`<${tag} style="${style}">${content}</${tag}>`;
    const div=(s,c)=>h('div',s,c); const sp=(s,c)=>h('span',s,c); const p=(s,c)=>h('p',s,c);
    const base='font-family:Calibri,Arial,sans-serif;font-size:14px;color:'+tx+';';
    const rows=[];
    // HEADER
    rows.push(div('margin-bottom:16px;',
      h('h2','margin:0 0 4px;font-size:18px;color:#222;','NEW HIRE PROGRESS REPORT') +
      div('font-size:13px;color:'+mu+';line-height:1.8;',
        sp('','Name: ')+sp('font-weight:bold;color:'+tx+';',hire.name)+'<br/>'+
        (hire.supervisor?sp('','Supervisor: ')+sp('font-weight:bold;',hire.supervisor)+'<br/>':'')+
        (hire.discProfile?sp('','DISC Profile: ')+sp('font-weight:bold;',hire.discProfile)+'<br/>':'')+
        sp('','Start Date: ')+sp('font-weight:bold;',fmtShortDate(hire.startDate))+'<br/>'+
        sp('','Current Phase: ')+sp('font-weight:bold;',phaseLabel(hire))+'<br/>'+
        sp('','Generated: ')+sp('font-weight:bold;',today)
      )
    ));
    // QUIZ PERFORMANCE
    const allPcts=Object.values(hire.days).map(d=>dayQuizPct(d)).filter(s=>s!=null);
    if(allPcts.length>0){
      const avg=Math.round(allPcts.reduce((a,b)=>a+b,0)/allPcts.length);
      const hiPct=Math.max(...allPcts); const loPct=Math.min(...allPcts);
      const hiDay=TRAINING_DAYS.find(td=>dayQuizPct(hire.days[td.day])===hiPct);
      const loDay=TRAINING_DAYS.find(td=>dayQuizPct(hire.days[td.day])===loPct);
      rows.push(
        div('margin-bottom:16px;border-left:4px solid #3b82f6;padding-left:12px;',
          h('h3','margin:0 0 8px;font-size:15px;color:#1e40af;','📊 Quiz Performance (per-day)') +
          div('line-height:2;font-size:13px;',
            div('',''+sp('color:'+mu+';',"Agent's Average Quiz Score: ")+sp('font-weight:bold;font-size:15px;',avg+'%'))+
            div('',''+sp('color:'+mu+';',"Agent's Highest Quiz Score: ")+sp('font-weight:bold;color:'+gr+';font-size:15px;',hiPct+'%')+(hiDay?' '+sp('color:'+mu+';font-size:12px;','(Day '+hiDay.day+' — '+hiDay.topics+')'):''))+
            div('',''+sp('color:'+mu+';',"Agent's Lowest Quiz Score:  ")+sp('font-weight:bold;color:'+rd+';font-size:15px;',loPct+'%')+(loDay?' '+sp('color:'+mu+';font-size:12px;','(Day '+loDay.day+' — '+loDay.topics+')'):''))
          )
        )
      );
    }
    // DOING WELL / AREAS OF IMPROVEMENT
    if(hire.doingWell||hire.areasOfImprovement){
      const cols=[];
      if(hire.doingWell) cols.push(div('flex:1;min-width:200px;background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:10px;',h('div','font-weight:bold;color:'+gr+';margin-bottom:4px;','✅ What the Agent is Doing Well')+div('font-size:13px;color:'+tx+';white-space:pre-wrap;',hire.doingWell)));
      if(hire.areasOfImprovement) cols.push(div('flex:1;min-width:200px;background:#fefce8;border:1px solid #fde047;border-radius:6px;padding:10px;',h('div','font-weight:bold;color:'+yl+';margin-bottom:4px;','⚠️ Areas of Improvement')+div('font-size:13px;color:'+tx+';white-space:pre-wrap;',hire.areasOfImprovement)));
      rows.push(div('display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;',cols.join('')));
    }
    // TRAINING DAYS COMPLETED
    const completedDays=TRAINING_DAYS.filter(td=>hire.days[td.day]?.completed);
    rows.push(h('h3','margin:0 0 8px;font-size:15px;color:#222;',`📋 Training Days Completed (${daysComp}/15 = ${daysPct}%)`));
    if(completedDays.length===0){ rows.push(p('color:'+mu+';font-size:13px;','No days completed yet.')); }
    else {
      const dayRows=completedDays.map(td=>{
        const d=hire.days[td.day]; const qpct=dayQuizPct(d);
        const badge=quizBadge(qpct,td.day);
        const badgeCol=badge?{color:badge.label.includes('Above')?gr:badge.label.includes('Below')?rd:yl}:{color:mu};
        const badgeHtml=badge?sp('font-weight:bold;color:'+badgeCol.color+';font-size:12px;margin-left:8px;',badge.label.replace('▲ ','').replace('▼ ','').replace('= ','')+ ' Score'):'';
        const quizHtml=qpct!=null?sp('font-weight:bold;',` | Quiz: ${qpct}% (${d.quizCorrect}/${d.quizTotal})`)+badgeHtml:'';
        return div('margin-bottom:10px;padding:8px 10px;background:#f8f9fa;border-radius:4px;border-left:3px solid #cbd5e1;',
          div('font-size:14px;font-weight:bold;color:'+tx+';','Day '+td.day+quizHtml)+
          div('font-size:12px;color:'+mu+';margin-top:2px;','~ '+td.topics)
        );
      });
      rows.push(div('margin-bottom:16px;',dayRows.join('')));
    }
    // HOMEWORK
    const hwEn=TRAINING_DAYS.filter(td=>!td.review&&hire.days[td.day]?.hasHw!==false);
    const hwDone=hwEn.filter(td=>hire.days[td.day]?.hwComplete);
    rows.push(h('h3','margin:0 0 8px;font-size:15px;color:#222;',`📎 Homework (${hwDone.length}/${hwEn.length} Completed)`));
    if(hwDone.length===0){ rows.push(p('color:'+mu+';font-size:13px;','No homework submitted yet.')); }
    else { rows.push(div('margin-bottom:16px;',hwDone.map(td=>div('font-size:13px;color:'+gr+';line-height:1.8;','✅ Day '+td.day+' Homework — Completed')).join(''))); }
    // NEXT TRAINING DAY
    const nextDay=TRAINING_DAYS.find(td=>!hire.days[td.day]?.completed);
    if(nextDay){ rows.push(div('background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px;',h('div','font-weight:bold;color:#1e40af;margin-bottom:4px;','⏭️ Next Training Day')+div('font-size:14px;font-weight:bold;color:'+tx+';','Day '+nextDay.day)+div('font-size:12px;color:'+mu+';margin-top:2px;','~ '+nextDay.topics))); }
    return `<div style="${base}">${rows.join('')}</div>`;
  };
  const copyReport = () => {
    const html=generateReportHtml();
    const txt=generateReport();
    try {
      const blob=new Blob([html],{type:'text/html'});
      const txtBlob=new Blob([txt],{type:'text/plain'});
      navigator.clipboard.write([new ClipboardItem({'text/html':blob,'text/plain':txtBlob})]).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);}).catch(()=>{navigator.clipboard.writeText(txt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});});
    } catch(e) {
      navigator.clipboard.writeText(txt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);}).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);setCopied(true);setTimeout(()=>setCopied(false),2500);});
    }
  };

  // ── render ────────────────────────────────────────────────────────────────
  return (
    <div style={{background:C.su,border:`1px solid ${C.bo}`,borderRadius:10,marginTop:16,overflow:'hidden'}}>

      {/* HEADER */}
      <div style={{background:C.ca,padding:'12px 16px',borderBottom:'1px solid '+C.bo}}>
        {editProfile ? (
          <div>
            <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:8}}>EDIT PROFILE</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
              <input value={nameDraft} onChange={e=>setNameDraft(e.target.value)} placeholder="Full name" style={{...inpS,flex:'2 1 120px'}}/>
              <input type="date" value={startDraft} onChange={e=>setStartDraft(e.target.value)} style={{...inpS,flex:'1 1 110px',colorScheme:'dark'}}/>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
              <input value={supDraft} onChange={e=>setSupDraft(e.target.value)} placeholder="Supervisor name…" style={{...inpS,flex:'1 1 160px'}}/>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
              <span style={{fontFamily:MO,fontSize:11,color:C.mu,flexShrink:0}}>DISC:</span>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {['D','I','S','C','DI','IS','SC','CD'].map(v=>(
                  <button key={v} onClick={()=>setDiscDraft(discDraft===v?'':v)} style={{fontFamily:MO,fontSize:11,padding:'3px 9px',borderRadius:4,cursor:'pointer',border:`1px solid ${discDraft===v?C.pu:C.bo}`,background:discDraft===v?C.pu+'22':C.ca,color:discDraft===v?C.pu:C.mu}}>{v}</button>
                ))}
                <input value={discDraft} onChange={e=>setDiscDraft(e.target.value)} placeholder="Custom…" style={{...inpS,width:80,padding:'3px 8px',fontSize:11}}/>
              </div>
            </div>
            {!isSpecialized&&<div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
              <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:4}}>✅ DOING WELL</div><textarea value={wellDraft} onChange={e=>setWellDraft(e.target.value)} placeholder="What are they doing well…" rows={3} style={{...inpS,width:'100%',resize:'vertical',fontSize:11,lineHeight:1.5}}/></div>
              <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>⚠️ AREAS OF IMPROVEMENT</div><textarea value={improveDraft} onChange={e=>setImproveDraft(e.target.value)} placeholder="Areas that need improvement…" rows={3} style={{...inpS,width:'100%',resize:'vertical',fontSize:11,lineHeight:1.5}}/></div>
            </div>}
            {hire.status==='active'&&<div style={{borderTop:'1px solid '+C.bo,paddingTop:10,marginBottom:8}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.bl,letterSpacing:2,marginBottom:8}}>🏢 DEPARTMENT</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
                <div style={{flex:'1 1 140px'}}>
                  <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:3}}>SHIFT</div>
                  <input value={shiftDraft||''} onChange={e=>setShiftDraft(e.target.value)} placeholder="e.g. 8:00-4:30" style={{...inpS,width:'100%',fontSize:11}}/>
                </div>
              </div>
              {!isSpecialized&&<div style={{marginBottom:8}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:5}}>QUEUES</div>
                <div style={{display:'flex',flexDirection:'column',gap:5}}>
                  {QUEUES.map(q=>{
                    const active=queuesDraft?.[q.id]?.active??false;
                    const qdate=queuesDraft?.[q.id]?.date||'';
                    return (
                      <div key={q.id} style={{display:'flex',alignItems:'center',gap:8}}>
                        <button onClick={()=>setQueuesDraft(p=>({...p,[q.id]:{active:!active,date:!active?new Date().toISOString().split('T')[0]:p?.[q.id]?.date||null}}))} style={{fontFamily:MO,fontSize:10,padding:'3px 10px',borderRadius:4,cursor:'pointer',border:`1px solid ${active?C.bl:C.bo}`,background:active?C.bl+'22':C.ca,color:active?C.bl:C.mu,minWidth:130,textAlign:'left'}}>{active?'✓':' '} {q.label}</button>
                        {active&&<input type="date" value={qdate} onChange={e=>setQueuesDraft(p=>({...p,[q.id]:{...p[q.id],date:e.target.value}}))} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 6px',color:C.tx,outline:'none',colorScheme:'dark'}}/>}
                        {active&&qdate&&<span style={{fontFamily:MO,fontSize:9,color:C.mu}}>since {new Date(qdate+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'})}</span>}
                      </div>
                    );
                  })}
                  <div style={{display:'flex',gap:8,marginTop:4}}>
                    <button onClick={()=>setTrainingDraft(p=>!p)} style={{fontFamily:MO,fontSize:9,padding:'3px 7px',borderRadius:4,cursor:'pointer',border:`1px solid ${trainingDraft?C.pu:C.bo}`,background:trainingDraft?C.pu+'22':C.ca,color:trainingDraft?C.pu:C.mu}}>🎓 Training</button>
                    <button onClick={()=>setInactiveDraft(p=>!p)} style={{fontFamily:MO,fontSize:9,padding:'3px 7px',borderRadius:4,cursor:'pointer',border:`1px solid ${inactiveDraft?C.rd:C.bo}`,background:inactiveDraft?C.rd+'22':C.ca,color:inactiveDraft?C.rd:C.mu}}>💤 Inactive</button>
                  </div>
                </div>
              </div>}
              <div style={{marginBottom:8}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:5}}>ADDITIONAL ROLES</div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                  {ADDITIONAL_ROLES.map(r=>{
                    const on=addRolesDraft?.[r.id]??false;
                    return <button key={r.id} onClick={()=>setAddRolesDraft(p=>({...p,[r.id]:!on}))} style={{fontFamily:MO,fontSize:9,padding:'3px 7px',borderRadius:4,cursor:'pointer',border:`1px solid ${on?C.pu:C.bo}`,background:on?C.pu+'22':C.ca,color:on?C.pu:C.mu}}>{r.label}</button>;
                  })}
                </div>
              </div>
              {!isSpecialized&&<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.rd,letterSpacing:1,marginBottom:4}}>⚠️ CURRENT ISSUES</div><textarea value={currentIssuesDraft} onChange={e=>setCurrentIssuesDraft(e.target.value)} placeholder="Any active issues…" rows={2} style={{...inpS,width:'100%',resize:'vertical',fontSize:11,lineHeight:1.5}}/></div>
                <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>📚 TRAINING NEEDS</div><textarea value={trainingNeedsDraft} onChange={e=>setTrainingNeedsDraft(e.target.value)} placeholder="Skills to develop…" rows={2} style={{...inpS,width:'100%',resize:'vertical',fontSize:11,lineHeight:1.5}}/></div>
              </div>}
            </div>}
            <div style={{display:'flex',gap:8}}><OBtn onClick={commitProfile} style={{fontSize:11,padding:'5px 14px'}}>Save</OBtn><Btn onClick={()=>setEditProfile(false)} style={{fontSize:11}}>Cancel</Btn></div>
          </div>
        ) : (
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
            <div>
              <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:3}}>
                <div style={{fontFamily:MO,fontSize:15,fontWeight:'bold',color:C.tx}}>{hire.name}</div>
                {hire.discProfile&&<span style={{fontFamily:MO,fontSize:10,padding:'1px 7px',borderRadius:3,border:'1px solid '+C.pu+'55',color:C.pu,background:C.pu+'11'}}>DISC: {hire.discProfile}</span>}
                <span style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,border:`1px solid ${hire.status==='active'?C.gr:hire.status==='trainee'?C.yl:C.mu}44`,color:hire.status==='active'?C.gr:hire.status==='trainee'?C.yl:C.mu}}>{hire.status}</span>
              </div>
              <div style={{fontFamily:MO,fontSize:10,color:C.mu}}>Started {fmtShortDate(hire.startDate)}{hire.supervisor?' · Supervisor: '+hire.supervisor:''}{isTrainee?' · '+phaseLabel(hire):''}</div>
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <Btn onClick={()=>setEditProfile(true)} style={{fontSize:11,padding:'5px 10px'}}>✎ Profile</Btn>
              <button onClick={e=>{flash(e);copyReport();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copied?C.gr+'22':C.ca,border:`1px solid ${copied?C.gr:C.bo}`,borderRadius:6,color:copied?C.gr:C.tx,cursor:'pointer',transition:'all .3s'}}>{copied?'✓ COPIED':'📤 Copy Report'}</button>
            </div>
          </div>
        )}
      </div>

      {/* PROGRESS SNAPSHOT — hidden for non-trainees and in history view */}
      {(isTrainee&&!showTraining)&&<div style={{background:C.su,borderBottom:'1px solid '+C.bo,padding:'12px 16px'}}>
        <div style={{fontFamily:MO,fontSize:9,color:C.or,letterSpacing:2,marginBottom:10}}>📊 PROGRESS SNAPSHOT</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
          {[
            [`📋 Days`,`${daysComp}/15`,daysPct>=100?C.gr:C.or,`${daysPct}%`],
            [`📞 Calls`,`${hire.mockCalls.length}/${mockGoal}`,mockPct>=100?C.gr:C.or,`${mockPct}%`],
            [`🤝 Buddy`,`${buddyCalls.length}/${buddyGoal}`,buddyPct>=100?C.gr:C.bl,`${buddyPct}%`],
            [`📌 Notes`,`${hire.notes.length}`,'',''],
          ].map(([label,val,col,pct])=>(
            <div key={label} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',minWidth:80,flex:'1 1 80px'}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>{label}</div>
              <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:col||C.tx}}>{val}{pct&&<span style={{fontSize:10,color:col,marginLeft:4}}>{pct}</span>}</div>
            </div>
          ))}
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',minWidth:80,flex:'1 1 80px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>📝 Homework</div>
            <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:hwDoneCount===hwEnabledDays.length&&hwEnabledDays.length>0?C.gr:C.tx}}>{hwDoneCount}/{hwEnabledDays.length}</div>
          </div>
        </div>
        {(quizAvg!=null||finalQuizPct!=null)&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:(hire.doingWell||hire.areasOfImprovement)?10:0}}>
          {quizAvg!=null&&[['Avg Quiz',quizAvg],[' High',quizHigh],['Low',quizLow]].map(([label,val])=>(
            <div key={label} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',flex:'1 1 60px',minWidth:60}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>{label}</div>
              <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:val>=90?C.gr:val>=70?C.yl:C.rd}}>{val}%</div>
            </div>
          ))}
          {finalQuizPct!=null&&<div style={{background:C.ca,border:'1px solid '+C.or+'44',borderRadius:6,padding:'6px 10px',flex:'1 1 80px',minWidth:80}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.or,marginBottom:2}}>🏁 Final Quiz</div>
            <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:finalQuizPct>=90?C.gr:finalQuizPct>=75?C.yl:C.rd}}>{finalQuizPct}% <span style={{fontSize:10,color:C.mu}}>({hire.finalQuizCorrect}/{hire.finalQuizTotal})</span></div>
          </div>}
        </div>}
        {(hire.doingWell||hire.areasOfImprovement)&&<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {hire.doingWell&&<div style={{flex:'1 1 200px',background:C.gr+'0d',border:'1px solid '+C.gr+'33',borderRadius:6,padding:'8px 10px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:4}}>✅ DOING WELL</div>
            <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{hire.doingWell}</div>
          </div>}
          {hire.areasOfImprovement&&<div style={{flex:'1 1 200px',background:C.yl+'0d',border:'1px solid '+C.yl+'33',borderRadius:6,padding:'8px 10px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>⚠️ AREAS OF IMPROVEMENT</div>
            <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{hire.areasOfImprovement}</div>
          </div>}
        </div>}
      </div>}

      {/* DEPARTMENT FIELDS — visible when status === 'active', 'trainee', or 'inactive' */}
      {(hire.status==='active'||hire.status==='trainee'||hire.status==='inactive')&&(()=>{
        const teamColor = TEAM_COLORS[hire.team||'none']||C.mu;
        const activeQueues = QUEUES.filter(q=>hire.queues?.[q.id]?.active);
        const activeRoles  = ADDITIONAL_ROLES.filter(r=>hire.additionalRoles?.[r.id]);
        const shiftInfo    = SHIFTS.find(s=>s.id===hire.shift);
        return (
          <div style={{background:C.su,borderBottom:'1px solid '+C.bo,padding:'12px 16px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.bl,letterSpacing:2,marginBottom:10}}>🏢 DEPARTMENT INFO</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',flex:'1 1 100px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>SUPERVISOR</div>
                <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:teamColor}}>{hire.supervisor||'Unassigned'}</div>
              </div>
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',flex:'1 1 100px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>SHIFT</div>
                <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:shiftInfo?C.tx:C.mu}}>{shiftInfo?shiftInfo.label:'Not set'}</div>
              </div>
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',flex:'1 1 100px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:2}}>SEAT</div>
                <div style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:hire.seatId?C.tx:C.mu}}>{hire.seatId||'Unassigned'}</div>
              </div>
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'8px 12px',flex:'2 1 200px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:6}}>QUEUES ({activeQueues.length})</div>
                {activeQueues.length===0
                  ? <span style={{fontFamily:MO,fontSize:10,color:C.mu,display:'block',marginBottom:6}}>None active</span>
                  : <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:8}}>
                      {activeQueues.map(q=>{
                        const qdate=hire.queues?.[q.id]?.date;
                        return (
                          <div key={q.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <span style={{fontFamily:MO,fontSize:10,color:C.bl}}>✓ {q.label}</span>
                            {qdate&&<span style={{fontFamily:MO,fontSize:9,color:C.mu}}>since {new Date(qdate+'T12:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'})}</span>}
                          </div>
                        );
                      })}
                    </div>
                }
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  <button onClick={()=>onUpdate({...hire,status:hire.status==='trainee'?'active':'trainee'})} style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,cursor:'pointer',border:`1px solid ${hire.status==='trainee'?C.pu:C.bo}`,background:hire.status==='trainee'?C.pu+'22':C.ca,color:hire.status==='trainee'?C.pu:C.mu,transition:'all .15s'}}>🎓 Training</button>
                  <button onClick={()=>onUpdate({...hire,status:hire.status==='inactive'?'active':'inactive'})} style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,cursor:'pointer',border:`1px solid ${hire.status==='inactive'?C.rd:C.bo}`,background:hire.status==='inactive'?C.rd+'22':C.ca,color:hire.status==='inactive'?C.rd:C.mu,transition:'all .15s'}}>💤 Inactive</button>
                </div>
              </div>
            </div>
            {activeRoles.length>0&&<div style={{marginBottom:(hire.currentIssues||hire.trainingNeeds)?10:0}}>
              <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:4}}>ADDITIONAL ROLES</div>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {activeRoles.map(r=>(
                  <span key={r.id} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,background:C.pu+'22',border:'1px solid '+C.pu+'44',color:C.pu}}>{r.label}</span>
                ))}
              </div>
            </div>}
            {(hire.currentIssues||hire.trainingNeeds)&&<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {hire.currentIssues&&<div style={{flex:'1 1 200px',background:C.rd+'0d',border:'1px solid '+C.rd+'33',borderRadius:6,padding:'8px 10px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.rd,letterSpacing:1,marginBottom:4}}>⚠️ CURRENT ISSUES</div>
                <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{hire.currentIssues}</div>
              </div>}
              {hire.trainingNeeds&&<div style={{flex:'1 1 200px',background:C.yl+'0d',border:'1px solid '+C.yl+'33',borderRadius:6,padding:'8px 10px'}}>
                <div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>📚 TRAINING NEEDS</div>
                <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{hire.trainingNeeds}</div>
              </div>}
            </div>}
          </div>
        );
      })()}

      {/* DISC INTERACTION GUIDE */}
      {(()=>{
        const disc = (hire.discProfile||'').trim().toUpperCase();
        const mode = disc[0];
        if(!disc || !['D','I','S','C'].includes(mode)) return null;
        const modeLabel = {D:'D',I:'I',S:'S',C:'C'}[mode];
        const modeColor = {D:C.rd,I:C.or,S:C.gr,C:C.bl}[mode];
        const guides = {
          D:{
            strengths:'You both are outgoing and activity-driven. Both of you like to win. You may admire the strengths and achievements of this person.',
            struggles:'You may find the other person to be too controlling, while you are too permissive. You are more social, while the other person is more task-driven.',
            strategies:"Understand that a D-type person is direct and results-oriented. Be more direct, and get to the point with them. Do not be afraid of confrontation. Expect it, and do not take it personally. Work first, and THEN have fun.",
          },
          I:{
            strengths:'Both of you live enthusiastically and enjoy being with people. You both like to have fun and tend to forgive easily.',
            struggles:'Both of you tend to live emotionally and may compete for attention. Both of you are impulsive, and that can lead to challenges with following through with responsibilities and staying organized.',
            strategies:"Remember to listen to the other person, because he or she likes to talk as much as you do. When working on important tasks, keep each other accountable, and be clear about who is responsible for what. Give sincere recognition of this person's abilities, ideas and contributions.",
          },
          S:{
            strengths:'Both of you are people-oriented. You like to talk and the other person likes to listen. You tend to get along very well.',
            struggles:'Most struggles are related to pace. You like things fast-paced, exciting, spontaneous and with high energy. The other person likes things to be more calm, quiet and predictable.',
            strategies:'Slow down your approach. Tone down your enthusiasm. Be sincere with praise and appreciation. Do not embarrass this person in public. Allow this person time to warm up and open up to you.',
          },
          C:{
            strengths:'Your opposite strengths provide a good balance to each other\'s weaknesses. You can learn from the other person\'s analytical nature, and this person can learn not to take things so seriously and to have more fun.',
            struggles:'Your differences can lead to misunderstandings. You love to talk and be on the go, but the other person likes time alone. You are much more verbal, and it is easy for you to miss the other person\'s more indirect way of sharing concerns.',
            strategies:"Tone down your emotional reactions. Be more factual and objective, especially in the face of conflict. Do not rush or push this person. Be specific in your communication, and expect this person to speak literally and to take things literally.",
          },
        };
        const g = guides[mode];
        return (
          <div style={{borderBottom:'1px solid '+C.bo}}>
            <button onClick={()=>setShowDiscGuide(p=>!p)} style={{width:'100%',display:'flex',alignItems:'center',gap:8,padding:'8px 16px',background:'transparent',border:'none',cursor:'pointer',textAlign:'left'}}>
              <span style={{fontFamily:MO,fontSize:10,color:C.pu,letterSpacing:2}}>🧠 DISC INTERACTION GUIDE</span>
              <span style={{fontFamily:MO,fontSize:10,padding:'1px 7px',borderRadius:3,border:'1px solid '+modeColor+'55',color:modeColor,background:modeColor+'11'}}>Jesse I ↔ {hire.name.split(' ')[0]} {modeLabel}</span>
              <span style={{fontFamily:MO,fontSize:10,color:C.mu,marginLeft:'auto'}}>{showDiscGuide?'▲ hide':'▼ show'}</span>
            </button>
            {showDiscGuide&&<div style={{display:'flex',gap:0,padding:'0 12px 14px'}}>
              {[['💪 Strengths',g.strengths,C.gr],['⚡ Struggles',g.struggles,C.yl],['🎯 Strategies',g.strategies,C.or]].map(([label,text,col])=>(
                <div key={label} style={{flex:1,background:C.bg,border:'1px solid '+col+'33',borderRadius:7,padding:'10px 12px',margin:'0 4px'}}>
                  <div style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:col,letterSpacing:1,marginBottom:6}}>{label}</div>
                  <div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.6}}>{text}</div>
                </div>
              ))}
            </div>}
          </div>
        );
      })()}

      {/* SECTION TABS */}
      <div style={{display:'flex',gap:0,borderBottom:'1px solid '+C.bo,overflowX:'auto',alignItems:'center'}}>
        {(showTabs?[
          ['days',  `📋 Days ${daysComp}/15 · ${daysPct}%`],
          ['mocks', `📞 Calls ${hire.mockCalls.length}/${mockGoal} · ${mockPct}%`],
          ['buddy', `🤝 Buddy ${buddyCalls.length}/${buddyGoal} · ${buddyPct}%`],
          ['notes', '📌 Notes'],
        ]:[
          ['notes', '📌 Notes'],
        ]).map(([k,l])=>(
          <button key={k} onClick={()=>setSection(k)} style={{fontFamily:MO,fontSize:11,padding:'9px 16px',cursor:'pointer',border:'none',borderBottom:`2px solid ${section===k?C.or:'transparent'}`,background:'transparent',color:section===k?C.or:C.mu,transition:'all .15s',flex:1,whiteSpace:'nowrap'}}>{l}</button>
        ))}
        {!isTrainee&&<button onClick={()=>{setShowTraining(p=>!p);setSection(showTraining?'notes':'days');}} style={{fontFamily:MO,fontSize:10,padding:'6px 12px',marginLeft:'auto',marginRight:8,cursor:'pointer',border:`1px solid ${showTraining?C.pu:C.bo}`,borderRadius:5,background:showTraining?C.pu+'22':'transparent',color:showTraining?C.pu:C.mu,whiteSpace:'nowrap',flexShrink:0}}>{showTraining?'🎓 Hide Training':'🎓 Training History'}</button>}
      </div>

      <div style={{padding:16}}>

        {/* ── TRAINING DAYS ── */}
        {section==='days'&&<div>
          <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14}}>
            <span style={{fontFamily:MO,fontSize:11,color:C.tx,flexShrink:0}}>{daysComp}/15 days complete</span>
            <div style={{flex:1,height:5,background:C.bo,borderRadius:3}}><div style={{height:'100%',width:`${daysPct}%`,background:daysPct>=100?C.gr:C.or,borderRadius:3,transition:'width .4s'}}/></div>
            <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:daysPct>=100?C.gr:C.or,flexShrink:0}}>{daysPct}%</span>
          </div>

          {TRAINING_DAYS.map(td=>{
            const d=hire.days[td.day]||{}, isRev=td.review, qpct=dayQuizPct(d);
            const hasHw=d.hasHw!==false, hasQuiz=d.hasQuiz!==false;
            return (
              <div key={td.day} style={{background:isRev?'#1a1500':C.ca,border:`1px solid ${isRev?C.yl+'44':C.bo}`,borderRadius:7,padding:'10px 12px',marginBottom:6}}>
                {/* Day title row */}
                <div style={{display:'flex',gap:8,alignItems:'flex-start',flexWrap:'wrap'}}>
                  <button onClick={()=>toggleDay(td.day)} style={{flexShrink:0,width:18,height:18,borderRadius:3,border:`2px solid ${d.completed?C.gr:C.bo}`,background:d.completed?C.gr+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',marginTop:2}}>
                    {d.completed&&<span style={{fontSize:10,color:C.gr,lineHeight:1}}>✓</span>}
                  </button>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                      <span style={{fontFamily:MO,fontSize:11,fontWeight:'bold',color:isRev?C.yl:C.tx}}>Day {td.day}</span>
                      {isRev&&<span style={{fontFamily:MO,fontSize:8,color:C.yl,border:'1px solid '+C.yl+'44',padding:'1px 5px',borderRadius:3}}>REVIEW ★</span>}
                    </div>
                    <div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:3,lineHeight:1.4}}>{td.topics}</div>
                  </div>
                  <div style={{display:'flex',gap:4,flexShrink:0,alignItems:'center'}}>
                    {!isRev&&<button onClick={()=>toggleDayHasHw(td.day)} title={hasHw?'Disable homework for this day':'Enable homework for this day'} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,cursor:'pointer',border:`1px solid ${hasHw?C.gr+'66':C.bo}`,background:hasHw?C.gr+'11':C.ca,color:hasHw?C.gr:C.mu+'88',transition:'all .15s'}}>HW</button>}
                    <button onClick={()=>toggleDayHasQuiz(td.day)} title={hasQuiz?'Disable quiz for this day':'Enable quiz for this day'} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,cursor:'pointer',border:`1px solid ${hasQuiz?C.bl+'66':C.bo}`,background:hasQuiz?C.bl+'11':C.ca,color:hasQuiz?C.bl:C.mu+'88',transition:'all .15s'}}>QZ</button>
                    {d.completed&&<input type="date" value={d.completedDate||''} onChange={e=>setDayDate(td.day,e.target.value)} title="Completion date" style={{...inpS,fontSize:11,padding:'2px 6px',width:118,colorScheme:'dark'}}/>}
                  </div>
                </div>

                {(hasHw||hasQuiz)&&<div style={{marginTop:8,paddingTop:8,borderTop:'1px solid '+C.bo+'55',display:'flex',flexDirection:'column',gap:7}}>
                  {/* Homework */}
                  {hasHw&&!isRev&&(hwPrompt===td.day
                    ? <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                        <span style={{fontFamily:MO,fontSize:10,color:C.gr,flexShrink:0}}>📎 HW Date:</span>
                        <input autoFocus type="date" value={hwDateDraft} onChange={e=>setHwDateDraft(e.target.value)} style={{...inpS,padding:'3px 6px',fontSize:11,width:120,colorScheme:'dark',flexShrink:0}}/>
                        <OBtn onClick={commitHw} style={{fontSize:10,padding:'3px 10px',flexShrink:0}}>✓ Mark Done</OBtn>
                        <Btn onClick={()=>setHwPrompt(null)} style={{fontSize:10,padding:'3px 8px',flexShrink:0}}>✕</Btn>
                      </div>
                    : <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                        <button onClick={()=>toggleHw(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:`2px solid ${d.hwComplete?C.gr:C.bo}`,background:d.hwComplete?C.gr+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                          {d.hwComplete&&<span style={{fontSize:8,color:C.gr,lineHeight:1}}>✓</span>}
                        </button>
                        {d.hwComplete
                          ? <><span style={{fontFamily:MO,fontSize:10,color:C.gr,flex:1}}>📎 Day {td.day} HW — done</span><input type="date" value={d.hwDate||''} onChange={e=>setHwDate(td.day,e.target.value)} title="HW completed date" style={{...inpS,padding:'2px 6px',fontSize:10,width:112,colorScheme:'dark',flexShrink:0}}/></>
                          : <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Day {td.day} Homework</span>
                        }
                      </div>
                  )}

                  {/* Per-day quiz */}
                  {hasQuiz&&<div style={{display:'flex',gap:8,alignItems:'center',paddingLeft:4}}>
                    <button onClick={()=>toggleQuizSent(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:`2px solid ${d.quizSent?C.yl:C.bo}`,background:d.quizSent?C.yl+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {d.quizSent&&<span style={{fontSize:8,color:C.yl,lineHeight:1}}>✓</span>}
                    </button>
                    <span style={{fontFamily:MO,fontSize:10,color:d.quizSent?C.yl:C.mu}}>Day {td.day} Quiz Sent</span>
                  </div>}

                  {hasQuiz&&!td.finalQuiz&&<div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                    <button onClick={()=>toggleDayQuiz(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:`2px solid ${d.quizComplete?C.bl:C.bo}`,background:d.quizComplete?C.bl+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {d.quizComplete&&<span style={{fontSize:8,color:C.bl,lineHeight:1}}>✓</span>}
                    </button>
                    <span style={{fontFamily:MO,fontSize:10,color:d.quizComplete?C.bl:C.mu,flexShrink:0}}>Day {td.day} Quiz</span>
                    <input type="number" min={0} step={0.5} value={d.quizCorrect??''} onChange={e=>setQuizField(td.day,'quizCorrect',e.target.value)} placeholder="?" title="Correct" style={{...inpS,width:52,padding:'2px 6px',fontSize:11,flexShrink:0}}/>
                    <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>/</span>
                    <input type="number" min={1} step={0.5} value={d.quizTotal??''} onChange={e=>setQuizField(td.day,'quizTotal',e.target.value)} placeholder="?" title="Total" style={{...inpS,width:52,padding:'2px 6px',fontSize:11,flexShrink:0}}/>
                    {qpct!=null&&<span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:qpct>=90?C.gr:qpct>=70?C.yl:C.rd,flexShrink:0}}>= {qpct}%</span>}
                    {qpct!=null&&(()=>{const b=quizBadge(qpct,td.day);return b?<span style={{fontFamily:MO,fontSize:9,fontWeight:'bold',color:b.color,background:b.color+'22',border:'1px solid '+b.color+'55',borderRadius:4,padding:'1px 5px',flexShrink:0}}>{b.label}</span>:null;})()}
                  </div>}

                  {td.finalQuiz&&<div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4,paddingTop:4,borderTop:'1px solid '+C.bo}}>
                    <span style={{fontFamily:MO,fontSize:10,color:C.or,flexShrink:0}}>🏁 Final Quiz:</span>
                    <input type="number" min={0} step={0.5} value={fqCorrect} onChange={e=>setFqCorrect(e.target.value)} placeholder="?" title="Correct" style={{...inpS,width:52,padding:'3px 8px',fontSize:11}}/>
                    <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>/</span>
                    <input type="number" min={1} step={0.5} value={fqTotal} onChange={e=>setFqTotal(e.target.value)} placeholder="?" title="Total" style={{...inpS,width:52,padding:'3px 8px',fontSize:11}}/>
                    <OBtn onClick={saveFinalQuiz} style={{fontSize:10,padding:'3px 10px'}}>Save</OBtn>
                    {hire.finalQuizCorrect!=null&&hire.finalQuizTotal!=null&&(()=>{const fp=Math.round((hire.finalQuizCorrect/hire.finalQuizTotal)*100);const b=quizBadge(fp,15);return(<><span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:fp>=90?C.gr:fp>=75?C.yl:C.rd}}>{fp}% ({hire.finalQuizCorrect}/{hire.finalQuizTotal})</span>{b&&<span style={{fontFamily:MO,fontSize:9,fontWeight:'bold',color:b.color,background:b.color+'22',border:'1px solid '+b.color+'55',borderRadius:4,padding:'1px 5px',flexShrink:0}}>{b.label}</span>}</>);})()}
                  </div>}
                </div>}
              </div>
            );
          })}
        </div>}

        {/* ── MOCK CALLS ── */}
        {section==='mocks'&&<div>
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
              <span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:C.tx}}>Mock Calls</span>
              <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>(Days 16–20)</span>
              <div style={{display:'flex',gap:4,alignItems:'center',marginLeft:'auto'}}>
                <span style={{fontFamily:MO,fontSize:11,color:C.mu}}>Goal:</span>
                {editGoal
                  ? <><input autoFocus type="number" min={1} value={goalDraft} onChange={e=>setGoalDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveGoal();if(e.key==='Escape')setEditGoal(false);}} style={{...inpS,width:60,padding:'2px 6px',fontSize:11}}/><OBtn onClick={saveGoal} style={{fontSize:10,padding:'2px 8px'}}>✓</OBtn></>
                  : <button onClick={()=>{setGoalDraft(String(mockGoal));setEditGoal(true);}} style={{fontFamily:MO,fontSize:11,padding:'2px 10px',background:C.su,border:'1px solid '+C.bo,borderRadius:4,color:C.or,cursor:'pointer'}}>{mockGoal} ✎</button>
                }
              </div>
              <OBtn onClick={openCall} style={{fontSize:11,padding:'5px 12px',flexShrink:0}}>+ Log Call</OBtn>
              <button onClick={()=>{setShowImport(p=>!p);setImportError('');}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',borderRadius:6,cursor:'pointer',border:`1px solid ${showImport?C.pu:C.bo}`,background:showImport?C.pu+'22':C.ca,color:showImport?C.pu:C.mu,flexShrink:0}}>📥 Import</button>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <span style={{fontFamily:MO,fontSize:11,color:mockPct>=100?C.gr:C.or,flexShrink:0}}>{hire.mockCalls.length}/{mockGoal}</span>
              <div style={{flex:1,height:5,background:C.bo,borderRadius:3}}><div style={{height:'100%',width:`${mockPct}%`,background:mockPct>=100?C.gr:C.or,borderRadius:3,transition:'width .4s'}}/></div>
              <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:mockPct>=100?C.gr:C.or,flexShrink:0}}>{mockPct}%</span>
            </div>
          </div>
          {showImport&&(
            <div style={{background:C.ca,border:'1px solid '+C.pu,borderRadius:8,padding:14,marginBottom:14}}>
              <div style={{fontFamily:MO,fontSize:10,color:C.pu,letterSpacing:2,marginBottom:8}}>📥 IMPORT FROM EMAIL</div>
              <div style={{fontFamily:MO,fontSize:11,color:C.mu,marginBottom:8}}>Paste the full mock call email submission below. All available fields will be auto-filled.</div>
              <textarea value={importText} onChange={e=>{setImportText(e.target.value);setImportError('');}} rows={8} placeholder="Paste email text here…" style={{fontFamily:MO,fontSize:11,color:C.tx,background:C.su,border:`1px solid ${importError?C.rd:C.bo}`,borderRadius:6,padding:'8px 10px',width:'100%',resize:'vertical',outline:'none',boxSizing:'border-box',lineHeight:1.5,marginBottom:6}}/>
              {importError&&<div style={{fontFamily:MO,fontSize:11,color:C.rd,marginBottom:6}}>{importError}</div>}
              <div style={{display:'flex',gap:8}}>
                <OBtn onClick={importCall} style={{background:C.pu}}>📥 Parse & Import</OBtn>
                <Btn onClick={()=>{setShowImport(false);setImportText('');setImportError('');}}>Cancel</Btn>
              </div>
            </div>
          )}
          {newCallOpen&&(
            <div style={{background:C.ca,border:'1px solid '+C.or,borderRadius:8,padding:14,marginBottom:14}}>
              <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:10}}>NEW CALL LOG</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                <div><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:3}}>DATE</div><input type="date" value={callDraft.date||''} onChange={e=>setCallDraft(p=>({...p,date:e.target.value}))} style={{...inpS,width:'100%',colorScheme:'dark'}}/></div>
                <div><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:3}}>TIME</div><input type="time" value={callDraft.time||''} onChange={e=>setCallDraft(p=>({...p,time:e.target.value}))} style={{...inpS,width:'100%',colorScheme:'dark'}}/></div>
              </div>
              <div style={{marginBottom:8}}><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:3}}>CALL DETAILS / WINTOUCH NOTES</div><textarea value={callDraft.details||''} onChange={e=>setCallDraft(p=>({...p,details:e.target.value}))} rows={3} placeholder="Paste Wintouch notes or call details…" style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5}}/></div>
              <div style={{marginBottom:8}}><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:5}}>CALL DURATION</div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{['0-5','5-10','10-15','15-20','20-25','25-30','30+'].map(v=>(<button key={v} onClick={()=>setCallDraft(p=>({...p,duration:v}))} style={{fontFamily:MO,fontSize:10,padding:'3px 8px',borderRadius:4,cursor:'pointer',border:`1px solid ${(callDraft.duration||'5-10')===v?C.bl:C.bo}`,background:(callDraft.duration||'5-10')===v?C.bl+'22':C.ca,color:(callDraft.duration||'5-10')===v?C.bl:C.mu}}>{v} min</button>))}</div>
              </div>
              <div style={{marginBottom:8}}><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:5}}>DID THEY RESOLVE?</div>
                <div style={{display:'flex',gap:6}}>
                  <button onClick={()=>setCallDraft(p=>({...p,resolved:true}))} style={{fontFamily:MO,fontSize:11,padding:'4px 12px',borderRadius:4,cursor:'pointer',border:`1px solid ${callDraft.resolved!==false?C.gr:C.bo}`,background:callDraft.resolved!==false?C.gr+'22':C.ca,color:callDraft.resolved!==false?C.gr:C.mu}}>✅ Yes</button>
                  <button onClick={()=>setCallDraft(p=>({...p,resolved:false}))} style={{fontFamily:MO,fontSize:11,padding:'4px 12px',borderRadius:4,cursor:'pointer',border:`1px solid ${callDraft.resolved===false?C.rd:C.bo}`,background:callDraft.resolved===false?C.rd+'22':C.ca,color:callDraft.resolved===false?C.rd:C.mu}}>❌ No</button>
                </div>
              </div>
              <div style={{marginBottom:8}}><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:5}}>WINTOUCH NOTES QUALITY</div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{QUAL.map(([v,l,col])=>(<button key={v} onClick={()=>setCallDraft(p=>({...p,wintouchQuality:v}))} style={{fontFamily:MO,fontSize:10,padding:'3px 9px',borderRadius:4,cursor:'pointer',border:`1px solid ${(callDraft.wintouchQuality||'good')===v?col:C.bo}`,background:(callDraft.wintouchQuality||'good')===v?col+'22':C.ca,color:(callDraft.wintouchQuality||'good')===v?col:C.mu}}>{l}</button>))}</div>
              </div>
              <div style={{marginBottom:12}}><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:5}}>OVERALL PERFORMANCE</div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{QUAL.map(([v,l,col])=>(<button key={v} onClick={()=>setCallDraft(p=>({...p,overallPerformance:v}))} style={{fontFamily:MO,fontSize:10,padding:'3px 9px',borderRadius:4,cursor:'pointer',border:`1px solid ${(callDraft.overallPerformance||'good')===v?col:C.bo}`,background:(callDraft.overallPerformance||'good')===v?col+'22':C.ca,color:(callDraft.overallPerformance||'good')===v?col:C.mu}}>{l}</button>))}</div>
              </div>
              <div style={{display:'flex',gap:8}}><OBtn onClick={saveCall} style={{flex:1}}>💾 Save Call</OBtn><Btn onClick={()=>setNewCallOpen(false)}>Cancel</Btn></div>
            </div>
          )}
          {hire.mockCalls.length===0&&!newCallOpen&&<div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:8,padding:'30px 16px',textAlign:'center',fontFamily:MO,fontSize:12,color:C.mu}}>No calls logged yet.</div>}
          {[...hire.mockCalls].sort((a,b)=>a.callNum-b.callNum).map(call=>{
            const isExp=expandedCall===call.id;
            return (
              <div key={call.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:7,marginBottom:6,overflow:'hidden'}}>
                <div onClick={()=>setExpandedCall(isExp?null:call.id)} style={{display:'flex',gap:8,alignItems:'center',padding:'8px 12px',cursor:'pointer',flexWrap:'wrap'}}>
                  <span style={{fontFamily:MO,fontSize:11,fontWeight:'bold',color:C.or,flexShrink:0}}>#{call.callNum}</span>
                  <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>{fmtShortDate(call.date)} {call.time}</span>
                  <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>⏱ {call.duration} min</span>
                  <span style={{fontFamily:MO,fontSize:10,color:call.resolved!==false?C.gr:C.rd,flexShrink:0}}>{call.resolved!==false?'✅ Resolved':'❌ Unresolved'}</span>
                  <span style={{fontFamily:MO,fontSize:10,color:qualColor(call.overallPerformance),flex:1,textAlign:'right',whiteSpace:'nowrap'}}>{qualLabel(call.overallPerformance)}</span>
                  <button onClick={e=>{e.stopPropagation();onUpdate({...hire,mockCalls:hire.mockCalls.filter(c=>c.id!==call.id)});}} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11,flexShrink:0}}>✕</button>
                </div>
                {isExp&&<div style={{padding:'8px 12px 12px',borderTop:'1px solid '+C.bo}}>
                  {call.details&&<div style={{fontFamily:MO,fontSize:10,color:C.mu,lineHeight:1.5,whiteSpace:'pre-wrap',marginBottom:8,padding:'6px 8px',background:C.bg,borderRadius:4}}>{call.details}</div>}
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 12px',fontFamily:MO,fontSize:10,color:C.mu,marginBottom:8}}>
                    {call.agentName&&<span>Agent: <span style={{color:C.tx}}>{call.agentName}</span></span>}
                    {call.trainerName&&<span>Trainer: <span style={{color:C.tx}}>{call.trainerName}</span></span>}
                    {call.totalCallTime&&<span>Total Time: <span style={{color:C.tx}}>{call.totalCallTime}</span></span>}
                    {call.onHoldCount&&<span>Hold Count: <span style={{color:C.tx}}>{call.onHoldCount}</span></span>}
                    {call.askedCompanyName&&<span>Asked Company: <span style={{color:C.tx}}>{call.askedCompanyName}</span></span>}
                    {call.askedMyName&&<span>Asked Name: <span style={{color:C.tx}}>{call.askedMyName}</span></span>}
                    {call.askedPanelType&&<span>Asked Panel: <span style={{color:C.tx}}>{call.askedPanelType}</span></span>}
                    {call.callDropped&&<span>Call Dropped: <span style={{color:call.callDropped==='Yes'?C.rd:C.tx}}>{call.callDropped}</span></span>}
                    {call.pulledPanelProgramming&&<span>Pulled Programming: <span style={{color:C.tx}}>{call.pulledPanelProgramming}</span></span>}
                    {call.loggedWintouch&&<span>Wintouch Ticket: <span style={{color:C.tx}}>{call.loggedWintouch}</span></span>}
                    {call.wintouchCaseNum&&<span>Case#: <span style={{color:C.tx}}>{call.wintouchCaseNum}</span></span>}
                    {call.askedBeforeHold&&<span>Asked Before Hold: <span style={{color:C.tx}}>{call.askedBeforeHold}</span></span>}
                    {call.thankedForHolding&&<span>Thanked For Hold: <span style={{color:C.tx}}>{call.thankedForHolding}</span></span>}
                  </div>
                  <div style={{display:'flex',gap:12,flexWrap:'wrap',fontFamily:MO,fontSize:11,color:C.tx,marginBottom:call.whatWentWell||call.whatToImprove||call.feedbackFromCall||call.wintouchNotesFeedback?8:0}}>
                    <span>Wintouch: <span style={{color:qualColor(call.wintouchQuality)}}>{qualLabel(call.wintouchQuality)}</span></span>
                    <span>Overall: <span style={{color:qualColor(call.overallPerformance)}}>{qualLabel(call.overallPerformance)}</span></span>
                  </div>
                  {call.whatWentWell&&<div style={{marginBottom:6}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:2}}>WHAT WENT WELL</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.whatWentWell}</div></div>}
                  {call.whatToImprove&&<div style={{marginBottom:6}}><div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:2}}>WHAT TO IMPROVE</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.whatToImprove}</div></div>}
                  {call.wintouchNotesFeedback&&<div style={{marginBottom:6}}><div style={{fontFamily:MO,fontSize:9,color:C.bl,letterSpacing:1,marginBottom:2}}>WINTOUCH NOTES FEEDBACK</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.wintouchNotesFeedback}</div></div>}
                  {call.feedbackFromCall&&<div style={{marginBottom:0}}><div style={{fontFamily:MO,fontSize:9,color:C.or,letterSpacing:1,marginBottom:2}}>FEEDBACK FROM CALL</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.feedbackFromCall}</div></div>}
                </div>}
              </div>
            );
          })}
        </div>}

        {/* ── BUDDY CALLS ── */}
        {section==='buddy'&&<div>
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
              <span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:C.tx}}>Buddy Calls</span>
              <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>(Days 20–25)</span>
              <div style={{display:'flex',gap:4,alignItems:'center',marginLeft:'auto'}}>
                <span style={{fontFamily:MO,fontSize:11,color:C.mu}}>Goal:</span>
                {editBuddyGoal
                  ? <><input autoFocus type="number" min={1} value={buddyGoalDraft} onChange={e=>setBuddyGoalDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveBuddyGoal();if(e.key==='Escape')setEditBuddyGoal(false);}} style={{...inpS,width:60,padding:'2px 6px',fontSize:11}}/><OBtn onClick={saveBuddyGoal} style={{fontSize:10,padding:'2px 8px'}}>✓</OBtn></>
                  : <button onClick={()=>{setBuddyGoalDraft(String(buddyGoal));setEditBuddyGoal(true);}} style={{fontFamily:MO,fontSize:11,padding:'2px 10px',background:C.su,border:'1px solid '+C.bo,borderRadius:4,color:C.bl,cursor:'pointer'}}>{buddyGoal} ✎</button>
                }
              </div>
              <OBtn onClick={openBuddy} style={{fontSize:11,padding:'5px 12px',flexShrink:0}}>+ Log Call</OBtn>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <span style={{fontFamily:MO,fontSize:11,color:buddyPct>=100?C.gr:C.bl,flexShrink:0}}>{buddyCalls.length}/{buddyGoal}</span>
              <div style={{flex:1,height:5,background:C.bo,borderRadius:3}}><div style={{height:'100%',width:`${buddyPct}%`,background:buddyPct>=100?C.gr:C.bl,borderRadius:3,transition:'width .4s'}}/></div>
              <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:buddyPct>=100?C.gr:C.bl,flexShrink:0}}>{buddyPct}%</span>
            </div>
          </div>
          {newBuddyOpen&&<div style={{background:C.ca,border:'1px solid '+C.bl,borderRadius:8,padding:14,marginBottom:14}}>
            <div style={{fontFamily:MO,fontSize:10,color:C.bl,letterSpacing:2,marginBottom:10}}>LOG BUDDY CALL</div>
            <div style={{marginBottom:8}}><div style={{fontFamily:MO,fontSize:9,color:C.mu,marginBottom:3}}>DATE</div><input type="date" value={buddyDraft.date||''} onChange={e=>setBuddyDraft(p=>({...p,date:e.target.value}))} style={{...inpS,colorScheme:'dark'}}/></div>
            <div style={{marginBottom:8}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:3}}>AGENT NOTES (your observations)</div><textarea value={buddyDraft.agentNotes||''} onChange={e=>setBuddyDraft(p=>({...p,agentNotes:e.target.value}))} rows={3} placeholder="Your notes from sitting with them…" style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5}}/></div>
            <div style={{marginBottom:12}}><div style={{fontFamily:MO,fontSize:9,color:C.pu,letterSpacing:1,marginBottom:3}}>TRAINEE NOTES (their self-reflection)</div><textarea value={buddyDraft.traineeNotes||''} onChange={e=>setBuddyDraft(p=>({...p,traineeNotes:e.target.value}))} rows={3} placeholder="Trainee's own notes or reflections…" style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5}}/></div>
            <div style={{display:'flex',gap:8}}><OBtn onClick={saveBuddy} style={{flex:1}}>💾 Save</OBtn><Btn onClick={()=>setNewBuddyOpen(false)}>Cancel</Btn></div>
          </div>}
          {buddyCalls.length===0&&!newBuddyOpen&&<div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:8,padding:'20px 16px',textAlign:'center',fontFamily:MO,fontSize:12,color:C.mu,marginBottom:14}}>No buddy calls logged yet.</div>}
          {buddyCalls.map((call,i)=>{
            const isExp=expandedBuddy===call.id;
            return (
              <div key={call.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:7,marginBottom:6,overflow:'hidden'}}>
                <div onClick={()=>setExpandedBuddy(isExp?null:call.id)} style={{display:'flex',gap:8,alignItems:'center',padding:'8px 12px',cursor:'pointer',flexWrap:'wrap'}}>
                  <span style={{fontFamily:MO,fontSize:11,fontWeight:'bold',color:C.bl,flexShrink:0}}>#{i+1}</span>
                  <span style={{fontFamily:MO,fontSize:10,color:C.mu,flex:1}}>{fmtShortDate(call.date)}</span>
                  {call.agentNotes&&<span style={{fontFamily:MO,fontSize:9,color:C.gr,border:'1px solid '+C.gr+'44',padding:'1px 5px',borderRadius:3,flexShrink:0}}>agent ✓</span>}
                  {call.traineeNotes&&<span style={{fontFamily:MO,fontSize:9,color:C.pu,border:'1px solid '+C.pu+'44',padding:'1px 5px',borderRadius:3,flexShrink:0}}>trainee ✓</span>}
                  <button onClick={e=>{e.stopPropagation();deleteBuddy(call.id);}} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11,flexShrink:0}}>✕</button>
                </div>
                {isExp&&<div style={{padding:'10px 12px 12px',borderTop:'1px solid '+C.bo}}>
                  {call.agentNotes&&<div style={{marginBottom:call.traineeNotes?10:0}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:4}}>AGENT NOTES</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.agentNotes}</div></div>}
                  {call.traineeNotes&&<div><div style={{fontFamily:MO,fontSize:9,color:C.pu,letterSpacing:1,marginBottom:4}}>TRAINEE NOTES</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.traineeNotes}</div></div>}
                  {!call.agentNotes&&!call.traineeNotes&&<div style={{fontFamily:MO,fontSize:11,color:C.mu}}>No notes recorded.</div>}
                </div>}
              </div>
            );
          })}
          <div style={{background:C.su,border:'1px solid '+C.bo,borderRadius:8,padding:12,marginTop:6}}>
            <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:8}}>PROFICIENCY SIGN-OFF</div>
            <div style={{fontFamily:MO,fontSize:11,color:C.mu,marginBottom:10}}>All items must be checked before sign-off.</div>
            {[['etiquette','Good call etiquette'],['patience','Patient with customers'],['troubleshooting','Follows troubleshooting steps'],['fielding','Able to field varied call types']].map(([k,label])=>(
              <div key={k} onClick={()=>!hire.buddyChecks.clearedDate&&toggleBuddyCheck(k)} style={{display:'flex',gap:10,alignItems:'center',background:hire.buddyChecks[k]?C.gr+'0d':C.ca,border:`1px solid ${hire.buddyChecks[k]?C.gr+'44':C.bo}`,borderRadius:7,padding:'10px 14px',marginBottom:8,cursor:hire.buddyChecks.clearedDate?'default':'pointer',transition:'all .15s'}}>
                <div style={{width:18,height:18,borderRadius:3,border:`2px solid ${hire.buddyChecks[k]?C.gr:C.bo}`,background:hire.buddyChecks[k]?C.gr+'22':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  {hire.buddyChecks[k]&&<span style={{fontSize:11,color:C.gr,lineHeight:1}}>✓</span>}
                </div>
                <span style={{fontFamily:MO,fontSize:12,color:hire.buddyChecks[k]?C.gr:C.tx}}>{label}</span>
              </div>
            ))}
            {hire.buddyChecks.clearedDate
              ? <div style={{fontFamily:MO,fontSize:13,color:C.gr,background:C.gr+'11',border:'1px solid '+C.gr+'44',borderRadius:8,padding:'14px 16px',textAlign:'center'}}>✅ CLEARED FOR SOLO — Signed off {fmtShortDate(hire.buddyChecks.clearedDate)}</div>
              : <button onClick={signOff} disabled={!['etiquette','patience','troubleshooting','fielding'].every(k=>hire.buddyChecks[k])} style={{width:'100%',fontFamily:MO,fontSize:13,fontWeight:'bold',padding:'12px',marginTop:4,border:'none',borderRadius:8,cursor:'pointer',background:C.gr,color:'#fff',opacity:['etiquette','patience','troubleshooting','fielding'].every(k=>hire.buddyChecks[k])?1:0.35,transition:'all .3s'}}>✅ CLEAR FOR SOLO — Sign Off</button>
            }
          </div>
        </div>}

        {/* ── NOTES ── */}
        {section==='notes'&&<div>
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:8}}>ADD SUPERVISOR NOTE</div>
            <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap'}}>
              {[['positive','👍 Positive',C.gr],['improvement','⚠️ Improvement',C.yl],['milestone','📌 Milestone',C.bl]].map(([k,l,col])=>(
                <button key={k} onClick={()=>setNoteTag(k)} style={{fontFamily:MO,fontSize:11,padding:'4px 10px',borderRadius:4,cursor:'pointer',border:`1px solid ${noteTag===k?col:C.bo}`,background:noteTag===k?col+'22':C.ca,color:noteTag===k?col:C.mu}}>{l}</button>
              ))}
            </div>
            <textarea value={noteBody} onChange={e=>setNoteBody(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))addNote();}} placeholder="Add a note… Ctrl+Enter to save" rows={3} style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5,marginBottom:8}}/>
            <div style={{display:'flex',justifyContent:'flex-end'}}><OBtn onClick={addNote} disabled={!noteBody.trim()}>+ Add Note</OBtn></div>
          </div>
          {hire.notes.length===0&&<div style={{fontFamily:MO,fontSize:12,color:C.mu,textAlign:'center',padding:'20px 0'}}>No notes yet.</div>}
          {[...hire.notes].sort((a,b)=>a.date.localeCompare(b.date)).map(n=>(
            <div key={n.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:7,padding:12,marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,gap:8}}>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,border:'1px solid '+tagCol(n.tag)+'55',color:tagCol(n.tag),background:tagCol(n.tag)+'11'}}>{tagIcon(n.tag)} {n.tag}</span>
                  <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>{fmtShortDate(n.date)}</span>
                </div>
                <button onClick={()=>onUpdate({...hire,notes:hire.notes.filter(x=>x.id!==n.id)})} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11}}>✕</button>
              </div>
              <div style={{fontFamily:MO,fontSize:12,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{n.body}</div>
            </div>
          ))}
        </div>}

      </div>
    </div>
  );
}
