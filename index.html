const MS_STATUS_OPTS  = ['not-started','in-progress','done'];
const MS_STATUS_LABEL = {'not-started':'Not Started','in-progress':'In Progress',done:'Done'};
const MS_STATUS_COLOR = {'not-started':C.mu,'in-progress':C.yl,done:C.gr};

function MilestoneRow({ milestone, projectTitle, onUpdate, onDelete, onSend, onMoveUp, onMoveDown, isFirst, isLast, otherMilestones, onMoveStep }) {
  const [expanded,    setExpanded]    = useState(false);
  const [editMode,    setEditMode]    = useState(false);
  const [titleDraft,  setTitleDraft]  = useState(milestone.title);
  const [dueDraft,    setDueDraft]    = useState(milestone.dueDate || '');
  const [addingStep,  setAddingStep]  = useState(false);
  const [stepInp,     setStepInp]     = useState('');
  const [showNotes,   setShowNotes]   = useState(false);
  const [notesVal,    setNotesVal]    = useState(milestone.notes || '');

  const commitNotes = () => { onUpdate({notes: notesVal}); };
  const hasNotes    = !!(milestone.notes && milestone.notes.trim());

  const saveEdit = () => {
    if (titleDraft.trim()) onUpdate({title: titleDraft.trim(), dueDate: dueDraft || null});
    setEditMode(false);
  };
  const cancelEdit = () => { setTitleDraft(milestone.title); setDueDraft(milestone.dueDate || ''); setEditMode(false); };

  // Checkbox done toggle: check → done, uncheck → in-progress
  const toggleDone = (e) => {
    e.stopPropagation();
    onUpdate({ done: !milestone.done, status: !milestone.done ? 'done' : 'in-progress' });
  };

  const steps = milestone.steps || [];
  const deleteStep = sid => onUpdate({ steps: steps.filter(s => s.id !== sid) });
  const moveStep = (sid, dir) => {
    var idx = steps.findIndex(s => s.id === sid);
    var j = idx + dir;
    if (idx < 0 || j < 0 || j >= steps.length) return;
    var next = steps.slice();
    var tmp = next[idx]; next[idx] = next[j]; next[j] = tmp;
    onUpdate({ steps: next });
  };
  const addStep = () => {
    if (!stepInp.trim()) return;
    onUpdate({ steps: [...steps, { id: nid(), text: stepInp.trim(), done: false, notes: '' }] });
    setStepInp(''); setAddingStep(false);
  };

  const isDone     = !!milestone.done;
  const effStatus  = isDone ? 'done' : (milestone.status || 'not-started');
  const col        = MS_STATUS_COLOR[effStatus] || C.mu;
  const stepsDone  = steps.filter(s => s.done).length;
  const stepsPct   = steps.length > 0 ? Math.round((stepsDone / steps.length) * 100) : 0;
  const stepsBarCol = stepsPct === 100 ? C.gr : stepsPct >= 50 ? C.te : C.mu;
  const arrowBtn   = (disabled) => ({ background:'transparent', border:'none', cursor:disabled?'default':'pointer', fontSize:11, padding:'0 2px', lineHeight:1, color:disabled?C.bo:C.mu, flexShrink:0 });

  const updateStep = (sid, changes) => {
    var newSteps = steps.map(function(s){ return s.id===sid ? {...s,...changes} : s; });
    var allDone = newSteps.length > 0 && newSteps.every(function(s){ return s.done; });
    if(allDone && !isDone) {
      onUpdate({ steps: newSteps, done: true, status: 'done' });
      setExpanded(false);
    } else {
      onUpdate({ steps: newSteps });
    }
  };

  return (
    <div style={{marginBottom:6,border:`1px solid ${C.bo}`,borderRadius:6,overflow:'hidden'}}>
      {/* Header */}
      <div style={{display:'flex',gap:5,alignItems:'center',padding:'7px 10px',background:C.ca,cursor:'pointer'}} onClick={()=>setExpanded(p=>!p)}>
        {/* Done checkbox */}
        <div onClick={toggleDone} style={{width:16,height:16,borderRadius:4,border:'2px solid '+(isDone?C.gr:C.bo),background:isDone?C.gr:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,cursor:'pointer'}}>
          {isDone && <span style={{color:'#111',fontSize:9,fontWeight:'bold',lineHeight:1}}>✓</span>}
        </div>
        <span style={{fontFamily:MO,fontSize:11,color:C.mu,flexShrink:0,userSelect:'none'}}>{expanded?'▼':'▶'}</span>
        <span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:isDone?C.mu:C.tx,flex:1,textDecoration:isDone?'line-through':'none',padding:'2px 0'}}>{milestone.title}</span>
        {milestone.dueDate && <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>{inputFmt(milestone.dueDate)}</span>}
        {/* Status dropdown */}
        <select value={effStatus} onClick={e=>e.stopPropagation()} onChange={e=>{e.stopPropagation();onUpdate({status:e.target.value,done:e.target.value==='done'});}}
          style={{fontFamily:MO,fontSize:10,color:col,background:C.ca,border:`1px solid ${col}44`,borderRadius:4,padding:'2px 5px',cursor:'pointer',outline:'none',flexShrink:0}}>
          {MS_STATUS_OPTS.map(s=><option key={s} value={s}>{MS_STATUS_LABEL[s]}</option>)}
        </select>
        {steps.length > 0 && <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
          <div style={{width:48,height:4,background:C.bo,borderRadius:2,overflow:'hidden'}}>
            <div style={{height:'100%',width:stepsPct+'%',background:stepsBarCol,borderRadius:2,transition:'width .3s'}}/>
          </div>
          <span style={{fontFamily:MO,fontSize:9,color:stepsBarCol,minWidth:24}}>{stepsDone}/{steps.length}</span>
        </div>}
        {/* Right controls: 📝 · ✏ · ▲ · ▼ · 📅 · 🗑 */}
        <button onClick={e=>{e.stopPropagation();setShowNotes(p=>!p);setExpanded(true);}} title="Notes"
          style={{background:'none',border:'none',cursor:'pointer',fontSize:11,padding:'0 2px',flexShrink:0,opacity:hasNotes?1:0.4,color:hasNotes?C.yl:C.mu}}>📝</button>
        <button onClick={e=>{e.stopPropagation();setTitleDraft(milestone.title);setDueDraft(milestone.dueDate||'');setEditMode(true);setExpanded(true);}} title="Edit milestone"
          style={{background:'transparent',border:'none',color:C.bl,cursor:'pointer',fontSize:12,padding:'0 2px',flexShrink:0}}>✏</button>
        <button onClick={e=>{e.stopPropagation();if(!isFirst&&onMoveUp)onMoveUp();}} disabled={!!isFirst} style={arrowBtn(!!isFirst)} title="Move up">▲</button>
        <button onClick={e=>{e.stopPropagation();if(!isLast&&onMoveDown)onMoveDown();}} disabled={!!isLast} style={arrowBtn(!!isLast)} title="Move down">▼</button>
        <div onClick={e=>e.stopPropagation()} style={{flexShrink:0}}>
          <SendToDatePicker itemId={milestone.id} label={`${projectTitle}: ${milestone.title}`} onSend={onSend}/>
        </div>
        <button onClick={e=>{e.stopPropagation();onDelete();}} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:12,padding:'0 2px',opacity:0.5,flexShrink:0}} title="Delete milestone">🗑</button>
      </div>
      {/* Expanded body */}
      {expanded && (
        <div style={{padding:'8px 10px',background:C.su,borderTop:`1px solid ${C.bo}`}}>
          {/* Inline edit form */}
          {editMode && (
            <div style={{background:C.ca,borderRadius:6,padding:'8px 10px',marginBottom:10,border:`1px solid ${C.bo}`}}>
              <input value={titleDraft} onChange={e=>setTitleDraft(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter')saveEdit();if(e.key==='Escape')cancelEdit();}}
                style={{fontFamily:MO,fontSize:12,color:C.tx,background:'transparent',border:'none',borderBottom:`1px solid ${C.te}`,outline:'none',width:'100%',padding:'2px 0',marginBottom:6}}/>
              <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
                <input type="date" value={dueDraft} onChange={e=>setDueDraft(e.target.value)}
                  style={{fontFamily:MO,fontSize:11,color:C.tx,background:C.su,border:`1px solid ${C.bo}`,borderRadius:4,padding:'3px 6px',outline:'none',flex:1}}/>
                <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>due date</span>
              </div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={saveEdit} style={{flex:1,fontFamily:MO,fontSize:11,padding:'5px 0',background:C.te+'22',border:`1px solid ${C.te}`,borderRadius:4,color:C.te,cursor:'pointer',fontWeight:'bold'}}>Save</button>
                <button onClick={cancelEdit} style={{fontFamily:MO,fontSize:11,padding:'5px 10px',background:'transparent',border:`1px solid ${C.bo}`,borderRadius:4,color:C.mu,cursor:'pointer'}}>Cancel</button>
              </div>
            </div>
          )}
          {/* Notes */}
          {showNotes && (
            <div style={{marginBottom:8}}>
              <textarea value={notesVal} onChange={e=>setNotesVal(e.target.value)} onBlur={commitNotes}
                placeholder="Milestone notes…" rows={3}
                style={{fontFamily:MO,fontSize:11,color:C.tx,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,padding:'5px 7px',outline:'none',width:'100%',resize:'vertical',boxSizing:'border-box',lineHeight:1.5}}/>
            </div>
          )}
          {steps.length === 0 && !addingStep && <div style={{fontFamily:MO,fontSize:10,color:C.mu,paddingBottom:4}}>No steps yet.</div>}
          {steps.map((s, si) => (
            <StepRow key={s.id} step={s} milestoneTitle={milestone.title} projectTitle={projectTitle}
              onToggle={()=>updateStep(s.id,{done:!s.done})}
              onEditText={text=>updateStep(s.id,{text})}
              onEditNotes={notes=>updateStep(s.id,{notes})}
              onSend={date=>onSend(date, s)}
              onDelete={()=>deleteStep(s.id)}
              onMoveUp={()=>moveStep(s.id,-1)}
              onMoveDown={()=>moveStep(s.id,1)}
              isFirst={si===0}
              isLast={si===steps.length-1}
              otherMilestones={otherMilestones||[]}
              onMove={toMsId=>{ if(onMoveStep) onMoveStep(s, toMsId); }}
            />
          ))}
          {addingStep
            ? <div style={{display:'flex',gap:6,alignItems:'center',marginTop:4}}>
                <input autoFocus placeholder="Step text…" value={stepInp} onChange={e=>setStepInp(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter')addStep();if(e.key==='Escape'){setAddingStep(false);setStepInp('');}}}
                  style={{fontFamily:MO,fontSize:11,color:C.tx,background:C.ca,border:`1px solid ${C.te}66`,borderRadius:4,padding:'3px 7px',outline:'none',flex:1}}/>
                <button onClick={addStep} disabled={!stepInp.trim()}
                  style={{fontFamily:MO,fontSize:10,padding:'3px 8px',background:C.te+'22',border:`1px solid ${C.te}`,borderRadius:4,color:C.te,cursor:stepInp.trim()?'pointer':'default'}}>✓</button>
                <button onClick={()=>{setAddingStep(false);setStepInp('');}}
                  style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11}}>✕</button>
              </div>
            : <button onClick={()=>setAddingStep(true)}
                style={{fontFamily:MO,fontSize:10,padding:'3px 10px',borderRadius:4,cursor:'pointer',border:`1px dashed ${C.bo}`,background:'transparent',color:C.mu,marginTop:4}}>＋ Add Step</button>
          }
        </div>
      )}
    </div>
  );
}

// ── DailyPlanner ──────────────────────────────────────────────────────────────
const STATUS_OPTS = ['active','on-hold','complete'];
const STATUS_LABEL = {active:'Active','on-hold':'On Hold',complete:'Complete'};
const STATUS_COLOR = {active:C.gr,'on-hold':C.yl,complete:C.mu};

function ProjectsTab({ projects, setProjects, setSd, isCompact }) {
  const [filter,    setFilter]    = useState('active');
  const [selectedId,setSelectedId]= useState(null);
  const [showNew,   setShowNew]   = useState(false);
  const [newTitle,  setNewTitle]  = useState('');
  const [newDesc,   setNewDesc]   = useState('');
  const [editingId,  setEditingId]  = useState(null);
  const [editTitle,  setEditTitle]  = useState('');
  const [editingDesc,setEditingDesc]= useState(false);
  const [editDesc,   setEditDesc]   = useState('');
  const [addingType, setAddingType] = useState(null); // 'milestone' | 'task' | null
  const [addInp,     setAddInp]     = useState('');
  const [addDue,     setAddDue]     = useState('');
  const [sortBy,     setSortBy]     = useState('created');

  const save = next => { setProjects(next); };

  const updateItems = (pid, newItems) =>
    save(projects.map(p => p.id===pid ? {...p, items: newItems} : p));

  const moveItem = (pid, idx, dir) => {
    save(projects.map(p => {
      if (p.id !== pid) return p;
      var items = (p.items || []).slice();
      var j = idx + dir;
      if (j < 0 || j >= items.length) return p;
      var tmp = items[idx]; items[idx] = items[j]; items[j] = tmp;
      return {...p, items};
    }));
  };

  const moveStepToMilestone = (pid, fromMsId, step, toMsId) => {
    save(projects.map(p => {
      if (p.id !== pid) return p;
      var items = (p.items || []).map(i => {
        if (i.id === fromMsId) return {...i, steps: (i.steps||[]).filter(s => s.id !== step.id)};
        if (i.id === toMsId)   return {...i, steps: [...(i.steps||[]), step]};
        return i;
      });
      return {...p, items};
    }));
  };

  const addItem = () => {
    if (!addInp.trim() || !selected) return;
    const items = selected.items || [];
    if (addingType === 'milestone') {
      items.push({ id:nid(), type:'milestone', title:addInp.trim(), dueDate:addDue||null, status:'not-started', steps:[] });
    } else {
      items.push({ id:nid(), type:'task', text:addInp.trim(), done:false });
    }
    updateItems(selected.id, [...items]);
    setAddInp(''); setAddDue(''); setAddingType(null);
  };

  const sendItemToDate = (date, projectId, taskText) => {
    if (!date || !taskText) return;
    const key = `tasks-${date}`;
    setSd(prev => {
      const existing = prev[key] || [];
      const newTask = { id:nid(), text:taskText, priority:'Medium', source:'project', carried:false };
      return { ...prev, [key]: [...existing, newTask] };
    });
  };

  const selected = projects.find(p => p.id===selectedId) || null;

  // Reset transient edit/add states when the selected project changes
  useEffect(() => {
    setEditingDesc(false); setEditDesc('');
    setAddingType(null);   setAddInp(''); setAddDue('');
    setEditingId(null);    setEditTitle('');
  }, [selectedId]);

  const createProject = () => {
    if (!newTitle.trim()) return;
    const p = { id:nid(), title:newTitle.trim(), description:newDesc.trim(), status:'active', created:new Date().toISOString(), items:[] };
    const next = [...projects, p];
    save(next); setSelectedId(p.id); setShowNew(false); setNewTitle(''); setNewDesc('');
  };
  const deleteProject = id => {
    if (!window.confirm('Delete this project and all its content?')) return;
    save(projects.filter(p=>p.id!==id));
    if (selectedId===id) setSelectedId(null);
  };
  const updateProject = (id, changes) => save(projects.map(p=>p.id===id?{...p,...changes}:p));

  const itemCount = p => {
    const ms = p.items.filter(i=>i.type==='milestone').length;
    const ts = p.items.filter(i=>i.type==='task').length;
    const parts = [];
    if(ms) parts.push(`${ms} milestone${ms!==1?'s':''}`);
    if(ts) parts.push(`${ts} task${ts!==1?'s':''}`);
    return parts.length ? parts.join(' · ') : 'No items yet';
  };
  const doneCount = p => {
    const milestonesDone = p.items.filter(i=>i.type==='milestone'&&i.status==='done').length;
    const tasksDone      = p.items.filter(i=>i.type==='task'&&i.done).length;
    const total          = p.items.length;
    const done           = milestonesDone + tasksDone;
    return total ? `${done}/${total}` : null;
  };

  const FILTER_PILLS = [['all','All'],['active','Active'],['on-hold','On Hold'],['complete','Complete']];
  const SORT_PILLS   = [['created','Created'],['alpha','A–Z'],['due','Due Date']];

  const earliestDue = p => {
    const dates = (p.items||[]).filter(i=>i.type==='milestone'&&i.dueDate).map(i=>i.dueDate);
    return dates.length ? dates.sort()[0] : null;
  };
  const sorted = [...projects.filter(p => filter==='all' || p.status===filter)].sort((a,b) => {
    if (sortBy==='alpha')   return a.title.localeCompare(b.title);
    if (sortBy==='created') return (b.created||'').localeCompare(a.created||'');
    if (sortBy==='due') {
      const da=earliestDue(a), db=earliestDue(b);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da.localeCompare(db);
    }
    return 0;
  });

  return (
    <div style={{display:'flex',gap:0,height:isCompact?'calc(100vh - 220px)':'calc(100vh - 200px)',fontFamily:MO}}>
      {/* ── Left panel ── */}
      <div style={{width:isCompact?220:280,flexShrink:0,borderRight:`1px solid ${C.bo}`,paddingRight:0,display:'flex',flexDirection:'column',gap:0,overflowY:'auto'}}>
        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0 0 10px',marginBottom:8,borderBottom:`1px solid ${C.bo}`}}>
          <span style={{fontSize:11,color:C.te,letterSpacing:2}}>PERSONAL PROJECTS</span>
          <button onClick={()=>{setShowNew(p=>!p);setNewTitle('');setNewDesc('');}} style={{fontFamily:MO,fontSize:11,padding:'3px 10px',borderRadius:4,cursor:'pointer',border:`1px solid ${C.te}66`,background:showNew?C.te+'22':C.ca,color:C.te}}>＋ New</button>
        </div>
        {/* New project inline form */}
        {showNew&&(
          <div style={{background:C.ca,border:`1px solid ${C.te}66`,borderRadius:6,padding:10,marginBottom:10}}>
            <input autoFocus placeholder="Project title (required)" value={newTitle} onChange={e=>setNewTitle(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter')createProject();if(e.key==='Escape'){setShowNew(false);setNewTitle('');setNewDesc('');}}}
              style={{width:'100%',boxSizing:'border-box',fontFamily:MO,fontSize:12,color:C.tx,background:'transparent',border:'none',borderBottom:`1px solid ${C.bo}`,outline:'none',padding:'4px 0',marginBottom:6}}/>
            <input placeholder="Description (optional)" value={newDesc} onChange={e=>setNewDesc(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter')createProject();if(e.key==='Escape'){setShowNew(false);setNewTitle('');setNewDesc('');}}}
              style={{width:'100%',boxSizing:'border-box',fontFamily:MO,fontSize:11,color:C.mu,background:'transparent',border:'none',borderBottom:`1px solid ${C.bo}`,outline:'none',padding:'4px 0',marginBottom:8}}/>
            <div style={{display:'flex',gap:6}}>
              <button onClick={createProject} disabled={!newTitle.trim()} style={{flex:1,fontFamily:MO,fontSize:11,padding:'4px 0',borderRadius:4,cursor:newTitle.trim()?'pointer':'default',border:`1px solid ${C.te}`,background:newTitle.trim()?C.te+'22':C.ca,color:newTitle.trim()?C.te:C.mu}}>✓ Create</button>
              <button onClick={()=>{setShowNew(false);setNewTitle('');setNewDesc('');}} style={{fontFamily:MO,fontSize:11,padding:'4px 8px',borderRadius:4,cursor:'pointer',border:`1px solid ${C.bo}`,background:'transparent',color:C.mu}}>✕</button>
            </div>
          </div>
        )}
        {/* Filter pills */}
        <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:6}}>
          {FILTER_PILLS.map(([k,l])=>(
            <button key={k} onClick={()=>setFilter(k)} style={{fontFamily:MO,fontSize:10,padding:'2px 8px',borderRadius:10,cursor:'pointer',border:`1px solid ${filter===k?C.te:C.bo}`,background:filter===k?C.te+'22':C.ca,color:filter===k?C.te:C.mu}}>{l}</button>
          ))}
        </div>
        {/* Sort pills */}
        <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:10,paddingBottom:8,borderBottom:`1px solid ${C.bo}`}}>
          <span style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,alignSelf:'center',marginRight:2}}>SORT</span>
          {SORT_PILLS.map(([k,l])=>(
            <button key={k} onClick={()=>setSortBy(k)} style={{fontFamily:MO,fontSize:10,padding:'2px 8px',borderRadius:10,cursor:'pointer',border:`1px solid ${sortBy===k?C.te:C.bo}`,background:sortBy===k?C.te+'22':C.ca,color:sortBy===k?C.te:C.mu}}>{l}</button>
          ))}
        </div>
        {/* Project list */}
        <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
          {sorted.length===0&&<div style={{fontSize:11,color:C.mu,textAlign:'center',paddingTop:24}}>No {filter==='all'?'':STATUS_LABEL[filter].toLowerCase()+' '}projects.</div>}
          {sorted.map(p=>{
            const active=selectedId===p.id;
            const dc=doneCount(p);
            return (
              <div key={p.id} onClick={()=>setSelectedId(p.id)} style={{padding:'8px 10px',borderRadius:6,cursor:'pointer',border:`1px solid ${active?C.te:C.bo}`,background:active?C.te+'11':C.ca,borderLeft:`3px solid ${active?C.te:STATUS_COLOR[p.status]||C.bo}`,transition:'all .12s',position:'relative'}}>
                <div style={{fontSize:12,color:C.tx,marginBottom:3,paddingRight:20}}>{p.title}</div>
                <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',marginBottom:dc?5:0}}>
                  <span style={{fontSize:9,color:STATUS_COLOR[p.status],border:`1px solid ${STATUS_COLOR[p.status]}44`,padding:'1px 5px',borderRadius:3}}>{STATUS_LABEL[p.status]}</span>
                  <span style={{fontSize:9,color:C.mu}}>{itemCount(p)}</span>
                </div>
                {(()=>{
                  var total = p.items.length;
                  if(!total) return null;
                  var done = p.items.filter(function(i){ return i.type==='milestone'?i.status==='done'||i.done:i.done; }).length;
                  var pct = Math.round((done/total)*100);
                  var barCol = pct===100?C.gr:pct>=50?C.te:C.mu;
                  return (
                    <div style={{display:'flex',alignItems:'center',gap:5}}>
                      <div style={{flex:1,height:4,background:C.bo,borderRadius:2,overflow:'hidden'}}>
                        <div style={{height:'100%',width:pct+'%',background:barCol,borderRadius:2,transition:'width .3s'}}/>
                      </div>
                      <span style={{fontFamily:MO,fontSize:9,color:barCol,flexShrink:0}}>{pct}%</span>
                    </div>
                  );
                })()}
                <button onClick={e=>{e.stopPropagation();deleteProject(p.id);}} style={{position:'absolute',top:6,right:6,background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:12,padding:'0 2px',opacity:0.5}} title="Delete project">🗑</button>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── Right panel ── */}
      <div style={{flex:1,paddingLeft:isCompact?12:20,minWidth:0,overflowY:'auto'}}>
        {!selected ? (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:320,gap:12,color:C.mu}}>
            <div style={{fontSize:36}}>🗂</div>
            <div style={{fontSize:12,letterSpacing:1}}>Select a project or create a new one</div>
          </div>
        ) : (
          <div>
            {/* Project header */}
            <div style={{marginBottom:16,paddingBottom:14,borderBottom:`1px solid ${C.bo}`}}>
              {editingId===selected.id
                ? <input autoFocus value={editTitle} onChange={e=>setEditTitle(e.target.value)}
                    onBlur={()=>{if(editTitle.trim())updateProject(selected.id,{title:editTitle.trim()});setEditingId(null);}}
                    onKeyDown={e=>{if(e.key==='Enter'){if(editTitle.trim())updateProject(selected.id,{title:editTitle.trim()});setEditingId(null);}if(e.key==='Escape')setEditingId(null);}}
                    style={{fontFamily:MO,fontSize:18,fontWeight:'bold',color:C.tx,background:'transparent',border:'none',borderBottom:`1px solid ${C.te}`,outline:'none',width:'100%',padding:'2px 0',marginBottom:8}}/>
                : <div onClick={()=>{setEditingId(selected.id);setEditTitle(selected.title);}} title="Click to edit" style={{fontSize:18,fontWeight:'bold',color:C.tx,cursor:'text',borderBottom:`1px dashed ${C.bo}`,display:'inline-block',marginBottom:8,maxWidth:'100%'}}>{selected.title}</div>
              }
              <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <select value={selected.status} onChange={e=>updateProject(selected.id,{status:e.target.value})}
                  style={{fontFamily:MO,fontSize:11,color:STATUS_COLOR[selected.status],background:C.ca,border:`1px solid ${STATUS_COLOR[selected.status]}44`,borderRadius:4,padding:'2px 6px',cursor:'pointer',outline:'none'}}>
                  {STATUS_OPTS.map(s=><option key={s} value={s}>{STATUS_LABEL[s]}</option>)}
                </select>
                {editingDesc
                  ? <div style={{display:'flex',gap:6,alignItems:'center',flex:1}}>
                      <input autoFocus value={editDesc} onChange={e=>setEditDesc(e.target.value)} placeholder="Project description…"
                        onBlur={()=>{updateProject(selected.id,{description:editDesc.trim()});setEditingDesc(false);}}
                        onKeyDown={e=>{if(e.key==='Enter'){updateProject(selected.id,{description:editDesc.trim()});setEditingDesc(false);}if(e.key==='Escape')setEditingDesc(false);}}
                        style={{fontFamily:MO,fontSize:11,color:C.tx,background:'transparent',border:'none',borderBottom:`1px solid ${C.te}`,outline:'none',flex:1,padding:'2px 0'}}/>
                    </div>
                  : selected.description
                    ? <span onClick={()=>{setEditingDesc(true);setEditDesc(selected.description);}} title="Click to edit description"
                        style={{fontFamily:MO,fontSize:11,color:C.mu,flex:1,cursor:'text',borderBottom:`1px dashed ${C.bo}`}}>{selected.description}</span>
                    : <span onClick={()=>{setEditingDesc(true);setEditDesc('');}} title="Add description"
                        style={{fontFamily:MO,fontSize:11,color:C.bo,cursor:'text'}}>+ description</span>
                }
              </div>
              {(()=>{
                var total = (selected.items||[]).length;
                if(!total) return null;
                var done = (selected.items||[]).filter(function(i){ return i.type==='milestone'?i.status==='done'||i.done:i.done; }).length;
                var pct = Math.round((done/total)*100);
                var barCol = pct===100?C.gr:pct>=50?C.te:C.mu;
                return (
                  <div style={{display:'flex',alignItems:'center',gap:8,marginTop:10}}>
                    <div style={{flex:1,height:6,background:C.bo,borderRadius:3,overflow:'hidden'}}>
                      <div style={{height:'100%',width:pct+'%',background:barCol,borderRadius:3,transition:'width .4s'}}/>
                    </div>
                    <span style={{fontFamily:MO,fontSize:10,color:barCol,flexShrink:0,minWidth:50}}>{done}/{total} · {pct}%</span>
                  </div>
                );
              })()}
            </div>
            {/* ── Add item bar ── */}
            {addingType
              ? <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
                  <input autoFocus placeholder={addingType==='milestone'?'Milestone title…':'Task text…'}
                    value={addInp} onChange={e=>setAddInp(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')addItem();if(e.key==='Escape'){setAddingType(null);setAddInp('');setAddDue('');} }}
                    style={{fontFamily:MO,fontSize:12,color:C.tx,background:C.ca,border:`1px solid ${C.te}`,borderRadius:4,padding:'4px 8px',outline:'none',flex:1,minWidth:120}}/>
                  {addingType==='milestone'&&(
                    <input type="date" value={addDue} onChange={e=>setAddDue(e.target.value)}
                      style={{fontFamily:MO,fontSize:11,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,padding:'4px 6px',color:C.mu,outline:'none'}}/>
                  )}
                  <button onClick={addItem} disabled={!addInp.trim()}
                    style={{fontFamily:MO,fontSize:11,padding:'4px 10px',background:addInp.trim()?C.te+'22':C.ca,border:`1px solid ${addInp.trim()?C.te:C.bo}`,borderRadius:4,color:addInp.trim()?C.te:C.mu,cursor:addInp.trim()?'pointer':'default'}}>✓ Add</button>
                  <button onClick={()=>{setAddingType(null);setAddInp('');setAddDue('');}}
                    style={{fontFamily:MO,fontSize:11,padding:'4px 8px',background:'transparent',border:`1px solid ${C.bo}`,borderRadius:4,color:C.mu,cursor:'pointer'}}>✕ Cancel</button>
                </div>
              : <div style={{display:'flex',gap:6,marginBottom:12}}>
                  <button onClick={()=>setAddingType('milestone')}
                    style={{fontFamily:MO,fontSize:11,padding:'4px 12px',borderRadius:4,cursor:'pointer',border:`1px solid ${C.te}66`,background:C.ca,color:C.te}}>＋ Milestone</button>
                  <button onClick={()=>setAddingType('task')}
                    style={{fontFamily:MO,fontSize:11,padding:'4px 12px',borderRadius:4,cursor:'pointer',border:`1px solid ${C.bo}`,background:C.ca,color:C.mu}}>＋ Task</button>
                </div>
            }
            {/* ── Items list ── */}
            <div>
              {(selected.items||[]).length===0&&<div style={{fontFamily:MO,fontSize:11,color:C.mu,textAlign:'center',padding:'24px 0'}}>No milestones or tasks yet.</div>}
              {(selected.items||[]).map((item, itemIdx) => {
                var totalItems = (selected.items||[]).length;
                if (item.type==='milestone') {
                  var otherMs = (selected.items||[]).filter(i=>i.type==='milestone'&&i.id!==item.id);
                  return (
                    <MilestoneRow key={item.id} milestone={item} projectTitle={selected.title}
                      onMoveUp={()=>moveItem(selected.id, itemIdx, -1)}
                      onMoveDown={()=>moveItem(selected.id, itemIdx, 1)}
                      isFirst={itemIdx===0}
                      isLast={itemIdx===totalItems-1}
                      otherMilestones={otherMs}
                      onMoveStep={(step, toMsId)=>moveStepToMilestone(selected.id, item.id, step, toMsId)}
                      onUpdate={changes => updateItems(selected.id, (selected.items||[]).map(i=>i.id===item.id?{...i,...changes}:i))}
                      onDelete={() => { if(window.confirm('Delete this milestone and all its steps?')) updateItems(selected.id,(selected.items||[]).filter(i=>i.id!==item.id)); }}
                      onSend={(date, step) => {
                        if (step) {
                          sendItemToDate(date, selected.id, `${selected.title}: ${item.title} - ${step.text}`);
                        } else if (item.steps && item.steps.length > 0) {
                          item.steps.forEach(function(s) {
                            sendItemToDate(date, selected.id, `${selected.title}: ${item.title} - ${s.text}`);
                          });
                        } else {
                          sendItemToDate(date, selected.id, `${selected.title}: ${item.title}`);
                        }
                      }}/>
                  );
                }
                if (item.type==='task') return (
                  <TaskRow key={item.id} task={item} projectTitle={selected.title}
                    onMoveUp={()=>moveItem(selected.id, itemIdx, -1)}
                    onMoveDown={()=>moveItem(selected.id, itemIdx, 1)}
                    isFirst={itemIdx===0}
                    isLast={itemIdx===totalItems-1}
                    onToggle={() => updateItems(selected.id,(selected.items||[]).map(i=>i.id===item.id?{...i,done:!i.done}:i))}
                    onEditText={text => updateItems(selected.id,(selected.items||[]).map(i=>i.id===item.id?{...i,text}:i))}
                    onEditNotes={notes => updateItems(selected.id,(selected.items||[]).map(i=>i.id===item.id?{...i,notes}:i))}
                    onSend={date => sendItemToDate(date, selected.id, `${selected.title}: ${item.text}`)}
                    onDelete={() => updateItems(selected.id,(selected.items||[]).filter(i=>i.id!==item.id))}/>
                );
                return null;
              })}
            </div>

        )}

}

function BlockDefaultsEditorModal({ current, onSave, onClose }) {
  var [draft, setDraft] = useState(function(){ return current.slice(); });
  var [newVal, setNewVal] = useState('');
  var [editIdx, setEditIdx] = useState(null);
  var [editVal, setEditVal] = useState('');

  var addItem = function() {
    var v = newVal.trim();
    if(!v) return;
    setDraft(function(p){ return [...p, v]; });
    setNewVal('');
  };
  var removeItem = function(i) { setDraft(function(p){ return p.filter(function(_,j){ return j!==i; }); }); };
  var moveItem = function(i, dir) {
    setDraft(function(p) {
      var n = p.slice(); var j = i+dir;
      if(j<0||j>=n.length) return p;
      var tmp=n[i]; n[i]=n[j]; n[j]=tmp; return n;
    });
  };
  var startEdit = function(i) { setEditIdx(i); setEditVal(draft[i]); };
  var commitEdit = function() {
    var v = editVal.trim();
    if(!v){ setEditIdx(null); return; }
    setDraft(function(p){ var n=p.slice(); n[editIdx]=v; return n; });
    setEditIdx(null);
  };

  return (
    <Modal onClose={onClose} width={440}>
      <div style={{padding:'16px 20px',borderBottom:'1px solid '+C.bo,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontFamily:MO,fontSize:15,fontWeight:'bold',color:C.tx}}>Block Defaults</div>
        <Btn onClick={onClose} style={{padding:'4px 10px'}}>x</Btn>
      </div>
      <div style={{padding:16,maxHeight:'55vh',overflowY:'auto'}}>
        <div style={{fontFamily:MO,fontSize:10,color:C.mu,marginBottom:12,lineHeight:1.6}}>
          These appear as quick-pick buttons in the block editor.
        </div>
        {draft.map(function(d,i){
          return (
            <div key={i} style={{display:'flex',gap:4,alignItems:'center',marginBottom:5}}>
              {editIdx===i ? (
                <input autoFocus value={editVal} onChange={function(e){setEditVal(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')commitEdit();if(e.key==='Escape')setEditIdx(null);}}
                  style={{flex:1,fontFamily:MO,fontSize:11,background:C.ca,border:'1px solid '+C.or,borderRadius:4,padding:'4px 7px',color:C.tx,outline:'none'}}/>
              ) : (
                <div style={{flex:1,fontFamily:MO,fontSize:11,color:C.tx,padding:'4px 7px',background:C.ca,border:'1px solid '+C.bo,borderRadius:4,cursor:'pointer'}} onClick={function(){startEdit(i);}}>{d}</div>
              )}
              <div style={{display:'flex',gap:2,flexShrink:0}}>
                <Btn onClick={function(){moveItem(i,-1);}} disabled={i===0} style={{fontSize:10,padding:'2px 6px'}}>^</Btn>
                <Btn onClick={function(){moveItem(i,1);}} disabled={i===draft.length-1} style={{fontSize:10,padding:'2px 6px'}}>v</Btn>
                <Btn onClick={function(){removeItem(i);}} style={{fontSize:10,padding:'2px 6px',color:C.rd}}>x</Btn>
              </div>
            </div>
          );
        })}
        <div style={{display:'flex',gap:4,marginTop:10}}>
          <input value={newVal} onChange={function(e){setNewVal(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')addItem();}}
            placeholder="New default label..." style={{flex:1,fontFamily:MO,fontSize:11,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'5px 7px',color:C.tx,outline:'none'}}/>
          <button onClick={addItem} disabled={!newVal.trim()} style={{fontFamily:MO,fontSize:13,padding:'5px 10px',background:newVal.trim()?C.or:C.mu,color:'#000',border:'none',borderRadius:4,cursor:newVal.trim()?'pointer':'default',fontWeight:'bold'}}>+</button>
        </div>
      </div>
      <div style={{padding:'12px 20px',borderTop:'1px solid '+C.bo,display:'flex',gap:8,justifyContent:'flex-end'}}>
        <Btn onClick={onClose}>Cancel</Btn>
        <OBtn onClick={function(){onSave(draft);}}>Save</OBtn>
      </div>
    </Modal>
  );
}

      var tmp = next[i]; next[i] = next[j]; next[j] = tmp;

      const isEditable=e.target?.isContentEditable;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||isEditable)return;
      if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();goNext();}
      if(e.key==='ArrowLeft' ||e.key==='ArrowUp')  {e.preventDefault();goBack();}
      if(e.key==='Escape'){setShowHist(false);setShowTL(false);setShowRest(false);setShowFullBackup(false);}
      const n=parseInt(e.key);
      if(n>=1&&n<=TABS.length)setTab(TABS[n-1]);
      if(n===5)setTab('projects');
      if(n===6)setTab('notes');
      if(n===7)setTab('stats');
    };
    window.addEventListener('keydown',handler);
    return ()=>window.removeEventListener('keydown',handler);
  },[tab]);

  const tabInfo={
    collect: {label:'Collect',  icon:'📥', step:1},
    schedule:{label:'Schedule', icon:'📅', step:2},
    progress:{label:'Progress', icon:'☑',  step:3},
    wrapup:  {label:'Wrap Up',  icon:'🎁', step:4},
    projects:{label:'Personal Projects', icon:'🗂', step:null, color:C.te},
    notes:   {label:'Notes',    icon:'📝', step:null, color:C.bl},
    stats:   {label:'Stats',    icon:'📊', step:null, color:C.pu},
  };

  const logAwayMs  =timerLogs.filter(r=>r.type==='Away')    .reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
  const logTrainMs =timerLogs.filter(r=>r.type==='Training').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
  const logWatchMs =timerLogs.filter(r=>r.type==='Watching').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;

  const TimerCtrl=({type,ms,running,color})=>(
    <div style={{display:'flex',alignItems:'center'}}>
      <button onClick={e=>{flash(e);timerAdj(type,-1);}} style={{width:20,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:'4px 0 0 4px',color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:13,padding:0}}>−</button>
      <button onClick={e=>{flash(e);timerToggle(type);}} style={{height:26,padding:'0 8px',background:running?`${color}22`:C.ca,border:`1px solid ${running?color:C.bo}`,borderLeft:'none',borderRight:'none',color:running?color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:isCompact?10:11,minWidth:isCompact?90:110,transition:'all .2s',whiteSpace:'nowrap'}}>
        {isCompact?type.slice(0,3).toUpperCase():type.charAt(0).toUpperCase()+type.slice(1)}: {fmtMs(ms)}
      </button>
      <button onClick={e=>{flash(e);timerAdj(type,1);}} style={{width:20,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:'0 4px 4px 0',borderLeft:'none',color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:13,padding:0}}>+</button>
    </div>
  );

  if (!storageReady) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
      <div style={{fontFamily:MO,fontSize:13,color:C.or,letterSpacing:2}}>DAILY PLANNING SYSTEM</div>
      <div style={{fontFamily:MO,fontSize:11,color:C.mu}}>Loading your data…</div>
    </div>
  );

  const cdBoxStyle = {flex:'1 1 130px', background:C.ca, border:'1px solid '+C.bo, borderRadius:8, padding:'8px 12px', boxSizing:'border-box', minWidth:isMobile?0:130};
  const cdValSize = isMobile ? 18 : 22;

  return (
    <div style={{minHeight:'100vh',background:C.bg,fontFamily:MO,color:C.tx,zoom:fontScale}}>
      <div style={{background:C.su,borderBottom:`1px solid ${C.bo}`,padding:'10px 14px'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:6,flexWrap:'wrap'}}>
          <div style={{flex:'1 1 180px',minWidth:0}}>
            <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.or,letterSpacing:2,marginBottom:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>DMP TECHNICAL SUPPORT — JESSE CALDWELL</div>
            <div style={{fontFamily:MO,fontSize:isCompact?14:16,fontWeight:'bold',color:C.tx,marginBottom:2}}>Daily Planning System <span style={{fontSize:isCompact?9:11,color:C.mu,fontWeight:'normal'}}>{DPS_VERSION}</span></div>
            <div style={{fontFamily:MO,fontSize:isCompact?9:10,color:C.mu,marginBottom:4}}>Technical Support Trainer</div>
            <div style={{display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
              <button onClick={()=>shiftWeekday(-1)} style={{width:26,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:12,flexShrink:0}}>‹</button>
              <input value={dateInp} onChange={e=>handleDateInput(e.target.value)} style={{fontFamily:MO,fontSize:12,color:C.tx,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,padding:'3px 8px',width:86,textAlign:'center',outline:'none'}}/>
              <button onClick={()=>shiftWeekday(1)} style={{width:26,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,color:C.tx,cursor:'pointer',fontFamily:MO,fontSize:12,flexShrink:0}}>›</button>
              <div style={{position:'relative',display:'inline-flex',flexShrink:0}}>
                <button onClick={()=>{if(calRef.current){try{calRef.current.showPicker();}catch(e){calRef.current.click();}}}} title="Jump to any date" style={{width:26,height:26,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:4,color:C.mu,cursor:'pointer',fontFamily:MO,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center'}}>📅</button>
                <input ref={calRef} type="date" value={ds} onChange={e=>{const v=e.target.value;if(v){setDs(v);setDateInp(inputFmt(v));setSd(p=>p[`tasks-${v}`]!==undefined?p:{...p,...initDay(v)});}}} style={{position:'absolute',opacity:0,width:0,height:0,pointerEvents:'none',top:0,left:0}}/>
              </div>
              {ds!==TODAY&&<button onClick={()=>{setDs(TODAY);setDateInp(inputFmt(TODAY));setSd(p=>p[`tasks-${TODAY}`]!==undefined?p:{...p,...initDay(TODAY)});}} style={{fontFamily:MO,fontSize:11,padding:'3px 10px',background:C.or+'22',border:`1px solid ${C.or}`,borderRadius:4,color:C.or,cursor:'pointer'}}>Today</button>}
              {!isMobile&&<span style={{fontFamily:MO,fontSize:11,color:C.mu,marginLeft:2}}>{fmtDate(ds)}</span>}
            </div>
            {isMobile&&<div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:4}}>{fmtDate(ds)}</div>}
          </div>
          <div style={{display:'flex',gap:6,flex:'1 1 300px',flexWrap:'wrap'}}>
            <div style={{...cdBoxStyle, position:'relative'}}>
              <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.tx,letterSpacing:1,marginBottom:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',paddingRight:18}}>{apptBoxTitle}</div>
              <div style={{fontFamily:MO,fontSize:apptCd===null?14:cdValSize,fontWeight:'bold',lineHeight:1.1,color:apptCd===null?C.mu:C.or,whiteSpace:'nowrap'}}>{apptCd!==null?apptCd:'—'}</div>
              {nextEvent&&<div style={{fontFamily:MO,fontSize:9,color:C.tx,marginTop:2,lineHeight:1.3,wordBreak:'break-word'}}>{nextEvent.displayName}</div>}
              <button onClick={()=>setShowKwEditor(true)} title="Edit keywords" style={{position:'absolute',top:4,right:4,fontFamily:MO,fontSize:9,padding:'1px 5px',borderRadius:3,border:'1px solid '+C.bo,background:C.ca,color:C.mu,cursor:'pointer',lineHeight:1}}>✎</button>
            </div>
            <div style={cdBoxStyle}>
              <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.tx,letterSpacing:1,marginBottom:2}}>🥗 LUNCH IN</div>
              <div style={{fontFamily:MO,fontSize:lunchCd===null||lunchDiff===0?14:cdValSize,fontWeight:'bold',lineHeight:1.1,color:lunchCd===null||lunchDiff===0?C.mu:C.gr,whiteSpace:'nowrap'}}>{lunchCd!==null?lunchCd:'—'}</div>
            </div>
            <div style={cdBoxStyle}>
              <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.tx,letterSpacing:1,marginBottom:2}}>🏁 SHIFT ENDS IN</div>
              <div style={{fontFamily:MO,fontSize:endDiff===0?14:cdValSize,fontWeight:'bold',lineHeight:1.1,color:endDiff===0?C.mu:C.bl,whiteSpace:'nowrap'}}>{endCd}</div>
              <div style={{display:'flex',gap:4,alignItems:'center',marginTop:4,flexWrap:'wrap'}}>
                <button onClick={()=>setEndTime('16:00')} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:4,cursor:'pointer',border:'1px solid '+(endTime==='16:00'?C.bl:C.bo),background:endTime==='16:00'?C.bl+'22':C.ca,color:endTime==='16:00'?C.bl:C.mu,whiteSpace:'nowrap'}}>4 PM</button>
                <button onClick={()=>setEndTime('17:00')} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:4,cursor:'pointer',border:'1px solid '+(endTime==='17:00'?C.bl:C.bo),background:endTime==='17:00'?C.bl+'22':C.ca,color:endTime==='17:00'?C.bl:C.mu,whiteSpace:'nowrap'}}>5 PM</button>
                <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 4px',color:C.tx,outline:'none',width:75,colorScheme:'dark'}}/>
              </div>
            </div>
          </div>
        </div>
        {!isMobile&&<div style={{fontFamily:MO,fontSize:9,color:C.mu+'88',marginBottom:5,letterSpacing:1}}>← → navigate steps &nbsp;·&nbsp; 1–4 jump to step &nbsp;·&nbsp; 5 = personal projects &nbsp;·&nbsp; 6 = notes &nbsp;·&nbsp; 7 = stats &nbsp;·&nbsp; Esc close modals</div>}
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <TimerCtrl type="away"     ms={awayMs+logAwayMs}   running={awayRun}  color={C.rd}/>
          <TimerCtrl type="training" ms={trainMs+logTrainMs} running={trainRun} color={C.pu}/>
          <TimerCtrl type="watching" ms={watchMs+logWatchMs} running={watchRun} color={C.bl}/>
          <div style={{display:'flex',gap:0,borderRadius:8,overflow:'hidden',border:`2px solid ${appMode==='training'?C.pu:appMode==='department'?C.bl:C.or}`,flexShrink:0,boxShadow:appMode==='training'?`0 0 10px ${C.pu}44`:appMode==='department'?`0 0 10px ${C.bl}44`:`0 0 10px ${C.or}44`,transition:'border-color .2s, box-shadow .2s'}}>
            <button onClick={()=>setAppMode('schedule')} style={{fontFamily:MO,fontSize:isCompact?10:12,fontWeight:'bold',padding:isCompact?'5px 10px':'6px 18px',background:appMode==='schedule'?C.or:C.ca,border:'none',borderRight:'1px solid '+C.bo,color:appMode==='schedule'?'#fff':C.mu,cursor:'pointer',letterSpacing:1,transition:'all .15s',whiteSpace:'nowrap'}}>📅 {isCompact?'SCH':'SCHEDULE'}</button>
            <button onClick={()=>setAppMode('training')} style={{fontFamily:MO,fontSize:isCompact?10:12,fontWeight:'bold',padding:isCompact?'5px 10px':'6px 18px',background:appMode==='training'?C.pu:C.ca,border:'none',borderRight:'1px solid '+C.bo,color:appMode==='training'?'#fff':C.mu,cursor:'pointer',letterSpacing:1,transition:'all .15s',whiteSpace:'nowrap'}}>👥 {isCompact?'TRN':'TRAINING'}</button>
            <button onClick={()=>setAppMode('department')} style={{fontFamily:MO,fontSize:isCompact?10:12,fontWeight:'bold',padding:isCompact?'5px 10px':'6px 18px',background:appMode==='department'?C.bl:C.ca,border:'none',color:appMode==='department'?'#fff':C.mu,cursor:'pointer',letterSpacing:1,transition:'all .15s',whiteSpace:'nowrap'}}>🏢 {isCompact?'DEPT':'DEPARTMENT'}</button>
          </div>
          <div style={{display:'flex',gap:4,marginLeft:'auto',flexWrap:'wrap'}}>
            <div style={{display:'flex',gap:0,alignItems:'center'}}>
              <button onClick={()=>adjFont(-0.1)} title="Smaller text" style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 7px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:'6px 0 0 6px',color:C.mu,cursor:'pointer',whiteSpace:'nowrap'}}>A−</button>
              <button onClick={()=>adjFont(0.1)}  title="Larger text"  style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 7px',background:C.ca,border:`1px solid ${C.bo}`,borderLeft:'none',borderRadius:'0 6px 6px 0',color:C.tx,cursor:'pointer',whiteSpace:'nowrap',fontWeight:'bold'}}>A+</button>
            </div>
            <button onClick={()=>setShowRest(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:'#1a1000',border:`1px solid ${C.or}`,borderRadius:6,color:C.or,cursor:'pointer',whiteSpace:'nowrap'}}>↑ {isCompact?'SES RST':'RESTORE SESSION'}</button>
            <button onClick={e=>{flash(e);saveSession();}} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:savedFlash?'#0d2010':C.ca,border:`1px solid ${savedFlash?C.gr:C.bo}`,borderRadius:6,color:savedFlash?C.gr:C.tx,cursor:'pointer',whiteSpace:'nowrap',transition:'all .3s'}}>{savedFlash?'✓ SAVED':'💾 SAVE'}</button>
            <button onClick={()=>setShowTL(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>⏱ {isCompact?'':'TIMER LOG'}</button>
            <button onClick={()=>setShowHist(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>■ {isCompact?'HIST':'HISTORY'}</button>
            <button onClick={()=>setShowSync(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:'#001a1a',border:`1px solid ${gistSyncer.gistStatus==='ok'?C.gr:C.gr}`,borderRadius:6,color:C.gr,cursor:'pointer',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:5}}>
              {gistSyncer.gistToken&&<span style={{width:7,height:7,borderRadius:'50%',background:gistSyncer.gistStatus==='ok'?C.gr:gistSyncer.gistStatus==='error'?C.rd:C.mu,flexShrink:0}}/>}
              📱 {isCompact?'':'SYNC'}
            </button>
            <button onClick={()=>{const b=new Blob([exportJson],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`jesse-planner-session-${ds}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);}} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>↑ {isCompact?'SES EXP':'EXPORT SESSION'}</button>
            <button onClick={exportFullBackup} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:'#0d1a0d',border:`1px solid ${C.gr}`,borderRadius:6,color:C.gr,cursor:'pointer',whiteSpace:'nowrap'}}>💾 {isCompact?'BCK':'FULL BACKUP'}</button>
            <button onClick={()=>setShowFullBackup(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:'#1a0d0d',border:`1px solid ${C.rd}`,borderRadius:6,color:C.rd,cursor:'pointer',whiteSpace:'nowrap'}}>↑ {isCompact?'RST':'FULL RESTORE'}</button>
          </div>
        </div>
      </div>

      {appMode==='training'
        ? <TrainingMode trainees={trainees} agents={agents} onUpdateAgent={updateAgent} onAddAgent={addAgent} onGraduateAgent={graduateAgent} onDeleteAgent={deleteAgent} onCreateTask={createTaskForDate} onUpdateTask={updateTaskText} onDeleteTask={deleteTaskFromDate} sd={sd}/>
        : appMode==='department'
        ? <DepartmentMode agents={agents} onUpdateAgent={updateAgent} onAddAgent={addAgent} onDeactivateAgent={deactivateAgent} onReactivateAgent={reactivateAgent} onDeleteAgent={deleteAgent} onLoadSeed={loadSeedAgents}/>
        : <>
          <div style={{background:C.su,borderBottom:`1px solid ${C.bo}`,padding:'6px 12px',display:'flex',gap:4,alignItems:'center',flexWrap:'nowrap'}}>
            {/* Workflow tabs — always visible */}
            {['collect','schedule','progress','wrapup'].map(t=>{
              const info=tabInfo[t], active=tab===t;
              return (
                <button key={t} onClick={e=>{flash(e);setTab(t);}} style={{
                  fontFamily:MO, fontSize:isCompact?11:12, padding:isCompact?'4px 8px':'5px 12px', borderRadius:20, cursor:'pointer',
                  border: active ? 'none' : `1px solid ${C.bo}`,
                  background: active ? C.or : C.ca,
                  color: active ? '#fff' : C.tx,
                  transition:'all .15s', display:'flex', alignItems:'center', gap:4, whiteSpace:'nowrap',
                }}>
                  <span>{info.icon}</span>
                  <span>{info.label}</span>
                  {info.step&&<span style={{fontFamily:MO,fontSize:9,opacity:0.5}}>{info.step}</span>}
                </button>
              );
            })}
            {/* Projects tab — desktop only */}
            {!isMobile&&(()=>{
              const t='projects', info=tabInfo[t], active=tab===t;
              return (
                <button onClick={e=>{flash(e);setTab(t);}} style={{
                  fontFamily:MO, fontSize:isCompact?11:12, padding:isCompact?'4px 8px':'5px 12px', borderRadius:20, cursor:'pointer',
                  border: active ? 'none' : `1px solid ${C.te}66`,
                  background: active ? C.te : C.ca,
                  color: active ? '#fff' : C.te,
                  transition:'all .15s', display:'flex', alignItems:'center', gap:4, whiteSpace:'nowrap',
                }}>
                  <span>{info.icon}</span><span>{info.label}</span>
                </button>
              );
            })()}
            {/* Flex spacer */}
            <div style={{flex:1,minWidth:12}}/>
            {/* Utility tabs — Notes + Stats */}
            {['notes','stats'].map(t=>{
              const info=tabInfo[t], active=tab===t, col=info.color;
              return (
                <button key={t} onClick={e=>{flash(e);setTab(t);}} style={{
                  fontFamily:MO, fontSize:isCompact?11:12, padding:isCompact?'4px 8px':'5px 12px', borderRadius:20, cursor:'pointer',
                  border: active ? 'none' : `1px solid ${col}66`,
                  background: active ? col : C.ca,
                  color: active ? '#fff' : col,
                  transition:'all .15s', display:'flex', alignItems:'center', gap:4, whiteSpace:'nowrap',
                }}>
                  <span>{info.icon}</span><span>{info.label}</span>
                </button>
              );
            })}
          </div>

          <div style={{padding:isMobile?'16px 12px':'24px 20px'}}>
            {tab==='collect'  && <CollectTab  tasks={tasks} dismissed={dismissed} lastSum={lastSum} deferred={deferred} onUpdateTasks={v=>upd('tasks',v)} onUpdateDismissed={v=>upd('dismissed',v)} onUpdateDeferred={v=>upd('deferred',v)} onRejectCarry={(srcId,srcDate)=>setSd(p=>{var next={...p,[`rejectedCarries-${TODAY}`]:[...(p[`rejectedCarries-${TODAY}`]||[]),srcId]};if(srcDate){next={...next,[`done-${srcDate}`]:[...(p[`done-${srcDate}`]||[]),srcId]};}return next;})} onBack={goBack} onNext={goNext} onResetCarry={resetAndRepull}/>}
            {tab==='schedule' && <ScheduleTab timeBlocks={timeBlocks} tasks={tasks} done={done} dismissed={dismissed} timerLogs={timerLogs} deferred={deferred} agents={agents} blockDefaults={blockDefaults} onSaveDefaults={function(arr){setBlockDefaults(arr);saveBlockDefaults(arr);}} onUpdateTime={v=>upd('time',v)} onBack={goBack} onNext={goNext} isCompact={isCompact}/>}
            {tab==='notes'    && <NotesTab    notes={allNotes} onUpdateNotes={handleUpdateAllNotes}/>}
            {tab==='progress' && <ProgressTab tasks={tasks} done={done} deferred={deferred} timeBlocks={timeBlocks} onUpdateDone={v=>upd('done',v)} onUpdateDeferred={v=>upd('deferred',v)} onBack={goBack} onNext={goNext} isMobile={isMobile}/>}
            {tab==='wrapup'   && <WrapUpTab   tasks={tasks} done={done} timeBlocks={timeBlocks} awayMs={awayMs} trainMs={trainMs} watchMs={watchMs} timerLogs={timerLogs} ds={ds} sums={sums} onSaveSummary={saveSummary} onBack={goBack} isMobile={isMobile} deferred={deferred}/>}
            {tab==='stats'    && <StatsTab    sums={sums} idx={idx} isMobile={isMobile}/>}
            {tab==='projects' && <ProjectsTab projects={projects} setProjects={setProjects} setSd={setSd} isCompact={isCompact}/>}
          </div>
        </>
      }

      {showHist && <HistoryModal sums={sums} idx={idx} onClose={()=>setShowHist(false)} onLoad={loadHistory} onDelete={deleteHistory} onImport={importHistory}/>}

      {showTL   && <TimerLogModal  logs={timerLogs} awayMs={awayMs} trainMs={trainMs} watchMs={watchMs} onSave={rows=>upd('timerLogs',rows)} onClose={()=>setShowTL(false)} onReset={timerReset}/>}
      {showRest && <RestoreModal onRestore={restoreSession} onClose={()=>setShowRest(false)}/>}
      {showFullBackup && <FullBackupRestoreModal onRestore={restoreFullBackup} onClose={()=>setShowFullBackup(false)}/>}
      {showSync && <SyncModal today={ds} tasks={tasks} done={done} timeBlocks={timeBlocks} deferred={deferred} timerLogs={timerLogs} awayMs={awayMs+logAwayMs} trainMs={trainMs+logTrainMs} watchMs={watchMs+logWatchMs} notes={gd('notes')||[]} onMerge={mergeFromSync} onClose={()=>setShowSync(false)} isSendFirst={true} gistSyncer={gistSyncer}/>}
      {showKwEditor && <KeywordEditorModal current={apptKeywords} onSave={kws=>{setApptKeywords(kws);saveApptKeywords(kws);setShowKwEditor(false);}} onClose={()=>setShowKwEditor(false)}/>}
    </div>
  );
}

// ── Error Boundary ────────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{minHeight:'100vh',background:'#111318',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
        <div style={{background:'#1c1f2b',border:'1px solid #ef4444',borderRadius:10,padding:24,maxWidth:700,width:'100%'}}>
          <div style={{fontFamily:"'Courier New',monospace",fontSize:13,color:'#ef4444',marginBottom:8,letterSpacing:2}}>⚠ RENDER ERROR</div>
          <pre style={{fontFamily:"'Courier New',monospace",fontSize:11,color:'#dde1ee',whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{this.state.error.toString()}{'\n\n'}{this.state.error.stack}</pre>
        </div>
      </div>
    );
    return this.props.children;
  }
}

// ── Mount ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><DailyPlanner /></ErrorBoundary>);
</script>
</body>
