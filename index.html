  buddyDoingWell:        h.buddyDoingWell        || '',
  buddyAreasOfImprovement: h.buddyAreasOfImprovement || '',
  finalQuizCorrect: h.finalQuizCorrect != null ? h.finalQuizCorrect : null,
  finalQuizTotal:   h.finalQuizTotal   != null ? h.finalQuizTotal   : null,
  trainingDaysComplete:     h.trainingDaysComplete     || false,
  trainingDaysCompleteDate: h.trainingDaysCompleteDate || null,
  mockCallsComplete:        h.mockCallsComplete        || false,
  mockCallsCompleteDate:    h.mockCallsCompleteDate    || null,
  buddyCallsComplete:       h.buddyCallsComplete       || false,
  buddyCallsCompleteDate:   h.buddyCallsCompleteDate   || null,
  trainingEval: {
    signedOff:     h.trainingEval?.signedOff     || false,

    dmpValues: {
      honestyIntegrity:     { rating: h.trainingEval?.dmpValues?.honestyIntegrity?.rating     || null, notes: h.trainingEval?.dmpValues?.honestyIntegrity?.notes     || '' },
      innovationInitiative: { rating: h.trainingEval?.dmpValues?.innovationInitiative?.rating || null, notes: h.trainingEval?.dmpValues?.innovationInitiative?.notes || '' },

      kindness:             { rating: h.trainingEval?.dmpValues?.kindness?.rating             || null, notes: h.trainingEval?.dmpValues?.kindness?.notes             || '' },

const fmtShortDate = ds => { const d=new Date(ds+'T12:00:00'); return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'}); };
const fmtTime = t => { if(!t) return null; const [h,m]=t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; };
const fmtShift = (s,e) => { const a=fmtTime(s),b=fmtTime(e); return (a&&b)?`${a} – ${b}`:a||b||null; };

const evalAllRatedGlobal = hire => {
  const ev = hire.trainingEval;
  return ev && hire.mockCallsComplete && hire.buddyCallsComplete && [...Object.values(ev.dmpValues||{}), ...Object.values(ev.tswp||{})].every(c=>c.rating!=null);
};

const phaseLabel = hire => {
  const comp = Object.values(hire.days).filter(d=>d.completed).length;
  if (hire.trainingEval?.signedOff) return 'Training Complete ✓';
  if (comp >= 15) {
    const ev = hire.trainingEval;
    const allRated = evalAllRatedGlobal(hire);
    if (allRated) return 'Ready for Sign-Off';
    const bLen=(hire.buddyCalls||[]).length, bGoal=hire.buddyCallsGoal||25;
    const mGoal=hire.mockCallsGoal||15;
    if (hire.mockCallsComplete || bLen>0) return `Buddy Calls (${bLen}/${bGoal})`;
    return `Mock Calls (${hire.mockCalls.length}/${mGoal})`;
  }
  return `Training Day ${comp+1} of 15`;
};

  const mockPct  = Math.min(100,Math.round((mockLen/mockGoal)*100));
  const bLen     = (hire.buddyCalls||[]).length;
  const bGoal    = hire.buddyCallsGoal||25;
  const bPct     = Math.min(100,Math.round((bLen/bGoal)*100));
  const complete = hire.trainingEval&&hire.trainingEval.signedOff;
  // Current phase progress for bar
  const curPhasePct = complete ? 100 : comp<15 ? dayPct : mockLen<mockGoal ? mockPct : bLen<bGoal ? bPct : 100;
  const barColor = curPhasePct>=100 ? C.gr : comp<15 ? C.or : mockLen<mockGoal ? C.bl : C.pu;
  const dayQuizPcts = TRAINING_DAYS.map(td=>{ const d=hire.days[td.day]; const c=parseFloat(d&&d.quizCorrect),t=parseFloat(d&&d.quizTotal); return (!c&&c!==0)||!t||t===0?null:Math.round((c/t)*100); }).filter(s=>s!=null);
  const avgQuiz = dayQuizPcts.length>0?Math.round(dayQuizPcts.reduce((a,b)=>a+b,0)/dayQuizPcts.length):null;

  const mu10 = {fontFamily:MO,fontSize:10,color:C.mu};
  return (
    <div onClick={()=>onSelect(hire.id)} style={{background:selected?'#1c1f2b':C.ca,border:`2px solid ${selected?C.or:C.bo}`,borderRadius:10,padding:14,cursor:'pointer',transition:'all .15s',flex:'1 1 190px',maxWidth:280}}>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4,gap:6}}>
        <div style={{fontFamily:MO,fontSize:14,fontWeight:'bold',color:C.tx}}>{hire.name}</div>
        <span style={{fontFamily:MO,fontSize:9,padding:'2px 7px',borderRadius:3,border:`1px solid ${hire.status==='active'?C.gr:hire.status==='trainee'?C.yl:C.mu}44`,color:hire.status==='active'?C.gr:hire.status==='trainee'?C.yl:C.mu,flexShrink:0}}>{hire.status}</span>
      </div>
      {/* Sub-header: started + disc + final quiz */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:6,gap:6}}>
        <div>
          <div style={{fontFamily:MO,fontSize:9,color:C.mu}}>Started {fmtShortDate(hire.startDate)}</div>
          {hire.discProfile&&<div style={{fontFamily:MO,fontSize:9,color:C.pu,marginTop:1}}>DISC: {hire.discProfile}</div>}
        </div>
        {fqPct!=null&&<div style={{textAlign:'right',flexShrink:0}}>

      <div style={{height:4,background:C.bo,borderRadius:2,marginBottom:8}}>

function parseMockCallEmail(txt) {
  const out = {date:'',time:'',trainerName:'',agentName:'',agentEmail:'',supervisorEmail:'',
    askedCompanyName:'',askedMyName:'',askedPanelType:'',callDropped:'',triedCallBack:'',
    onHoldCount:'',askedBeforeHold:'',thankedForHolding:'',pulledPanelProgramming:'',
    whatWentWell:'',whatToImprove:'',loggedWintouch:'',wintouchCaseNum:'',
    wintouchQuality:'good',wintouchNotesFeedback:'',totalCallTime:'',
    resolved:true,overallPerformance:'good',feedbackFromCall:'',details:'',duration:'15-20'};
  const lines = txt.split('\n');
  let i=0, lastAnchor='';
  const ratingMap=r=>r.toLowerCase().includes('great')?'great':r.toLowerCase().includes('needs')?'needs-work':'good';
  const boolStr=v=>v.trim().toLowerCase()==='yes';
  const parseD=s=>{try{const d=new Date(s);return isNaN(d)?'':d.toISOString().split('T')[0];}catch(e){return '';}};
  const parseT=s=>{try{const d=new Date('2000-01-01 '+s);return isNaN(d)?s:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}catch(e){return s;}};
  const parseDur=s=>s.replace(/ min.*/i,'').trim();
  const tabMap={
    'Date':v=>{out.date=parseD(v);},'Time':v=>{out.time=parseT(v);},
    'Mock Call Trainer Name':v=>{out.trainerName=v;},'Agent Name':v=>{out.agentName=v;},
    'Agent Email':v=>{out.agentEmail=v;},'Supervisor Email':v=>{out.supervisorEmail=v;},
    'Did the Agent ask for my company name?':v=>{out.askedCompanyName=v;},
    'Did the Agent ask for my name?':v=>{out.askedMyName=v;},
    'Did the Agent ask what panel I was using?':v=>{out.askedPanelType=v;},
    'Did the call Drop?':v=>{out.callDropped=v;},
    'Did the Agent try and call them back?':v=>{out.triedCallBack=v;},
    'How many times did they place me on hold?':v=>{out.onHoldCount=v;},
    'On Hold: Did they ask to place me on hold?':v=>{out.askedBeforeHold=v;},
    'On Hold: Did they thank me for holding?':v=>{out.thankedForHolding=v;},
    'Did the Agent try to pull the panel programming in Remote Link or Dealer Admin?':v=>{out.pulledPanelProgramming=v;},
    'Did they log a Wintouch Ticket?':v=>{out.loggedWintouch=v;lastAnchor='wt';},
    'Wintouch Case#':v=>{out.wintouchCaseNum=v;lastAnchor='wtcase';},
    'How long was the call?':v=>{out.duration=parseDur(v);},
    'Total Call Time':v=>{out.totalCallTime=v;},
    'Did they resolve the call?':v=>{out.resolved=boolStr(v);lastAnchor='resolved';},
  };
  const secMap={'What went well on the call?':'whatWentWell','What went well on the call? (Doing Well)':'whatWentWell','What can they improve?':'whatToImprove','What can they improve? (Areas to Develop)':'whatToImprove',
    'Wintouch Case Notes Feedback':'wintouchNotesFeedback','Feedback from the call':'feedbackFromCall'};
  const allHdrs=[...Object.keys(tabMap),...Object.keys(secMap),'Mock Call Details','On Hold','Review of the Call','On Hold Time'];
  // Collect Mock Call Details block
  const di=lines.findIndex(l=>l.trim()==='Mock Call Details');
  if(di>=0){const dl=[];for(let j=di+1;j<lines.length;j++){if(lines[j].includes('\t')||lines[j].trim()==='Date')break;dl.push(lines[j].trim());}out.details=dl.filter(Boolean).join('\n').trim();}
  while(i<lines.length){
    const raw=lines[i],tr=raw.trim();
    if(raw.includes('\t')){
      const ti=raw.indexOf('\t'),label=raw.slice(0,ti).trim(),value=raw.slice(ti+1).trim();
      if(label&&tabMap[label])tabMap[label](value);
      else if(!label&&value.startsWith('-')){
        if(lastAnchor==='wtcase')out.wintouchQuality=ratingMap(value);
        else if(lastAnchor==='resolved')out.overallPerformance=ratingMap(value);
      }
      i++;continue;
    }
    if(secMap[tr]){
      const key=secMap[tr];i++;const bl=[];
      while(i<lines.length){const nx=lines[i].trim();if(lines[i].includes('\t')||allHdrs.includes(nx))break;bl.push(nx);i++;}
      out[key]=bl.filter(Boolean).join('\n').trim();continue;
    }
    if(tr.startsWith('-')&&(lastAnchor==='wtcase'||lastAnchor==='resolved')){
      if(lastAnchor==='wtcase')out.wintouchQuality=ratingMap(tr);
      else if(lastAnchor==='resolved')out.overallPerformance=ratingMap(tr);
      lastAnchor='';
    }
    i++;
  }
  return out;
}

function parseBuddyCallEmail(txt) {
  const out = {
    date:'', observerName:'', observerEmail:'', agentNotes:'', traineeNotes:'',
    independence:null, confidence:null, wintouchCaseNum:'',
    checklist:{ greetedCorrectly:false, confirmedIssue:false, identifiedIssue:false, pulledProgramming:false, loggedWintouch:false, askedForHelpApprop:false }
  };
  const lines = txt.split('\n');
  let i=0, lastAnchor='';
  const parseD = s => { try{const d=new Date(s);return isNaN(d)?'':d.toISOString().split('T')[0];}catch(e){return '';} };
  const indepMap = v => {
    const lv=v.toLowerCase();
    if(lv.includes('guid')) return 'guidance';
    if(lv.includes('exceed')) return 'exceeding';
    if(lv.includes('independ')) return 'independent';
    return null;
  };
  const confMap = v => {
    const lv=v.toLowerCase();
    if(lv.includes('low')) return 'low';
    if(lv.includes('develop')) return 'developing';
    if(lv.includes('confid')) return 'confident';
    return null;
  };
  // Maps a checklist item string (from Important Observations multi-select) to the right key
  const ckMap = function(v) {
    const lv = v.toLowerCase().replace(/^-\s*/,'');
    if(lv.includes('greet')) { out.checklist.greetedCorrectly=true; }
    else if(lv.includes('confirm')) { out.checklist.confirmedIssue=true; }
    else if(lv.includes('identif')) { out.checklist.identifiedIssue=true; }
    else if(lv.includes('pull') || lv.includes('panel') || lv.includes('program')) { out.checklist.pulledProgramming=true; }
    else if(lv.includes('log') || lv.includes('wintouch')) { out.checklist.loggedWintouch=true; }
    else if(lv.includes('ask') || lv.includes('help')) { out.checklist.askedForHelpApprop=true; }
  };
  const tabMap = {
    'Date':                                v=>{out.date=parseD(v);lastAnchor='';},
    'Observer Name':                       v=>{out.observerName=v;lastAnchor='';},
    'Observer Email (Your Email)':         v=>{out.observerEmail=v;lastAnchor='';},
    'Case#':                               v=>{out.wintouchCaseNum=v;lastAnchor='';},
    'Wintouch Case#':                      v=>{out.wintouchCaseNum=v;lastAnchor='';},
    'Important Observations':              v=>{lastAnchor='importantObs';if(v)ckMap(v);},
    'Greeted caller correctly':            v=>{out.checklist.greetedCorrectly=v.trim().toLowerCase()==='yes';lastAnchor='';},
    'Confirmed the issue with the caller': v=>{out.checklist.confirmedIssue=v.trim().toLowerCase()==='yes';lastAnchor='';},
    'Identified the issue':                v=>{out.checklist.identifiedIssue=v.trim().toLowerCase()==='yes';lastAnchor='';},
    'Pulled panel programming':            v=>{out.checklist.pulledProgramming=v.trim().toLowerCase()==='yes';lastAnchor='';},
    'Logged Wintouch ticket':              v=>{out.checklist.loggedWintouch=v.trim().toLowerCase()==='yes';lastAnchor='';},
    'Asked for help appropriately':        v=>{out.checklist.askedForHelpApprop=v.trim().toLowerCase()==='yes';lastAnchor='';},
    'Independence':                        v=>{out.independence=indepMap(v);lastAnchor='';},
    'Confidence':                          v=>{out.confidence=confMap(v);lastAnchor='';},
  };
  const secMap = {
    'Observer Notes':'agentNotes',
    'Agent Notes':'agentNotes',
    'Trainee Notes':'traineeNotes',
    'Self-Reflection':'traineeNotes',
    'Trainee Self-Reflection':'traineeNotes',
  };
  const allHdrs=[...Object.keys(tabMap),...Object.keys(secMap)];
  while(i<lines.length){
    const raw=lines[i],tr=raw.trim();
    if(raw.includes('\t')){
      const ti=raw.indexOf('\t'),label=raw.slice(0,ti).trim(),value=raw.slice(ti+1).trim();
      if(label&&tabMap[label]) { tabMap[label](value); }
      else if(!label&&lastAnchor==='importantObs'&&value) { ckMap(value); }
      else if(label) { lastAnchor=''; }
      i++;continue;
    }
    if(secMap[tr]){
      const key=secMap[tr];lastAnchor='';i++;const bl=[];
      while(i<lines.length){const nx=lines[i].trim();if(lines[i].includes('\t')||allHdrs.includes(nx))break;bl.push(nx);i++;}
      out[key]=bl.filter(Boolean).join('\n').trim();continue;
    }
    // Continuation lines for Important Observations multi-select
    if(lastAnchor==='importantObs'&&tr.startsWith('-')) { ckMap(tr); }
    else if(tr&&!tr.startsWith('-')) { lastAnchor=''; }
    i++;
  }
  return out;
}

      'S': 'Write as steady, supportive narrative under each heading. Frame development areas as natural next steps in their growth, not deficiencies. Avoid abrupt or blunt language. High S readers need psychological safety to hear critical feedback.',
      'C': 'Write as detailed, analytical prose under each heading. Reference specific patterns across calls, cite observable behaviors, and explain the reasoning behind each observation. High C readers want evidence and thoroughness, not summaries.'
    };

          D:{
            strengths:'You both are outgoing and activity-driven. Both of you like to win. You may admire the strengths and achievements of this person.',

                  </div>
                  <div style={{display:'flex',gap:4,flexShrink:0,alignItems:'center'}}>
                    {(!isRev&&showHwBtn)&&<button onClick={()=>toggleDayHasHw(td.day)} title={hasHw?'Disable homework for this day':'Enable homework for this day'} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,cursor:'pointer',border:`1px solid ${hasHw?C.gr+'66':C.bo}`,background:hasHw?C.gr+'11':C.ca,color:hasHw?C.gr:C.mu+'88',transition:'all .15s'}}>HW</button>}
                    {showQuizBtn&&<button onClick={()=>toggleDayHasQuiz(td.day)} title={hasQuiz?'Disable quiz for this day':'Enable quiz for this day'} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,cursor:'pointer',border:`1px solid ${hasQuiz?C.bl+'66':C.bo}`,background:hasQuiz?C.bl+'11':C.ca,color:hasQuiz?C.bl:C.mu+'88',transition:'all .15s'}}>QZ</button>}
                    {d.completed&&<input type="date" value={d.completedDate||''} onChange={e=>setDayDate(td.day,e.target.value)} title="Completion date" style={{...inpS,fontSize:11,padding:'2px 6px',width:118,colorScheme:'dark'}}/>}
                  </div>
                </div>

                {(hasHw||hasQuiz||td.hasReviewQuiz||(d.customSteps||[]).length>0)&&<div style={{marginTop:8,paddingTop:8,borderTop:'1px solid '+C.bo+'55',display:'flex',flexDirection:'column',gap:7}}>
                  {(function(){
                    var slotOrder = d.stepOrder || td.stepOrder || (['hw','quizSent','quiz','reviewQuiz']).concat((d.customSteps||[]).map(function(s){return s.id;}));
                    return slotOrder.map(function(slotId){
                      if(slotId==='hw'){
                        if(!hasHw||isRev) return null;
                        if(hwPrompt===td.day) return (
                          <div key="hw" style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <span style={{fontFamily:MO,fontSize:10,color:C.gr,flexShrink:0}}>📎 HW Date:</span>
                            <input autoFocus type="date" value={hwDateDraft} onChange={e=>setHwDateDraft(e.target.value)} style={{...inpS,padding:'3px 6px',fontSize:11,width:120,colorScheme:'dark',flexShrink:0}}/>
                            <OBtn onClick={commitHw} style={{fontSize:10,padding:'3px 10px',flexShrink:0}}>✓ Mark Done</OBtn>
                            <Btn onClick={()=>setHwPrompt(null)} style={{fontSize:10,padding:'3px 8px',flexShrink:0}}>✕</Btn>
                          </div>
                        );
                        return (
                          <div key="hw" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <button onClick={()=>toggleHw(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(d.hwComplete?C.gr:C.bo),background:d.hwComplete?C.gr+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {d.hwComplete&&<span style={{fontSize:8,color:C.gr,lineHeight:1}}>✓</span>}
                            </button>
                            {d.hwComplete
                              ? <><span style={{fontFamily:MO,fontSize:10,color:C.gr,flex:1}}>📎 Day {td.day} HW — done</span><input type="date" value={d.hwDate||''} onChange={e=>setHwDate(td.day,e.target.value)} title="HW completed date" style={{...inpS,padding:'2px 6px',fontSize:10,width:112,colorScheme:'dark',flexShrink:0}}/></>
                              : <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Day {td.day} Homework</span>
                            }
                          </div>
                        );
                      }
                      if(slotId==='quizSent'){
                        if(!hasQuiz) return null;
                        return (
                          <div key="quizSent" style={{display:'flex',gap:8,alignItems:'center',paddingLeft:4}}>
                            <button onClick={()=>toggleQuizSent(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(d.quizSent?C.yl:C.bo),background:d.quizSent?C.yl+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {d.quizSent&&<span style={{fontSize:8,color:C.yl,lineHeight:1}}>✓</span>}
                            </button>
                            <span style={{fontFamily:MO,fontSize:10,color:d.quizSent?C.yl:C.mu}}>Day {td.day} Quiz Sent</span>
                          </div>
                        );
                      }
                      if(slotId==='quiz'){
                        if(!hasQuiz) return null;
                        if(td.finalQuiz) return (
                          <div key="quiz" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4,paddingTop:4,borderTop:'1px solid '+C.bo}}>
                            <span style={{fontFamily:MO,fontSize:10,color:C.or,flexShrink:0}}>🏁 Final Quiz:</span>
                            <input type="number" min={0} step={0.5} value={fqCorrect} onChange={e=>setFqCorrect(e.target.value)} placeholder="?" title="Correct" style={{...inpS,width:52,padding:'3px 8px',fontSize:11}}/>
                            <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>/</span>
                            <input type="number" min={1} step={0.5} value={fqTotal} onChange={e=>setFqTotal(e.target.value)} placeholder="?" title="Total" style={{...inpS,width:52,padding:'3px 8px',fontSize:11}}/>
                            <OBtn onClick={saveFinalQuiz} style={{fontSize:10,padding:'3px 10px'}}>Save</OBtn>
                            {hire.finalQuizCorrect!=null&&hire.finalQuizTotal!=null&&(()=>{const fp=Math.round((hire.finalQuizCorrect/hire.finalQuizTotal)*100);const b=quizBadge(fp,15);return(<><span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:fp>=90?C.gr:fp>=75?C.yl:C.rd}}>{fp}% ({hire.finalQuizCorrect}/{hire.finalQuizTotal})</span>{b&&<span style={{fontFamily:MO,fontSize:9,fontWeight:'bold',color:b.color,background:b.color+'22',border:'1px solid '+b.color+'55',borderRadius:4,padding:'1px 5px',flexShrink:0}}>{b.label}</span>}</>);})()}
                          </div>
                        );
                        return (
                          <div key="quiz" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <button onClick={()=>toggleDayQuiz(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(d.quizComplete?C.bl:C.bo),background:d.quizComplete?C.bl+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {d.quizComplete&&<span style={{fontSize:8,color:C.bl,lineHeight:1}}>✓</span>}
                            </button>
                            <span style={{fontFamily:MO,fontSize:10,color:d.quizComplete?C.bl:C.mu,flexShrink:0}}>Day {td.day} Quiz</span>
                            <input type="number" min={0} step={0.5} value={d.quizCorrect!=null?String(d.quizCorrect):''} onChange={e=>setQuizField(td.day,'quizCorrect',e.target.value)} placeholder="?" title="Correct" style={{...inpS,width:52,padding:'2px 6px',fontSize:11,flexShrink:0}}/>
                            <span style={{fontFamily:MO,fontSize:10,color:C.mu,flexShrink:0}}>/</span>
                            <input type="number" min={1} step={0.5} value={d.quizTotal!=null?String(d.quizTotal):''} onChange={e=>setQuizField(td.day,'quizTotal',e.target.value)} placeholder="?" title="Total" style={{...inpS,width:52,padding:'2px 6px',fontSize:11,flexShrink:0}}/>
                            {qpct!=null&&<span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:qpct>=90?C.gr:qpct>=70?C.yl:C.rd,flexShrink:0}}>= {qpct}%</span>}
                            {qpct!=null&&(()=>{const b=quizBadge(qpct,td.day);return b?<span style={{fontFamily:MO,fontSize:9,fontWeight:'bold',color:b.color,background:b.color+'22',border:'1px solid '+b.color+'55',borderRadius:4,padding:'1px 5px',flexShrink:0}}>{b.label}</span>:null;})()}
                          </div>
                        );
                      }
                      if(slotId==='reviewQuiz'){
                        if(!td.hasReviewQuiz||(!hire.days[td.day-1]||hire.days[td.day-1].hasQuiz===false)) return null;
                        if(rqPrompt===td.day) return (
                          <div key="reviewQuiz" style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <span style={{fontFamily:MO,fontSize:10,color:C.pu,flexShrink:0}}>📝 RQ Date:</span>
                            <input autoFocus type="date" value={rqDateDraft} onChange={e=>setRqDateDraft(e.target.value)} style={{...inpS,padding:'3px 6px',fontSize:11,width:120,colorScheme:'dark',flexShrink:0}}/>
                            <OBtn onClick={commitRq} style={{fontSize:10,padding:'3px 10px',flexShrink:0}}>✓ Mark Done</OBtn>
                            <Btn onClick={()=>setRqPrompt(null)} style={{fontSize:10,padding:'3px 8px',flexShrink:0}}>✕</Btn>
                          </div>
                        );
                        return (
                          <div key="reviewQuiz" style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',paddingLeft:4}}>
                            <button onClick={()=>toggleReviewQuiz(td.day)} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(d.reviewQuizComplete?C.pu:C.bo),background:d.reviewQuizComplete?C.pu+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {d.reviewQuizComplete&&<span style={{fontSize:8,color:C.pu,lineHeight:1}}>✓</span>}
                            </button>
                            {d.reviewQuizComplete
                              ? <><span style={{fontFamily:MO,fontSize:10,color:C.pu,flex:1}}>📝 Review Day {td.day-1} Quiz - In Class — done</span><input type="date" value={d.reviewQuizDate||''} onChange={e=>onUpdate({...hire,days:{...hire.days,[td.day]:{...d,reviewQuizDate:e.target.value}}})} title="Review quiz date" style={{...inpS,padding:'2px 6px',fontSize:10,width:112,colorScheme:'dark',flexShrink:0}}/></>
                              : <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Review Day {td.day-1} Quiz - In Class</span>
                            }
                          </div>
                        );
                      }
                      var cs=(d.customSteps||[]).find(function(s){return s.id===slotId;});
                      if(!cs) return null;
                      var csi=(d.customSteps||[]).indexOf(cs);
                      var cqPct=(cs.isQuiz&&cs.quizCorrect!=null&&cs.quizTotal!=null&&parseFloat(cs.quizTotal)>0)?Math.round(parseFloat(cs.quizCorrect)/parseFloat(cs.quizTotal)*100):null;
                      var cqBadge=cqPct!=null?customStepQuizBadge(cs.id,cqPct,td.day):null;
                      return (
                        <div key={cs.id} style={{paddingLeft:4,marginBottom:cs.isQuiz?5:0}}>
                          <div style={{display:'flex',gap:8,alignItems:'center'}}>
                            <button onClick={()=>{var steps=[...(d.customSteps||[])];steps[csi]={...cs,complete:!cs.complete,completeDate:cs.complete?null:new Date().toISOString().slice(0,10)};onUpdate({...hire,days:{...hire.days,[td.day]:{...d,customSteps:steps}}});}} style={{flexShrink:0,width:14,height:14,borderRadius:2,border:'2px solid '+(cs.complete?C.gr:C.bo),background:cs.complete?C.gr+'22':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {cs.complete&&<span style={{fontSize:8,color:C.gr,lineHeight:1}}>✓</span>}
                            </button>
                            <span style={{fontFamily:MO,fontSize:10,color:cs.complete?C.gr:C.mu,textDecoration:cs.complete?'line-through':'none',flex:1}}>{cs.label}</span>
                            {(cs.plannedDate!==null&&cs.plannedDate!==undefined)&&<input type="date" value={cs.completeDate||''} onChange={e=>{var steps=[...(d.customSteps||[])];steps[csi]={...cs,completeDate:e.target.value||null};onUpdate({...hire,days:{...hire.days,[td.day]:{...d,customSteps:steps}}});}} title="Date completed" style={{...inpS,padding:'2px 6px',fontSize:10,width:112,colorScheme:'dark',flexShrink:0}}/>}
                          </div>
                          {cs.isQuiz&&<div style={{display:'flex',gap:6,alignItems:'center',marginTop:3,paddingLeft:22}}>
                            <input type="number" min="0" placeholder="?" value={cs.quizCorrect!=null?String(cs.quizCorrect):''} onChange={e=>{var steps=[...(d.customSteps||[])];steps[csi]={...cs,quizCorrect:e.target.value===''?null:parseFloat(e.target.value)||null};onUpdate({...hire,days:{...hire.days,[td.day]:{...d,customSteps:steps}}});}} style={{...inpS,width:44,padding:'2px 5px',fontSize:10,textAlign:'center'}}/>
                            <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>/</span>
                            <input type="number" min="1" placeholder="#" value={cs.quizTotal!=null?String(cs.quizTotal):''} onChange={e=>{var steps=[...(d.customSteps||[])];steps[csi]={...cs,quizTotal:e.target.value===''?null:parseFloat(e.target.value)||null};onUpdate({...hire,days:{...hire.days,[td.day]:{...d,customSteps:steps}}});}} style={{...inpS,width:44,padding:'2px 5px',fontSize:10,textAlign:'center'}}/>
                            {cqPct!=null&&<span style={{fontFamily:MO,fontSize:10,color:cqPct>=90?C.gr:cqPct>=75?C.yl:C.rd,fontWeight:'bold'}}>{cqPct}%</span>}
                            {cqBadge&&<span style={{fontFamily:MO,fontSize:9,color:cqBadge.color,border:'1px solid '+cqBadge.color+'44',borderRadius:3,padding:'1px 5px'}}>{cqBadge.label}</span>}
                          </div>}
                        </div>
                      );
                    });
                  })()}
                </div>}
              </div>
            );
          })}
        </div>}

        {/* ── MOCK CALLS ── */}
        {section==='mocks'&&<div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
            <button onClick={hire.mockCalls.length>=1?()=>onUpdate({...hire,mockCallsComplete:!hire.mockCallsComplete,mockCallsCompleteDate:hire.mockCallsComplete?null:new Date().toISOString().slice(0,10)}):null} style={{flexShrink:0,width:16,height:16,borderRadius:3,border:`2px solid ${hire.mockCallsComplete?C.gr:hire.mockCalls.length>=1?C.bo:C.mu+'44'}`,background:hire.mockCallsComplete?C.gr+'22':'transparent',cursor:hire.mockCalls.length>=1?'pointer':'not-allowed',display:'flex',alignItems:'center',justifyContent:'center',opacity:hire.mockCalls.length>=1?1:0.5}}>
              {hire.mockCallsComplete&&<span style={{fontSize:9,color:C.gr,lineHeight:1}}>✓</span>}
            </button>
            <span style={{fontFamily:MO,fontSize:11,color:hire.mockCallsComplete?C.gr:hire.mockCalls.length>=1?C.mu:C.mu+'88'}}>Mark this step complete</span>
            {hire.mockCallsComplete&&<span style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:C.gr,background:C.gr+'11',border:'1px solid '+C.gr+'44',borderRadius:4,padding:'1px 8px'}}>✓ Complete{hire.mockCallsCompleteDate?' '+fmtShortDate(hire.mockCallsCompleteDate):''}</span>}
            {hire.mockCalls.length===0&&!hire.mockCallsComplete&&<span style={{fontFamily:MO,fontSize:10,color:C.rd+'cc',marginLeft:4}}>• Log at least 1 call first</span>}
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10,flexWrap:'wrap'}}>
            <span style={{fontFamily:MO,fontSize:11,color:C.mu,flexShrink:0}}>Mock Calls Start Date:</span>
            <input type="date" value={hire.mockCallStartDate||''} onChange={e=>onUpdate({...hire,mockCallStartDate:e.target.value||null})} style={{...inpS,fontSize:11,padding:'3px 8px',width:140,colorScheme:'dark',flexShrink:0}}/>
            {hire.mockCallStartDate&&<span style={{fontFamily:MO,fontSize:11,color:C.or}}>{(()=>{const d=new Date(hire.mockCallStartDate+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric',year:'2-digit'});})()}</span>}
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
            <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:4}}>✅ MOCK CALLS — DOING WELL</div><textarea value={hire.mockDoingWell||''} onChange={e=>onUpdate({...hire,mockDoingWell:e.target.value})} placeholder="What are they doing well in mock calls..." rows={Math.max(3,Math.ceil((hire.mockDoingWell||'').length/60),(hire.mockDoingWell||'').split('\n').length,Math.ceil((hire.mockAreasOfImprovement||'').length/60),(hire.mockAreasOfImprovement||'').split('\n').length)} style={{...inpS,width:'100%',resize:'none',fontSize:11,lineHeight:1.5,boxSizing:'border-box'}}/></div>
            <div style={{flex:'1 1 200px'}}><div style={{fontFamily:MO,fontSize:9,color:C.yl,letterSpacing:1,marginBottom:4}}>⚠️ MOCK CALLS — AREAS TO DEVELOP</div><textarea value={hire.mockAreasOfImprovement||''} onChange={e=>onUpdate({...hire,mockAreasOfImprovement:e.target.value})} placeholder="Areas to develop through mock calls..." rows={Math.max(3,Math.ceil((hire.mockDoingWell||'').length/60),(hire.mockDoingWell||'').split('\n').length,Math.ceil((hire.mockAreasOfImprovement||'').length/60),(hire.mockAreasOfImprovement||'').split('\n').length)} style={{...inpS,width:'100%',resize:'none',fontSize:11,lineHeight:1.5,boxSizing:'border-box'}}/></div>
          </div>
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
              <span style={{fontFamily:MO,fontSize:12,fontWeight:'bold',color:C.tx}}>Mock Calls</span>
              <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>(Days 16–20)</span>
              <div style={{display:'flex',gap:4,alignItems:'center',marginLeft:'auto'}}>
                <span style={{fontFamily:MO,fontSize:11,color:C.mu}}>Goal:</span>
                {editGoal
                  ? <><input autoFocus type="number" min={1} value={goalDraft} onChange={e=>setGoalDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveGoal();if(e.key==='Escape')setEditGoal(false);}} style={{...inpS,width:60,padding:'2px 6px',fontSize:11}}/><OBtn onClick={saveGoal} style={{fontSize:10,padding:'2px 8px'}}>✓</OBtn></>
                  : <button onClick={()=>{setGoalDraft(String(mockGoal));setEditGoal(true);}} style={{fontFamily:MO,fontSize:11,padding:'2px 10px',background:C.su,border:'1px solid '+C.bo,borderRadius:4,color:C.or,cursor:'pointer'}}>{mockGoal} ✎</button>
                }
              </div>
              <OBtn onClick={openCall} style={{fontSize:11,padding:'5px 12px',flexShrink:0}}>+ Log Call</OBtn>
              <button onClick={()=>{setShowImport(p=>!p);setImportError('');}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',borderRadius:6,cursor:'pointer',border:`1px solid ${showImport?C.pu:C.bo}`,background:showImport?C.pu+'22':C.ca,color:showImport?C.pu:C.mu,flexShrink:0}}>📥 Import</button>
              <button onClick={e=>{flash(e);copyMockReport();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copiedMock?C.gr+'22':C.ca,border:`1px solid ${copiedMock?C.gr:C.bo}`,borderRadius:6,color:copiedMock?C.gr:C.tx,cursor:'pointer',transition:'all .3s',flexShrink:0}}>{copiedMock?'✓ COPIED':'📤 Copy Report'}</button>
              <button onClick={e=>{flash(e);copyMockFeedback();}} title="Copy all feedback notes as a combined Perplexity prompt" style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copiedFeedback?C.pu+'22':C.ca,border:`1px solid ${copiedFeedback?C.pu:C.pu+'66'}`,borderRadius:6,color:copiedFeedback?C.pu:C.pu,cursor:'pointer',transition:'all .3s',flexShrink:0}}>{copiedFeedback?'✓ COPIED':'📋 Feedback'}</button>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <span style={{fontFamily:MO,fontSize:11,color:mockPct>=100?C.gr:C.or,flexShrink:0}}>{hire.mockCalls.length}/{mockGoal}</span>
              <div style={{flex:1,height:5,background:C.bo,borderRadius:3}}><div style={{height:'100%',width:`${mockPct}%`,background:mockPct>=100?C.gr:C.or,borderRadius:3,transition:'width .4s'}}/></div>
              <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:mockPct>=100?C.gr:C.or,flexShrink:0}}>{mockPct}%</span>
            </div>
          </div>
          {hire.mockCallsComplete&&<div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
            <button onClick={e=>{flash(e);copyMockSupEmail();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copiedMockSupEmail?C.gr+'22':C.ca,border:`1px solid ${copiedMockSupEmail?C.gr:C.bl}`,borderRadius:6,color:copiedMockSupEmail?C.gr:C.bl,cursor:'pointer',transition:'all .3s',flexShrink:0}}>{copiedMockSupEmail?'✓ COPIED':'📧 Final Email — Supervisor'}</button>
            <button onClick={e=>{flash(e);copyMockAgentEmail();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copiedMockAgentEmail?C.gr+'22':C.ca,border:`1px solid ${copiedMockAgentEmail?C.gr:C.te}`,borderRadius:6,color:copiedMockAgentEmail?C.gr:C.te,cursor:'pointer',transition:'all .3s',flexShrink:0}}>{copiedMockAgentEmail?'✓ COPIED':'📧 Final Email — Agent'}</button>
          </div>}
          {showImport&&(
            <div style={{background:C.ca,border:'1px solid '+C.pu,borderRadius:8,padding:14,marginBottom:14}}>
              <div style={{fontFamily:MO,fontSize:10,color:C.pu,letterSpacing:2,marginBottom:8}}>📥 IMPORT FROM EMAIL</div>
              <div style={{fontFamily:MO,fontSize:11,color:C.mu,marginBottom:8}}>Paste the full mock call email submission below. All available fields will be auto-filled.</div>
              <textarea value={importText} onChange={e=>{setImportText(e.target.value);setImportError('');}} rows={8} placeholder="Paste email text here…" style={{fontFamily:MO,fontSize:11,color:C.tx,background:C.su,border:`1px solid ${importError?C.rd:C.bo}`,borderRadius:6,padding:'8px 10px',width:'100%',resize:'vertical',outline:'none',boxSizing:'border-box',lineHeight:1.5,marginBottom:6}}/>
              {importError&&<div style={{fontFamily:MO,fontSize:11,color:C.rd,marginBottom:6}}>{importError}</div>}
              <div style={{display:'flex',gap:8}}>
                <OBtn onClick={importCall} style={{background:C.pu}}>📥 Parse & Import</OBtn>
                <Btn onClick={()=>{setShowImport(false);setImportText('');setImportError('');}}>Cancel</Btn>
              </div>
            </div>
          )}
          {newCallOpen&&(
            <div style={{background:C.ca,border:'1px solid '+C.or,borderRadius:8,padding:14,marginBottom:14}}>
              <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:10}}>NEW CALL LOG</div>

            </div>
            <div style={{marginBottom:8}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:3}}>AGENT NOTES (your observations)</div><textarea value={buddyDraft.agentNotes||''} onChange={e=>setBuddyDraft(p=>({...p,agentNotes:e.target.value}))} rows={3} placeholder="Your notes from sitting with them…" style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5}}/></div>
            <div style={{marginBottom:12}}><div style={{fontFamily:MO,fontSize:9,color:C.pu,letterSpacing:1,marginBottom:3}}>TRAINEE NOTES (their self-reflection)</div><textarea value={buddyDraft.traineeNotes||''} onChange={e=>setBuddyDraft(p=>({...p,traineeNotes:e.target.value}))} rows={3} placeholder="Trainee's own notes or reflections…" style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5}}/></div>
            <div style={{display:'flex',gap:8}}><OBtn onClick={saveBuddy} style={{flex:1}}>💾 Save</OBtn><Btn onClick={()=>setNewBuddyOpen(false)}>Cancel</Btn></div>
          </div>}
          {buddyCalls.length===0&&!newBuddyOpen&&<div style={{background:C.ca,border:'1px dashed '+C.bo,borderRadius:8,padding:'20px 16px',textAlign:'center',fontFamily:MO,fontSize:12,color:C.mu,marginBottom:14}}>No buddy calls logged yet.</div>}
          {buddyCalls.map((call,i)=>{
            const isExp=expandedBuddy===call.id;
            return (
              <div key={call.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:7,marginBottom:6,overflow:'hidden'}}>

                  <span style={{fontFamily:MO,fontSize:10,color:C.mu,flex:1}}>{fmtShortDate(call.date)}</span>

                  {call.independence&&<span style={{fontFamily:MO,fontSize:9,color:call.independence==='exceeding'?C.gr:call.independence==='independent'?C.yl:C.rd,border:`1px solid ${call.independence==='exceeding'?C.gr:call.independence==='independent'?C.yl:C.rd}44`,padding:'1px 5px',borderRadius:3,flexShrink:0}}>{call.independence==='exceeding'?'Exceeded':call.independence==='independent'?'Independent':'Guided'}</span>}
                  {call.confidence&&<span style={{fontFamily:MO,fontSize:9,color:call.confidence==='confident'?C.gr:call.confidence==='developing'?C.yl:C.rd,border:`1px solid ${call.confidence==='confident'?C.gr:call.confidence==='developing'?C.yl:C.rd}44`,padding:'1px 5px',borderRadius:3,flexShrink:0}}>{call.confidence==='confident'?'Confident':call.confidence==='developing'?'Developing':'Low'}</span>}
                  <button onClick={e=>{e.stopPropagation();deleteBuddy(call.id);}} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11,flexShrink:0}}>✕</button>
                </div>
                {isExp&&<div style={{padding:'10px 12px 12px',borderTop:'1px solid '+C.bo}}>
                  {(call.independence||call.confidence)&&<div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
                    {call.independence&&<span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Independence: <span style={{color:call.independence==='exceeding'?C.gr:call.independence==='independent'?C.yl:C.rd,fontWeight:'bold'}}>{call.independence==='exceeding'?'Exceeded Expectations':call.independence==='independent'?'Handled Independently':'Needed Guidance'}</span></span>}
                    {call.confidence&&<span style={{fontFamily:MO,fontSize:10,color:C.mu}}>Confidence: <span style={{color:call.confidence==='confident'?C.gr:call.confidence==='developing'?C.yl:C.rd,fontWeight:'bold'}}>{call.confidence==='confident'?'Confident':call.confidence==='developing'?'Developing':'Low'}</span></span>}
                  </div>}
                  {call.checklist&&Object.values(call.checklist).some(Boolean)&&<div style={{background:C.su,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',marginBottom:10}}>
                    <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:4}}>CHECKLIST</div>
                    {[['greetedCorrectly','Greeted caller correctly'],['confirmedIssue','Confirmed the issue with the caller'],['identifiedIssue','Identified the issue'],['pulledProgramming','Pulled panel programming'],['loggedWintouch','Logged Wintouch ticket'],['askedForHelpApprop','Asked for help appropriately']].map(([key,lbl])=>(
                      call.checklist[key]&&<div key={key} style={{fontFamily:MO,fontSize:10,color:C.gr,marginBottom:2}}>✓ {lbl}{key==='loggedWintouch'&&call.wintouchCaseNum?<span style={{color:C.mu}}> · Case# {call.wintouchCaseNum}</span>:null}</div>
                    ))}
                    {[['greetedCorrectly','Greeted caller correctly'],['confirmedIssue','Confirmed the issue with the caller'],['identifiedIssue','Identified the issue'],['pulledProgramming','Pulled panel programming'],['loggedWintouch','Logged Wintouch ticket'],['askedForHelpApprop','Asked for help appropriately']].map(([key,lbl])=>(
                      !call.checklist[key]&&<div key={key+'x'} style={{fontFamily:MO,fontSize:10,color:C.rd,marginBottom:2}}>✕ {lbl}</div>
                    ))}
                  </div>}
                  {call.agentNotes&&<div style={{marginBottom:call.traineeNotes?10:0}}><div style={{fontFamily:MO,fontSize:9,color:C.gr,letterSpacing:1,marginBottom:4}}>AGENT NOTES</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.agentNotes}</div></div>}
                  {call.traineeNotes&&<div><div style={{fontFamily:MO,fontSize:9,color:C.pu,letterSpacing:1,marginBottom:4}}>TRAINEE NOTES</div><div style={{fontFamily:MO,fontSize:11,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{call.traineeNotes}</div></div>}
                  {!call.agentNotes&&!call.traineeNotes&&!call.independence&&!call.confidence&&<div style={{fontFamily:MO,fontSize:11,color:C.mu}}>No notes recorded.</div>}

        {/* ── EVAL ── */}
        {section==='eval'&&(()=>{
          const ev = hire.trainingEval;
          const allRated = evalAllRated();
          const ratingBg = r => r==='needs-work'?C.rd+'22':r==='good'?C.yl+'22':r==='great'?C.gr+'22':'transparent';
          const ratingBdr = r => r==='needs-work'?C.rd+'66':r==='good'?C.yl+'66':r==='great'?C.gr+'66':C.bo;
          const sectionStatus = group => {
            const cats = Object.values(ev[group]||{});
            const rated = cats.filter(c=>c.rating!=null).length;
            if (rated===0) return null;
            const needs = cats.filter(c=>c.rating==='needs-work').length;
            if (needs===0) return {label:'On Track',color:C.gr};
            if (needs<=2) return {label:'Needs Attention',color:C.yl};
            return {label:'At Risk',color:C.rd};
          };

          const tswpStatus = sectionStatus('tswp');

          const CategoryRow = ({group, catKey, label}) => {
            const cat = ev[group][catKey];

              <div style={{background:ratingBg(cat.rating),border:`1px solid ${ratingBdr(cat.rating)}`,borderRadius:7,padding:'10px 12px',marginBottom:6}}>

                  <RatingBtn val="needs-work" cur={cat.rating} onClick={()=>setEvalRating(group,catKey,'needs-work')} color={C.rd} label="⚠️ Needs Work"/>

                  <RatingBtn val="great" cur={cat.rating} onClick={()=>setEvalRating(group,catKey,'great')} color={C.gr} label="⭐ Great Work"/>
                </div>
                {cat.rating&&<input value={cat.notes} onChange={e=>setEvalNotes(group,catKey,e.target.value)} placeholder="Notes (optional)…" style={{...inpS,width:'100%',fontSize:11,padding:'4px 8px',boxSizing:'border-box'}}/>}
              </div>
            );
          };
          return (
            <div>
              {/* Sign-off */}
              {ev.signedOff
                ? <div style={{fontFamily:MO,fontSize:13,color:C.gr,background:C.gr+'11',border:'1px solid '+C.gr+'44',borderRadius:8,padding:'14px 16px',textAlign:'center',marginBottom:14}}>✅ TRAINING COMPLETE — Signed off {fmtShortDate(ev.signedOffDate)}</div>
                : <button onClick={signOff} disabled={!allRated} style={{width:'100%',fontFamily:MO,fontSize:13,fontWeight:'bold',padding:'12px',marginBottom:14,border:'none',borderRadius:8,cursor:allRated?'pointer':'default',background:allRated?C.gr:C.bo,color:allRated?'#fff':C.mu,opacity:allRated?1:0.5,transition:'all .3s'}}>✅ CLEAR FOR SOLO — Sign Off{!allRated?(!hire.mockCallsComplete?' (complete mock calls first)':!hire.buddyCallsComplete?' (complete buddy calls first)':' (rate all categories first)'):''}</button>
              }
              <div style={{display:'flex',justifyContent:'flex-end',marginBottom:10}}>
                <button onClick={e=>{flash(e);copyEvalReport();}} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',background:copiedEval?C.gr+'22':C.ca,border:`1px solid ${copiedEval?C.gr:C.bo}`,borderRadius:6,color:copiedEval?C.gr:C.tx,cursor:'pointer',transition:'all .3s'}}>{copiedEval?'✓ COPIED':'📤 Copy Full Report'}</button>
              </div>
              {/* Header strip */}
              <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:'10px 14px',marginBottom:12,display:'flex',gap:16,flexWrap:'wrap',alignItems:'center'}}>
                {quizAvg!=null&&<span style={{fontFamily:MO,fontSize:11,color:C.mu}}>Avg Quiz: <span style={{color:quizAvg>=90?C.gr:quizAvg>=70?C.yl:C.rd,fontWeight:'bold'}}>{quizAvg}%</span></span>}
                {finalQuizPct!=null&&<span style={{fontFamily:MO,fontSize:11,color:C.mu}}>Final Quiz: <span style={{color:finalQuizPct>=90?C.gr:finalQuizPct>=75?C.yl:C.rd,fontWeight:'bold'}}>{finalQuizPct}%</span></span>}
                {dmpStatus&&<span style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:dmpStatus.color,background:dmpStatus.color+'22',border:'1px solid '+dmpStatus.color+'55',borderRadius:4,padding:'2px 8px'}}>DMP: {dmpStatus.label}</span>}
                {tswpStatus&&<span style={{fontFamily:MO,fontSize:10,fontWeight:'bold',color:tswpStatus.color,background:tswpStatus.color+'22',border:'1px solid '+tswpStatus.color+'55',borderRadius:4,padding:'2px 8px'}}>TSWP: {tswpStatus.label}</span>}
                {hire.doingWell&&<span style={{fontFamily:MO,fontSize:11,color:C.gr,flex:1,minWidth:120}}>👍 <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>DAYS: </span>{hire.doingWell}</span>}
                {hire.areasOfImprovement&&<span style={{fontFamily:MO,fontSize:11,color:C.yl,flex:1,minWidth:120}}>⚠️ <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>DAYS: </span>{hire.areasOfImprovement}</span>}
                {hire.mockCallsComplete&&hire.mockDoingWell&&<span style={{fontFamily:MO,fontSize:11,color:C.gr,flex:1,minWidth:120}}>👍 <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>MOCK: </span>{hire.mockDoingWell}</span>}
                {hire.mockCallsComplete&&hire.mockAreasOfImprovement&&<span style={{fontFamily:MO,fontSize:11,color:C.yl,flex:1,minWidth:120}}>⚠️ <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>MOCK: </span>{hire.mockAreasOfImprovement}</span>}
                {hire.buddyCallsComplete&&hire.buddyDoingWell&&<span style={{fontFamily:MO,fontSize:11,color:C.gr,flex:1,minWidth:120}}>👍 <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>BUDDY: </span>{hire.buddyDoingWell}</span>}
                {hire.buddyCallsComplete&&hire.buddyAreasOfImprovement&&<span style={{fontFamily:MO,fontSize:11,color:C.yl,flex:1,minWidth:120}}>⚠️ <span style={{color:C.mu,fontSize:9,letterSpacing:1}}>BUDDY: </span>{hire.buddyAreasOfImprovement}</span>}
              </div>
              {/* Sub-tabs */}
              <div style={{display:'flex',gap:0,borderBottom:'1px solid '+C.bo,marginBottom:12}}>
                {[['dmp','DMP Values',dmpStatus],['tswp','Tech Support Word Pictures',tswpStatus]].map(([k,l,st])=>(
                  <button key={k} onClick={()=>setEvalSubTab(k)} style={{fontFamily:MO,fontSize:11,padding:'8px 16px',cursor:'pointer',border:'none',borderBottom:`2px solid ${evalSubTab===k?C.or:'transparent'}`,background:'transparent',color:evalSubTab===k?C.or:C.mu,transition:'all .15s',display:'flex',gap:6,alignItems:'center'}}>
                    {l}{st&&<span style={{fontFamily:MO,fontSize:9,fontWeight:'bold',color:st.color,background:st.color+'22',border:'1px solid '+st.color+'44',borderRadius:3,padding:'1px 5px'}}>{st.label}</span>}
                  </button>
                ))}
              </div>
              {/* DMP Values */}
              {evalSubTab==='dmp'&&<div>
                <CategoryRow group="dmpValues" catKey="honestyIntegrity"     label="Honesty and integrity"/>
                <CategoryRow group="dmpValues" catKey="innovationInitiative" label="Innovation and initiative"/>
                <CategoryRow group="dmpValues" catKey="responsiveness"       label="Responsiveness"/>
                <CategoryRow group="dmpValues" catKey="kindness"             label="Kindness"/>
                <CategoryRow group="dmpValues" catKey="fun"                  label="Fun!"/>
                <CategoryRow group="dmpValues" catKey="profit"               label="Profit"/>
                <CategoryRow group="dmpValues" catKey="teamworkDmp"          label="Teamwork"/>
                <CategoryRow group="dmpValues" catKey="generosity"           label="Generosity"/>
                <CategoryRow group="dmpValues" catKey="appearance"           label="Appearance"/>
              </div>}
              {/* TSWP */}
              {evalSubTab==='tswp'&&<div>
                <CategoryRow group="tswp" catKey="resolutionMindset"  label="Resolution mindset"/>
                <CategoryRow group="tswp" catKey="phoneEtiquette"     label="Phone etiquette"/>
                <CategoryRow group="tswp" catKey="attitude"           label="Attitude"/>
                <CategoryRow group="tswp" catKey="initiative"         label="Initiative"/>
                <CategoryRow group="tswp" catKey="documentingCalls"   label="Documenting calls"/>
                <CategoryRow group="tswp" catKey="responseToCoaching" label="Response to coaching"/>
                <CategoryRow group="tswp" catKey="attendance"         label="Attendance"/>
                <CategoryRow group="tswp" catKey="teamworkTswp"       label="Teamwork"/>
              </div>}
            </div>
          );
        })()}

        {/* ── NOTES ── */}
        {section==='notes'&&<div>
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:12,marginBottom:14}}>
            <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:8}}>ADD SUPERVISOR NOTE</div>
            <div style={{display:'flex',gap:6,marginBottom:8,flexWrap:'wrap'}}>
              {[['positive','👍 Positive',C.gr],['improvement','⚠️ Improvement',C.yl],['milestone','📌 Milestone',C.bl]].map(([k,l,col])=>(
                <button key={k} onClick={()=>setNoteTag(k)} style={{fontFamily:MO,fontSize:11,padding:'4px 10px',borderRadius:4,cursor:'pointer',border:`1px solid ${noteTag===k?col:C.bo}`,background:noteTag===k?col+'22':C.ca,color:noteTag===k?col:C.mu}}>{l}</button>
              ))}
            </div>
            <textarea value={noteBody} onChange={e=>setNoteBody(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))addNote();}} placeholder="Add a note… Ctrl+Enter to save" rows={3} style={{...inpS,width:'100%',resize:'vertical',lineHeight:1.5,marginBottom:8}}/>
            <div style={{display:'flex',justifyContent:'flex-end'}}><OBtn onClick={addNote} disabled={!noteBody.trim()}>+ Add Note</OBtn></div>
          </div>
          {hire.notes.length===0&&<div style={{fontFamily:MO,fontSize:12,color:C.mu,textAlign:'center',padding:'20px 0'}}>No notes yet.</div>}
          {[...hire.notes].sort((a,b)=>a.date.localeCompare(b.date)).map(n=>(
            <div key={n.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:7,padding:12,marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,gap:8}}>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:3,border:'1px solid '+tagCol(n.tag)+'55',color:tagCol(n.tag),background:tagCol(n.tag)+'11'}}>{tagIcon(n.tag)} {n.tag}</span>
                  <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>{fmtShortDate(n.date)}</span>
                </div>
                <button onClick={()=>onUpdate({...hire,notes:hire.notes.filter(x=>x.id!==n.id)})} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11}}>✕</button>
              </div>
              <div style={{fontFamily:MO,fontSize:12,color:C.tx,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{n.body}</div>
            </div>
          ))}
        </div>}

      </div>
    </div>
  );
}

const AddForm = ({isAlumni, onSave, onCancel, name, setName, start, setStart, sup, setSup, disc, setDisc}) => {

  return (
    <div style={{background:C.su,border:'1px solid '+(isAlumni?C.bl:C.pu),borderRadius:8,padding:14,marginBottom:16}}>

        <Btn onClick={onCancel}>Cancel</Btn>
      </div>
    </div>
  );
};

  const [tmplLabelDraft, setTmplLabelDraft]     = useState('');
  const [tmplStepDraft, setTmplStepDraft]       = useState([]);
  const STEP_TYPES = [{id:'session',label:'Session'},{id:'homework',label:'Homework'},{id:'practice',label:'Practice'},{id:'quiz',label:'Quiz'}];
  const updateTemplates = t => { setTemplates(t); saveTemplates(t); };

  // Campaign state
  const [campaigns, setCampaigns]             = useState(loadCampaigns);
  const [showCampaigns, setShowCampaigns]     = useState(false);
  const [selCampaignId, setSelCampaignId]     = useState(null);
  const [showNewCampaign, setShowNewCampaign] = useState(false);
  const [cName, setCName]                     = useState('');
  const [cTemplate, setCTemplate]             = useState('single-track');
  const [cLabel, setCLabel]                   = useState('');
  const [cType, setCType]                     = useState('other');
  const [cSubject, setCSubject]               = useState('');
  const [cDueDate, setCDueDate]               = useState('');
  const [cChecked, setCChecked]               = useState({});
  const [showAddAgents, setShowAddAgents]     = useState(false);
  const [addChecked, setAddChecked]           = useState({});

  const TODAY = new Date().toISOString().split('T')[0];
  const [filterSup, setFilterSup]       = useState('');
  const [filterQueue, setFilterQueue]   = useState('');
  const [filterShift, setFilterShift]   = useState('');
  const [filterActive, setFilterActive] = useState(false);
  const supervisors = [...new Set(agents.filter(a=>a.status==='active'&&!a.specializedRole&&a.supervisor).map(a=>a.supervisor))].sort();
  const activeAgents = agents
    .filter(a=>a.status==='active'&&!a.specializedRole)
    .filter(a=>!filterSup   || a.supervisor===filterSup)
    .filter(a=>!filterQueue || (a.queues && a.queues[filterQueue] && a.queues[filterQueue].active))
    .filter(a=>!filterShift || a.shiftStart===filterShift)
    .filter(a=>!filterActive || (a.extTraining||[]).some(r=>!r.signedOff))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const selectedAgent = activeAgents.find(a=>a.id===selectedId)||null;
  const trainingCount = a=>(a.extTraining||[]).filter(r=>!r.signedOff).length;
  const stepTypeColor = type=>({session:C.or,homework:C.yl,practice:C.bl,quiz:C.pu}[type]||C.mu);

  const updateStep = (recId, stepId, patch) => {
    const updated = {
      ...selectedAgent,
      extTraining: (selectedAgent.extTraining||[]).map(r=>
        r.id!==recId ? r : {...r, steps:r.steps.map(s=>s.id!==stepId?s:{...s,...patch})}
      )
    };
    onUpdateAgent(updated);
  };

  const updateRec = (recId, patch) => {
    onUpdateAgent({
      ...selectedAgent,
      extTraining: (selectedAgent.extTraining||[]).map(r=>r.id!==recId?r:{...r,...patch})
    });
  };

  const calcSessionMins = (start, end) => {
    if (!start || !end) return 0;
    var sp = start.split(':'); var ep = end.split(':');
    var sm = parseInt(sp[0])*60+parseInt(sp[1]);
    var em = parseInt(ep[0])*60+parseInt(ep[1]);
    return Math.max(0, em-sm);
  };

  const fmtMinutes = (mins) => {
    var h = Math.floor(mins/60); var m = mins%60;
    if (h>0&&m>0) return h+' hr '+m+' min';
    if (h>0) return h+' hr';
    return m+' min';
  };

  const totalSessionMins = (sessions) => {
    return (sessions||[]).reduce(function(acc,s){ return acc+calcSessionMins(s.start,s.end); },0);
  };

  const editTraining = (rec) => {
    if (!selectedAgent) return;
    var newLabel = editLabel.trim();
    if (!newLabel) return;
    var newDate = editDate || null;
    var newRecType = editType;
    var newSubject = editSubject;
    var newSubjectLabel = newLabel;

    // Build task name strings using plain ASCII dash (no em dash)
    var oldTaskName = 'Dept. Training: ' + (rec.subjectLabel || '') + ' - ' + selectedAgent.name;
    var newTaskName = 'Dept. Training: ' + newSubjectLabel + ' - ' + selectedAgent.name;

    // Scan all future task keys in sd and rename/delete matching tasks
    var TODAY_KEY = new Date().toISOString().split('T')[0];
    var sdSafe = sd || {};
    var futureKeys = Object.keys(sdSafe).filter(function(k) {
      return k.startsWith('tasks-') && k.replace('tasks-', '') >= TODAY_KEY;
    });

    var foundTaskDate = null;
    futureKeys.forEach(function(k) {
      var dateKey = k.replace('tasks-', '');
      var taskList = sdSafe[k] || [];
      taskList.forEach(function(t) {
        if (t.text === oldTaskName) { foundTaskDate = dateKey; }
      });
    });

    // Delete old task if found
    if (foundTaskDate && onDeleteTask) {
      var oldTaskId = null;
      var oldList = sdSafe['tasks-' + foundTaskDate] || [];
      oldList.forEach(function(t) { if (t.text === oldTaskName) oldTaskId = t.id; });
      if (oldTaskId) onDeleteTask(oldTaskId, foundTaskDate);
    }

    // Create new task on newDate if set
    var newDeferredTaskId = null;
    if (newDate && onCreateTask) {
      newDeferredTaskId = onCreateTask(newTaskName, newDate);
    }

    var updatedRec = {
      ...rec,
      type: newRecType,
      subject: newSubject || rec.subject,
      subjectLabel: newSubjectLabel,
      plannedStartDate: newDate,
      deferredTaskId: newDeferredTaskId
    };
    onUpdateAgent({
      ...selectedAgent,
      extTraining: (selectedAgent.extTraining || []).map(r => r.id !== rec.id ? r : updatedRec)
    });
    setEditingRec(null);
    setEditLabel('');
    setEditDate('');
    setEditType('queue');
    setEditSubject('');
  };

  const generateDeptReport = (agent) => {
    var records = agent.extTraining || [];
    var active = records.filter(function(r) { return !r.signedOff; });
    var completed = records.filter(function(r) { return r.signedOff; });
    var activeQueues = Object.keys(agent.queues || {}).filter(function(k) {
      return agent.queues[k] && agent.queues[k].active;
    }).map(function(k) {
      var q = QUEUES.find(function(x) { return x.id === k; });
      return q ? q.label : k;
    });

    var stepTypeLbl = function(type) {
      return ({session:'Session',homework:'Homework',practice:'Practice',quiz:'Quiz'})[type] || type;
    };
    var fmtReportDate = function(iso) {
      if (!iso) return '';
      var d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
    };
    var fmtMins = function(mins) {
      var h=Math.floor(mins/60); var m=mins%60;
      if(h>0&&m>0) return h+' hr '+m+' min';
      if(h>0) return h+' hr';
      return m+' min';
    };
    var calcMins = function(start,end) {
      if(!start||!end) return 0;
      var sp=start.split(':'); var ep=end.split(':');
      return Math.max(0,(parseInt(ep[0])*60+parseInt(ep[1]))-(parseInt(sp[0])*60+parseInt(sp[1])));
    };

    var html = '<div style="font-family:Courier New,monospace;font-size:15px;color:#111111;background:#ffffff;padding:24px;border-radius:8px;max-width:720px">';

    // Header
    html += '<div style="margin-bottom:18px;border-bottom:2px solid #cccccc;padding-bottom:14px">';
    html += '<div style="font-size:22px;font-weight:bold;color:#111111">' + agent.name + '</div>';
    if (agent.supervisor) html += '<div style="font-size:13px;color:#555555;margin-top:4px">Supervisor: ' + agent.supervisor + '</div>';
    if (activeQueues.length > 0) {
      html += '<div style="font-size:13px;color:#555555;margin-top:2px">Active Queues: ' + activeQueues.join(', ') + '</div>';
    }
    html += '</div>';

    // Section 1 — Open Training
    html += '<div style="font-size:12px;font-weight:bold;color:#c2410c;letter-spacing:2px;margin-bottom:10px">OPEN TRAINING</div>';
    if (active.length > 0) {
      active.forEach(function(rec) {
        var typeColor = rec.type === 'queue' ? '#1d4ed8' : '#7e22ce';
        var typeLabel = rec.type === 'queue' ? 'Queue' : 'Other';
        html += '<div style="margin-bottom:16px;border:1px solid #cccccc;border-radius:6px;padding:12px">';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">';
        html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
        html += '<span style="font-weight:bold;font-size:15px;color:#111111">' + (rec.subjectLabel || '') + '</span>';
        if (rec.plannedStartDate) {
          html += '<span style="font-size:12px;color:#1d4ed8;padding-left:10px;border-left:1px solid #cccccc">' + fmtReportDate(rec.plannedStartDate) + '</span>';
        }
        html += '</div>';
        html += '<span style="font-size:11px;padding:2px 8px;border-radius:3px;border:1px solid ' + typeColor + ';color:' + typeColor + ';white-space:nowrap;flex-shrink:0;font-weight:bold">' + typeLabel + '</span>';
        html += '</div>';
        rec.steps.forEach(function(step) {
          var done = step.completed;
          html += '<div style="padding:6px 0;border-top:1px solid #eeeeee">';
          html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">';
          html += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0">';
          html += '<span style="font-size:14px;color:' + (done ? '#16a34a' : '#888888') + ';flex-shrink:0;font-weight:bold">' + (done ? '[x]' : '[ ]') + '</span>';
          html += '<span style="font-size:14px;color:' + (done ? '#555555' : '#111111') + ';text-decoration:' + (done ? 'line-through' : 'none') + '">' + step.label + '</span>';
          if (done && step.completedDate) html += '<span style="font-size:12px;color:#16a34a;flex-shrink:0">' + fmtReportDate(step.completedDate) + '</span>';
          if (step.type === 'quiz' && done && step.quizCorrect != null && step.quizTotal) {
            var pct = Math.round((step.quizCorrect / step.quizTotal) * 100);
            html += '<span style="font-size:12px;color:#92400e;font-weight:bold;flex-shrink:0">Score: ' + step.quizCorrect + '/' + step.quizTotal + ' (' + pct + '%)</span>';
          }
          html += '</div>';
          html += '<span style="font-size:12px;color:#555555;flex-shrink:0;margin-left:8px">' + stepTypeLbl(step.type) + '</span>';
          html += '</div>';
          if (step.notes && step.notes.trim()) {
            html += '<div style="font-size:13px;color:#555555;margin-top:4px;padding-left:24px;font-style:italic">' + step.notes.trim() + '</div>';
          }
          html += '</div>';
        });
        var sessions = rec.timeSessions || [];
        var totalMins = sessions.reduce(function(acc,s){ return acc+calcMins(s.start,s.end); },0);
        if (sessions.length > 0 && totalMins > 0) {
          html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #eeeeee">';
          html += '<div style="font-size:13px;color:#0f766e;font-weight:bold;margin-bottom:4px">Training Time: ' + fmtMins(totalMins) + ' across ' + sessions.length + ' session' + (sessions.length===1?'':'s') + '</div>';
          sessions.forEach(function(s) {
            var m = calcMins(s.start,s.end);
            html += '<div style="font-size:12px;color:#555555;padding-left:10px">- ' + (s.date||'') + '  ' + (s.start||'') + ' to ' + (s.end||'') + (m>0?' ('+m+' min)':'') + '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
    } else {
      html += '<div style="font-size:13px;color:#555555;font-style:italic;margin-bottom:14px">No open training records.</div>';
    }

    // Section 2 — Completed Training
    if (completed.length > 0) {
      html += '<div style="font-size:12px;font-weight:bold;color:#15803d;letter-spacing:2px;margin-top:12px;margin-bottom:10px">COMPLETED TRAINING</div>';
      completed.forEach(function(rec) {
        html += '<div style="margin-bottom:12px;border:1px solid #cccccc;border-radius:6px;padding:10px;background:#f9fafb">';
        var cSessions = rec.timeSessions || [];
        var cTotal = cSessions.reduce(function(acc,s){ return acc+calcMins(s.start,s.end); },0);
        html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">';
        html += '<span style="font-weight:bold;font-size:14px;color:#333333">' + (rec.subjectLabel || '') + '</span>';
        html += '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap">';
        if (rec.signedOffDate) html += '<span style="font-size:12px;color:#15803d;border:1px solid #15803d;padding:1px 8px;border-radius:3px;font-weight:bold">&#10003; ' + fmtReportDate(rec.signedOffDate) + '</span>';
        if (cTotal > 0) html += '<span style="font-size:12px;color:#0f766e;font-weight:bold">&#9201; ' + fmtMins(cTotal) + '</span>';
        html += '</div>';
        html += '</div>';
        if (rec.queueActiveDate) html += '<div style="font-size:12px;color:#1d4ed8;margin-bottom:8px">Queue active: ' + fmtReportDate(rec.queueActiveDate) + '</div>';
        rec.steps.forEach(function(step) {
          html += '<div style="padding:4px 0;border-top:1px solid #eeeeee">';
          html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">';
          html += '<div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0">';
          html += '<span style="font-size:13px;color:#16a34a;flex-shrink:0;font-weight:bold">[x]</span>';
          html += '<span style="font-size:13px;color:#555555;text-decoration:line-through">' + step.label + '</span>';
          if (step.type === 'quiz' && step.quizCorrect != null && step.quizTotal) {
            var pct2 = Math.round((step.quizCorrect / step.quizTotal) * 100);
            html += '<span style="font-size:12px;color:#92400e;font-weight:bold;flex-shrink:0">Score: ' + step.quizCorrect + '/' + step.quizTotal + ' (' + pct2 + '%)</span>';
          }
          html += '</div>';
          html += '<span style="font-size:12px;color:#555555;flex-shrink:0;margin-left:8px">' + stepTypeLbl(step.type) + '</span>';
          html += '</div>';
          if (step.notes && step.notes.trim()) {
            html += '<div style="font-size:12px;color:#555555;margin-top:2px;padding-left:22px;font-style:italic">' + step.notes.trim() + '</div>';
          }
          html += '</div>';
        });
        if (cSessions.length > 0 && cTotal > 0) {
          html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #eeeeee">';
          cSessions.forEach(function(s) {
            var m = calcMins(s.start,s.end);
            html += '<div style="font-size:12px;color:#555555;padding-left:10px">- ' + (s.date||'') + '  ' + (s.start||'') + ' to ' + (s.end||'') + (m>0?' ('+m+' min)':'') + '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
    }

    html += '</div>';
    return html;
  };

  const copyDeptReport = (agent) => {
    var html = generateDeptReport(agent);
    var plain = agent.name + ' - Dept. Training Report\n';
    plain += 'Supervisor: ' + (agent.supervisor || 'N/A') + '\n\n';
    var records = agent.extTraining || [];
    records.forEach(function(rec) {
      plain += (rec.signedOff ? '[DONE] ' : '[OPEN] ') + (rec.subjectLabel || '') + '\n';
      rec.steps.forEach(function(s) {
        plain += '  ' + (s.completed ? '[x]' : '[ ]') + ' ' + s.label + '\n';
      });
    });
    try {
      var blob = new Blob([html], {type:'text/html'});
      var plainBlob = new Blob([plain], {type:'text/plain'});
      var item = new ClipboardItem({'text/html': blob, 'text/plain': plainBlob});
      navigator.clipboard.write([item]).then(function() {
        setCopiedReport(true);
        setTimeout(function() { setCopiedReport(false); }, 2500);
      });
    } catch(e) {
      navigator.clipboard.writeText(plain).then(function() {
        setCopiedReport(true);
        setTimeout(function() { setCopiedReport(false); }, 2500);
      });
    }
  };

  const saveNewTraining = () => {
    if(!mSubject||(mSubject==='other'&&!mOtherText.trim())) return;
    const isOther      = mSubject==='other';
    const subject      = isOther?'other':mSubject;
    const subjectLabel = isOther ? mOtherText.trim() : (QUEUES.find(q=>q.id===mSubject)?.label||mSubject);
    const type         = isOther?'product':'queue';
    const tmpl         = templates.find(t=>t.id===mTemplate);
    let deferredTaskId = null;
    if(mStartDate&&onCreateTask) deferredTaskId=onCreateTask(`Dept. Training: ${subjectLabel} — ${selectedAgent.name}`,mStartDate);
    const record = {
      id:nid(), type, subject, subjectLabel, templateId:mTemplate,
      steps: tmpl.steps.map(s=>({id:nid(),label:s.label,type:s.type,completed:false,completedDate:null,notes:'',quizCorrect:null,quizTotal:null})),
      plannedStartDate:mStartDate||null, deferredTaskId,
      signedOff:false, signedOffDate:null, queueActiveDate:null, createdDate:TODAY,
      timeLogEnabled:false, timeSessions:[],
    };
    onUpdateAgent({...selectedAgent,extTraining:[...(selectedAgent.extTraining||[]),record]});
    setShowNewModal(false); setMSubject(''); setMOtherText(''); setMTemplate('single-track'); setMStartDate('');
  };

  const confirmSignOff = () => {
    const updatedRecords=(signOffAgent.extTraining||[]).map(r=>r.id!==signOffRec.id?r:{...r,signedOff:true,signedOffDate:TODAY,queueActiveDate:signOffRec.type==='queue'?signOffDate:null});
    let updatedQueues={...signOffAgent.queues};
    if(signOffRec.type==='queue'&&signOffRec.subject!=='other'){
      updatedQueues={...updatedQueues,[signOffRec.subject]:{...updatedQueues[signOffRec.subject],active:true,date:signOffDate}};
    }
    onUpdateAgent({...signOffAgent,extTraining:updatedRecords,queues:updatedQueues});
    setSignOffRec(null); setSignOffAgent(null); setSignOffDate('');
  };

  const undoSignOff = (rec) => {
    if(!window.confirm(`Undo sign-off for "${rec.subjectLabel}"? This will move it back to active training.`)) return;
    const updatedRecords=(selectedAgent.extTraining||[]).map(r=>r.id!==rec.id?r:{...r,signedOff:false,signedOffDate:null,queueActiveDate:null});
    let updatedQueues={...selectedAgent.queues};
    if(rec.type==='queue'&&rec.subject!=='other'){
      updatedQueues={...updatedQueues,[rec.subject]:{...updatedQueues[rec.subject],active:false,date:null}};
    }
    onUpdateAgent({...selectedAgent,extTraining:updatedRecords,queues:updatedQueues});
    setEditingCompleted(p=>{const n={...p};delete n[rec.id];return n;});
  };

  const allRosterAgents = agents.filter(a=>a.status==='active'&&!a.specializedRole).sort((a,b)=>a.name.localeCompare(b.name));

  const updateCampaigns = c => { setCampaigns(c); saveCampaigns(c); };

  const buildRecord = (tmpl, camp, campId, agentName, dueDate) => ({
    id:nid(), type:camp.type||'other', subject:camp.subject||'', subjectLabel:camp.label||'',
    templateId:camp.templateId||'single-track', campaignId:campId,
    steps:(tmpl.steps||[]).map(s=>({id:nid(),label:s.label,type:s.type,completed:false,completedDate:null,notes:'',quizCorrect:null,quizTotal:null})),
    plannedStartDate:dueDate||null, deferredTaskId:null,
    signedOff:false, signedOffDate:null, queueActiveDate:null, createdDate:TODAY,
    timeLogEnabled:false, timeSessions:[],
  });

  const createCampaign = () => {
    if (!cName.trim()) return;
    var tmpl = templates.find(t=>t.id===cTemplate) || templates[0];
    if (!tmpl) return;
    var selectedIds = Object.keys(cChecked).filter(id=>cChecked[id]);
    if (selectedIds.length === 0) { alert('Select at least one agent.'); return; }
    var campId = nid();
    var subLbl = cLabel.trim() || tmpl.label;
    var campObj = {id:campId, name:cName.trim(), templateId:cTemplate, label:subLbl, type:cType, subject:cSubject, dueDate:cDueDate||null, createdDate:TODAY, agentIds:selectedIds};
    selectedIds.forEach(function(agentId) {
      var agent = agents.find(function(a){ return String(a.id)===String(agentId); });
      if (!agent) return;
      onUpdateAgent({...agent, extTraining:[...(agent.extTraining||[]), buildRecord(tmpl,campObj,campId,agent.name,cDueDate)]});
    });
    updateCampaigns([...campaigns, campObj]);
    setSelCampaignId(campId); setShowNewCampaign(false);
    setCName(''); setCTemplate('single-track'); setCLabel(''); setCType('other'); setCSubject(''); setCDueDate(''); setCChecked({});
  };

  const pushToCampaign = (camp) => {
    var newIds = Object.keys(addChecked).filter(id=>addChecked[id]);
    if (newIds.length === 0) return;
    var tmpl = templates.find(t=>t.id===camp.templateId) || templates[0];
    if (!tmpl) return;
    newIds.forEach(function(agentId) {
      var agent = agents.find(function(a){ return String(a.id)===String(agentId); });
      if (!agent) return;
      onUpdateAgent({...agent, extTraining:[...(agent.extTraining||[]), buildRecord(tmpl,camp,camp.id,agent.name,camp.dueDate)]});
    });
    var updated = {...camp, agentIds:[...(camp.agentIds||[]),...newIds]};
    updateCampaigns(campaigns.map(c=>c.id===camp.id?updated:c));
    setShowAddAgents(false); setAddChecked({});
  };

  const getCampStatus = (camp) => {
    return (camp.agentIds||[]).map(function(agentId) {
      var a = agents.find(function(x){ return String(x.id)===String(agentId); });
      if (!a) return {agentId,name:'Removed Agent',supervisor:'',done:0,total:0,signedOff:false};
      var rec = (a.extTraining||[]).find(r=>r.campaignId===camp.id);
      if (!rec) return {agentId,name:a.name,supervisor:a.supervisor||'',done:0,total:0,signedOff:false,noRecord:true};
      var done=(rec.steps||[]).filter(s=>s.completed).length;
      return {agentId,name:a.name,supervisor:a.supervisor||'',done,total:(rec.steps||[]).length,signedOff:rec.signedOff};
    });
  };

  const inpS={fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'6px 8px',color:C.tx,outline:'none'};

  return (
    <div style={{display:'flex',gap:0,alignItems:'flex-start',minHeight:400}}>

      {/* LEFT PANEL */}
      <div style={{width:180,flexShrink:0,background:C.su,border:'1px solid '+C.bo,borderRadius:8,overflowY:'auto',maxHeight:'calc(100vh - 260px)',marginRight:12}}>
        <div style={{padding:'8px 10px',borderBottom:'1px solid '+C.bo,background:C.ca,borderRadius:'8px 8px 0 0',display:'flex',flexDirection:'column',gap:4}}>
          <select value={filterSup} onChange={e=>{setFilterSup(e.target.value);setSelectedId(null);}} style={{fontFamily:MO,fontSize:9,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 4px',color:filterSup?C.tx:C.mu,outline:'none',width:'100%'}}>
            <option value="">All Supervisors</option>
            {supervisors.map(s=><option key={s} value={s}>{s.split(' ').slice(-1)[0]}</option>)}
          </select>
          <select value={filterQueue} onChange={e=>{setFilterQueue(e.target.value);setSelectedId(null);}} style={{fontFamily:MO,fontSize:9,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 4px',color:filterQueue?C.tx:C.mu,outline:'none',width:'100%'}}>
            <option value="">All Queues</option>
