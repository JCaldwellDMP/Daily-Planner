      <span onClick={()=>toggle(item.id)} style={{fontFamily:MO,fontSize:12,color:C.tx,flex:1,lineHeight:1.3,cursor:'pointer',minWidth:100}}>{item.text}</span>
      <SrcBadge source={item.source}/>
      <PriBadge p={item.priority}/>
      <DeferPicker taskId={item.id} deferDates={deferDates} setDeferDates={setDeferDates} deferred={deferred} onUpdateDeferred={onUpdateDeferred}/>
    </div>
  );
}

function ProgressTab({ tasks, done, deferred, timeBlocks, onUpdateDone, onUpdateDeferred, onBack, onNext, isMobile }) {
  const [deferDates,setDeferDates]=useState({});
  const doneSet    =new Set(done);
  const deferredSet=new Set(Object.keys(deferred));
  const toggle=id=>onUpdateDone(doneSet.has(id)?done.filter(x=>x!==id):[...done,id]);
  const active      =tasks.filter(i=>!doneSet.has(i.id)&&!deferredSet.has(String(i.id))).sort(priSort);
  const completed   =tasks.filter(i=> doneSet.has(i.id));
  const deferredItems=tasks.filter(i=>deferredSet.has(String(i.id))&&!doneSet.has(i.id));
  const endLabel=slot=>{ const m=slotToMin(slot)+15,hh=Math.floor(m/60),mm=m%60; const ap=hh>=12?'PM':'AM',hd=hh>12?hh-12:hh===0?12:hh; return hd+':'+(mm===0?'00':mm)+' '+ap; };
  const sortedBlocks=ALL_TIME_SLOTS.filter(s=>slotArr(timeBlocks[s]).length>0).map(s=>({slot:s,items:slotArr(timeBlocks[s]),min:slotToMin(s)}));
  const groups=[];
  sortedBlocks.forEach(b=>{ const last=groups[groups.length-1]; const sameContent=last&&last.items.length===b.items.length&&last.items.length===1&&last.items[0].text===b.items[0].text&&b.min-last.endMin===15; if(sameContent){last.endMin=b.min;last.endSlot=b.slot;}else groups.push({items:b.items,startSlot:b.slot,endSlot:b.slot,startMin:b.min,endMin:b.min}); });

  const tagRe = /^([A-Za-z]+(?:[- ][A-Za-z]+){0,2})\s*:/;
  const tagCounts = {};
  active.forEach(item => {
    const m = item.text.match(tagRe);
    if (m) { const tag = m[1].trim(); tagCounts[tag] = (tagCounts[tag]||0)+1; }
  });
  const tagEntries = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]);

  const [showSchedule, setShowSchedule] = useState(!isMobile);
  const [showLabels, setShowLabels] = useState(!isMobile);

  return (
    <div>
      <div style={{fontFamily:MO,fontSize:11,color:C.or,letterSpacing:2,marginBottom:4}}>STEP 4 OF 5</div>
      <h2 style={{fontFamily:MO,fontSize:20,color:C.tx,margin:'0 0 6px'}}>Progress</h2>
      <p style={{fontFamily:MO,fontSize:13,color:C.mu,margin:'0 0 14px'}}>Check off tasks as you complete them.</p>
      <div style={{display:'flex',gap:10,justifyContent:'space-between',marginBottom:14,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:8}}>
          <Btn onClick={onBack}>← Back</Btn>
          <OBtn onClick={onNext}>Next →</OBtn>
        </div>
        <div style={{display:'flex',gap:6}}>
          {groups.length>0&&<button onClick={()=>setShowSchedule(p=>!p)} style={{fontFamily:MO,fontSize:11,padding:'4px 10px',borderRadius:6,cursor:'pointer',border:'1px solid '+(showSchedule?C.or:C.bo),background:showSchedule?C.or+'22':C.ca,color:showSchedule?C.or:C.mu}}>📅 Schedule</button>}
          {tagEntries.length>0&&<button onClick={()=>setShowLabels(p=>!p)} style={{fontFamily:MO,fontSize:11,padding:'4px 10px',borderRadius:6,cursor:'pointer',border:'1px solid '+(showLabels?C.or:C.bo),background:showLabels?C.or+'22':C.ca,color:showLabels?C.or:C.mu}}>🏷 Labels</button>}
        </div>
      </div>
      <div style={{display:'flex',gap:16,alignItems:'flex-start',flexWrap:isMobile?'wrap':'nowrap'}}>
        {showSchedule&&(
          <div style={{width:isMobile?'100%':220,flexShrink:0}}>
            <div style={{fontFamily:MO,fontSize:10,color:C.mu,letterSpacing:2,marginBottom:8,paddingBottom:5,borderBottom:'1px solid '+C.bo}}>SCHEDULE</div>
            {groups.length===0
              ? <div style={{fontFamily:MO,fontSize:12,color:C.mu,textAlign:'center',padding:'20px 0',lineHeight:1.6}}>No blocks scheduled yet.</div>
              : groups.map((g,i)=>(
                <div key={i} style={{marginBottom:5,padding:'7px 10px',background:C.ca,border:'1px solid '+C.bo,borderRadius:5}}>
                  <div style={{fontFamily:MO,fontSize:10,color:C.or,marginBottom:4}}>{g.startSlot}{g.startSlot!==g.endSlot?' – '+endLabel(g.endSlot):''}</div>
                  {g.items.map((item,idx)=>(
                    <div key={idx} style={{fontFamily:MO,fontSize:12,color:C.tx,lineHeight:1.4,paddingLeft:g.items.length>1?8:0,borderLeft:g.items.length>1?'2px solid '+C.bo:'none',marginBottom:idx<g.items.length-1?3:0}}>
                      {g.items.length>1&&<span style={{color:C.mu,marginRight:4}}>·</span>}{item.text}
                    </div>
                  ))}
                </div>
              ))
            }
          </div>
        )}
        {showSchedule&&!isMobile&&<div style={{width:1,background:C.bo,alignSelf:'stretch',flexShrink:0,minHeight:200}}/>}
        <div style={{flex:1,minWidth:0,width:isMobile?'100%':undefined}}>
          <div style={{fontFamily:MO,fontSize:10,color:C.mu,letterSpacing:2,marginBottom:8,paddingBottom:5,borderBottom:'1px solid '+C.bo}}>
            TASKS — {completed.length}/{tasks.length} DONE
          </div>
          {tasks.length===0
            ? <div style={{fontFamily:MO,fontSize:12,color:C.mu,padding:'20px 0'}}>No tasks yet.</div>
            : <>
              {active.map(item=><ProgressTaskRow key={item.id} item={item} toggle={toggle} deferred={deferred} onUpdateDeferred={onUpdateDeferred} deferDates={deferDates} setDeferDates={setDeferDates}/>)}
              {deferredItems.length>0&&(
                <>
                  <div style={{fontFamily:MO,fontSize:10,color:C.bl,letterSpacing:2,margin:'10px 0 5px',paddingTop:6,borderTop:'1px solid '+C.bo}}>DEFERRED</div>
                  {deferredItems.map(item=>(
                    <div key={item.id} style={{display:'flex',gap:8,alignItems:'center',background:'#0d1520',border:'1px solid '+C.bl+'33',borderRadius:5,padding:'8px 10px',marginBottom:4,opacity:0.75,flexWrap:'wrap'}}>
                      <Dot p={item.priority} size={6}/>
                      <span style={{fontFamily:MO,fontSize:12,color:C.mu,flex:1,minWidth:100}}>{item.text}</span>
                      <span style={{fontFamily:MO,fontSize:9,color:C.bl,border:'1px solid '+C.bl+'44',padding:'1px 6px',borderRadius:3,whiteSpace:'nowrap'}}>→ {deferred[item.id]?inputFmt(deferred[item.id]):'deferred'}</span>
                      <button onClick={()=>{ const nd={...deferred}; delete nd[item.id]; onUpdateDeferred(nd); }} style={{background:'none',border:'none',color:C.mu,cursor:'pointer',fontSize:11,padding:'0 2px'}} title="Un-defer">✕</button>
                    </div>
                  ))}
                </>
              )}
              {completed.length>0&&(
                <>
                  <div style={{fontFamily:MO,fontSize:10,color:C.mu,letterSpacing:2,margin:'10px 0 5px',paddingTop:6,borderTop:'1px solid '+C.bo}}>COMPLETED</div>
                  {completed.map(item=>(
                    <div key={item.id} onClick={()=>toggle(item.id)} style={{display:'flex',gap:8,alignItems:'center',background:'#1a2010',border:'1px solid '+C.gr+'33',borderRadius:5,padding:'8px 10px',marginBottom:4,cursor:'pointer',opacity:0.65}}>
                      <div style={{width:15,height:15,borderRadius:2,border:'2px solid '+C.gr,background:C.gr,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <span style={{color:'#fff',fontSize:9,lineHeight:1}}>✓</span>
                      </div>
                      <Dot p={item.priority} size={6}/>
                      <span style={{fontFamily:MO,fontSize:12,color:C.mu,flex:1,textDecoration:'line-through'}}>{item.text}</span>
                    </div>
                  ))}
                </>
              )}
            </>
          }
        </div>
        {showLabels&&tagEntries.length>0&&(
          <div style={{width:isMobile?'100%':180,flexShrink:0}}>
            <div style={{fontFamily:MO,fontSize:10,color:C.mu,letterSpacing:2,marginBottom:8,paddingBottom:5,borderBottom:'1px solid '+C.bo}}>TASK LABELS</div>
            {tagEntries.map(([tag,count])=>(
              <div key={tag} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 8px',background:C.ca,border:'1px solid '+C.bo,borderRadius:5,marginBottom:4}}>
                <span style={{fontFamily:MO,fontSize:11,color:C.tx,flex:1,wordBreak:'break-word'}}>{tag}:</span>
                <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.or,flexShrink:0,marginLeft:6}}>{count}</span>
              </div>
            ))}
            <div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:8,paddingTop:6,borderTop:'1px solid '+C.bo}}>
              {tagEntries.reduce((s,[,c])=>s+c,0)} unfinished
            </div>
          </div>
        )}
      </div>
      <div style={{display:'flex',gap:10,justifyContent:'space-between',marginTop:20}}>
        <Btn onClick={onBack}>← Back</Btn><OBtn onClick={onNext}>Next →</OBtn>
      </div>
    </div>
  );
}

function WrapUpTab({ tasks, done, timeBlocks, awayMs, trainMs, watchMs, timerLogs, ds, sums, onSaveSummary, onBack, isMobile, deferred={} }) {
  const [saved,setSaved]=useState(!!sums[ds]);
  const doneSet    = new Set(done);
  const deferredSet= new Set(Object.keys(deferred).map(String));
  const activeTasks  = tasks.filter(i => !deferredSet.has(String(i.id)));
  const compItems    = activeTasks.filter(i =>  doneSet.has(i.id));
  const undoItems    = activeTasks.filter(i => !doneSet.has(i.id));
  const pct=activeTasks.length>0?Math.round((compItems.length/activeTasks.length)*100):0;
  const logAway =timerLogs.filter(r=>r.type==='Away')    .reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
  const logTrain=timerLogs.filter(r=>r.type==='Training').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
  const logWatch=timerLogs.filter(r=>r.type==='Watching').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;

  const saveSummary=()=>{
    onSaveSummary({
      dateKey:ds, dateLabel:fmtDate(ds), savedAt:new Date().toISOString(),
      completed:compItems, undone:undoItems,
      timerTotals:{away:awayMs+logAway,training:trainMs+logTrain,watching:watchMs+logWatch},
      snapshot:{tasks,done,timeBlocks:timeBlocks||{},deferred}
    });
    setSaved(true);
  };

  const [copyStyle,setCopyStyle]       = useState('plain');
  const [copyPlatform,setCopyPlatform] = useState('email');
  const [copied,setCopied]             = useState(false);

  const fmtMsShort = ms => { const tot=Math.floor(ms/1000),m=Math.floor(tot/60),h=Math.floor(m/60); return h>0?`${h}h ${m%60}m`:`${m}m`; };
  const awayTotal  = awayMs+logAway;
  const trainTotal = trainMs+logTrain;
  const watchTotal = watchMs+logWatch;

  const generateCopy = () => {
    const dateStr = fmtDate(ds);
    const pctStr  = pct+'%';
    const priTag  = i => i.priority ? '['+i.priority[0]+'] ' : '';
    if (copyStyle==='minimal') {
      return copyPlatform==='teams'
        ? `📅 EOD ${ds}: ✅ ${compItems.length}/${activeTasks.length} (${pctStr}) | 🎓 ${fmtMsShort(trainTotal)} | 👁 ${fmtMsShort(watchTotal)} | 🚶 ${fmtMsShort(awayTotal)}`
        : `EOD Update ${dateStr} — ${compItems.length}/${activeTasks.length} tasks (${pctStr}). Training ${fmtMsShort(trainTotal)}, Watching ${fmtMsShort(watchTotal)}, Away ${fmtMsShort(awayTotal)}.`;
    }
    if (copyStyle==='plain') {
      if (copyPlatform==='teams') {
        const L=[`📅 **EOD Update — ${dateStr}**`,'']; 
        if(compItems.length){L.push(`✅ **Completed (${compItems.length}):**`);compItems.forEach(i=>L.push('  • '+i.text));L.push('');}
        if(undoItems.length){L.push(`⏳ **Carrying Forward (${undoItems.length}):**`);undoItems.forEach(i=>L.push('  • '+i.text));L.push('');}
        L.push(`⏱ Training: ${fmtMsShort(trainTotal)} | Watching: ${fmtMsShort(watchTotal)} | Away: ${fmtMsShort(awayTotal)}`);
        L.push(`📊 Day completion: ${pctStr}`);
        return L.join('\n');
      } else {
        const L=[`Subject: EOD Update — ${dateStr}`,'',`Here's my end of day update for ${dateStr}:`,''];
        if(compItems.length){L.push(`Completed (${compItems.length}):`);compItems.forEach(i=>L.push('  ✓ '+i.text));L.push('');}
        if(undoItems.length){L.push(`Left for tomorrow (${undoItems.length}):`);undoItems.forEach(i=>L.push('  · '+i.text));L.push('');}
        L.push('Time breakdown:',`  Training:  ${fmtMsShort(trainTotal)}`,`  Watching:  ${fmtMsShort(watchTotal)}`,`  Away:      ${fmtMsShort(awayTotal)}`,'',`Completion: ${pctStr}`);
        return L.join('\n');
      }
    }
    // structured
    if (copyPlatform==='teams') {
      const L=[`📅 **DAILY WRAP-UP — ${dateStr}**`,'']; 
      L.push(`✅ **COMPLETED ${compItems.length}/${activeTasks.length} — ${pctStr}**`);
      compItems.forEach(i=>L.push('  [✓] '+priTag(i)+i.text));
      if(undoItems.length){L.push('');L.push(`⏳ **LEFT UNDONE (${undoItems.length})**`);undoItems.forEach(i=>L.push('  [ ] '+priTag(i)+i.text));}
      L.push('','⏱ **TIMER SUMMARY**',`  Training:  ${fmtMsShort(trainTotal)}`,`  Watching:  ${fmtMsShort(watchTotal)}`,`  Away:      ${fmtMsShort(awayTotal)}`);
      return L.join('\n');
    } else {
      const sep='─'.repeat(42);
      const L=[`Subject: Daily Wrap-Up — ${dateStr}`,'',sep,`DAILY WRAP-UP — ${dateStr}`,sep,''];
      L.push(`COMPLETED (${compItems.length}/${activeTasks.length} — ${pctStr})`);
      compItems.forEach(i=>L.push('  [✓] '+priTag(i)+i.text));
      if(undoItems.length){L.push('');L.push(`LEFT UNDONE (${undoItems.length})`);undoItems.forEach(i=>L.push('  [ ] '+priTag(i)+i.text));}
      L.push('','TIMER SUMMARY',`  Training:  ${fmtMsShort(trainTotal)}`,`  Watching:  ${fmtMsShort(watchTotal)}`,`  Away:      ${fmtMsShort(awayTotal)}`,'',sep);
      return L.join('\n');
    }
  };

  const doCopy = () => {
    const text=generateCopy();
    navigator.clipboard.writeText(text)
      .then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);})
      .catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);setCopied(true);setTimeout(()=>setCopied(false),2500);});
  };

  useEffect(()=>{ setSaved(!!sums[ds]); },[ds,sums]);

  const AM='#f59e0b';
  const hml=items=>{ const h=items.filter(i=>i.priority==='High').length,m=items.filter(i=>i.priority==='Medium').length,l=items.filter(i=>i.priority==='Low').length; return (<div style={{display:'flex',justifyContent:'center',gap:8,marginTop:5}}><span style={{fontFamily:MO,fontSize:9,color:C.rd}}>{h}H</span><span style={{fontFamily:MO,fontSize:9,color:C.mu}}>·</span><span style={{fontFamily:MO,fontSize:9,color:C.yl}}>{m}M</span><span style={{fontFamily:MO,fontSize:9,color:C.mu}}>·</span><span style={{fontFamily:MO,fontSize:9,color:C.gr}}>{l}L</span></div>); };

  return (
    <div>
      <div style={{fontFamily:MO,fontSize:11,color:C.or,letterSpacing:2,marginBottom:4}}>STEP 5 OF 5</div>
      <h2 style={{fontFamily:MO,fontSize:20,color:C.tx,margin:'0 0 6px'}}>Wrap Up</h2>
      <p style={{fontFamily:MO,fontSize:13,color:C.mu,margin:'0 0 20px'}}>Review your day, save a summary, and carry unfinished work forward.</p>
      <div style={{marginBottom:16}}><Btn onClick={onBack}>← Back</Btn></div>
      {deferredSet.size > 0 && (
        <div style={{fontFamily:MO,fontSize:11,color:C.bl,background:'#0d1520',border:'1px solid '+C.bl+'44',borderRadius:6,padding:'8px 14px',marginBottom:14}}>
          ⏭ {deferredSet.size} deferred task{deferredSet.size!==1?'s':''} excluded from today's counts and summary.
        </div>
      )}
      <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(3,1fr)',gap:10,marginBottom:16}}>
        {[{l:'STARTED WITH',v:activeTasks.length,c:C.or,items:activeTasks},{l:'COMPLETED',v:compItems.length,c:C.gr,items:compItems},{l:'LEFT UNDONE',v:undoItems.length,c:AM,items:undoItems}].map(x=>(
          <div key={x.l} style={{background:C.ca,border:'1px solid '+(x.l==='LEFT UNDONE'?AM+'55':C.bo),borderRadius:8,padding:'14px 8px 10px',textAlign:'center'}}>
            <div style={{fontFamily:MO,fontSize:isMobile?22:28,color:x.c,fontWeight:'bold'}}>{x.v}</div>
            <div style={{fontFamily:MO,fontSize:isMobile?8:9,color:x.l==='LEFT UNDONE'?AM:C.mu,letterSpacing:isMobile?1:2,marginTop:4}}>{x.l}</div>
            {hml(x.items)}
          </div>
        ))}
      </div>
      {[{label:'TRAINING TIME',ms:trainMs+logTrain,color:C.pu},{label:'WATCHING DEPT',ms:watchMs+logWatch,color:C.bl},{label:'TIME AWAY',ms:awayMs+logAway,color:C.rd}].map(x=>(
        <div key={x.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,padding:'11px 16px',marginBottom:8,flexWrap:'wrap',gap:6}}>
          <span style={{fontFamily:MO,fontSize:11,color:C.tx,letterSpacing:1}}>{x.label}</span>
          <span style={{fontFamily:MO,fontSize:13,color:x.color,fontWeight:'bold'}}>{fmtMs(x.ms)}</span>
        </div>
      ))}
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6,marginTop:4}}>
        <span style={{fontFamily:MO,fontSize:12,color:C.tx}}>Day completion</span>
        <span style={{fontFamily:MO,fontSize:12,color:C.or}}>{pct}%</span>
      </div>
      <div style={{height:4,background:C.bo,borderRadius:2,marginBottom:20}}>
        <div style={{height:'100%',width:`${pct}%`,background:C.or,borderRadius:2,transition:'width .5s'}}/>
      </div>
      <button onClick={e=>{flash(e);saveSummary();}} style={{display:'block',width:'100%',fontFamily:MO,fontSize:14,fontWeight:'bold',padding:'15px',border:'none',borderRadius:8,cursor:'pointer',marginBottom:8,background:saved?C.gr:C.or,color:'#fff',transition:'all .3s'}}>{saved?'☑ SAVED — Click to Overwrite':"💾 SAVE TODAY'S SUMMARY"}</button>
      {saved&&<div style={{fontFamily:MO,fontSize:11,color:C.mu,textAlign:'center',marginBottom:8}}>Last saved at {new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})} · {compItems.length} task{compItems.length!==1?'s':''} complete</div>}
      <div style={{background:C.ca,border:`1px solid ${C.bo}`,borderRadius:8,padding:14,marginBottom:16}}>
        <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:10}}>📤 EOD REPORT</div>
        <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
          <div style={{flex:'1 1 140px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:5}}>STYLE</div>
            <div style={{display:'flex',gap:4}}>
              {[['plain','Plain'],['structured','Structured'],['minimal','Minimal']].map(([v,l])=>(
                <button key={v} onClick={()=>setCopyStyle(v)} style={{flex:1,fontFamily:MO,fontSize:10,padding:'5px 0',borderRadius:4,cursor:'pointer',border:'1px solid '+(copyStyle===v?C.or:C.bo),background:copyStyle===v?C.or+'22':C.ca,color:copyStyle===v?C.or:C.mu,transition:'all .12s'}}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{flex:'1 1 100px'}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:5}}>PLATFORM</div>
            <div style={{display:'flex',gap:4}}>
              {[['email','Email'],['teams','Teams']].map(([v,l])=>(
                <button key={v} onClick={()=>setCopyPlatform(v)} style={{flex:1,fontFamily:MO,fontSize:10,padding:'5px 0',borderRadius:4,cursor:'pointer',border:'1px solid '+(copyPlatform===v?C.bl:C.bo),background:copyPlatform===v?C.bl+'22':C.ca,color:copyPlatform===v?C.bl:C.mu,transition:'all .12s'}}>{l}</button>
              ))}
            </div>
          </div>
        </div>
        <button onClick={e=>{flash(e);doCopy();}} style={{display:'block',width:'100%',fontFamily:MO,fontSize:12,padding:'10px',border:`1px solid ${copied?C.gr:C.bo}`,borderRadius:6,cursor:'pointer',background:copied?C.gr+'22':C.ca,color:copied?C.gr:C.tx,transition:'all .3s'}}>
          {copied?'✓ COPIED TO CLIPBOARD':'↑ COPY EOD REPORT'}
        </button>
      </div>
      <div style={{marginTop:4}}><Btn onClick={onBack}>← Back</Btn></div>
    </div>
  );
}

function NotesTab({ notes=[], onUpdateNotes, fontSize }) {
  const PRESET_TAGS = ['Idea','Observation','FYI'];
  const [body,setBody]         = useState('');
  const [tag,setTag]           = useState('');
  const [customTag,setCustomTag] = useState('');
  const [editId,setEditId]     = useState(null);
  const [editBody,setEditBody] = useState('');
  const [editTag,setEditTag]   = useState('');
  const [editCustom,setEditCustom] = useState('');
  const [filterTag,setFilterTag]   = useState('');
  const [search,setSearch]         = useState('');

  const activeTag = tag==='custom' ? customTag.trim() : tag;
  const editActiveTag = editTag==='custom' ? editCustom.trim() : editTag;

  const addNote = () => {
    if (!body.trim()) return;
    const note = { id: nid(), body: body.trim(), tag: activeTag||'', createdAt: new Date().toISOString() };
    onUpdateNotes([note, ...notes]);
    setBody(''); setTag(''); setCustomTag('');
  };

  const deleteNote = id => onUpdateNotes(notes.filter(n=>n.id!==id));

  const startEdit = note => {
    setEditId(note.id);
    setEditBody(note.body);
    const isPreset = PRESET_TAGS.includes(note.tag);
    setEditTag(isPreset ? note.tag : note.tag ? 'custom' : '');
    setEditCustom(isPreset ? '' : note.tag||'');
  };

  const commitEdit = id => {
    if (!editBody.trim()) return;
    onUpdateNotes(notes.map(n=>n.id===id?{...n,body:editBody.trim(),tag:editActiveTag||''}:n));
    setEditId(null);
  };

  const allTags = [...new Set(notes.map(n=>n.tag).filter(Boolean))].sort();
  const filtered = notes
    .filter(n=> filterTag ? n.tag===filterTag : true)
    .filter(n=> search ? n.body.toLowerCase().includes(search.toLowerCase())||n.tag.toLowerCase().includes(search.toLowerCase()) : true)
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  const tagColor = t => t==='Idea'?C.yl : t==='Observation'?C.bl : t==='FYI'?C.gr : C.pu;

  const TagBadge = ({t}) => !t ? null : (
    <span style={{fontFamily:MO,fontSize:9,padding:'1px 6px',borderRadius:3,border:`1px solid ${tagColor(t)}55`,color:tagColor(t),background:tagColor(t)+'11',whiteSpace:'nowrap'}}>{t}</span>
  );

  const TagPicker = ({value, onSet, customVal, onCustom}) => (
    <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
      {PRESET_TAGS.map(t=>(
        <button key={t} onClick={()=>onSet(value===t?'':t)} style={{fontFamily:MO,fontSize:11,padding:'3px 9px',borderRadius:4,cursor:'pointer',border:`1px solid ${value===t?tagColor(t):C.bo}`,background:value===t?tagColor(t)+'22':C.ca,color:value===t?tagColor(t):C.mu,transition:'all .12s'}}>{t}</button>
      ))}
      <button onClick={()=>onSet(value==='custom'?'':'custom')} style={{fontFamily:MO,fontSize:11,padding:'3px 9px',borderRadius:4,cursor:'pointer',border:`1px solid ${value==='custom'?C.pu:C.bo}`,background:value==='custom'?C.pu+'22':C.ca,color:value==='custom'?C.pu:C.mu,transition:'all .12s'}}>+ Custom</button>
      {value==='custom'&&<input autoFocus value={customVal} onChange={e=>onCustom(e.target.value)} placeholder="Tag name…" style={{fontFamily:MO,fontSize:11,background:C.ca,border:'1px solid '+C.pu,borderRadius:4,padding:'3px 8px',color:C.tx,outline:'none',width:100}}/>}
    </div>
  );

  return (
    <div>
      <h2 style={{fontFamily:MO,fontSize:20,color:C.tx,margin:'0 0 6px'}}>📝 Notes</h2>
      <p style={{fontFamily:MO,fontSize:13,color:C.mu,margin:'0 0 16px'}}>Day-agnostic observations, ideas, and FYIs. Sorted by newest first.</p>

      {/* ── ADD NOTE ── */}
      <div style={{background:C.su,border:`1px solid ${C.bo}`,borderRadius:8,padding:14,marginBottom:16}}>
        <div style={{fontFamily:MO,fontSize:11,color:C.or,letterSpacing:2,marginBottom:10}}>NEW NOTE</div>
        <TagPicker value={tag} onSet={setTag} customVal={customTag} onCustom={setCustomTag}/>
        <textarea value={body} onChange={e=>setBody(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))addNote();}} placeholder="Type your note… Ctrl+Enter to save" rows={3} style={{fontFamily:MO,fontSize:13,color:C.tx,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,padding:'10px 12px',width:'100%',resize:'vertical',outline:'none',marginTop:10,boxSizing:'border-box',lineHeight:1.5}}/>
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
          <OBtn onClick={addNote} disabled={!body.trim()}>+ Add Note</OBtn>
        </div>
      </div>

      {/* ── FILTER / SEARCH ── */}
      {notes.length>0&&(
        <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search notes…" style={{fontFamily:MO,fontSize:12,background:C.ca,border:'1px solid '+C.bo,borderRadius:6,padding:'6px 10px',color:C.tx,outline:'none',flex:'1 1 160px',minWidth:0}}/>
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
            <button onClick={()=>setFilterTag('')} style={{fontFamily:MO,fontSize:11,padding:'4px 9px',borderRadius:4,cursor:'pointer',border:'1px solid '+(filterTag===''?C.or:C.bo),background:filterTag===''?C.or+'22':C.ca,color:filterTag===''?C.or:C.mu}}>All</button>
            {allTags.map(t=>(
              <button key={t} onClick={()=>setFilterTag(filterTag===t?'':t)} style={{fontFamily:MO,fontSize:11,padding:'4px 9px',borderRadius:4,cursor:'pointer',border:`1px solid ${filterTag===t?tagColor(t):C.bo}`,background:filterTag===t?tagColor(t)+'22':C.ca,color:filterTag===t?tagColor(t):C.mu}}>{t}</button>
            ))}
          </div>
        </div>
      )}

      {/* ── NOTES LIST ── */}
      {filtered.length===0
        ? <div style={{background:C.ca,border:`1px dashed ${C.bo}`,borderRadius:8,padding:'50px 20px',textAlign:'center'}}>
            <div style={{fontSize:32,marginBottom:10}}>📝</div>
            <div style={{fontFamily:MO,fontSize:13,color:C.mu}}>{notes.length===0?'No notes yet. Add one above.':'No notes match your filter.'}</div>
          </div>
        : filtered.map(note=>(
          <div key={note.id} style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:14,marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,marginBottom:6,flexWrap:'wrap'}}>
              <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                <span style={{fontFamily:MO,fontSize:10,color:C.mu}}>{fmtDateTime(note.createdAt)}</span>
                {note.tag&&<TagBadge t={note.tag}/>}
              </div>
              <div style={{display:'flex',gap:6,flexShrink:0}}>
                {editId!==note.id&&<button onClick={()=>startEdit(note)} style={{fontFamily:MO,fontSize:11,padding:'2px 8px',background:'none',border:'1px solid '+C.bo,borderRadius:4,color:C.mu,cursor:'pointer'}}>✎ Edit</button>}
                <button onClick={()=>deleteNote(note.id)} style={{fontFamily:MO,fontSize:11,padding:'2px 8px',background:'none',border:'1px solid '+C.rd+'44',borderRadius:4,color:C.rd,cursor:'pointer'}}>✕</button>
              </div>
            </div>
            {editId===note.id
              ? <>
                  <TagPicker value={editTag} onSet={setEditTag} customVal={editCustom} onCustom={setEditCustom}/>
                  <textarea autoFocus value={editBody} onChange={e=>setEditBody(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))commitEdit(note.id);if(e.key==='Escape')setEditId(null);}} rows={3} style={{fontFamily:MO,fontSize:13,color:C.tx,background:C.su,border:'1px solid '+C.or,borderRadius:6,padding:'8px 10px',width:'100%',resize:'vertical',outline:'none',marginTop:8,boxSizing:'border-box',lineHeight:1.5}}/>
                  <div style={{display:'flex',gap:6,justifyContent:'flex-end',marginTop:6}}>
                    <Btn onClick={()=>setEditId(null)}>Cancel</Btn>
                    <OBtn onClick={()=>commitEdit(note.id)}>Save</OBtn>
                  </div>
                </>
              : <div style={{fontFamily:MO,fontSize:13,color:C.tx,lineHeight:1.6,whiteSpace:'pre-wrap'}}>{note.body}</div>
            }
          </div>
        ))
      }
    </div>
  );
}

function StatsTab({ sums, idx, isMobile }) {
  const [range, setRange] = useState('30');
  const fmtMin = m => { const h=Math.floor(m/60); return h>0?`${h}h ${m%60}m`:`${m}m`; };

  const allDays = [...idx].filter(Boolean).sort();
  const cutoff = range === 'all' ? null : (() => { const d=new Date(); d.setDate(d.getDate()-parseInt(range)); return d; })();
  const filtered = cutoff ? allDays.filter(d=>new Date(d+'T12:00:00')>=cutoff) : allDays;

  const getActiveTasks = s => {
    const deferredIds = new Set(Object.keys(s.snapshot?.deferred || {}).map(String));
    if (!deferredIds.size) return { comp: s.completed||[], undo: s.undone||[] };
    return {
      comp: (s.completed||[]).filter(t => !deferredIds.has(String(t.id))),
      undo: (s.undone||[]).filter(t => !deferredIds.has(String(t.id))),
    };
  };

  const dayData = filtered.map(d => {
    const s = sums[d] || {};
    const { comp, undo } = getActiveTasks(s);
    const total = comp.length + undo.length;
    const pct   = total > 0 ? Math.round((comp.length/total)*100) : 0;
    const tt    = s.timerTotals || {};
    const date  = new Date(d+'T12:00:00');
    return {
      d, pct, comp: comp.length, undo: undo.length, total,
      label: `${date.getMonth()+1}/${date.getDate()}`,
      dow:   date.toLocaleDateString('en-US',{weekday:'short'}),
      training: Math.round((tt.training||0)/60000),
      watching: Math.round((tt.watching||0)/60000),
      away:     Math.round((tt.away||0)/60000),
      _comp: comp, _undo: undo,
    };
  });

  const avgPct       = dayData.length ? Math.round(dayData.reduce((s,d)=>s+d.pct,0)/dayData.length) : 0;
  const totalTrain   = dayData.reduce((s,d)=>s+d.training,0);
  const totalWatch   = dayData.reduce((s,d)=>s+d.watching,0);
  const totalAway    = dayData.reduce((s,d)=>s+d.away,0);
  const totalComp    = dayData.reduce((s,d)=>s+d.comp,0);
  const totalTasks   = dayData.reduce((s,d)=>s+d.total,0);
  const avgTasks     = dayData.length ? Math.round(totalTasks/dayData.length) : 0;

  const bestStreak = (() => { let b=0,c=0; dayData.forEach(d=>{d.pct>=80?(c++,b=Math.max(b,c)):c=0;}); return b; })();
  const curStreak  = (() => { let c=0; for(let i=dayData.length-1;i>=0;i--){if(dayData[i].pct>=80)c++;else break;} return c; })();

  const totalCarried = dayData.reduce((s,d)=>{
    return s+[...d._comp,...d._undo].filter(t=>t.carried).length;
  },0);
  const carryRate = totalTasks>0 ? Math.round((totalCarried/totalTasks)*100) : 0;

  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dowMap = {};
  dayData.forEach(d=>{
    if(!dowMap[d.dow]) dowMap[d.dow]=[];
    dowMap[d.dow].push(d.pct);
  });
  const dowData = DAYS.map(dow=>({
    dow, count: dowMap[dow]?.length||0,
    avg: dowMap[dow]?.length ? Math.round(dowMap[dow].reduce((a,b)=>a+b,0)/dowMap[dow].length) : null,
  })).filter(d=>d.avg!==null);

  const priComp={High:0,Medium:0,Low:0,None:0}, priUndo={High:0,Medium:0,Low:0,None:0};
  dayData.forEach(d=>{
    d._comp.forEach(t=>{const k=t.priority||'None'; priComp[k]=(priComp[k]||0)+1;});
    d._undo.forEach(t=>{const k=t.priority||'None'; priUndo[k]=(priUndo[k]||0)+1;});
  });
  const priData = ['High','Medium','Low','None']
    .map(p=>({name:p, completed:priComp[p]||0, undone:priUndo[p]||0, color:p==='High'?C.rd:p==='Medium'?C.yl:p==='Low'?C.gr:C.mu}))
    .filter(p=>p.completed+p.undone>0);

  const tagRe = /^([A-Za-z]+(?:[- ][A-Za-z]+){0,2})\s*:/;
  const tagMap = {};
  dayData.forEach(d=>{
    [...d._comp,...d._undo].forEach(t=>{
      const m=t.text?.match(tagRe);
      if(m){const tag=m[1].trim(); tagMap[tag]=(tagMap[tag]||0)+1;}
    });
  });
  const tagData = Object.entries(tagMap).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([tag,count])=>({tag,count}));

  const ttCfg = {contentStyle:{background:C.su,border:'1px solid '+C.bo,fontFamily:MO,fontSize:11},labelStyle:{color:C.tx},itemStyle:{color:C.tx}};
  const cols = isMobile ? '1fr' : '1fr 1fr';

  const StatCard = ({label,value,color,sub}) => (
    <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:'14px 16px',flex:1,minWidth:isMobile?'calc(50% - 5px)':120}}>
      <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginBottom:6}}>{label}</div>
      <div style={{fontFamily:MO,fontSize:isMobile?18:22,fontWeight:'bold',color:color||C.or,lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:4}}>{sub}</div>}
    </div>
  );
  const SHead = ({title}) => (
    <div style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2,marginBottom:12,paddingBottom:6,borderBottom:'1px solid '+C.bo}}>{title}</div>
  );

  if (!filtered.length) return (
    <div style={{textAlign:'center',padding:'80px 0'}}>
      <div style={{fontSize:40,marginBottom:16}}>📊</div>
      <div style={{fontFamily:MO,fontSize:13,color:C.mu}}>No history data in this range.</div>
      <div style={{fontFamily:MO,fontSize:11,color:C.mu+'88',marginTop:8}}>Save daily summaries in the Wrap Up tab to see statistics.</div>
    </div>
  );

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,flexWrap:'wrap',gap:10}}>
        <div>
          <div style={{fontFamily:MO,fontSize:11,color:C.or,letterSpacing:2,marginBottom:2}}>ANALYTICS</div>
          <h2 style={{fontFamily:MO,fontSize:20,color:C.tx,margin:0}}>Statistics</h2>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {[['7','7d'],['30','30d'],['90','90d'],['all','All']].map(([v,l])=>(
            <button key={v} onClick={()=>setRange(v)} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',borderRadius:20,cursor:'pointer',border:'none',background:range===v?C.or:C.ca,color:range===v?'#fff':C.mu,transition:'all .15s'}}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:24}}>
        <StatCard label="DAYS TRACKED"    value={filtered.length}  sub={range==='all'?'all time':`last ${range}d`}/>
        <StatCard label="AVG COMPLETE"    value={avgPct+'%'}        color={avgPct>=75?C.gr:avgPct>=50?C.yl:C.rd} sub="tasks finished"/>
        <StatCard label="BEST STREAK"     value={bestStreak}        color={C.pu} sub="days ≥80%"/>
        <StatCard label="CUR STREAK"      value={curStreak}         color={curStreak>=3?C.gr:C.or} sub="days ≥80%"/>
        <StatCard label="AVG TASKS/DAY"   value={avgTasks}          color={C.bl} sub={`${totalComp} done`}/>
        <StatCard label="CARRY RATE"      value={carryRate+'%'}     color={carryRate>40?C.rd:carryRate>20?C.yl:C.gr} sub="carried fwd"/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:cols,gap:16,marginBottom:16}}>
        <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:16}}>
          <SHead title="COMPLETION TREND"/>
          <ResponsiveContainer width="100%" height={180}>
            <LineChart data={dayData} margin={{top:4,right:8,left:-20,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.bo}/>
              <XAxis dataKey="label" tick={{fontFamily:MO,fontSize:9,fill:C.mu}} interval="preserveStartEnd"/>
              <YAxis domain={[0,100]} tick={{fontFamily:MO,fontSize:9,fill:C.mu}} tickFormatter={v=>v+'%'}/>
              <Tooltip {...ttCfg} formatter={v=>[v+'%','Completion']}/>
              <Line type="monotone" dataKey="pct" stroke={C.or} strokeWidth={2} dot={false} activeDot={{r:4,fill:C.or}}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
        <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:16}}>
          <SHead title="BY DAY OF WEEK"/>
          <ResponsiveContainer width="100%" height={180}>
            <BarChart data={dowData} margin={{top:4,right:8,left:-20,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.bo}/>
              <XAxis dataKey="dow" tick={{fontFamily:MO,fontSize:9,fill:C.mu}}/>
              <YAxis domain={[0,100]} tick={{fontFamily:MO,fontSize:9,fill:C.mu}} tickFormatter={v=>v+'%'}/>
              <Tooltip {...ttCfg} formatter={(v,_,p)=>[v+'%',`Avg (${p.payload.count} days)`]}/>
              <Bar dataKey="avg" radius={[3,3,0,0]}>
                {dowData.map((d,i)=><Cell key={i} fill={d.avg>=75?C.gr:d.avg>=50?C.yl:C.rd}/>)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:cols,gap:16,marginBottom:16}}>
        <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:16}}>
          <SHead title="DAILY TIMER BREAKDOWN (MIN)"/>
          <ResponsiveContainer width="100%" height={180}>
            <BarChart data={dayData} margin={{top:4,right:8,left:-20,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.bo}/>
              <XAxis dataKey="label" tick={{fontFamily:MO,fontSize:9,fill:C.mu}} interval="preserveStartEnd"/>
              <YAxis tick={{fontFamily:MO,fontSize:9,fill:C.mu}}/>
              <Tooltip {...ttCfg} formatter={(v,n)=>[v+'m',n.charAt(0).toUpperCase()+n.slice(1)]}/>
              <Legend wrapperStyle={{fontFamily:MO,fontSize:10}}/>
              <Bar dataKey="training" stackId="a" fill={C.pu} name="Training"/>
              <Bar dataKey="watching" stackId="a" fill={C.bl} name="Watching"/>
              <Bar dataKey="away"     stackId="a" fill={C.rd} name="Away" radius={[3,3,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:16}}>
          <SHead title="PRIORITY BREAKDOWN"/>
          <ResponsiveContainer width="100%" height={180}>
            <BarChart data={priData} layout="vertical" margin={{top:4,right:8,left:10,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.bo}/>
              <XAxis type="number" tick={{fontFamily:MO,fontSize:9,fill:C.mu}}/>
              <YAxis dataKey="name" type="category" tick={{fontFamily:MO,fontSize:9,fill:C.mu}} width={48}/>
              <Tooltip {...ttCfg}/>
              <Legend wrapperStyle={{fontFamily:MO,fontSize:10}}/>
              <Bar dataKey="completed" stackId="a" name="Completed">
                {priData.map((d,i)=><Cell key={i} fill={d.color}/>)}
              </Bar>
              <Bar dataKey="undone" stackId="a" fill={C.bo} name="Left Undone" radius={[0,3,3,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:cols,gap:16,marginBottom:16}}>
        {tagData.length>0&&(
          <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:16}}>
            <SHead title="TOP TASK LABELS"/>
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={tagData} layout="vertical" margin={{top:4,right:16,left:8,bottom:0}}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.bo}/>
                <XAxis type="number" tick={{fontFamily:MO,fontSize:9,fill:C.mu}}/>
                <YAxis dataKey="tag" type="category" tick={{fontFamily:MO,fontSize:9,fill:C.mu}} width={110}/>
                <Tooltip {...ttCfg} formatter={v=>[v,'Tasks']}/>
                <Bar dataKey="count" fill={C.or} radius={[0,3,3,0]}/>
              </BarChart>
            </ResponsiveContainer>
          </div>
        )}
        <div style={{background:C.ca,border:'1px solid '+C.bo,borderRadius:8,padding:16}}>
          <SHead title="TIMER TOTALS"/>
          {[
            {label:'Total Training',val:fmtMin(totalTrain),color:C.pu,avg:fmtMin(Math.round(totalTrain/filtered.length))},
            {label:'Total Watching',val:fmtMin(totalWatch),color:C.bl,avg:fmtMin(Math.round(totalWatch/filtered.length))},
            {label:'Total Away',    val:fmtMin(totalAway), color:C.rd,avg:fmtMin(Math.round(totalAway/filtered.length))},
          ].map(x=>(
            <div key={x.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid '+C.bo,flexWrap:'wrap',gap:4}}>
              <span style={{fontFamily:MO,fontSize:12,color:C.tx}}>{x.label}</span>
              <div style={{textAlign:'right'}}>
                <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:x.color}}>{x.val}</div>
                {filtered.length>1&&<div style={{fontFamily:MO,fontSize:10,color:C.mu}}>~{x.avg}/day</div>}
              </div>

          ))}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid '+C.bo}}>
            <span style={{fontFamily:MO,fontSize:12,color:C.tx}}>Completed</span>
            <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.gr}}>{totalComp}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0'}}>
            <span style={{fontFamily:MO,fontSize:12,color:C.tx}}>Left Undone</span>
            <span style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.yl}}>{totalTasks-totalComp}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Note merge helper (union-by-ID, highest updatedAt wins) ──────────────────
function mergeNotes(localNotes, remoteNotes) {
  var merged = {};
  (localNotes || []).forEach(function(n) { merged[n.id] = n; });
  (remoteNotes || []).forEach(function(n) {
    if (!merged[n.id]) {
      merged[n.id] = n;
    } else {
      var localTime  = new Date(merged[n.id].updatedAt || merged[n.id].createdAt || 0).getTime();
      var remoteTime = new Date(n.updatedAt || n.createdAt || 0).getTime();
      if (remoteTime > localTime) merged[n.id] = n;
    }
  });
  return Object.keys(merged).map(function(k){ return merged[k]; });
}

// ── GitHub Gist Sync Hook ─────────────────────────────────────────────────────
function useGistSync(sd, setSd) {
  const [gistToken,    setGistTokenState] = useState(() => store.getItem('dps-gist-token')||'');
  const [gistId,       setGistIdState]    = useState(() => store.getItem('dps-gist-id')||'');
  const [gistStatus,   setGistStatus]     = useState('idle'); // idle|syncing|ok|error
  const [gistLastSync, setGistLastSync]   = useState(null);
  const [gistError,    setGistError]      = useState('');
  const [gistMsg,      setGistMsg]        = useState(''); // last operation result message

  const setGistToken = v => { store.setItem('dps-gist-token', v); setGistTokenState(v); };
  const setGistId    = v => { store.setItem('dps-gist-id',    v); setGistIdState(v); };

  const gistPush = useCallback(async (currentSd, timerState, notes) => {
    if (!gistToken) return;
    setGistStatus('syncing'); setGistMsg('');
    const payload = { savedAt: new Date().toISOString(), device: 'desktop', sd: currentSd || sd, timerState: timerState || null, notes: notes || [] };
    const fileBody = { files: { 'dps-session.json': { content: JSON.stringify(payload) } } };
    try {
      let id = gistId;
      if (!id) {
        const r = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${gistToken}` },
          body: JSON.stringify({ ...fileBody, public: false, description: 'DPS Session Sync' }),
        });
        if (!r.ok) throw new Error(`GitHub ${r.status}: ${await r.text()}`);
        const j = await r.json(); id = j.id; setGistId(id);
      } else {
        const r = await fetch(`https://api.github.com/gists/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${gistToken}` },
          body: JSON.stringify(fileBody),
        });
        if (!r.ok) throw new Error(`GitHub ${r.status}: ${await r.text()}`);
      }
      setGistStatus('ok'); setGistLastSync(new Date().toLocaleTimeString()); setGistError('');
      setGistMsg('↑ Pushed to Gist — ' + new Date().toLocaleTimeString());
    } catch(e) { setGistStatus('error'); setGistError(e.message); setGistMsg('✗ Push failed: ' + e.message); }
  }, [gistToken, gistId, sd]);

  const gistPull = useCallback(async (force=false) => {
    if (!gistToken || !gistId) return;
    setGistStatus('syncing'); setGistMsg('');
    try {
      const r = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers: { 'Authorization': `Bearer ${gistToken}` },
      });
      if (!r.ok) throw new Error(`GitHub ${r.status}`);
      const j = await r.json();
      const fileInfo = j.files?.['dps-session.json'];
      if (!fileInfo) throw new Error('No session file in Gist');
      // Always use raw_url — avoids GitHub's 1MB inline content truncation as file grows
      let content;
      if (fileInfo.raw_url) {
        const rawR = await fetch(fileInfo.raw_url);
        if (!rawR.ok) throw new Error(`GitHub raw fetch ${rawR.status}`);
        content = await rawR.text();
      } else {
        content = fileInfo.content;
      }
      if (!content) throw new Error('Empty session file in Gist');
      const remote = JSON.parse(content);
      const localSavedAt = (() => { try { return JSON.parse(store.getItem('dps-v2')||'{}').savedAt||''; } catch(e){ return ''; } })();
      if (remote.savedAt && remote.sd && (force || !localSavedAt || remote.savedAt > localSavedAt)) {
        const todayKey = new Date().toISOString().split('T')[0];
        setSd(prev => {
          const merged = { ...remote.sd };
          // Preserve local dismissed/done for today so dropped tasks stay dropped
          [`dismissed-${todayKey}`, `done-${todayKey}`].forEach(k => {
            if (prev[k] && prev[k].length) merged[k] = prev[k];
          });
          // Merge notes: union local + remote, highest updatedAt/createdAt wins
          if (remote.notes && remote.notes.length) {
            var localNotes = prev['notes-' + todayKey] || [];
            merged['notes-' + todayKey] = mergeNotes(localNotes, remote.notes);
          }
          return merged;
        });
        store.setItem('dps-v2', JSON.stringify({ sd: remote.sd, sums: {}, summaryIndex: [], savedAt: remote.savedAt }));
        setGistMsg('✓ Remote data applied — ' + new Date().toLocaleTimeString());
      } else {
        setGistMsg('⚠ Remote not newer — nothing applied (remote: ' + (remote.savedAt||'?') + ')');
      }
      setGistStatus('ok'); setGistLastSync(new Date().toLocaleTimeString()); setGistError('');
    } catch(e) { setGistStatus('error'); setGistError(e.message); setGistMsg('✗ Pull failed: ' + e.message); }
  }, [gistToken, gistId]);

  // Auto-poll disabled — re-enable once sync is confirmed working
  // useEffect(() => {
  //   if (!gistToken || !gistId) return;
  //   const iv = setInterval(gistPull, 60000);
  //   return () => clearInterval(iv);
  // }, [gistToken, gistId, gistPull]);

  return { gistToken, setGistToken, gistId, setGistId, gistStatus, gistLastSync, gistError, gistMsg, gistPush, gistPull };
}

// ── SyncModal ──────────────────────────────────────────────────────────────────
function SyncModal({ today, tasks, done, timeBlocks, deferred, timerLogs, awayMs, trainMs, watchMs, notes, onMerge, onClose, isSendFirst=true, gistSyncer }) {
  const [tab, setTab]         = useState(isSendFirst ? 'send' : 'scan');
  const [pending, setPending] = useState(null);
  const [camErr, setCamErr]   = useState('');
  const [scanning, setScanning] = useState(false);
  const [tokenInp, setTokenInp] = useState(gistSyncer?.gistToken||'');
  const qrDiv   = useRef(null);
  const videoEl = useRef(null);
  const canvEl  = useRef(null);
  const rafId   = useRef(null);
  const streamR = useRef(null);

  const gs = gistSyncer || {};
  const isConnected = gs.gistStatus === 'ok' || (gs.gistToken && gs.gistId && gs.gistStatus !== 'error');
  const statusDot = gs.gistStatus === 'ok' ? C.gr : gs.gistStatus === 'error' ? C.rd : gs.gistStatus === 'syncing' ? C.yl : C.mu;
  const statusLabel = gs.gistStatus === 'ok' ? `✓ Synced ${gs.gistLastSync||''}` : gs.gistStatus === 'error' ? `✗ ${gs.gistError}` : gs.gistStatus === 'syncing' ? '⟳ Syncing…' : gs.gistToken && gs.gistId ? 'Connected' : 'Not configured';

  const connectGist = () => {
    if (!tokenInp.trim()) return;
    gs.setGistToken && gs.setGistToken(tokenInp.trim());
  };

  // ── V3 compact payload: single-char keys, indexed tb, no def/notes/tlogs ──
  const payload = JSON.stringify({
    v: 3, d: today,
    ea: new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
    tk: (tasks||[]).map(({id,text,priority}) => ({i:id, t:text, p:priority})),
    dn: (done||[]).map(i => (typeof i==='object' ? i.id : i)),
    tb: Object.entries(timeBlocks||{})
          .filter(([,v])=>v!=null)
          .reduce((acc,[slot,items]) => {
            const idx = ALL_TIME_SLOTS.indexOf(slot);
            if (idx < 0) return acc;
            const texts = (Array.isArray(items)?items:[items])
              .filter(Boolean).map(i=>typeof i==='string'?i:i.text).filter(Boolean);
            if (texts.length) acc.push([idx, texts]);
            return acc;
          }, []),
    tmr: {a:awayMs, tr:trainMs, w:watchMs},
  });

  // Compress: pako deflate → base64, prefixed "z1:"
  const qrData = (() => {
    if (!window.pako) return payload;
    try {
      const compressed = window.pako.deflate(payload);
      let bin = '';
      for (let i = 0; i < compressed.length; i++) bin += String.fromCharCode(compressed[i]);
      return 'z1:' + btoa(bin);
    } catch(e) { return payload; }
  })();
  const rawBytes = payload.length;
  const qrBytes  = qrData.length;
  const tooBig   = qrBytes > 2900;

  // Generate QR via qrcodejs into a div, 500px so modules are ~5px each
  useEffect(() => {
    if (tab !== 'send' || tooBig || !qrDiv.current) return;
    qrDiv.current.innerHTML = '';
    try {
      new window.QRCode(qrDiv.current, {
        text: qrData,
        width: 500, height: 500,
        colorDark: '#000000', colorLight: '#ffffff',
        correctLevel: window.QRCode.CorrectLevel.M,
      });
    } catch(e) { console.error('QR gen failed', e); }
  }, [tab]);

  // Camera lifecycle
  const stopCam = useCallback(() => {
    if (rafId.current)   { cancelAnimationFrame(rafId.current); rafId.current=null; }
    if (streamR.current) { streamR.current.getTracks().forEach(t=>t.stop()); streamR.current=null; }
    setScanning(false);
  }, []);

  useEffect(() => {
    if (tab !== 'scan') { stopCam(); return; }
    let alive = true;
    (async () => {
      try {
        const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
        if (!alive) { s.getTracks().forEach(t=>t.stop()); return; }
        streamR.current = s;
        if (!videoEl.current) return;
        videoEl.current.srcObject = s;
        await videoEl.current.play();
        setScanning(true);
        const scan = () => {
          if (!alive || !videoEl.current || !canvEl.current) return;
          const v = videoEl.current;
          if (v.readyState === v.HAVE_ENOUGH_DATA) {
            canvEl.current.width = v.videoWidth; canvEl.current.height = v.videoHeight;
            const ctx = canvEl.current.getContext('2d');
            ctx.drawImage(v, 0, 0);
            const img = ctx.getImageData(0, 0, v.videoWidth, v.videoHeight);
            const code = window.jsQR && window.jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
            if (code) {
              try {
                let parsed = null;
                const raw = code.data;
                if (raw.startsWith('z1:') && window.pako) {
                  const bin = atob(raw.slice(3));
                  const bytes = new Uint8Array(bin.length);
                  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                  parsed = JSON.parse(window.pako.inflate(bytes, { to: 'string' }));
                } else {
                  parsed = JSON.parse(raw);
                }
                if (parsed && parsed.d) { setPending(expandSyncData(parsed)); stopCam(); return; }
              } catch(e) {}
            }
          }
          rafId.current = requestAnimationFrame(scan);
        };
        rafId.current = requestAnimationFrame(scan);
      } catch(e) {
        if (alive) setCamErr(e.name==='NotAllowedError' ? 'Camera permission denied.' : 'Camera unavailable: '+e.message);
      }
    })();
    return () => { alive=false; stopCam(); };
  }, [tab]);

  const doMerge = () => { if (pending) { onMerge(pending); onClose(); } };

  const tabBtn = (key, label) => (
    <button onClick={()=>setTab(key)} style={{flex:1,fontFamily:MO,fontSize:11,padding:'10px 0',border:'none',borderBottom:`2px solid ${tab===key?C.or:'transparent'}`,background:'transparent',color:tab===key?C.or:C.mu,cursor:'pointer',letterSpacing:1}}>
      {label}
    </button>
  );

  if (pending) {
    const tc=(pending.tasks||[]).length, dc=(pending.done||[]).length, nc=(pending.notes||[]).length;
    return (
      <Modal onClose={onClose} width={440}>
        <div style={{padding:24}}>
          <div style={{fontFamily:MO,fontSize:11,color:C.or,letterSpacing:2,marginBottom:2}}>📱 SYNC IMPORT</div>
          <div style={{fontFamily:MO,fontSize:16,fontWeight:'bold',color:C.tx,marginBottom:16}}>Confirm Import</div>
          <div style={{background:C.ca,border:`1px solid ${C.bo}`,borderRadius:8,padding:14,marginBottom:14}}>
            <div style={{fontFamily:MO,fontSize:11,color:C.mu,marginBottom:10}}>Session from {pending.ea||'—'} · {pending.d}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
              {[{l:'TASKS',v:tc,c:C.or},{l:'DONE',v:dc,c:C.gr},{l:'NOTES',v:nc,c:C.bl}].map(x=>(
                <div key={x.l} style={{textAlign:'center',background:C.bg,borderRadius:6,padding:'10px 0'}}>
                  <div style={{fontFamily:MO,fontSize:24,fontWeight:'bold',color:x.c,lineHeight:1}}>{x.v}</div>
                  <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2,marginTop:4}}>{x.l}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{fontFamily:MO,fontSize:11,color:C.mu,marginBottom:20,lineHeight:1.7}}>
            Tasks, schedule, notes, and deferred will be overwritten with incoming data. Timer totals will be merged (highest value wins). Timer logs will be combined.
          </div>
          <div style={{display:'flex',gap:10}}>
            <Btn onClick={()=>setPending(null)} style={{flex:'0 0 auto',padding:'8px 18px'}}>← Back</Btn>
            <OBtn onClick={doMerge} style={{flex:1,textAlign:'center',padding:'10px 0'}}>✓ Import Session</OBtn>
          </div>
        </div>
      </Modal>
    );
  }

  return (
    <Modal onClose={onClose} width={540}>
      <div style={{padding:'16px 20px',borderBottom:`1px solid ${C.bo}`,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
        <div>
          <div style={{fontFamily:MO,fontSize:11,color:C.or,letterSpacing:2,marginBottom:2}}>📱 SYNC</div>
          <div style={{fontFamily:MO,fontSize:13,color:C.tx}}>Today: {today}</div>
        </div>
        <Btn onClick={onClose} style={{padding:'6px 10px'}}>✕</Btn>
      </div>

      {/* ── GIST SYNC SECTION ── */}
      <div style={{padding:'14px 20px',borderBottom:`1px solid ${C.bo}`,background:C.su}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <span style={{width:8,height:8,borderRadius:'50%',background:statusDot,flexShrink:0,boxShadow:isConnected?`0 0 6px ${statusDot}`:'none'}}/>
          <span style={{fontFamily:MO,fontSize:11,color:C.or,letterSpacing:2,flex:1}}>GITHUB GIST SYNC</span>
          <span style={{fontFamily:MO,fontSize:10,color:statusDot}}>{statusLabel}</span>
        </div>
        {!gs.gistToken ? (
          <div style={{display:'flex',gap:8}}>
            <input
              type="password" value={tokenInp} onChange={e=>setTokenInp(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&connectGist()}
              placeholder="GitHub Personal Access Token (gist scope)…"
              style={{fontFamily:MO,fontSize:12,background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,padding:'8px 10px',flex:1,color:C.tx,outline:'none'}}
            />
            <OBtn onClick={connectGist} style={{padding:'8px 14px',fontSize:12,whiteSpace:'nowrap'}}>Connect</OBtn>
          </div>
        ) : (
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <OBtn onClick={()=>gs.gistPush&&gs.gistPush()} style={{padding:'7px 14px',fontSize:12}}>↑ Sync Now</OBtn>
            <Btn onClick={()=>gs.gistPull&&gs.gistPull(true)} style={{padding:'7px 14px',fontSize:12}}>↓ Pull</Btn>
            <button onClick={()=>{ gs.setGistToken&&gs.setGistToken(''); gs.setGistId&&gs.setGistId(''); setTokenInp(''); }} style={{fontFamily:MO,fontSize:11,padding:'7px 10px',background:'none',border:`1px solid ${C.rd}44`,borderRadius:6,color:C.rd,cursor:'pointer'}}>Disconnect</button>
            {gs.gistId&&<div style={{fontFamily:MO,fontSize:9,color:C.mu,marginTop:6,wordBreak:'break-all'}}>Gist ID: <span style={{color:C.tx,userSelect:'all'}}>{gs.gistId}</span></div>}
          </div>
        )}
        {gs.gistMsg&&<div style={{fontFamily:MO,fontSize:11,marginTop:8,padding:'6px 10px',borderRadius:5,background:C.ca,color:(gs.gistMsg.startsWith('✓')||gs.gistMsg.startsWith('↑')||gs.gistMsg.startsWith('↓'))?C.gr:gs.gistMsg.startsWith('⚠')?C.yl:C.rd}}>{gs.gistMsg}</div>}
        {!gs.gistToken&&<div style={{fontFamily:MO,fontSize:10,color:C.mu,marginTop:8,lineHeight:1.6}}>Create a token at https://github.com/settings/tokens → New classic token → check <strong style={{color:C.tx}}>gist</strong> scope.</div>}
      </div>

      {/* ── QR FALLBACK — hidden until Gist sync is fully verified ── */}
      {false && <><div style={{padding:'8px 20px 4px',borderBottom:`1px solid ${C.bo}`}}>
        <span style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:2}}>── QR FALLBACK ──</span>
      </div>
      <div style={{display:'flex',borderBottom:`1px solid ${C.bo}`}}>
        {isSendFirst ? <>{tabBtn('send','📱 Send to Phone')}{tabBtn('scan','📷 Get from Phone')}</>
                     : <>{tabBtn('scan','📷 Scan Desktop')}{tabBtn('send','📱 Show My QR')}</>}
      </div>
      <div style={{padding:'12px 12px',minHeight:320,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        {tab==='send' && (
          tooBig
            ? <div style={{fontFamily:MO,fontSize:12,color:C.yl,textAlign:'center',lineHeight:1.8}}>
                ⚠ Today's data ({qrBytes} bytes compressed) exceeds QR limit.<br/>
                <span style={{color:C.mu,fontSize:11}}>Use the JSON Export instead.</span>
              </div>
            : <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
                <div style={{background:'#fff',borderRadius:8,lineHeight:0,overflow:'hidden'}}>
                  <div ref={qrDiv}/>
                </div>
                <div style={{fontFamily:MO,fontSize:11,color:C.mu,textAlign:'center',lineHeight:1.7}}>
                  Point your phone camera at this code.<br/>Tap 📱 SYNC on the mobile app to scan.
                </div>
                <div style={{fontFamily:MO,fontSize:9,color:C.mu+'66'}}>{qrBytes} bytes compressed · {rawBytes} bytes raw · {tasks.length} tasks</div>
              </div>
        )}
        {tab==='scan' && (
          camErr
            ? <div style={{fontFamily:MO,fontSize:12,color:C.rd,textAlign:'center',lineHeight:1.8}}>
                ⚠ {camErr}<br/><span style={{color:C.mu,fontSize:11}}>Ensure camera permission is granted (HTTPS required).</span>
              </div>
            : <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
                <div style={{position:'relative',width:280,height:210,background:'#000',borderRadius:10,overflow:'hidden',border:`2px solid ${scanning?C.gr:C.bo}`,transition:'border-color .3s'}}>
                  <video ref={videoEl} style={{width:'100%',height:'100%',objectFit:'cover'}} playsInline muted/>
                  {scanning && (
                    <div style={{position:'absolute',inset:0,pointerEvents:'none'}}>
                      <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:150,height:150,border:`2px solid ${C.gr}`,borderRadius:6,boxShadow:`0 0 0 9999px rgba(0,0,0,0.4)`}}/>
                    </div>
                  )}
                  {!scanning && !camErr && (
                    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                      <div style={{fontFamily:MO,fontSize:11,color:C.mu}}>Starting camera…</div>
                    </div>
                  )}
                </div>
                <canvas ref={canvEl} style={{display:'none'}}/>
                <div style={{fontFamily:MO,fontSize:11,color:scanning?C.gr:C.mu,letterSpacing:1}}>
                  {scanning ? '● SCANNING…' : 'Initializing camera…'}
                </div>
              </div>
        )}
      </div></>}
    </Modal>
  );
}

  const [dragOver, setDragOver] = useState(null);
  const [targetAgentId, setTargetAgentId] = useState('');
  const [pushMsg, setPushMsg] = useState({});
  const inpS = {fontFamily:MO,fontSize:11,background:C.ca,border:'1px solid '+C.bo,borderRadius:5,padding:'5px 8px',color:C.tx,outline:'none',width:'100%',boxSizing:'border-box'};

  const applyChange = (newOutline) => {
    setUndoStack(prev => [...prev.slice(-19), outline]);
    setOutline(newOutline);
    saveOutline(newOutline);
  };

  const undo = () => {
    if(!undoStack.length) return;
    const prev = undoStack[undoStack.length-1];
    setUndoStack(s => s.slice(0,-1));
    setOutline(prev);
    saveOutline(prev);
  };

  const updateDay = (day, patch) => {
    applyChange(outline.map(d => d.day===day ? {...d,...patch} : d));
  };

  const addStep = (day) => {
    const label = (newStep[day]||'').trim();
    if(!label) return;
    const step = {id: String(Date.now()), label};
    const d = outline.find(o=>o.day===day);
    var curOrder = d.stepOrder || defaultStepOrder(d);
    updateDay(day, {customSteps:[...(d.customSteps||[]), step], stepOrder:[...curOrder, step.id]});
    setNewStep(p=>({...p,[day]:''}));
  };

  const removeStep = (day, stepId) => {
    const d = outline.find(o=>o.day===day);
    var curOrder = (d.stepOrder || defaultStepOrder(d)).filter(function(id){return id!==stepId;});
    updateDay(day, {customSteps:(d.customSteps||[]).filter(s=>s.id!==stepId), stepOrder:curOrder});
  };

  const moveSlot = (day, slotId, dir) => {
    var d = outline.find(o=>o.day===day);
    var order = (d.stepOrder || defaultStepOrder(d)).slice();
    var idx = order.indexOf(slotId);
    var to = idx + dir;
    if(idx<0||to<0||to>=order.length) return;
    var tmp = order[idx]; order[idx]=order[to]; order[to]=tmp;
    updateDay(day, {stepOrder:order});
  };

  // Drag-to-reorder days
  const handleDragStart = (idx) => setDragIdx(idx);
  const handleDragOver = (e, idx) => { e.preventDefault(); setDragOver(idx); };
  const handleDrop = (e, toIdx) => {
    e.preventDefault();
    if(dragIdx===null||dragIdx===toIdx) { setDragIdx(null); setDragOver(null); return; }
    const next = [...outline];
    const [moved] = next.splice(dragIdx, 1);
    next.splice(toIdx, 0, moved);
    // Renumber days by position
    const renumbered = next.map((d,i) => ({...d, day:i+1}));
    applyChange(renumbered);
    setDragIdx(null); setDragOver(null);
  };

  const executePushTo = (daysToProcess, msgKey) => {
    var agent = allActive.find(function(a){return String(a.id)===String(targetAgentId);});
    if(!agent) return;
    if(msgKey==='all'&&!window.confirm('Push full outline to '+agent.name+'? Adds missing steps and updates flags. Completed items are never changed.')) return;
    var freshOutline = loadOutline();
    var updatedDays = {};
    Object.keys(agent.days||{}).forEach(function(k){ updatedDays[k]={...(agent.days[k]||{})}; });
    var addedCount = 0;
    daysToProcess.forEach(function(day) {
      var od = freshOutline.find(function(o){return o.day===day;});
      if(!od) return;
      var dayKey = String(day);
      var dayRec = updatedDays[dayKey] || {};
      var existing = dayRec.customSteps || [];
      var existSet = {};
      existing.forEach(function(s){ existSet[s.id]=true; });
      var fresh = (od.customSteps||[]).filter(function(s){return !existSet[s.id];});
      addedCount += fresh.length;
      updatedDays[dayKey] = {
        ...dayRec,
        showHwToggle: od.showHwToggle,
        showQuizToggle: od.showQuizToggle,
        hasReviewQuiz: od.hasReviewQuiz,
        stepOrder: od.stepOrder || defaultStepOrder(od),
        customSteps: existing.concat(fresh.map(function(s){return {...s,complete:false,completeDate:null,quizCorrect:null,quizTotal:null};})),
      };
    });
    onUpdateAgent({...agent, days:updatedDays});
    var resultMsg = addedCount>0 ? ('✓ Pushed to '+agent.name+' — '+addedCount+' new step'+(addedCount!==1?'s':'')+' added') : ('✓ Pushed to '+agent.name+' — flags updated');
    setPushMsg(function(p){var n={};Object.keys(p).forEach(function(k){n[k]=p[k];});n[String(msgKey)]=resultMsg;return n;});
    setTimeout(function(){setPushMsg(function(p){var n={};Object.keys(p).forEach(function(k){n[k]=p[k];});n[String(msgKey)]=null;return n;});},4000);
  };

  const resetToDefault = () => {
    if(!window.confirm('Reset outline to default? Existing agent records are not changed.')) return;
    applyChange(DEFAULT_OUTLINE.map(d=>({...d,customSteps:[]})));
  };

  const toggleField = (day, field) => updateDay(day, {[field]: !outline.find(d=>d.day===day)[field]});

  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
        <div>
          <div style={{fontFamily:MO,fontSize:11,color:C.pu,letterSpacing:2,marginBottom:2}}>TRAINING OUTLINE</div>
          <div style={{fontFamily:MO,fontSize:12,color:C.mu}}>Drag to reorder days. Changes auto-save. Future new hires use this outline.</div>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
          {undoStack.length>0&&<button onClick={undo} style={{fontFamily:MO,fontSize:10,padding:'5px 12px',borderRadius:5,border:'1px solid '+C.yl+'55',background:C.yl+'11',color:C.yl,cursor:'pointer'}}>↩ Undo ({undoStack.length})</button>}
          <button onClick={resetToDefault} style={{fontFamily:MO,fontSize:10,padding:'5px 12px',borderRadius:5,border:'1px solid '+C.bo,background:C.ca,color:C.mu,cursor:'pointer'}}>↺ Reset to Default</button>
        </div>
      </div>
      {/* Agent selector + push controls */}
      {allActive.length>0&&(
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:14,padding:'10px 12px',background:C.ca,border:'1px solid '+C.bo,borderRadius:7}}>
          <span style={{fontFamily:MO,fontSize:10,color:C.mu,letterSpacing:1,flexShrink:0}}>PUSH TO AGENT</span>
          <select value={targetAgentId} onChange={e=>setTargetAgentId(e.target.value)} style={{fontFamily:MO,fontSize:11,background:C.su,border:'1px solid '+(targetAgentId?C.pu:C.bo),borderRadius:5,padding:'4px 8px',color:targetAgentId?C.tx:C.mu,outline:'none',flex:1,minWidth:140}}>
            <option value="">— Select agent —</option>
            {allActive.map(a=><option key={a.id} value={a.id}>{a.name} ({a.status})</option>)}
          </select>
          {pushMsg['all']&&<span style={{fontFamily:MO,fontSize:10,color:C.gr}}>{pushMsg['all']}</span>}
        </div>
      )}

      {/* Day list */}
      {outline.map((d, idx) => {
        const isExp = expanded===d.day;
        const isDragging = dragIdx===idx;
        const isOver = dragOver===idx;
        return (
          <div key={d.day}
            draggable
            onDragStart={()=>handleDragStart(idx)}
            onDragOver={e=>handleDragOver(e,idx)}
            onDrop={e=>handleDrop(e,idx)}
            onDragEnd={()=>{setDragIdx(null);setDragOver(null);}}
            style={{marginBottom:6,border:'1px solid '+(isOver?C.pu:isExp?C.pu+'55':C.bo),borderRadius:7,overflow:'hidden',opacity:isDragging?0.4:1,transition:'opacity .15s,border-color .15s'}}>
            {/* Day header */}
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:C.ca,cursor:'grab',userSelect:'none'}}>
              <span style={{fontFamily:MO,fontSize:11,color:C.mu,flexShrink:0}}>⣿</span>
              <span style={{fontFamily:MO,fontSize:11,color:C.pu,fontWeight:'bold',minWidth:40,flexShrink:0}}>DAY {d.day}</span>
              <span onClick={()=>setExpanded(isExp?null:d.day)} style={{fontFamily:MO,fontSize:11,color:C.tx,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',cursor:'pointer'}}>{d.title}</span>
              <div style={{display:'flex',gap:4,flexShrink:0}}>
                {[{k:'showHwToggle',l:'HW',c:C.gr},{k:'showQuizToggle',l:'QZ',c:C.bl},{k:'hasReviewQuiz',l:'RQ',c:C.pu},{k:'isReviewDay',l:'REV',c:C.yl},{k:'isFinalQuiz',l:'FQ',c:C.or}].map(({k,l,c})=>(
                  <button key={k} onClick={e=>{e.stopPropagation();toggleField(d.day,k);}} style={{fontFamily:MO,fontSize:8,padding:'2px 5px',borderRadius:3,cursor:'pointer',border:`1px solid ${d[k]?c+'66':C.bo}`,background:d[k]?c+'18':C.ca,color:d[k]?c:C.mu+'66',transition:'all .15s'}}>{l}</button>
                ))}
                {(d.customSteps||[]).length>0&&<span style={{fontFamily:MO,fontSize:9,color:C.pu,border:'1px solid '+C.pu+'44',borderRadius:4,padding:'1px 6px'}}>{d.customSteps.length}</span>}
              </div>
              <span onClick={()=>setExpanded(isExp?null:d.day)} style={{fontFamily:MO,fontSize:11,color:C.mu,cursor:'pointer',flexShrink:0}}>{isExp?'▲':'▼'}</span>
            </div>

            {/* Expanded editor */}
            {isExp&&(
              <div style={{padding:'10px 14px',background:C.su}}>
                {/* Title */}
                <div style={{marginBottom:10}}>
                  <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:4}}>DAY TITLE</div>
                  <input value={d.title} onChange={e=>updateDay(d.day,{title:e.target.value})} style={inpS}/>
                </div>
                {/* Review Day badge (cosmetic only, not a step) */}
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                  <button onClick={()=>toggleField(d.day,'isReviewDay')} style={{fontFamily:MO,fontSize:10,padding:'3px 10px',borderRadius:5,cursor:'pointer',border:'1px solid '+(d.isReviewDay?C.yl+'66':C.bo),background:d.isReviewDay?C.yl+'18':C.ca,color:d.isReviewDay?C.yl:C.mu,transition:'all .15s'}}>
                    {d.isReviewDay?'✓ ':''} Review Day Badge
                  </button>
                  <span style={{fontFamily:MO,fontSize:9,color:C.mu}}>cosmetic only</span>
                </div>
                {/* Unified step order list */}
                <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:6}}>STEP ORDER — use ▲▼ to reorder</div>
                {(function(){
                  var order = d.stepOrder || defaultStepOrder(d);
                  var BUILTIN = {
                    hw:         {label:'📎 Homework',                flag:'showHwToggle',   color:C.gr},
                    quizSent:   {label:'📤 Quiz Sent',               flag:'showQuizToggle', color:C.bl},
                    quiz:       {label:d.isFinalQuiz?'🏁 Final Quiz':'📝 Quiz Score', flag:'showQuizToggle', color:d.isFinalQuiz?C.or:C.bl},
                    reviewQuiz: {label:'📝 Review Quiz - In Class',  flag:'hasReviewQuiz',  color:C.pu},
                  };
                  var arrowBtn = function(dis){ return {fontFamily:MO,fontSize:8,width:18,height:14,borderRadius:2,border:'1px solid '+C.bo,background:C.ca,color:dis?C.bo:C.mu,cursor:dis?'default':'pointer',padding:0,lineHeight:1,flexShrink:0}; };
                  return order.map(function(slotId, si){
                    var isFirst = si===0, isLast = si===order.length-1;
                    var bDef = BUILTIN[slotId];
                    if(bDef){
                      var flagOn = !!d[bDef.flag];
                      return (
                        <div key={slotId} style={{display:'flex',alignItems:'center',gap:6,marginBottom:5,padding:'5px 8px',background:C.ca,borderRadius:5,border:'1px solid '+(flagOn?bDef.color+'33':C.bo+'55'),opacity:flagOn?1:0.5}}>
                          <div style={{display:'flex',flexDirection:'column',gap:1}}>
                            <button onClick={()=>moveSlot(d.day,slotId,-1)} disabled={isFirst} style={arrowBtn(isFirst)}>▲</button>
                            <button onClick={()=>moveSlot(d.day,slotId,1)} disabled={isLast} style={arrowBtn(isLast)}>▼</button>
                          </div>
                          <span style={{fontFamily:MO,fontSize:11,color:flagOn?bDef.color:C.mu,flex:1}}>{bDef.label}</span>
                          {slotId==='quiz'&&<button onClick={()=>toggleField(d.day,'isFinalQuiz')} style={{fontFamily:MO,fontSize:8,padding:'2px 6px',borderRadius:3,cursor:'pointer',border:'1px solid '+(d.isFinalQuiz?C.or+'66':C.bo),background:d.isFinalQuiz?C.or+'18':C.ca,color:d.isFinalQuiz?C.or:C.mu+'66',flexShrink:0,transition:'all .15s'}}>Final Quiz</button>}
                          <button onClick={()=>toggleField(d.day,bDef.flag)} style={{fontFamily:MO,fontSize:8,padding:'2px 8px',borderRadius:3,cursor:'pointer',border:'1px solid '+(flagOn?bDef.color+'66':C.bo),background:flagOn?bDef.color+'18':C.ca,color:flagOn?bDef.color:C.mu+'66',flexShrink:0,transition:'all .15s'}}>{flagOn?'✓ ON':'OFF'}</button>
                        </div>
                      );
                    }
                    var cs = (d.customSteps||[]).find(function(s){return s.id===slotId;});
                    if(!cs) return null;
                    var csIdx = (d.customSteps||[]).indexOf(cs);
                    return (
                      <div key={slotId} style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
                        <div style={{display:'flex',flexDirection:'column',gap:1}}>
                          <button onClick={()=>moveSlot(d.day,slotId,-1)} disabled={isFirst} style={arrowBtn(isFirst)}>▲</button>
                          <button onClick={()=>moveSlot(d.day,slotId,1)} disabled={isLast} style={arrowBtn(isLast)}>▼</button>
                        </div>
                        <button onClick={()=>{var steps=[...(d.customSteps||[])];steps[csIdx]={...cs,isQuiz:!cs.isQuiz};updateDay(d.day,{customSteps:steps});}} title={cs.isQuiz?'Remove quiz scoring':'Add quiz scoring'} style={{fontFamily:MO,fontSize:8,padding:'2px 5px',borderRadius:3,cursor:'pointer',border:'1px solid '+(cs.isQuiz?C.bl+'66':C.bo),background:cs.isQuiz?C.bl+'18':C.ca,color:cs.isQuiz?C.bl:C.mu+'66',flexShrink:0,transition:'all .15s'}}>Q</button>
                        <button onClick={()=>{var steps=[...(d.customSteps||[])];steps[csIdx]=cs.plannedDate?{...cs,plannedDate:null}:{...cs,plannedDate:''};updateDay(d.day,{customSteps:steps});}} title={cs.plannedDate!==undefined&&cs.plannedDate!==null?'Clear date':'Add date'} style={{fontFamily:MO,fontSize:8,padding:'2px 5px',borderRadius:3,cursor:'pointer',border:'1px solid '+(cs.plannedDate?C.or+'66':C.bo),background:cs.plannedDate?C.or+'18':C.ca,color:cs.plannedDate?C.or:C.mu+'66',flexShrink:0,transition:'all .15s'}}>D</button>
                        <input value={cs.label} onChange={e=>{var steps=[...(d.customSteps||[])];steps[csIdx]={...cs,label:e.target.value};updateDay(d.day,{customSteps:steps});}} style={{...inpS,flex:1}}/>
                        {cs.plannedDate!==undefined&&cs.plannedDate!==null&&<input type="date" value={cs.plannedDate||''} onChange={e=>{var steps=[...(d.customSteps||[])];steps[csIdx]={...cs,plannedDate:e.target.value};updateDay(d.day,{customSteps:steps});}} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.or+'66',borderRadius:4,padding:'3px 6px',color:C.tx,outline:'none',colorScheme:'dark',flexShrink:0}}/>}
                        <button onClick={()=>removeStep(d.day,cs.id)} style={{fontFamily:MO,fontSize:11,width:24,height:24,borderRadius:4,border:'1px solid '+C.rd+'44',background:'#1a0d0d',color:C.rd,cursor:'pointer',padding:0,flexShrink:0}}>✕</button>
                      </div>
                    );
                  });
                })()}
                {/* Add custom checkbox */}
                <div style={{display:'flex',gap:6,marginTop:6,marginBottom:12}}>
                  <input value={newStep[d.day]||''} onChange={e=>setNewStep(p=>({...p,[d.day]:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&addStep(d.day)} placeholder="New checkbox label…" style={{...inpS,flex:1}}/>
                  <button onClick={()=>addStep(d.day)} style={{fontFamily:MO,fontSize:11,padding:'5px 12px',borderRadius:5,border:'1px solid '+C.gr+'55',background:C.gr+'18',color:C.gr,cursor:'pointer',flexShrink:0}}>+ Add</button>
                </div>
                {/* Push this day */}
                {allActive.length>0&&(
                  <div style={{display:'flex',alignItems:'center',gap:8,paddingTop:8,borderTop:'1px solid '+C.bo}}>
                    <button onClick={()=>executePushTo([d.day],d.day)} disabled={!targetAgentId} style={{fontFamily:MO,fontSize:10,padding:'4px 12px',borderRadius:5,border:'1px solid '+(targetAgentId?C.pu+'55':C.bo),background:targetAgentId?C.pu+'18':C.ca,color:targetAgentId?C.pu:C.mu,cursor:targetAgentId?'pointer':'default'}}>⬆ Push Day {d.day}</button>
                    {!targetAgentId&&<span style={{fontFamily:MO,fontSize:9,color:C.mu}}>Select agent above first</span>}
                    {pushMsg[String(d.day)]&&<span style={{fontFamily:MO,fontSize:10,color:C.gr}}>{pushMsg[String(d.day)]}</span>}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}


    </div>
  );
}

const sanitizeAgent = h => ({
  ...h,
  supervisor:     h.supervisor     || '',
  discProfile:    h.discProfile    || '',
  status:         h.status         || 'trainee',
  team:           h.team           || 'none',
  shiftStart: (()=>{
    if(h.shiftStart) return h.shiftStart;
    if(h.shift&&typeof h.shift==='string'){const m=h.shift.match(/(\d+):(\d+)/);if(m)return `${String(parseInt(m[1])).padStart(2,'0')}:${m[2]}`;}
    return null;
  })(),
  shiftEnd: (()=>{
    if(h.shiftEnd) return h.shiftEnd;
    if(h.shift&&typeof h.shift==='string'){const m=h.shift.match(/-\s*(\d+):(\d+)/);if(m){let eh=parseInt(m[1]),em=m[2];const ss=h.shiftStart||(h.shift.match(/(\d+):(\d+)/)||[])[0];const shm=ss?parseInt(ss.split(':')[0])*60+parseInt(ss.split(':')[1]||0):0;if(eh*60+parseInt(em)<=shm)eh+=12;return `${String(eh).padStart(2,'0')}:${em}`;}}
    return null;
  })(),
  seatId:         h.seatId         || null,
  specializedRole: h.specializedRole || '',
  queues: {
