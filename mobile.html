<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>DPS Mobile — Jesse Caldwell</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111318; overflow: hidden; }
    #root { height: 100%; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }
    select option { background: #1c1f2b; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #111318; }
    ::-webkit-scrollbar-thumb { background: #252836; border-radius: 2px; }
    .sheet-enter { animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1); }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .tab-fade { animation: tabFade 0.15s ease; }
    @keyframes tabFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    input, textarea, select { -webkit-appearance: none; appearance: none; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

</head>
<body>
  <div id="root"></div>

<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useRef, useCallback } = React;

// ── Storage (same as desktop) ──────────────────────────────────────────────────
const _mem = {};
const store = (() => {
  try { localStorage.setItem('_m','1'); localStorage.removeItem('_m'); return localStorage; }
  catch(e) { return { getItem:k=>_mem[k]||null, setItem:(k,v)=>{_mem[k]=v;}, removeItem:k=>{delete _mem[k];} }; }
})();

// ── Constants ──────────────────────────────────────────────────────────────────
const C = {
  bg:'#111318', su:'#181b24', ca:'#1c1f2b', bo:'#252836',
  or:'#f97316', gr:'#22c55e', rd:'#ef4444', yl:'#eab308',
  pu:'#a855f7', bl:'#3b82f6', tx:'#dde1ee', mu:'#52566a',
};
const MO = "'Courier New', Courier, monospace";
const PD = { High:C.rd, Medium:C.yl, Low:C.gr };
const MOBILE_VERSION = 'v1.1.1';

// ── Time slots (identical to desktop) ─────────────────────────────────────────
const AFTER5_SLOTS = (() => {
  const s = [];
  for (let h = 17; h <= 21; h++)
    for (let m = 0; m < 60; m += 15) {
      if (h === 17 && m === 0) continue;
      if (h === 21 && m > 0) break;
      const hd = h > 12 ? h - 12 : h;
      s.push(`${hd}:${m === 0 ? '00' : m} PM`);
    }
  return s;
})();

const TIME_SLOTS = (() => {
  const s = [];
  for (let h = 8; h <= 16; h++)
    for (let m = 0; m < 60; m += 15) {
      if (h === 16 && m > 45) break;
      const ap = h >= 12 ? 'PM' : 'AM';
      const hd = h > 12 ? h - 12 : h === 0 ? 12 : h;
      s.push(`${hd}:${m === 0 ? '00' : m} ${ap}`);
    }
  return s;
})();

const ALL_TIME_SLOTS = [...TIME_SLOTS, ...AFTER5_SLOTS];

// ── Normalise incoming sync payload (v3 compact → internal format) ────────────
const DEFAULT_TAGS = ['#meeting','#training','#watching','#action','#general','#reminder'];

// ── Helpers ────────────────────────────────────────────────────────────────────
const nid = () => Date.now() + Math.random();
const fmtMs = ms => {
  const tot = Math.floor(ms/1000), m = Math.floor(tot/60), h = Math.floor(m/60);
  return h > 0 ? `${h}h ${m%60}m` : `${m}m ${tot%60}s`;
};
const fmtDate = str => {
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric', year:'numeric' });
};
const slotToMin = slot => {
  const [h, rest] = slot.split(':');
  const [mn, ap] = rest.split(' ');
  let hh = parseInt(h);
  if (ap === 'PM' && hh !== 12) hh += 12;
  if (ap === 'AM' && hh === 12) hh = 0;
  return hh * 60 + parseInt(mn);
};
const slotArr = v => !v ? [] : Array.isArray(v) ? v.filter(Boolean) : [v];
const priSort = (a,b) => {
  const o = {High:0, Medium:1, Low:2};
  const av = a.priority==null ? 3 : (o[a.priority]??3);
  const bv = b.priority==null ? 3 : (o[b.priority]??3);
  return av !== bv ? av - bv : (a.text||'').localeCompare(b.text||'');
};
const snapToSlot = str => {
  const exact = ALL_TIME_SLOTS.indexOf(str);
  if (exact >= 0) return exact;
  const m = str.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return -1;
  let h = parseInt(m[1]), mn = parseInt(m[2]);
  const ap = (m[3]||'').toUpperCase();
  if (ap==='PM' && h!==12) h+=12;
  if (ap==='AM' && h===12) h=0;
  const tot = h*60+mn;
  let bestIdx=-1, bestDiff=Infinity;
  ALL_TIME_SLOTS.forEach((s,i)=>{ const d=Math.abs(slotToMin(s)-tot); if(d<bestDiff){bestDiff=d;bestIdx=i;} });
  return bestIdx;
};
const fmtTimeLabel = min => {
  const h = Math.floor(min/60), m = min%60;
  const ap = h>=12?'PM':'AM', h12 = h>12?h-12:h===0?12:h;
  return `${h12}:${String(m).padStart(2,'0')} ${ap}`;
};
const fmtTimestamp = ts => new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

// ── Dot component ──────────────────────────────────────────────────────────────
const Dot = ({p, size=8}) => (
  <span style={{
    width:size, height:size, borderRadius:'50%', flexShrink:0,
    background: p==='High'?C.rd : p==='Medium'?C.yl : p==='Low'?C.gr : C.mu+'66',
    border: !p ? '1px solid '+C.mu : 'none',
    display:'inline-block'
  }}/>
);

// ── Splash Screen ──────────────────────────────────────────────────────────────
function SplashScreen({ date }) {
  return (
    <div style={{
      position:'fixed', inset:0, background:C.bg,
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      gap:16, zIndex:9999
    }}>
      <div style={{
        width:56, height:56, borderRadius:14,
        background:C.or+'22', border:`2px solid ${C.or}`,
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:28, marginBottom:8
      }}>📋</div>
      <div style={{fontFamily:MO, fontSize:14, color:C.or, letterSpacing:3, textAlign:'center'}}>DAILY PLANNING SYSTEM</div>
      <div style={{fontFamily:MO, fontSize:11, color:C.mu, textAlign:'center', letterSpacing:1}}>
        Session loaded — {fmtDate(date)}
      </div>
      <div style={{marginTop:16, display:'flex', gap:4}}>
        {[0,1,2].map(i => (
          <div key={i} style={{
            width:6, height:6, borderRadius:'50%',
            background:i===0?C.or:C.bo,
            animation:`pulse${i} 1s ease infinite ${i*0.2}s`
          }}/>
        ))}
      </div>
      <style>{`
        @keyframes pulse0{0%,100%{opacity:1}50%{opacity:.3}}
        @keyframes pulse1{0%,100%{opacity:.3}50%{opacity:1}}
        @keyframes pulse2{0%,100%{opacity:.5}25%{opacity:1}75%{opacity:.3}}
      `}</style>
    </div>
  );
}

// ── Countdown Banner ───────────────────────────────────────────────────────────
function CountdownBanner({ timeBlocks, nowMin, endTime, onSync }) {
  const getItemText = function(i) { return (typeof i==='string' ? i : (i && i.text ? i.text : '')).trim().toLowerCase(); };

  // Lunch
  const lunchSlot = ALL_TIME_SLOTS.find(s => slotArr(timeBlocks[s]).some(i=>getItemText(i).startsWith('lunch')));
  const lunchMin  = lunchSlot ? slotToMin(lunchSlot) : null;

  // Appt events
  const PREFIXES = [
    {match:'meeting:', label:'Meeting', icon:'📋'},
    {match:'class:',   label:'Class',   icon:'🎓'},
    {match:'tour:',    label:'Tour',    icon:'🗺'},
  ];
  const events = [];
  ALL_TIME_SLOTS.forEach(slot => {
    const min = slotToMin(slot);
    let matched = null;
    for (const item of slotArr(timeBlocks[slot])) {
      const lower = item.text.trim().toLowerCase();
      for (const p of PREFIXES) {
        if (lower.startsWith(p.match)) {
          const displayName = item.text.trim().slice(p.match.length).trim();
          const mo = displayName.match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?/i);
          let timeOverride = null;
          if (mo) {
            let h=parseInt(mo[1]),mn2=parseInt(mo[2]);
            const ap=(mo[3]||'').toUpperCase();
            if(ap==='PM'&&h!==12)h+=12; if(ap==='AM'&&h===12)h=0;
            timeOverride=h*60+mn2;
          }
          matched = { fullText:item.text.trim(), label:p.label, icon:p.icon, displayName, timeOverride };
          break;
        }
      }
      if (matched) break;
    }
    if (!matched) return;
    const last = events[events.length-1];
    if (last && last.fullText===matched.fullText && min===last.endMin) { last.endMin=min+15; }
    else { const as=matched.timeOverride??min; events.push({...matched,startMin:as,endMin:as+15}); }
  });

  // Lunch event
  if (lunchMin !== null) {
    const lunchEvent = {label:'Lunch',icon:'🥗',displayName:'Lunch',startMin:lunchMin,endMin:lunchMin+60,fullText:'lunch'};
    events.push(lunchEvent);
    events.sort((a,b)=>a.startMin-b.startMin);
  }

  // Shift end
  const [eh,em] = endTime.split(':').map(Number);
  const endMin = eh*60+(em||0);

  // Next and then
  const upcoming = events.filter(e=>e.startMin>nowMin);
  const nextUp   = upcoming[0] || null;
  const thenUp   = upcoming[1] || null;
  const endDiff  = Math.max(0, endMin - nowMin);
  const endCd    = `${String(Math.floor(endDiff/60)).padStart(2,'0')}:${String(endDiff%60).padStart(2,'0')}`;

  const fmtDiff = min => `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
  const nextDiff = nextUp ? Math.max(0, nextUp.startMin - nowMin) : null;

  return (
    <div style={{
      background:'#13161f', borderBottom:`1px solid ${C.bo}`,
      padding:'8px 14px 8px',
      paddingTop:`calc(8px + env(safe-area-inset-top, 0px))`,
    }}>
      <div style={{display:'flex', gap:10, alignItems:'stretch', flexWrap:'wrap'}}>
        {/* Next Up */}
        <div style={{flex:'1 1 120px', minWidth:0}}>
          <div style={{fontFamily:MO, fontSize:8, color:C.mu, letterSpacing:2, marginBottom:2}}>NEXT UP</div>
          {nextUp ? (
            <div style={{display:'flex', gap:6, alignItems:'baseline'}}>
              <span style={{fontFamily:MO, fontSize:18, fontWeight:'bold', color:C.or, lineHeight:1}}>
                {fmtDiff(nextDiff)}
              </span>
              <span style={{fontFamily:MO, fontSize:9, color:C.tx, lineHeight:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>
                {nextUp.icon} {nextUp.displayName||nextUp.label}
              </span>
            </div>
          ) : (
            <div style={{fontFamily:MO, fontSize:12, color:C.mu}}>—</div>
          )}
        </div>

        {/* Then */}
        <div style={{flex:'1 1 100px', minWidth:0}}>
          <div style={{fontFamily:MO, fontSize:8, color:C.mu, letterSpacing:2, marginBottom:2}}>THEN</div>
          {thenUp ? (
            <div>
              <div style={{fontFamily:MO, fontSize:11, color:C.tx, lineHeight:1.3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>
                {thenUp.icon} {thenUp.displayName||thenUp.label}
              </div>
              <div style={{fontFamily:MO, fontSize:9, color:C.mu}}>{fmtTimeLabel(thenUp.startMin)}</div>
            </div>
          ) : (
            <div style={{fontFamily:MO, fontSize:11, color:C.mu}}>—</div>
          )}
        </div>

        {/* Shift End + Sync */}
        <div style={{flex:'0 0 auto', textAlign:'right', display:'flex', flexDirection:'column', alignItems:'flex-end', gap:6}}>
          <button onClick={onSync} style={{fontFamily:MO,fontSize:9,padding:'3px 8px',borderRadius:5,cursor:'pointer',border:`1px solid ${C.gr}`,background:C.gr+'22',color:C.gr,letterSpacing:1,whiteSpace:'nowrap'}}>📱 SYNC</button>
          <div>
            <div style={{fontFamily:MO, fontSize:8, color:C.mu, letterSpacing:2, marginBottom:2}}>🏁 SHIFT</div>
            <div style={{fontFamily:MO, fontSize:18, fontWeight:'bold', color:endDiff===0?C.mu:C.bl, lineHeight:1}}>
              {endCd}
            </div>
            <div style={{fontFamily:MO, fontSize:7, color:C.mu, letterSpacing:1, marginTop:3, textAlign:'right'}}>{MOBILE_VERSION}</div>
          </div>
        </div>
      </div>
    </div>
  );
}


// ── Schedule Tab ───────────────────────────────────────────────────────────────
function ScheduleTab({ timeBlocks, done, deferred, nowMin }) {
  const [showAfter5, setShowAfter5] = useState(false);
  const doneSet     = {};
  done.forEach(function(id){ doneSet[id]=true; });
  const deferredSet = {};
  Object.keys(deferred).forEach(function(k){ deferredSet[k]=true; });
  const nowRef      = useRef(null);

  // Scroll to current time on mount
  useEffect(() => {
    if (nowRef.current) {
      setTimeout(function(){ if(nowRef.current) nowRef.current.scrollIntoView({behavior:'smooth',block:'center'}); }, 300);
    }
  }, []);

  const isItemDeferred = function(item){ return item.itemId && deferredSet[String(item.itemId)]; };
  const after5Has = AFTER5_SLOTS.some(function(s){ return slotArr(timeBlocks[s]).length > 0; });

  const renderSlot = (slot) => {
    const items = slotArr(timeBlocks[slot]);
    const min   = slotToMin(slot);
    const isCurrent = nowMin >= min && nowMin < min + 15;

    return (
      <div key={slot} ref={isCurrent ? nowRef : null} style={{position:'relative'}}>
        {/* Current time indicator */}
        {isCurrent && (
          <div style={{position:'absolute',left:0,right:0,top:0,height:2,background:C.or,zIndex:2,boxShadow:`0 0 6px ${C.or}`}}/>
        )}
        <div style={{
          display:'flex', alignItems:'stretch', minHeight:44,
          borderBottom:`1px solid ${C.bo}22`,
          background: isCurrent ? C.or+'08' : 'transparent',
        }}>
          {/* Time label */}
          <div style={{
            width:58, flexShrink:0, padding:'8px 6px',
            display:'flex', alignItems:'flex-start', justifyContent:'flex-end',
          }}>
            <span style={{fontFamily:MO, fontSize:10, color:isCurrent?C.or:C.mu, lineHeight:1.3}}>{slot}</span>
          </div>
          {/* Content */}
          <div style={{flex:1, borderLeft:`2px solid ${isCurrent?C.or:C.bo+'44'}`, padding:'6px 10px', display:'flex', flexDirection:'column', justifyContent:'center', gap:2}}>
            {items.length > 0 ? items.map((item, idx) => {
              const def = isItemDeferred(item);
              return (
                <div key={idx} style={{display:'flex',gap:6,alignItems:'center'}}>
                  {def && <span style={{fontFamily:MO,fontSize:8,color:C.bl,border:`1px solid ${C.bl}44`,borderRadius:2,padding:'0 3px',flexShrink:0}}>defer</span>}
                  <span style={{fontFamily:MO,fontSize:12,color:def?C.mu:C.tx,lineHeight:1.3,textDecoration:def?'line-through':'none'}}>{item.text}</span>
                </div>
              );
            }) : (
              <span style={{fontFamily:MO,fontSize:11,color:C.mu+'44'}}>—</span>
            )}
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={{height:'100%',overflow:'auto',background:C.bg}} className="tab-fade">
      <div style={{padding:'12px 14px 6px'}}>
        <div style={{fontFamily:MO,fontSize:9,color:C.or,letterSpacing:2,marginBottom:2}}>TODAY'S SCHEDULE</div>
        <div style={{fontFamily:MO,fontSize:12,color:C.mu}}>{fmtDate(new Date().toISOString().split('T')[0])}</div>
      </div>

      <div style={{paddingBottom:8}}>
        {TIME_SLOTS.map(renderSlot)}
      </div>

      {/* After 5 PM toggle */}
      <div onClick={()=>setShowAfter5(p=>!p)} style={{
        display:'flex',alignItems:'center',justifyContent:'center',gap:8,
        padding:'12px 16px',cursor:'pointer',
        borderTop:`1px dashed ${C.bo}`,
        borderBottom:`1px dashed ${C.bo}`,
        margin:'4px 0', background:'transparent',
      }}>
        <span style={{fontFamily:MO,fontSize:10,color:C.mu,letterSpacing:1}}>
          {showAfter5 ? '▲ HIDE AFTER 5 PM' : '▼ EXPAND AFTER 5 PM (up to 9:00 PM)'}
        </span>
        {!showAfter5 && after5Has && (
          <span style={{fontFamily:MO,fontSize:9,color:C.or,border:`1px solid ${C.or}66`,borderRadius:3,padding:'1px 6px'}}>
            {AFTER5_SLOTS.filter(s=>slotArr(timeBlocks[s]).length>0).length} scheduled
          </span>
        )}
      </div>
      {showAfter5 && AFTER5_SLOTS.map(renderSlot)}

      <div style={{height:80}}/>
    </div>
  );
}

// ── Add Note Sheet ─────────────────────────────────────────────────────────────
function AddNoteSheet({ onSave, onClose }) {
  const [text,setText]   = useState('');
  const [tag,setTag]     = useState('#general');
  const [customTag,setCustomTag] = useState('');
  const [useCustom,setUseCustom] = useState(false);
  const [ts,setTs]       = useState(() => {
    const n=new Date();
    return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  });

  const save = () => {
    if (!text.trim()) return;
    const finalTag = useCustom ? customTag.trim() || '#general' : tag;
    const [h,m] = ts.split(':').map(Number);
    const now = new Date(); now.setHours(h||0,m||0,0,0);
    onSave({ id:nid(), text:text.trim(), tag:finalTag, createdAt:now.toISOString() });
    onClose();
  };

  return (
    <>
      <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',zIndex:200}}/>
      <div className="sheet-enter" style={{
        position:'fixed',bottom:0,left:0,right:0,
        background:C.su,borderRadius:'16px 16px 0 0',
        border:`1px solid ${C.bo}`,borderBottom:'none',
        maxHeight:'85vh',overflow:'auto',zIndex:201,
        paddingBottom:`env(safe-area-inset-bottom, 16px)`,
      }}>
        <div style={{display:'flex',justifyContent:'center',padding:'10px 0 4px'}}>
          <div style={{width:36,height:4,borderRadius:2,background:C.bo}}/>
        </div>
        <div style={{padding:'0 16px 20px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.or}}>ADD NOTE</div>
            <button onClick={onClose} style={{background:'none',border:'none',color:C.mu,fontSize:20,cursor:'pointer'}}>×</button>
          </div>

          <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Note text…" rows={4} style={{fontFamily:MO,fontSize:13,background:C.bg,color:C.tx,border:`1px solid ${C.bo}`,borderRadius:8,padding:'10px 12px',outline:'none',width:'100%',resize:'none',marginBottom:12}}/>

          <div style={{marginBottom:12}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:6}}>TAG</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
              {DEFAULT_TAGS.map(t => (
                <button key={t} onClick={()=>{setTag(t);setUseCustom(false);}} style={{fontFamily:MO,fontSize:11,padding:'5px 10px',borderRadius:6,cursor:'pointer',border:`1px solid ${!useCustom&&tag===t?C.or:C.bo}`,background:!useCustom&&tag===t?C.or+'22':C.ca,color:!useCustom&&tag===t?C.or:C.tx}}>
                  {t}
                </button>
              ))}
              <button onClick={()=>setUseCustom(true)} style={{fontFamily:MO,fontSize:11,padding:'5px 10px',borderRadius:6,cursor:'pointer',border:`1px solid ${useCustom?C.bl:C.bo}`,background:useCustom?C.bl+'22':C.ca,color:useCustom?C.bl:C.tx}}>
                custom…
              </button>
            </div>
            {useCustom && (
              <input value={customTag} onChange={e=>setCustomTag(e.target.value)} placeholder="#mytag" style={{fontFamily:MO,fontSize:12,background:C.bg,color:C.tx,border:`1px solid ${C.bl}`,borderRadius:8,padding:'8px 12px',outline:'none',width:'100%'}}/>
            )}
          </div>

          <div style={{marginBottom:14}}>
            <div style={{fontFamily:MO,fontSize:9,color:C.mu,letterSpacing:1,marginBottom:6}}>TIME</div>
            <input type="time" value={ts} onChange={e=>setTs(e.target.value)} style={{fontFamily:MO,fontSize:13,background:C.bg,color:C.tx,border:`1px solid ${C.bo}`,borderRadius:8,padding:'8px 12px',outline:'none',colorScheme:'dark'}}/>
          </div>

          <button onClick={save} disabled={!text.trim()} style={{display:'block',width:'100%',fontFamily:MO,fontSize:13,fontWeight:'bold',padding:'14px',borderRadius:8,cursor:'pointer',border:'none',background:text.trim()?C.or:'#333',color:text.trim()?'#000':C.mu}}>
            Save Note
          </button>
        </div>
      </div>
    </>
  );
}

// ── Tasks Tab ──────────────────────────────────────────────────────────────────
function TasksTab({ tasks, done, deferred, notes, onUpdateTasks, onUpdateDone, onUpdateDeferred, onUpdateNotes }) {
  const [subTab, setSubTab]       = useState('tasks');
  const [addText, setAddText]     = useState('');
  const [showAdd, setShowAdd]     = useState(false);
  const [showNoteSheet, setShowNoteSheet] = useState(false);
  const [noteFilter, setNoteFilter] = useState('all');

  const doneSet     = new Set(done);
  const deferredSet = new Set(Object.keys(deferred));
  const active      = tasks.filter(t => !doneSet.has(t.id) && !deferredSet.has(String(t.id))).sort(priSort);
  const deferredTasks = tasks.filter(t => deferredSet.has(String(t.id)) && !doneSet.has(t.id));
  const completed   = tasks.filter(t => doneSet.has(t.id));

  const toggle = id => onUpdateDone(doneSet.has(id) ? done.filter(x=>x!==id) : [...done, id]);
  const addTask = () => {
    if (!addText.trim()) return;

// ── Main App ───────────────────────────────────────────────────────────────────
// ── Note merge helper (union-by-ID, highest updatedAt/createdAt wins) ─────────
function mergeNotes(localNotes, remoteNotes) {
  var merged = {};
  (localNotes || []).forEach(function(n) { merged[n.id] = n; });
  (remoteNotes || []).forEach(function(n) {
    if (!merged[n.id]) {
      merged[n.id] = n;
    } else {
      var localTime  = new Date(merged[n.id].updatedAt || merged[n.id].createdAt || 0).getTime();
      var remoteTime = new Date(n.updatedAt || n.createdAt || 0).getTime();
      if (remoteTime > localTime) merged[n.id] = n;
    }
  });
  return Object.keys(merged).map(function(k){ return merged[k]; });
}

// ── GitHub Gist Sync Hook ─────────────────────────────────────────────────────
function useGistSync(sd, setSd) {
  const [gistToken,    setGistTokenState] = useState(() => store.getItem('dps-gist-token')||'');
  const [gistId,       setGistIdState]    = useState(() => store.getItem('dps-gist-id')||'');
  const [gistStatus,   setGistStatus]     = useState('idle');
  const [gistLastSync, setGistLastSync]   = useState(null);
  const [gistError,    setGistError]      = useState('');
  const [gistMsg,      setGistMsg]        = useState(''); // last operation result message

  const setGistToken = v => { store.setItem('dps-gist-token', v); setGistTokenState(v); };
  const setGistId    = v => { store.setItem('dps-gist-id',    v); setGistIdState(v); };
  const justPulled   = useRef(false); // prevents auto-save from overwriting Gist after a pull

  const gistPush = useCallback(async (currentSd, extraNotes) => {
    if (!gistToken || !gistId) return; // never auto-create a Gist on mobile — must have ID from desktop
    setGistStatus('syncing'); setGistMsg('');
    var activeSd = currentSd || sd;
    var todayKey = new Date().toISOString().split('T')[0];
    var todayNotes = extraNotes || activeSd['notes-' + todayKey] || [];
    // Strip timer keys — desktop is sole owner of timer state in Gist
    var safeSd = {};
    Object.keys(activeSd).forEach(function(k) {
      if (k.indexOf('awayMs-')===0 || k.indexOf('awayRun-')===0 || k.indexOf('awayStart-')===0 ||
          k.indexOf('trainMs-')===0 || k.indexOf('trainRun-')===0 || k.indexOf('trainStart-')===0 ||
          k.indexOf('watchMs-')===0 || k.indexOf('watchRun-')===0 || k.indexOf('watchStart-')===0 ||
          k.indexOf('timerLogs-')===0) return;
      safeSd[k] = activeSd[k];
    });
    const payload = { savedAt: new Date().toISOString(), device: 'mobile', sd: safeSd, notes: todayNotes };
    const fileBody = { files: { 'dps-session.json': { content: JSON.stringify(payload) } } };
    try {
      const r = await fetch(`https://api.github.com/gists/${gistId}`, { method:'PATCH', headers:{'Content-Type':'application/json','Authorization':`Bearer ${gistToken}`}, body: JSON.stringify(fileBody) });
      if (!r.ok) throw new Error(`GitHub ${r.status}: ${await r.text()}`);
      setGistStatus('ok'); setGistLastSync(new Date().toLocaleTimeString()); setGistError('');
      setGistMsg('✓ Push successful — ' + new Date().toLocaleTimeString());
    } catch(e) { setGistStatus('error'); setGistError(e.message); setGistMsg('✗ Push failed: ' + e.message); }
  }, [gistToken, gistId, sd]);

  const gistPull = useCallback(async (force=false) => {
    if (!gistToken || !gistId) return;
    setGistStatus('syncing'); setGistMsg('');
    try {
      const r = await fetch(`https://api.github.com/gists/${gistId}?_=${Date.now()}`, { headers:{'Authorization':`Bearer ${gistToken}`} });
      if (!r.ok) throw new Error(`GitHub ${r.status}`);
      const j = await r.json();
      const fileInfo = j.files && j.files['dps-session.json'];
      if (!fileInfo) throw new Error('No session file in Gist');
      // Always use raw_url — avoids GitHub's 1MB inline content truncation as file grows
      let content;
      if (fileInfo.raw_url) {
        const rawR = await fetch(fileInfo.raw_url);
        if (!rawR.ok) throw new Error(`GitHub raw fetch ${rawR.status}`);
        content = await rawR.text();
      } else {
        content = fileInfo.content;
      }
      if (!content) throw new Error('Empty session file in Gist');
      const remote = JSON.parse(content);
      const localSavedAt = (() => { try { return JSON.parse(store.getItem('dps-v2')||'{}').savedAt||''; } catch(e){ return ''; } })();
      if (remote.savedAt && remote.sd && (force || !localSavedAt || remote.savedAt > localSavedAt)) {
        justPulled.current = true;
        const todayKey = new Date().toISOString().split('T')[0];
        setSd(prev => {
          const merged = { ...remote.sd };
          // Preserve local dismissed/done for today so dropped tasks stay dropped
          [`dismissed-${todayKey}`, `done-${todayKey}`].forEach(k => {
            if (prev[k] && prev[k].length) merged[k] = prev[k];
          });
          // Merge notes from remote — union-by-ID, highest updatedAt/createdAt wins
          if (remote.notes && remote.notes.length) {
            var localNotes = prev['notes-' + todayKey] || [];
            merged['notes-' + todayKey] = mergeNotes(localNotes, remote.notes);
          }
          // Apply timerState into React sd so TimersTab reads live start timestamps
          if (remote.timerState) {
            var ts2 = remote.timerState;
            merged['awayMs-'    + todayKey] = ts2.awayMs    || 0;
            merged['trainMs-'   + todayKey] = ts2.trainMs   || 0;
            merged['watchMs-'   + todayKey] = ts2.watchMs   || 0;
            merged['awayRun-'   + todayKey] = ts2.awayRun   || false;
            merged['trainRun-'  + todayKey] = ts2.trainRun  || false;
            merged['watchRun-'  + todayKey] = ts2.watchRun  || false;
            merged['awayStart-'  + todayKey] = ts2.awayStart  || null;
            merged['trainStart-' + todayKey] = ts2.trainStart || null;
            merged['watchStart-' + todayKey] = ts2.watchStart || null;
          }
          return merged;
        });
        // Apply timerState from desktop into localStorage timer keys
        if (remote.timerState) {
          var ts = remote.timerState;
          var p2 = JSON.parse(store.getItem('dps-v2') || '{}');
          var s2 = p2.sd || {};
          s2['awayMs-'   + todayKey] = ts.awayMs   || 0;
          s2['trainMs-'  + todayKey] = ts.trainMs  || 0;
          s2['watchMs-'  + todayKey] = ts.watchMs  || 0;
          s2['awayRun-'  + todayKey] = ts.awayRun  || false;
          s2['trainRun-' + todayKey] = ts.trainRun || false;
          s2['watchRun-' + todayKey] = ts.watchRun || false;
          s2['awayStart-'  + todayKey] = ts.awayStart  || null;
          s2['trainStart-' + todayKey] = ts.trainStart || null;
          s2['watchStart-' + todayKey] = ts.watchStart || null;
          store.setItem('dps-v2', JSON.stringify({ sd: s2, sums: p2.sums || {}, summaryIndex: p2.summaryIndex || [], savedAt: remote.savedAt }));
        } else {
          store.setItem('dps-v2', JSON.stringify({ sd: remote.sd, sums: {}, summaryIndex: [], savedAt: remote.savedAt }));
        }
        const taskCount = (remote.sd['tasks-' + todayKey] || []).length;
        setGistMsg('✓ Applied from Gist — ' + taskCount + ' tasks for ' + todayKey);
      } else {
        setGistMsg('⚠ Remote not newer — nothing applied (remote: ' + (remote.savedAt||'?') + ', local: ' + (localSavedAt||'none') + ')');
      }
      setGistStatus('ok'); setGistLastSync(new Date().toLocaleTimeString()); setGistError('');
    } catch(e) { setGistStatus('error'); setGistError(e.message); setGistMsg('✗ Pull failed: ' + e.message); }
  }, [gistToken, gistId]);

  // Auto-poll every 90 seconds to pick up desktop timer and note updates
  useEffect(() => {
    if (!gistToken || !gistId) return;
    const iv = setInterval(function(){ gistPull(false); }, 90000);
    return function(){ clearInterval(iv); };
  }, [gistToken, gistId, gistPull]);

  return { gistToken, setGistToken, gistId, setGistId, gistStatus, gistLastSync, gistError, gistMsg, gistPush, gistPull, justPulled };
}

// ── Mobile SyncModal ───────────────────────────────────────────────────────────
function SyncModal({ onClose, gistSyncer }) {
  const [tokenInp, setTokenInp]   = useState(gistSyncer ? gistSyncer.gistToken : '');
  const [gistIdInp, setGistIdInp] = useState(gistSyncer ? gistSyncer.gistId   : '');
  const gs = gistSyncer || {};
  var statusDot   = gs.gistStatus==='ok'?C.gr : gs.gistStatus==='error'?C.rd : gs.gistStatus==='syncing'?C.yl : C.mu;
  var statusLabel = gs.gistStatus==='ok' ? ('Synced ' + (gs.gistLastSync||''))
                  : gs.gistStatus==='error' ? gs.gistError
                  : gs.gistStatus==='syncing' ? 'Syncing...'
                  : (gs.gistToken && gs.gistId) ? 'Connected' : 'Not configured';

  var connectGist = function(){
    if (!tokenInp.trim()) return;
    if (gs.setGistToken) gs.setGistToken(tokenInp.trim());
    if (gistIdInp.trim() && gs.setGistId) gs.setGistId(gistIdInp.trim());
  };

  return (
    <>
      <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:300}}/>
      <div className="sheet-enter" style={{
        position:'fixed',bottom:0,left:0,right:0,
        background:C.su,borderRadius:'16px 16px 0 0',
        border:`1px solid ${C.bo}`,borderBottom:'none',
        zIndex:301,
        paddingBottom:`env(safe-area-inset-bottom, 0px)`,
      }}>
        <div style={{display:'flex',justifyContent:'center',padding:'10px 0 4px'}}>
          <div style={{width:36,height:4,borderRadius:2,background:C.bo}}/>
        </div>
        <div style={{padding:'0 18px 24px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              {gs.gistToken && <span style={{width:8,height:8,borderRadius:'50%',background:statusDot,flexShrink:0,display:'inline-block'}}/>}
              <div style={{fontFamily:MO,fontSize:13,fontWeight:'bold',color:C.or}}>SYNC</div>
            </div>
            <button onClick={onClose} style={{background:'none',border:'none',color:C.mu,fontSize:20,cursor:'pointer'}}>x</button>
          </div>

          <div style={{background:C.ca,border:`1px solid ${C.bo}`,borderRadius:8,padding:14,marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <span style={{fontFamily:MO,fontSize:10,color:C.or,letterSpacing:2}}>GITHUB GIST</span>
              <span style={{fontFamily:MO,fontSize:10,color:statusDot}}>{statusLabel}</span>
            </div>
            {!gs.gistToken ? (
              <>
                <input type="password" value={tokenInp} onChange={function(e){setTokenInp(e.target.value);}} placeholder="GitHub PAT (gist scope)..." style={{fontFamily:MO,fontSize:12,background:C.bg,border:`1px solid ${C.bo}`,borderRadius:6,padding:'9px 10px',width:'100%',color:C.tx,outline:'none',marginBottom:8}}/>
                <div style={{display:'flex',gap:8,marginBottom:10}}>
                  <input type="text" value={gistIdInp} onChange={function(e){setGistIdInp(e.target.value);}} placeholder="Gist ID..." style={{fontFamily:MO,fontSize:12,background:C.bg,border:`1px solid ${C.bo}`,borderRadius:6,padding:'9px 10px',flex:1,color:C.tx,outline:'none'}}/>
                  <button onClick={connectGist} style={{fontFamily:MO,fontSize:12,padding:'9px 14px',background:C.or,color:'#000',border:'none',borderRadius:6,cursor:'pointer',fontWeight:'bold',whiteSpace:'nowrap'}}>Connect</button>
                </div>
                <div style={{fontFamily:MO,fontSize:10,color:C.mu,lineHeight:1.6}}>Enter your GitHub PAT and the Gist ID shown on the desktop SYNC modal.</div>
              </>
            ) : (
              <>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <button onClick={function(){if(gs.gistPush) gs.gistPush();}} style={{fontFamily:MO,fontSize:12,fontWeight:'bold',padding:'10px 16px',background:C.or,color:'#000',border:'none',borderRadius:6,cursor:'pointer',flex:1}}>Push</button>
                  <button onClick={function(){if(gs.gistPull) gs.gistPull(true);}} style={{fontFamily:MO,fontSize:12,padding:'10px 16px',background:C.ca,color:C.tx,border:`1px solid ${C.bo}`,borderRadius:6,cursor:'pointer',flex:1}}>Pull</button>
                  <button onClick={function(){if(gs.setGistToken)gs.setGistToken('');if(gs.setGistId)gs.setGistId('');setTokenInp('');setGistIdInp('');}} style={{fontFamily:MO,fontSize:11,padding:'10px 12px',background:'none',border:`1px solid ${C.rd}44`,borderRadius:6,color:C.rd,cursor:'pointer',flexShrink:0}}>Disconnect</button>
                </div>
                {gs.gistId && <div style={{fontFamily:MO,fontSize:9,color:C.mu,wordBreak:'break-all',marginBottom:4}}>Gist: {gs.gistId}</div>}
              </>
            )}
            {gs.gistMsg && <div style={{fontFamily:MO,fontSize:11,marginTop:8,padding:'6px 10px',borderRadius:5,background:C.bg,color:gs.gistMsg[0]==='v'?C.gr:gs.gistMsg[0]===String.fromCharCode(8854)?C.yl:C.rd}}>{gs.gistMsg}</div>}
          </div>
        </div>
      </div>
    </>
  );
}

function MobileApp() {
  const TODAY = new Date().toISOString().split('T')[0];
  const [showSplash, setShowSplash] = useState(true);
  const [showSync, setShowSync]     = useState(false);
  const [loaded, setLoaded]         = useState(false);
  const [tab, setTab]               = useState('schedule');
  const [sd, setSd]                 = useState({});
  const [endTime]                   = useState('17:00'); // imported from desktop if present
  const [nowMin, setNowMin]         = useState(() => { const n=new Date(); return n.getHours()*60+n.getMinutes(); });
  const tickRef                     = useRef(Date.now());
  const saveTimer                   = useRef(null);

  // Touch/swipe state
  const touchStartX = useRef(null);
  const TABS = ['schedule','tasks','timers'];

  // ── Load from localStorage ─────────────────────────────────────────────────
  useEffect(() => {
    try {
      const raw = store.getItem('dps-v2');
      if (raw) {
        const sv = JSON.parse(raw);
        if (sv.sd) setSd(sv.sd);
      }
    } catch(e) {}
    setLoaded(true);
    setTimeout(() => setShowSplash(false), 1000);
  }, []);

  const gistSyncer = useGistSync(sd, setSd);

  // ── Auto-save (merge today keys back into full dps-v2) ────────────────────
  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        const raw = store.getItem('dps-v2');
        const existing = raw ? JSON.parse(raw) : {};
        const mergedSd = {...(existing.sd||{}), ...sd};
        const savedAt = new Date().toISOString();
        store.setItem('dps-v2', JSON.stringify({...existing, sd:mergedSd, savedAt}));
        if (gistSyncer.justPulled && gistSyncer.justPulled.current) {
          gistSyncer.justPulled.current = false; // data came FROM Gist — don't push it back
        } else {
          gistSyncer.gistPush(mergedSd);
        }
      } catch(e) {}
    }, 30000); // 30s inactivity before push — consistent with desktop
  }, [sd, loaded]);

  // ── Pull on any tab switch (15s cooldown) ────────────────────────────────
  const lastPullRef = useRef(0);
  useEffect(function() {
    if (!gistSyncer.gistPull || !gistSyncer.gistId) return;
    const now = Date.now();
    if (now - lastPullRef.current > 15000) {
      lastPullRef.current = now;
      gistSyncer.gistPull(true);
    }
  }, [tab, gistSyncer.gistId]);

  // ── Auto-pull on Timers tab open + 10s interval while on tab ───────────────
  useEffect(function() {
    if (tab === 'timers' && gistSyncer.gistPull && gistSyncer.gistId) {
      var iv = setInterval(function(){ gistSyncer.gistPull(true); }, 10000);
      return function(){ clearInterval(iv); };
    }
  }, [tab, gistSyncer.gistId]);
  useEffect(() => {
    const tick = () => { const n=new Date(); setNowMin(n.getHours()*60+n.getMinutes()); };
    const ms = 60000 - (Date.now()%60000);
    let iv;
    const to = setTimeout(() => { tick(); iv = setInterval(tick,60000); }, ms);
    return () => { clearTimeout(to); clearInterval(iv); };
  }, []);

  // ── Swipe to navigate ─────────────────────────────────────────────────────
  const handleTouchStart = e => { touchStartX.current = e.touches[0].clientX; };
  const handleTouchEnd   = e => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    touchStartX.current = null;
    if (Math.abs(dx) < 50) return;
    const cur = TABS.indexOf(tab);
    if (dx < 0 && cur < TABS.length-1) setTab(TABS[cur+1]);
    if (dx > 0 && cur > 0)              setTab(TABS[cur-1]);
  };

  // ── Shortcuts to today's data ──────────────────────────────────────────────
  const gd  = k => sd[`${k}-${TODAY}`];
  const upd = (k,v) => setSd(p => ({...p, [`${k}-${TODAY}`]:v}));

  const tasks      = gd('tasks')      || [];
  const done       = gd('done')       || [];
  const deferred   = gd('deferred')   || {};
  const notes      = gd('notes')      || [];
  const awayMs     = gd('awayMs')     || 0;
  const awayRun    = gd('awayRun')    || false;
  const awayStart  = gd('awayStart')  || null;
  const trainMs    = gd('trainMs')    || 0;
  const trainRun   = gd('trainRun')   || false;
  const trainStart = gd('trainStart') || null;
  const watchMs    = gd('watchMs')    || 0;
  const watchRun   = gd('watchRun')   || false;
  const watchStart = gd('watchStart') || null;

  const timeBlocks = Object.fromEntries(
    Object.entries(gd('time')||{}).filter(([,v])=>v!=null)
  );

  // ── Render ─────────────────────────────────────────────────────────────────
  if (showSplash) return <SplashScreen date={TODAY}/>;

  return (
    <div
      style={{height:'100%', display:'flex', flexDirection:'column', background:C.bg, overflow:'hidden'}}
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
    >
      {/* Countdown Banner */}
      <CountdownBanner timeBlocks={timeBlocks} nowMin={nowMin} endTime={endTime} onSync={()=>setShowSync(true)}/>

      {/* Tab Content */}
      <div style={{flex:1, overflow:'hidden', position:'relative'}}>
        {tab==='schedule' && (
          <ScheduleTab
            timeBlocks={timeBlocks}
            done={done}
            deferred={deferred}
            nowMin={nowMin}
          />
        )}
        {tab==='tasks' && (
          <TasksTab
            tasks={tasks}
            done={done}
            deferred={deferred}
            notes={notes}
            onUpdateTasks={v=>upd('tasks',v)}
            onUpdateDone={v=>upd('done',v)}
            onUpdateDeferred={v=>upd('deferred',v)}
            onUpdateNotes={v=>{ upd('notes',v); setTimeout(function(){ gistSyncer.gistPush(null, v); }, 30000); }}
          />
        )}
        {tab==='timers' && (
          <TimersTab
            awayMs={awayMs}   awayRun={awayRun}   awayStart={awayStart}
            trainMs={trainMs} trainRun={trainRun} trainStart={trainStart}
            watchMs={watchMs} watchRun={watchRun} watchStart={watchStart}
          />
        )}
      </div>

      {/* Bottom Nav */}
      <BottomNav tab={tab} setTab={setTab}/>

      {showSync && (
        <SyncModal
          onClose={function(){setShowSync(false);}}
          gistSyncer={gistSyncer}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MobileApp/>);
</script>
</body>
</html>
