  },[storageReady]);

  const getItemText = i => (typeof i === 'string' ? i : i?.text || '').trim().toLowerCase();
  const lunchSlot = ALL_TIME_SLOTS.find(s => slotArr(timeBlocks[s]).some(i => getItemText(i).startsWith('lunch')));
  const lunchMin  = lunchSlot ? slotToMin(lunchSlot) : null;
  const lunchDiff = lunchMin!==null ? Math.max(0,lunchMin-nowMin) : null;
  const lunchCd   = lunchDiff!==null ? String(Math.floor(lunchDiff/60)).padStart(2,'0')+':'+String(lunchDiff%60).padStart(2,'0') : null;

  const apptEvents = (() => {
    const PREFIXES = [
      { match: 'meeting:', type: 'meeting', title: '📋 NEXT MEETING IN' },
      { match: 'class:',   type: 'class',   title: '🎓 NEXT CLASS IN'   },
      { match: 'tour:',    type: 'tour',    title: '🗺 NEXT TOUR IN'    },
    ];
    const events = [];
    ALL_TIME_SLOTS.forEach(slot => {
      const min = slotToMin(slot);
      let matched = null;
      for (const item of slotArr(timeBlocks[slot])) {
        const lower = item.text.trim().toLowerCase();
        for (const p of PREFIXES) {
          if (lower.startsWith(p.match)) {
            const displayName = item.text.trim().slice(p.match.length).trim();
            const timeOverride = (() => {
              const m = displayName.match(/^(\d{1,2}):(\d{2})\s*(AM|PM|am|pm)?/i);
              if (!m) return null;
              let h = parseInt(m[1]), mn = parseInt(m[2]);
              const ap = (m[3]||'').toUpperCase();
              if (ap === 'PM' && h !== 12) h += 12;
              if (ap === 'AM' && h === 12) h = 0;
              if (!ap && h < slotToMin(slot)/60) h += 12;
              return h * 60 + mn;
            })();
            matched = { fullText: item.text.trim(), type: p.type, title: p.title, displayName, timeOverride };
            break;
          }
        }
        if (matched) break;
      }
      if (!matched) return;
      const last = events[events.length - 1];
      if (last && last.fullText === matched.fullText && min === last.endMin) {
        last.endMin = min + 15;
      } else {
        const actualStart = matched.timeOverride ?? min;
        events.push({ ...matched, startMin: actualStart, endMin: actualStart + 15 });
      }
    });
    return events;
  })();

  const apptDiff     = nextEvent ? Math.max(0, nextEvent.startMin - nowMin) : null;
  const apptCd       = apptDiff !== null ? String(Math.floor(apptDiff/60)).padStart(2,'0')+':'+String(apptDiff%60).padStart(2,'0') : null;

  const timerReset=type=>{ const k=type==='away'?'away':type==='training'?'train':'watch',logType=type==='away'?'Away':type==='training'?'Training':'Watching'; setSd(p=>({...p,[`${k}Ms-${ds}`]:0,[`${k}Run-${ds}`]:false,[`${k}Start-${ds}`]:null,[`timerLogs-${ds}`]:(p[`timerLogs-${ds}`]||[]).filter(r=>r.type!==logType)})); };

        u[`trainMs-${today}`] = Math.max(p[`trainMs-${today}`]||0, data.tmr.tr||0);
        u[`watchMs-${today}`] = Math.max(p[`watchMs-${today}`]||0, data.tmr.w ||0);

      const ownDone  = new Set(ownTasks.map(t=>t.id));

        .filter(t => !srcDone.has(t.id) && !(String(t.id) in srcDeferred))
        .map(t => ({...t, id:nid(), carrySrcId:String(t.id), carrySrcDate:srcDate, carried:true, source:'brain'}));

      return {...p, [`tasks-${ds}`]: [...ownTasks, ...toAdd], [`done-${ds}`]: cleanDone};

  const saveSummary=sum=>{ setSums(p=>({...p,[ds]:sum})); setIdx(p=>{const n=p.filter(Boolean);if(!n.includes(ds))n.push(ds);return n;}); };

      const logWatch=timerLogs.filter(r=>r.type==='Watching').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
      const sum={dateKey:ds,dateLabel:fmtDate(ds),savedAt:new Date().toISOString(),completed:activeTasks.filter(i=>doneSet.has(i.id)),undone:activeTasks.filter(i=>!doneSet.has(i.id)),timerTotals:{away:awayMs+logAway,training:trainMs+logTrain,watching:watchMs+logWatch},snapshot:{tasks,done,timeBlocks:timeBlocks||{},deferred},autoSaved:true};
      setSums(p=>({...p,[ds]:sum}));

  },[ds,tasks,done,timerLogs,awayMs,trainMs,watchMs,timeBlocks,deferred]);

  const loadHistory=summary=>{
    if(summary.snapshot){const snap=summary.snapshot;setSd(p=>({...p,[`tasks-${ds}`]:snap.tasks||[],...( snap.done?{[`done-${ds}`]:snap.done}:{}),...(snap.timeBlocks?{[`time-${ds}`]:snap.timeBlocks}:{}),[`dismissed-${ds}`]:[]}));}
    else{const newItems=(summary.undone||[]).map(i=>({id:nid(),text:i.text,priority:i.priority,carried:true,srcId:i.id}));setSd(p=>({...p,[`tasks-${ds}`]:[...(p[`tasks-${ds}`]||[]),...newItems],[`dismissed-${ds}`]:[]}));}
  };
  const deleteHistory=keys=>{ setSums(p=>{const n={...p};keys.forEach(k=>delete n[k]);return n;}); setIdx(p=>p.filter(d=>!keys.includes(d))); };
  const importHistory=data=>{ if(data.summaries)setSums(p=>({...p,...data.summaries})); if(data.idx)setIdx(p=>{const n=[...p];data.idx.forEach(d=>{if(!n.includes(d))n.push(d);});return n;}); };
  const restoreSession=data=>{
    if(data.sd)setSd(()=>({...initDay(TODAY),...data.sd}));
    if(data.sums)setSums(()=>({...data.sums}));
    if(data.summaryIndex)setIdx(data.summaryIndex);
    if(data.sd){
      const dates=Object.keys(data.sd).filter(k=>k.startsWith('tasks-')&&Array.isArray(data.sd[k])&&data.sd[k].length>0).map(k=>k.replace('tasks-','')).sort().reverse();
      if(dates[0]){setDs(dates[0]);setDateInp(inputFmt(dates[0]));}
    }
  };

  const TABS=['inbox','dump','schedule','progress','wrapup'];
  const ALL_TABS=[...TABS,'stats','capture'];
  const goNext=()=>{ const i=TABS.indexOf(tab); if(i<TABS.length-1)setTab(TABS[i+1]); };
  const goBack=()=>{ const i=TABS.indexOf(tab); if(i>0)setTab(TABS[i-1]); };

  useEffect(()=>{
    const handler=e=>{
      const tag=(e.target?.tagName||'').toUpperCase();

  },[tab]);

  const tabInfo={
    inbox:   {label:'Inbox',   icon:'📥', step:1},
    dump:    {label:'Dump',    icon:'🧠', step:2},
    schedule:{label:'Schedule',icon:'📅', step:3},
    progress:{label:'Progress',icon:'☑',  step:4},
    wrapup:  {label:'Wrap Up', icon:'🎁', step:5},
    stats:   {label:'Stats',   icon:'📊', step:null},

  };

  const logAwayMs  =timerLogs.filter(r=>r.type==='Away')    .reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
  const logTrainMs =timerLogs.filter(r=>r.type==='Training').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;
  const logWatchMs =timerLogs.filter(r=>r.type==='Watching').reduce((s,r)=>s+(parseInt(r.duration)||0),0)*60000;

    <div style={{display:'flex',alignItems:'center'}}>

            <div style={cdBoxStyle}>
              <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.tx,letterSpacing:1,marginBottom:2}}>🥗 LUNCH IN</div>
              <div style={{fontFamily:MO,fontSize:lunchCd===null||lunchDiff===0?14:cdValSize,fontWeight:'bold',lineHeight:1.1,color:lunchCd===null||lunchDiff===0?C.mu:C.gr,whiteSpace:'nowrap'}}>{lunchCd!==null?lunchCd:'—'}</div>
            </div>
            <div style={cdBoxStyle}>
              <div style={{fontFamily:MO,fontSize:isCompact?9:11,color:C.tx,letterSpacing:1,marginBottom:2}}>🏁 SHIFT ENDS IN</div>
              <div style={{fontFamily:MO,fontSize:endDiff===0?14:cdValSize,fontWeight:'bold',lineHeight:1.1,color:endDiff===0?C.mu:C.bl,whiteSpace:'nowrap'}}>{endCd}</div>
              <div style={{display:'flex',gap:4,alignItems:'center',marginTop:4,flexWrap:'wrap'}}>
                <button onClick={()=>setEndTime('16:00')} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:4,cursor:'pointer',border:'1px solid '+(endTime==='16:00'?C.bl:C.bo),background:endTime==='16:00'?C.bl+'22':C.ca,color:endTime==='16:00'?C.bl:C.mu,whiteSpace:'nowrap'}}>4 PM</button>
                <button onClick={()=>setEndTime('17:00')} style={{fontFamily:MO,fontSize:9,padding:'2px 6px',borderRadius:4,cursor:'pointer',border:'1px solid '+(endTime==='17:00'?C.bl:C.bo),background:endTime==='17:00'?C.bl+'22':C.ca,color:endTime==='17:00'?C.bl:C.mu,whiteSpace:'nowrap'}}>5 PM</button>
                <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)} style={{fontFamily:MO,fontSize:10,background:C.ca,border:'1px solid '+C.bo,borderRadius:4,padding:'2px 4px',color:C.tx,outline:'none',width:75,colorScheme:'dark'}}/>
              </div>
            </div>
          </div>
        </div>
        {!isMobile&&<div style={{fontFamily:MO,fontSize:9,color:C.mu+'88',marginBottom:5,letterSpacing:1}}>← → navigate steps &nbsp;·&nbsp; 1–5 jump to step &nbsp;·&nbsp; 6 = stats &nbsp;·&nbsp; 7 = capture &nbsp;·&nbsp; Esc close modals</div>}
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <TimerCtrl type="away"     ms={awayMs+logAwayMs}   running={awayRun}  color={C.rd}/>
          <TimerCtrl type="training" ms={trainMs+logTrainMs} running={trainRun} color={C.pu}/>
          <TimerCtrl type="watching" ms={watchMs+logWatchMs} running={watchRun} color={C.bl}/>
          <div style={{display:'flex',gap:4,marginLeft:'auto',flexWrap:'wrap'}}>
            <button onClick={()=>setShowRest(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:'#1a1000',border:`1px solid ${C.or}`,borderRadius:6,color:C.or,cursor:'pointer',whiteSpace:'nowrap'}}>↑ {isCompact?'':' '}RESTORE</button>
            <button onClick={e=>{flash(e);saveSession();}} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:storOk?'#0d2010':C.ca,border:`1px solid ${storOk?C.gr:C.bo}`,borderRadius:6,color:storOk?C.gr:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>{storOk?'💾 SAVED':'💾 SAVE'}</button>
            <button onClick={()=>setShowTL(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>⏱ {isCompact?'':'TIMER LOG'}</button>
            <button onClick={()=>setShowHist(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>■ {isCompact?'HIST':'HISTORY'}</button>
            <button onClick={()=>setShowSync(true)} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:'#001a1a',border:`1px solid ${C.gr}`,borderRadius:6,color:C.gr,cursor:'pointer',whiteSpace:'nowrap'}}>📱 {isCompact?'':'SYNC'}</button>
            <button onClick={()=>{const b=new Blob([exportJson],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`jesse-planner-session-${ds}.json`;a.click();}} style={{fontFamily:MO,fontSize:isCompact?10:11,padding:'4px 8px',background:C.ca,border:`1px solid ${C.bo}`,borderRadius:6,color:C.tx,cursor:'pointer',whiteSpace:'nowrap'}}>↑ {isCompact?'EXP':'EXPORT'}</button>
          </div>
        </div>
      </div>

      <div style={{background:C.su,borderBottom:`1px solid ${C.bo}`,padding:'6px 12px',display:'flex',gap:4,flexWrap:'wrap'}}>
        {ALL_TABS.map(t=>{
          const info=tabInfo[t], active=tab===t;
          const isUtil = t==='capture';
          const isStats = t==='stats';
          return (
            <button key={t} onClick={e=>{flash(e);setTab(t);}} style={{
              fontFamily:MO, fontSize:isCompact?11:12, padding:isCompact?'4px 8px':'5px 12px', borderRadius:20, cursor:'pointer',
              border: active ? 'none' : `1px solid ${isUtil?C.bl+'66':isStats?C.pu+'66':C.bo}`,
              background: active ? (isUtil?C.bl:isStats?C.pu:C.or) : C.ca,
              color: active ? '#fff' : isUtil ? C.bl : isStats ? C.pu : C.tx,
              transition:'all .15s', display:'flex', alignItems:'center', gap:4,
              marginLeft: (!isMobile && isUtil) ? 'auto' : 0,
              whiteSpace:'nowrap',
            }}>
              <span>{info.icon}</span>
              <span>{isMobile && isUtil ? '⚡' : info.label}</span>
              {!isMobile&&!isUtil&&!isStats&&info.step&&<span style={{fontFamily:MO,fontSize:9,opacity:0.5}}>{info.step}</span>}
            </button>
          );
        })}
      </div>

      <div style={{padding:isMobile?'16px 12px':'24px 20px'}}>
        {tab==='inbox'    && <InboxTab    inp={inboxInp} setInp={setInboxInpSafe} scanItems={scanItems} onUpdate={v=>{upd('scanItems',v);window._dpsInboxDraft='';}} onBack={goBack} onNext={goNext}/>}
        {tab==='dump'     && <DumpTab     tasks={tasks} dismissed={dismissed} lastSum={lastSum} scanItems={scanItems} deferred={deferred} onUpdateScanItems={v=>upd('scanItems',v)} onUpdateTasks={v=>upd('tasks',v)} onUpdateDismissed={v=>upd('dismissed',v)} onBack={goBack} onNext={goNext} onResetCarry={resetAndRepull}/>}
        {tab==='schedule' && <ScheduleTab timeBlocks={timeBlocks} tasks={tasks} done={done} timerLogs={timerLogs} deferred={deferred} onUpdateTime={v=>upd('time',v)} onBack={goBack} onNext={goNext} isCompact={isCompact}/>}
        {tab==='capture'  && <CaptureTab  tasks={tasks} deferred={deferred} onUpdateTasks={v=>upd('tasks',v)} onUpdateDeferred={v=>upd('deferred',v)}/>}
        {tab==='progress' && <ProgressTab tasks={tasks} done={done} deferred={deferred} timeBlocks={timeBlocks} onUpdateDone={v=>upd('done',v)} onUpdateDeferred={v=>upd('deferred',v)} onBack={goBack} onNext={goNext} isMobile={isMobile}/>}
        {tab==='wrapup'   && <WrapUpTab   tasks={tasks} done={done} timeBlocks={timeBlocks} awayMs={awayMs} trainMs={trainMs} watchMs={watchMs} timerLogs={timerLogs} ds={ds} sums={sums} onSaveSummary={saveSummary} onBack={goBack} isMobile={isMobile} deferred={deferred}/>}
        {tab==='stats'    && <StatsTab    sums={sums} idx={idx} isMobile={isMobile}/>}
      </div>

      {showHist && <HistoryModal sums={sums} idx={idx} onClose={()=>setShowHist(false)} onLoad={loadHistory} onDelete={deleteHistory} onImport={importHistory}/>}

      {showTL   && <TimerLogModal  logs={timerLogs} awayMs={awayMs} trainMs={trainMs} watchMs={watchMs} onSave={rows=>upd('timerLogs',rows)} onClose={()=>setShowTL(false)} onReset={timerReset}/>}
      {showRest && <RestoreModal   onRestore={restoreSession} onClose={()=>setShowRest(false)}/>}
      {showSync && <SyncModal today={ds} tasks={tasks} done={done} timeBlocks={timeBlocks} deferred={deferred} timerLogs={timerLogs} awayMs={awayMs+logAwayMs} trainMs={trainMs+logTrainMs} watchMs={watchMs+logWatchMs} notes={gd('notes')||[]} onMerge={mergeFromSync} onClose={()=>setShowSync(false)} isSendFirst={true}/>}
    </div>
  );
}

// ── Mount ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DailyPlanner />);
</script>
</body>
</html>
